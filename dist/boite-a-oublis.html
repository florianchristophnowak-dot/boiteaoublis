      if (findItem(materials, id) && kept.indexOf(id) < 0) kept.push(id);
    });
    if (kept.length !== live.materialIds.length) { live.materialIds = kept; changed = true; }
    return changed;
  }

  function loadLive() {
    var raw = BAO.storage.readJSON(LIVE_KEY) || {};
    live = {
      phaseId: typeof raw.phaseId === 'string' ? raw.phaseId : '',
      materialIds: Array.isArray(raw.materialIds)
        ? raw.materialIds.filter(function (id) { return typeof id === 'string'; }) : [],
      timer: T.normalize(raw.timer, clock())
    };
    sanitizeLive();
    soundFired = false;
    saveLive();
    if (live.timer.running) ensureTicker();
  }

  function liveChanged() {
    saveLive();
    emit('live');
  }

  /* --- Sozialform und Material ------------------------------------------------------ */

  function setPhase(id) {
    var next = id && findItem(catalog('phases'), id) ? id : '';
    if (next === live.phaseId) return;
    live.phaseId = next;
    liveChanged();
  }

  /** Wie in der Leiste: Ein Klick auf die gewählte Sozialform nimmt sie zurück. */
  function togglePhase(id) { setPhase(live.phaseId === id ? '' : id); }

  function toggleMaterial(id) {
    if (!findItem(catalog('materials'), id)) return;
    var index = live.materialIds.indexOf(id);
    if (index >= 0) live.materialIds.splice(index, 1); else live.materialIds.push(id);
    liveChanged();
  }

  function setMaterials(ids) {
    var materials = catalog('materials');
    var next = [];
    (ids || []).forEach(function (id) {
      if (findItem(materials, id) && next.indexOf(id) < 0) next.push(id);
    });
    live.materialIds = next;
    liveChanged();
  }

  function clearMaterials() {
    if (!live.materialIds.length) return;
    live.materialIds = [];
    liveChanged();
  }

  /* --- Timer -------------------------------------------------------------------------
     Der Timer rechnet mit dem Zeitpunkt seines Endes, nicht mit gezählten
     Takten. Ein Browser, der ein verdecktes Fenster ausbremst, verfälscht
     ihn deshalb nicht – tick() darf beliebig oft und von überall gerufen
     werden (auch aus dem Beamerfenster, siehe panel.js). */

  function rememberMinutes(minutes) {
    minutes = T.clampMinutes(minutes, settings().timerMinutes);
    if (minutes !== settings().timerMinutes) tune(function (c) { c.timerMinutes = minutes; });
    return minutes;
  }

  function ensureTicker() {
    if (ticker) return;
    ticker = window.setInterval(tick, TICK_MS);
  }

  function stopTicker() {
    if (!ticker) return;
    window.clearInterval(ticker);
    ticker = null;
  }

  function timerChanged() {
    if (live.timer.running) ensureTicker(); else stopTicker();
    liveChanged();
  }

  function startTimer(minutes) {
    minutes = rememberMinutes(minutes);
    live.timer = T.start(minutes, clock());
    soundFired = false;
    timerChanged();
  }

  /** Start, Pause, Weiter – oder nach dem Ablauf: noch einmal von vorn. */
  function toggleTimer() {
    if (!T.hasValue(live.timer)) { startTimer(settings().timerMinutes); return; }
    if (T.remainingSeconds(live.timer, clock()) <= 0) { resetTimer(); return; }
    live.timer = T.togglePause(live.timer, clock());
    timerChanged();
  }

  function resetTimer() {
    if (!T.hasValue(live.timer)) { startTimer(settings().timerMinutes); return; }
    live.timer = T.reset(live.timer, clock());
    soundFired = false;
    timerChanged();
  }

  /** Ändert die laufende Zeit oder, ohne gesetzten Timer, die Startdauer. */
  function adjustTimer(delta) {
    if (T.hasValue(live.timer)) {
      live.timer = T.addMinutes(live.timer, delta, clock());
      if (T.remainingSeconds(live.timer, clock()) > 0) soundFired = false;
      timerChanged();
      return;
    }
    rememberMinutes(settings().timerMinutes + delta);
  }

  function clearTimer() {
    live.timer = T.empty();
    soundFired = false;
    if (BAO.sounds) BAO.sounds.stopTimerSound();
    timerChanged();
  }

  function tick() {
    var now = clock();
    var before = live.timer;
    live.timer = T.settle(live.timer, now);
    if (T.remainingSeconds(live.timer, now) > 0) {
      soundFired = false;
    } else if (T.hasValue(live.timer) && !soundFired) {
      // Genau einmal je abgelaufenem Timer, nicht bei jedem Takt.
      soundFired = true;
      if (BAO.sounds) BAO.sounds.playTimerSound();
    }
    if (live.timer !== before) { timerChanged(); return; }
    if (!live.timer.running) stopTicker();
    emit('tick');
  }

  /** Alles, was eine Anzeige über den Timer wissen muss. */
  function timerView() {
    var now = clock();
    var remaining = T.remainingSeconds(live.timer, now);
    return {
      phase: T.phase(live.timer, now),          // idle | running | paused | done
      progress: T.progress(live.timer, now),
      remaining: remaining,
      clock: T.clock(remaining),
      totalMinutes: T.totalMinutes(live.timer),
      running: live.timer.running,
      hasValue: T.hasValue(live.timer),
      defaultMinutes: settings().timerMinutes
    };
  }

  /* --- Einstellungen der Leiste ------------------------------------------------------- */

  function setShow(module, on) {
    if (settings().show[module] === !!on) return;
    tune(function (c) { c.show[module] = !!on; });
  }

  function setPanelY(ratio) {
    ratio = util.clamp(Number(ratio) || 0, 0, 1);
    if (Math.abs(ratio - settings().panelY) < 0.001) return;
    tune(function (c) { c.panelY = ratio; });
  }

  function setTimerPresets(list) {
    var next = model.repairTimerPresets(list);
    change('Timer-Schnellwahl geändert', function (c) { c.timerPresets = next; });
    return next;
  }

  function setSoundOption(key, value) {
    tune(function (c) {
      c.sounds[key] = value;
      // Die Prüfung holt jeden Wert in seinen gültigen Bereich zurück.
      c.sounds = model.repairClassroom({ sounds: c.sounds }).sounds;
    });
  }

  /* --- Kataloge: Sozialformen und Materialien --------------------------------------------- */

  function listOf(c, kind) { return kind === 'materials' ? c.materials : c.phases; }
  function kindLabel(kind) { return kind === 'materials' ? 'Material' : 'Sozialform'; }

  function addItem(kind, name) {
    var item = model.makeItem({ name: String(name || '').trim().slice(0, 120) || 'Eigenes Symbol' });
    change(kindLabel(kind) + ' hinzugefügt', function (c) { listOf(c, kind).push(item); });
    return item.id;
  }

  function renameItem(kind, id, name) {
    name = String(name || '').trim().slice(0, 120);
    if (!name) return false;
    return change(kindLabel(kind) + ' umbenannt', function (c) {
      var item = findItem(listOf(c, kind), id);
      if (!item || item.name === name) return false;
      item.name = name;
    });
  }

  function moveItem(kind, id, delta) {
    return change('Reihenfolge geändert', function (c) {
      var list = listOf(c, kind);
      var index = list.indexOf(findItem(list, id));
      var target = index + delta;
      if (index < 0 || target < 0 || target >= list.length) return false;
      list.splice(target, 0, list.splice(index, 1)[0]);
    });
  }

  function removeItem(kind, id) {
    return change(kindLabel(kind) + ' entfernt', function (c) {
      var list = listOf(c, kind);
      var index = list.indexOf(findItem(list, id));
      if (index < 0) return false;
      list.splice(index, 1);
    });
  }

  function restoreDefaults(kind) {
    return change('Standards wiederhergestellt', function (c) {
      if (kind === 'materials') c.materials = model.defaultMaterials(); else c.phases = model.defaultPhases();
    });
  }

  /** Ersetzt das Symbol durch ein eigenes Bild (PNG, JPG, SVG …). */
  function setItemImage(kind, id, file) {
    return storeImage(file).then(function (result) {
      if (!result.ok) return result;
      change('Symbol ausgetauscht', function (c) {
        var item = findItem(listOf(c, kind), id);
        if (!item) return false;
        item.imageId = result.info.id;
      });
      return result;
    });
  }

  function resetItemImage(kind, id) {
    return change('Standardbild wiederhergestellt', function (c) {
      var item = findItem(listOf(c, kind), id);
      if (!item || !item.imageId) return false;
      item.imageId = '';
    });
  }

  /* --- Dateien annehmen --------------------------------------------------------------------- */

  function tooLarge(file) {
    return file.size > BAO.media.MAX_FILE_BYTES
      ? { ok: false, message: '„' + file.name + '“ ist ' + BAO.media.formatBytes(file.size)
        + ' groß. Erlaubt sind höchstens ' + BAO.media.formatBytes(BAO.media.MAX_FILE_BYTES)
        + ' – gedacht ist das Soundboard für kurze Signale und Clips.' }
      : null;
  }

  function storeImage(file) {
    if (!file) return Promise.resolve({ ok: false, message: '' });
    var refused = tooLarge(file);
    if (refused) return Promise.resolve(refused);
    return BAO.media.prepareImage(file).then(function (blob) {
      return BAO.media.add(blob, { name: file.name });
    }).then(function (info) {
      return { ok: true, info: info };
    }, function () {
      return { ok: false, message: '„' + file.name + '“ ließ sich nicht als Bild lesen. Geeignet sind PNG, JPG und SVG.' };
    });
  }

  function storeMedia(file, wantAudio) {
    if (!file) return Promise.resolve({ ok: false, message: '' });
    var refused = tooLarge(file);
    if (refused) return Promise.resolve(refused);
    return BAO.sounds.probe(file).then(function (probe) {
      if (!probe.ok) {
        return { ok: false, message: '„' + file.name + '“ kann dieser Browser nicht abspielen. ' + BAO.sounds.FORMAT_TIP };
      }
      return BAO.media.add(file, { name: file.name }).then(function (info) {
        return { ok: true, info: info, kind: wantAudio ? 'audio' : probe.kind };
      });
    });
  }

  /* --- Münzen ---------------------------------------------------------------------------------- */

  function button(index) { return settings().sounds.buttons[index] || null; }

  function assignMedia(index, file) {
    return storeMedia(file, false).then(function (result) {
      if (!result.ok) return result;
      change('Klang zugewiesen', function (c) {
        var target = c.sounds.buttons[index];
        if (!target) return false;
        target.mediaId = result.info.id;
        target.name = result.info.name;
        target.kind = result.kind;
      });
      return result;
    });
  }

  function assignImage(index, file) {
    return storeImage(file).then(function (result) {
      if (!result.ok) return result;
      change('Münzbild zugewiesen', function (c) {
        var target = c.sounds.buttons[index];
        if (!target) return false;
        target.imageId = result.info.id;
        target.imageName = result.info.name;
      });
      return result;
    });
  }

  function resetImage(index) {
    return change('Münzbild entfernt', function (c) {
      var target = c.sounds.buttons[index];
      if (!target || !target.imageId) return false;
      target.imageId = '';
      target.imageName = '';
    });
  }

  function clearButton(index) {
    if (BAO.sounds && BAO.sounds.playingIndex() === index) BAO.sounds.stop();
    return change('Zuweisungen gelöscht', function (c) {
      var target = c.sounds.buttons[index];
      if (!target || (!target.mediaId && !target.imageId)) return false;
      c.sounds.buttons[index] = model.emptyButton();
    });
  }

  /* --- Klang am Ende des Timers ------------------------------------------------------------------ */

  function assignTimerSound(file) {
    return storeMedia(file, true).then(function (result) {
      if (!result.ok) return result;
      change('Timer-Klang festgelegt', function (c) {
        c.timerSound = { mediaId: result.info.id, name: result.info.name };
      });
      return result;
    });
  }

  function removeTimerSound() {
    if (BAO.sounds) BAO.sounds.stopTimerSound();
    return change('Timer-Klang entfernt', function (c) {
      if (!c.timerSound.mediaId) return false;
      c.timerSound = { mediaId: '', name: '' };
    });
  }

  /* --- Phasen-Presets ------------------------------------------------------------------------------ */

  var TARGET_KINDS = {
    bank: { label: 'Wortbank', collection: 'banks' },
    board: { label: 'Tafel', collection: 'boards' },
    whiteboard: { label: 'Whiteboard', collection: 'whiteboards' }
  };

  function preset(id) { return findItem(presets(), id); }

  /** Das Ziel eines Presets im Bestand – oder null, wenn es gelöscht wurde. */
  function presetTarget(item, state) {
    state = state || BAO.store.getState();
    var kind = item && TARGET_KINDS[item.targetKind];
    if (!kind || !item.targetId) return null;
    return select.byId(state[kind.collection] || [], item.targetId);
  }

  /** hasTarget = es ist ein Ziel gewählt; missing = gewählt, aber nicht mehr vorhanden. */
  function presetStatus(item, state) {
    var hasTarget = !!(item && TARGET_KINDS[item.targetKind] && item.targetId);
    var target = hasTarget ? presetTarget(item, state) : null;
    return {
      hasTarget: hasTarget,
      missing: hasTarget && !target,
      kindLabel: hasTarget ? TARGET_KINDS[item.targetKind].label : '',
      title: target ? target.title : (item ? item.targetTitle : ''),
      target: target
    };
  }

  /** Alles, was ein Preset öffnen kann – für die Auswahl im Dialog. */
  function presetTargets(state) {
    state = state || BAO.store.getState();
    var result = [];
    Object.keys(TARGET_KINDS).forEach(function (kind) {
      (state[TARGET_KINDS[kind].collection] || []).forEach(function (entry) {
        var group = select.group(state, entry.groupId);
        if (group && group.archived) return;
        result.push({
          kind: kind, id: entry.id, kindLabel: TARGET_KINDS[kind].label,
          title: entry.title || '', group: group ? group.name : '',
          scene: kind === 'bank' ? (entry.scene || '') : '',
          level: kind === 'bank' ? (entry.defaultLevel || 2) : 2
        });
      });
    });
    return result.sort(function (a, b) {
      return (a.group + ' ' + a.kindLabel + ' ' + a.title).localeCompare(b.group + ' ' + b.kindLabel + ' ' + b.title, 'de');
    });
  }

  function suggestPhase(scene) {
    return model.suggestPhase(scene, catalog('phases'), settings().sceneMap);
  }

  /**
   * Legt ein Preset an oder ändert es.
   * options.rememberScene: Szene, deren Zuordnung zur Sozialform gemerkt wird.
   */
  function savePreset(data, options) {
    options = options || {};
    var existing = data.id ? preset(data.id) : null;
    var next = model.repairPreset(model.makePreset(Object.assign({}, existing || {}, data, { updatedAt: util.nowISO() })));
    if (!existing) next.createdAt = next.updatedAt;
    next.name = next.name.trim() || next.targetTitle;

    BAO.store.commit(existing ? 'Preset geändert' : 'Preset angelegt', function (draft) {
      var index = draft.presets.indexOf(findItem(draft.presets, next.id));
      if (index >= 0) draft.presets[index] = next; else draft.presets.push(next);
      var sceneKey = model.normalizeScene(options.rememberScene);
      if (sceneKey) {
        if (next.phaseId) draft.classroom.sceneMap[sceneKey] = next.phaseId;
        else delete draft.classroom.sceneMap[sceneKey];
      }
    });
    return next.id;
  }

  function removePreset(id) {
    return BAO.store.commit('Preset gelöscht', function (draft) {
      var index = draft.presets.indexOf(findItem(draft.presets, id));
      if (index < 0) return false;
      draft.presets.splice(index, 1);
    });
  }

  function movePreset(id, delta) {
    return BAO.store.commit('Reihenfolge geändert', function (draft) {
      var index = draft.presets.indexOf(findItem(draft.presets, id));
      var target = index + delta;
      if (index < 0 || target < 0 || target >= draft.presets.length) return false;
      draft.presets.splice(target, 0, draft.presets.splice(index, 1)[0]);
    });
  }

  /** Der Unterrichtsteil eines Presets: Sozialform, Material, Timer. */
  function applyPreset(item) {
    var show = {};
    if (item.phaseId && findItem(catalog('phases'), item.phaseId)) {
      live.phaseId = item.phaseId;
      show.phase = true;
    }
    var materials = catalog('materials');
    var wanted = item.materialIds.filter(function (id) { return !!findItem(materials, id); });
    if (wanted.length) {
      live.materialIds = wanted;
      show.materials = true;
    }
    if (item.timerMinutes > 0) show.timer = true;

    var current = settings();
    var hidden = Object.keys(show).filter(function (key) { return !current.show[key]; });
    var minutes = item.timerMinutes > 0 ? item.timerMinutes : current.timerMinutes;
    if (hidden.length || minutes !== current.timerMinutes) {
      tune(function (c) {
        hidden.forEach(function (key) { c.show[key] = true; });
        c.timerMinutes = minutes;
      });
    }
    liveChanged();
    if (item.timerMinutes > 0 && item.timerAutostart) startTimer(item.timerMinutes);
  }

  /**
   * Startet eine Unterrichtsphase: stellt die Leiste ein und öffnet das Ziel.
   * @returns {{ok: boolean, missing: boolean}} missing = das Ziel gibt es nicht mehr
   */
  function startPreset(id) {
    var item = preset(id);
    if (!item) return { ok: false, missing: false };
    var status = presetStatus(item);
    applyPreset(item);

    if (status.target && BAO.app) {
      var target = status.target;
      if (item.targetKind === 'bank') {
        BAO.app.setContext(target.subjectId, target.groupId);
        BAO.app.projectBank(target.id, { level: item.level });
      } else if (item.targetKind === 'board') {
        BAO.app.projectBoard(target.id);
      } else {
        BAO.app.setContext(target.subjectId, target.groupId);
        BAO.app.go('whiteboard/' + target.id);
      }
    }
    return { ok: true, missing: status.missing };
  }

  /* --- Start ------------------------------------------------------------------------------------------- */

  function sign(state) {
    return JSON.stringify(state.classroom || null) + '\n' + JSON.stringify(state.presets || null);
  }

  function boot(meta) {
    signature = sign(BAO.store.getState());
    loadLive();
    BAO.media.subscribe(function () { emit('media'); });
    BAO.media.init().then(function () {
      // Aufräumen nur bei einem regulär geladenen Bestand: Nach einem
      // Fehlstart verwiese nichts mehr auf die Dateien, obwohl sie noch
      // gebraucht werden könnten.
      if (meta && meta.startedFresh) return;
      var keep = model.mediaIds(BAO.store.getState());
      var safety = BAO.storage.loadSafetyCopy();
      if (safety && safety.state) keep = keep.concat(model.mediaIds(safety.state));
      BAO.media.sweep(keep);
    });
  }

  BAO.store.subscribe(function (state, meta) {
    if (meta.reason === 'init') { boot(meta); return; }
    var next = sign(state);
    if (next === signature) return;
    signature = next;
    if (sanitizeLive()) saveLive();
    emit('settings');
  });

  BAO.classroom = {
    QUIET_LABEL: QUIET_LABEL,
    subscribe: subscribe,
    settings: settings,
    presets: presets,
    catalog: catalog,
    live: function () { return live; },
    phaseItem: phaseItem,
    materialItems: materialItems,

    setPhase: setPhase,
    togglePhase: togglePhase,
    toggleMaterial: toggleMaterial,
    setMaterials: setMaterials,
    clearMaterials: clearMaterials,

    startTimer: startTimer,
    toggleTimer: toggleTimer,
    resetTimer: resetTimer,
    adjustTimer: adjustTimer,
    clearTimer: clearTimer,
    tick: tick,
    timerView: timerView,
    TICK_MS: TICK_MS,

    setShow: setShow,
    setPanelY: setPanelY,
    setTimerPresets: setTimerPresets,
    setSoundOption: setSoundOption,

    addItem: addItem,
    renameItem: renameItem,
    moveItem: moveItem,
    removeItem: removeItem,
    restoreDefaults: restoreDefaults,
    setItemImage: setItemImage,
    resetItemImage: resetItemImage,

    button: button,
    assignMedia: assignMedia,
    assignImage: assignImage,
    resetImage: resetImage,
    clearButton: clearButton,
    assignTimerSound: assignTimerSound,
    removeTimerSound: removeTimerSound,

    preset: preset,
    presetStatus: presetStatus,
    presetTargets: presetTargets,
    suggestPhase: suggestPhase,
    savePreset: savePreset,
    removePreset: removePreset,
    movePreset: movePreset,
    startPreset: startPreset,

    /** Nur für Prüfungen: ersetzt die Uhr, damit ein Timer ohne Warten abläuft. */
    setClock: function (fn) { clock = fn || function () { return Date.now(); }; },
    reloadLive: loadLive
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/classroom/sounds.js */
/* ==========================================================================
   Klänge abspielen
   Die Münzen des Soundboards: Jede spielt eine Audio- oder Videodatei. Ein
   zweiter Klick auf dieselbe Münze stoppt, eine andere Münze löst die
   laufende ab. Ein Video erscheint über der Leinwand – groß in der Mitte,
   bildfüllend oder kurz bildfüllend und danach groß.

   Der Ton kommt immer aus dem Hauptfenster: Dort hat die Lehrkraft geklickt,
   also erlaubt der Browser die Wiedergabe. Ist das Beamerfenster offen,
   läuft das Video dort stumm und im Gleichschritt mit.

   Daneben gibt es einen zweiten, unabhängigen Spieler für den Klang am Ende
   des Timers – er darf eine laufende Münze nicht abbrechen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;

  var FORMAT_TIP = 'Am zuverlässigsten sind MP3 oder WAV für Klänge und MP4 (H.264/AAC) oder WebM für Videos.';
  var AUDIO_ACCEPT = 'audio/*,.mp3,.wav,.ogg,.oga,.flac,.m4a,.aac,.opus';
  var MEDIA_ACCEPT = AUDIO_ACCEPT + ',video/*,.mp4,.m4v,.mov,.webm,.mkv';
  var IMAGE_ACCEPT = 'image/png,image/jpeg,image/svg+xml,image/webp,image/gif,.png,.jpg,.jpeg,.svg,.webp,.gif';
  var PROBE_TIMEOUT_MS = 6000;

  var current = null;        // { index, video, element, frames: [{ node, doc }], mirror, burst }
  var timerAudio = null;
  var listeners = [];

  function emit(reason) {
    listeners.slice().forEach(function (fn) {
      try { fn(reason); } catch (err) { console.error('Fehler im Beobachter der Klänge:', err); }
    });
  }

  /** Gründe: 'play', 'stop' (eine Münze), 'timer-sound' (Klang am Ende des Timers beginnt oder endet). */
  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function options() { return BAO.classroom.settings().sounds; }
  function volume() { return util.clamp(Number(options().volume), 0, 1); }

  /* --- Datei prüfen ------------------------------------------------------------ */

  /**
   * Kann der Browser die Datei abspielen – und ist es ein Klang oder ein Video?
   * Maßgeblich ist der Inhalt, nicht die Endung: Eine MP4-Datei ohne Bildspur
   * ist ein Klang.
   * @returns {Promise<{ok: boolean, kind: string, duration: number}>}
   */
  function probe(blob) {
    return new Promise(function (resolve) {
      var source = URL.createObjectURL(blob);
      var element = document.createElement('video');
      var done = false;
      var guard = window.setTimeout(function () { finish({ ok: false, kind: '', duration: 0 }); }, PROBE_TIMEOUT_MS);
      function finish(result) {
        if (done) return;
        done = true;
        window.clearTimeout(guard);
        element.onloadedmetadata = element.onerror = null;
        element.removeAttribute('src');
        try { element.load(); } catch (err) { /* egal */ }
        URL.revokeObjectURL(source);
        resolve(result);
      }
      element.preload = 'metadata';
      element.muted = true;
      element.onloadedmetadata = function () {
        finish({
          ok: true,
          kind: element.videoWidth > 0 && element.videoHeight > 0 ? 'video' : 'audio',
          duration: isFinite(element.duration) ? element.duration : 0
        });
      };
      element.onerror = function () { finish({ ok: false, kind: '', duration: 0 }); };
      element.src = source;
    });
  }

  /* --- Video über der Leinwand ---------------------------------------------------- */

  function hostOf(doc) {
    return doc.fullscreenElement && doc.fullscreenElement !== doc.documentElement
      ? doc.fullscreenElement : doc.body;
  }

  function buildFrame(doc, source, muted) {
    BAO.render.ensureStyle(doc, false);
    var video = doc.createElement('video');
    video.className = 'snd-video__film';
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.muted = !!muted;
    video.src = source;
    var node = doc.createElement('div');
    node.className = 'snd-video';
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', 'Video – Klick beendet die Wiedergabe');
    var box = doc.createElement('div');
    box.className = 'snd-video__box';
    box.appendChild(video);
    node.appendChild(box);
    box.addEventListener('click', function () { stop(); });
    hostOf(doc).appendChild(node);
    return { node: node, doc: doc, video: video };
  }

  function setMode(mode) {
    if (!current) return;
    current.frames.forEach(function (frame) { frame.node.dataset.mode = mode; });
  }

  function showVideo(source) {
    var settings = options();
    current.frames.push(buildFrame(document, source, false));
    current.element = current.frames[0].video;

    // Im Beamerfenster läuft dasselbe Video stumm mit.
    var surface = BAO.output.getSurface('window');
    if (surface && surface.doc && surface.doc !== document) {
      try {
        var twin = buildFrame(surface.doc, source, true);
        current.frames.push(twin);
        current.mirror = twin.video;
      } catch (err) { console.warn('Video im Beamerfenster nicht möglich:', err); }
    }

    if (settings.videoMode === 'full') {
      setMode('full');
    } else if (settings.videoMode === 'burst') {
      setMode('full');
      current.burst = window.setTimeout(function () { setMode('large'); },
        Math.max(200, Math.round(settings.burstSeconds * 1000)));
    } else {
      setMode('large');
    }
  }

  function syncMirror() {
    if (!current || !current.mirror) return;
    var mirror = current.mirror;
    try {
      if (Math.abs(mirror.currentTime - current.element.currentTime) > 0.25) mirror.currentTime = current.element.currentTime;
      if (mirror.paused) { var attempt = mirror.play(); if (attempt && attempt.catch) attempt.catch(function () {}); }
    } catch (err) { /* Fenster inzwischen geschlossen */ }
  }

  /* --- Münzen ------------------------------------------------------------------------ */

  function playingIndex() { return current ? current.index : -1; }
  function isVideoShowing() { return !!(current && current.video); }

  function reportError(name) {
    BAO.toast.error('„' + name + '“ konnte nicht abgespielt werden. ' + FORMAT_TIP);
  }

  /**
   * Löst eine Münze aus (index 0 … 7).
   * @returns {'playing'|'stopped'|'empty'|'missing'|'none'}
   */
  function trigger(index) {
    var button = options().buttons[index];
    if (!button) return 'none';
    if (!button.mediaId) return 'empty';
    if (!BAO.media.has(button.mediaId)) return 'missing';

    if (current && current.index === index) { stop(); return 'stopped'; }
    stop();

    var source = BAO.media.url(button.mediaId);
    var session = { index: index, video: button.kind === 'video', element: null, frames: [], mirror: null, burst: null, failed: false };
    current = session;

    if (session.video) showVideo(source);
    else { session.element = new Audio(); session.element.src = source; }

    var element = session.element;
    element.volume = volume();
    element.addEventListener('ended', function () { if (current === session) stop(); });
    element.addEventListener('error', function () { fail(session, button.name); });
    if (session.mirror) {
      element.addEventListener('playing', syncMirror);
      element.addEventListener('timeupdate', syncMirror);
    }

    var attempt;
    try { attempt = element.play(); } catch (err) { fail(session, button.name); return 'none'; }
    if (attempt && attempt.catch) attempt.catch(function (err) {
      // Ein Abbruch durch stop() ist kein Fehler.
      if (err && err.name === 'AbortError') return;
      fail(session, button.name);
    });

    emit('play');
    return 'playing';
  }

  function fail(session, name) {
    if (session.failed || current !== session) return;
    session.failed = true;            // genau eine Meldung je Fehlversuch
    stop();
    reportError(name || 'Die Datei');
  }

  function release(element) {
    if (!element) return;
    try {
      element.pause();
      element.removeAttribute('src');
      element.load();
    } catch (err) { /* Fenster inzwischen geschlossen */ }
  }

  function stop() {
    if (!current) return false;
    var session = current;
    current = null;
    if (session.burst) window.clearTimeout(session.burst);
    release(session.element);
    session.frames.forEach(function (frame) {
      release(frame.video);
      try { if (frame.node.parentNode) frame.node.parentNode.removeChild(frame.node); } catch (err) { /* egal */ }
    });
    emit('stop');
    return true;
  }

  /** Meldungen in Worten – für Klicks außerhalb der Verwaltung. */
  function triggerWithFeedback(index) {
    var result = trigger(index);
    var button = options().buttons[index];
    if (result === 'empty') {
      BAO.toast.show('Für Münze ' + (index + 1) + ' ist keine Medien-Datei zugewiesen.', {
        actionLabel: 'Soundboard öffnen', onAction: function () { BAO.app.go('soundboard'); }
      });
    } else if (result === 'missing') {
      BAO.toast.error('Die Datei „' + (button.name || 'ohne Namen') + '“ für Münze ' + (index + 1)
        + ' liegt in diesem Browser nicht mehr vor. Bitte neu zuweisen oder die Sicherungsdatei wiederherstellen.');
    }
    return result;
  }

  /** Lautstärke sofort anwenden – etwa während der Regler gezogen wird. */
  function applyVolume(value) {
    var level = util.clamp(Number(value), 0, 1);
    if (current && current.element) current.element.volume = level;
    if (timerAudio) timerAudio.volume = level;
  }

  /* --- Klang am Ende des Timers --------------------------------------------------------- */

  function stopTimerSound() {
    if (!timerAudio) return;
    release(timerAudio);
    timerAudio = null;
    emit('timer-sound');
  }

  /** @returns {boolean} true, wenn ein Klang gestartet wurde */
  function playTimerSound() {
    stopTimerSound();
    var sound = BAO.classroom.settings().timerSound;
    if (!sound || !sound.mediaId || !BAO.media.has(sound.mediaId)) return false;
    var audio = new Audio();
    timerAudio = audio;
    audio.src = BAO.media.url(sound.mediaId);
    audio.volume = volume();
    audio.addEventListener('ended', function () { if (timerAudio === audio) stopTimerSound(); });
    try {
      var attempt = audio.play();
      if (attempt && attempt.catch) attempt.catch(function (err) {
        if (err && err.name === 'AbortError') return;
        console.warn('Der Klang am Ende des Timers ließ sich nicht abspielen:', err);
      });
    } catch (err) { timerAudio = null; return false; }
    emit('timer-sound');
    return true;
  }

  function stopAll() {
    var stopped = stop();
    if (timerAudio) { stopTimerSound(); stopped = true; }
    return stopped;
  }

  /* --- Tastatur -----------------------------------------------------------------------------
     Überall in der App, auch im Beamerfenster:
       Alt + Umschalt + 1 … 8   Münze auslösen (nur sichtbare Münzen)
       Alt + Umschalt + 0       alles stoppen
     Solange ein Video zu sehen ist, beenden Esc, Leertaste und Rücktaste es.
     Die Tasten werden abgefangen, bevor Projektion, Tafel oder Whiteboard sie
     sehen – sonst löschte die Rücktaste nebenbei ein Element der Tafel. */

  function digitOf(event) {
    var match = /^(?:Digit|Numpad)([0-9])$/.exec(event.code || '');
    return match ? parseInt(match[1], 10) : -1;
  }

  function onKeyDown(event) {
    if (isVideoShowing() && !event.ctrlKey && !event.metaKey && !event.altKey
      && (event.key === 'Escape' || event.key === ' ' || event.key === 'Spacebar' || event.key === 'Backspace')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      stop();
      return;
    }
    if (!event.altKey || !event.shiftKey || event.ctrlKey || event.metaKey) return;
    var digit = digitOf(event);
    if (digit < 0 || digit > BAO.classroomModel.MAX_BUTTONS) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (event.repeat) return;
    if (digit === 0) { stopAll(); return; }
    if (digit <= options().visible) triggerWithFeedback(digit - 1);
  }

  /**
   * Bindet die Tastatur eines Dokuments an – Hauptfenster oder Beamerfenster.
   * Mehrfaches Anbinden schadet nicht: Derselbe Beobachter zählt nur einmal.
   */
  function bindDocument(doc) {
    if (doc) doc.addEventListener('keydown', onKeyDown, true);
  }

  bindDocument(document);

  BAO.sounds = {
    FORMAT_TIP: FORMAT_TIP,
    AUDIO_ACCEPT: AUDIO_ACCEPT,
    MEDIA_ACCEPT: MEDIA_ACCEPT,
    IMAGE_ACCEPT: IMAGE_ACCEPT,
    subscribe: subscribe,
    probe: probe,
    trigger: trigger,
    triggerWithFeedback: triggerWithFeedback,
    stop: stop,
    stopAll: stopAll,
    playingIndex: playingIndex,
    isVideoShowing: isVideoShowing,
    applyVolume: applyVolume,
    playTimerSound: playTimerSound,
    stopTimerSound: stopTimerSound,
    isTimerSoundPlaying: function () { return !!timerAudio; },
    bindDocument: bindDocument
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/classroom/panel.js */
/* ==========================================================================
   Unterrichtsleiste
   Die textfreie Leiste des Soundboards am rechten Rand der Leinwand: Münzen,
   Projektion, Sozialform, Material, Timer. Sie hängt an jeder Ausgabefläche
   (Beamerfenster, Vollbild, Vorschau) und am Whiteboard – überall dieselbe
   Leiste mit demselben Stand.

   Bedienung wie im Teacher Soundboard:
     Münze        spielt ihren Klang, ein zweiter Klick stoppt
     Projektion   blendet die Sprachhilfe aus und ein; der kleine Knopf
                  daneben öffnet Blättern, Stufen und die Phasen-Presets
     Sozialform   öffnet die Auswahl (eine)
     Material     öffnet die Auswahl (mehrere)
     Scheibe      öffnet die Zeitwahl; darunter Minus, Start/Pause, Plus
     Griff        verschiebt die Leiste senkrecht

   Die Leiste nimmt der Tastatur nichts weg: Ein Klick verschiebt den Fokus
   nicht, damit Projektion, Tafel und Whiteboard ihre Tasten behalten.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var icons = BAO.classroomIcons;
  var classroom = BAO.classroom;
  var sounds = BAO.sounds;

  var panels = [];
  var reflowScheduled = false;

  /** h() für ein bestimmtes Dokument – die Leiste entsteht auch im Beamerfenster. */
  function builder(doc) {
    return function (tag, props) {
      var args = [tag, Object.assign({ ownerDocument: doc }, props || {})];
      for (var i = 2; i < arguments.length; i++) args.push(arguments[i]);
      return util.h.apply(null, args);
    };
  }

  /* --- Bausteine (auch für die Ansicht „Soundboard“) ----------------------------- */

  /** Kachel einer Sozialform oder eines Materials: eigenes Bild oder Symbol. */
  function tileNode(doc, item, options) {
    options = options || {};
    var h = builder(doc);
    var node = h('button.cr-tile' + (options.big ? '.cr-tile--big' : ''), {
      type: 'button', title: options.title || item.name || null, 'aria-label': options.label || item.name || null
    });
    node.style.setProperty('--tile', icons.tileColor(item.icon));
    if (item.imageId && BAO.media.has(item.imageId)) {
      var image = h('img.cr-tile__image', { alt: '', draggable: 'false' });
      image.src = BAO.media.url(item.imageId);
      node.appendChild(image);
    } else {
      node.appendChild(icons.glyph(doc, item.icon));
    }
    if (options.selected) node.dataset.selected = 'true';
    return node;
  }

  /** Münze einer Klangtaste: eigenes Bild oder nummerierte Münze. */
  function coinNode(doc, index, button, options) {
    options = options || {};
    var h = builder(doc);
    var number = index + 1;
    var name = button && button.mediaId ? (button.name || 'Klang') : 'noch kein Klang';
    var node = h('button.cr-coin', {
      type: 'button', title: options.title || ('Münze ' + number + ': ' + name),
      'aria-label': 'Münze ' + number + ': ' + name, dataset: { index: String(index) }
    });
    if (button && button.imageId && BAO.media.has(button.imageId)) {
      var image = h('img.cr-coin__image', { alt: '', draggable: 'false' });
      image.src = BAO.media.url(button.imageId);
      node.appendChild(image);
    } else {
      node.appendChild(icons.coin(doc, number));
    }
    if (!button || !button.mediaId) node.dataset.empty = 'true';
    if (sounds.playingIndex() === index) node.dataset.playing = 'true';
    return node;
  }

  /* --- Stand der Projektion ---------------------------------------------------------- */

  function projectionStatus() {
    var store = BAO.store.getState();
    var session = BAO.session.getState();
    if (session.active) {
      var bank = session.bankId ? BAO.select.bank(store, session.bankId) : null;
      var bankGroup = bank ? BAO.select.group(store, bank.groupId) : null;
      return {
        kind: 'bank', active: true, blank: !!session.blank, level: session.level,
        title: bank ? bank.title : 'Live-Hilfe', group: bankGroup ? bankGroup.name : '',
        page: session.index + 1, pages: BAO.session.totalSlides()
      };
    }
    if (BAO.board.isActive()) {
      var board = BAO.board.getBoard();
      var boardGroup = board ? BAO.select.group(store, board.groupId) : null;
      return {
        kind: 'board', active: true, blank: !!BAO.board.getState().blank, level: 0,
        title: board ? board.title : 'Tafel', group: boardGroup ? boardGroup.name : '',
        page: 0, pages: 0
      };
    }
    return { kind: '', active: false, blank: false, level: 0, title: '', group: '', page: 0, pages: 0 };
  }

  function projectionSignature(status) {
    return [status.kind, status.active, status.blank, status.level, status.title, status.group, status.page, status.pages].join('|');
  }

  function toggleProjectionBlank() {
    if (BAO.session.getState().active) BAO.session.toggleBlank();
    else if (BAO.board.isActive()) BAO.board.toggleBlank();
  }

  function stopProjection() {
    if (BAO.session.getState().active) BAO.session.stop();
    if (BAO.board.isActive()) BAO.board.stop();
    BAO.output.closeOverlay();
    if (BAO.app) BAO.app.scheduleRender();
  }

  /* --- Leinwand neu einteilen ------------------------------------------------------------
     Ändert sich die Breite der Leiste, hat der Inhalt mehr oder weniger Platz.
     Wortbank und Tafel teilen ihre Fläche dann neu ein. */

  function scheduleReflow() {
    if (reflowScheduled) return;
    reflowScheduled = true;
    window.requestAnimationFrame(function () {
      reflowScheduled = false;
      if (BAO.session.getState().active) BAO.session.renderAll({ reason: 'resize' });
      else if (BAO.board.isActive()) BAO.board.renderAll('resize');
    });
  }

  /* --- Die Leiste ---------------------------------------------------------------------------- */

  /**
   * Hängt eine Leiste in eine Fläche.
   * @param {HTMLElement} host  Leinwand (.bao-stage) oder Zeichenfläche (.wb)
   * @param {{kind: 'stage'|'whiteboard', surface?: object}} options
   */
  function mount(host, options) {
    options = options || {};
    var kind = options.kind || 'stage';
    var doc = host.ownerDocument;
    var win = doc.defaultView || window;
    var h = builder(doc);

    BAO.render.ensureStyle(doc, false);
    sounds.bindDocument(doc);

    // Die Leiste hängt nur in der Fläche, solange sie etwas zeigt: Ohne
    // eingeschalteten Baustein bleibt die Projektion frei von Bedienelementen.
    var node = h('div.cr-panel', { dataset: { host: kind }, hidden: true });
    var groups = h('div.cr-groups');
    var grip = h('button.cr-grip', {
      type: 'button', title: 'Leiste verschieben', 'aria-label': 'Unterrichtsleiste senkrecht verschieben'
    });
    node.appendChild(grip);
    node.appendChild(groups);

    var destroyed = false;
    var dial = null;
    var toggleButton = null;
    var lastTimerPhase = '';
    var lastProjection = '';
    var popup = null;
    var ownTicker = null;
    var reserve = -1;
    var dragging = false;
    var anchors = {};

    /* Ein Klick auf die Leiste darf den Fokus nicht verschieben – sonst
       gehörten Leertaste und Eingabetaste plötzlich der Leiste. */
    function keepFocus(event) {
      if (event.target.closest && event.target.closest('button')) event.preventDefault();
    }
    function ownKeys(event) {
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') event.stopPropagation();
    }
    node.addEventListener('mousedown', keepFocus);
    node.addEventListener('keydown', ownKeys);

    /* --- Aufbau ------------------------------------------------------------------------ */

    function buildCoins(settings) {
      var row = h('div.cr-row');
      for (var i = 0; i < settings.sounds.visible; i++) {
        (function (index) {
          var coin = coinNode(doc, index, settings.sounds.buttons[index]);
          coin.addEventListener('click', function () { sounds.triggerWithFeedback(index); });
          row.appendChild(coin);
        })(i);
      }
      return h('div.cr-group', { dataset: { module: 'sounds' } }, row);
    }

    function buildProjection() {
      var status = projectionStatus();
      lastProjection = projectionSignature(status);
      var state = !status.active ? 'ready' : (status.blank ? 'blank' : 'live');
      var label = !status.active ? 'Projektion: nichts läuft – Steuerung öffnen'
        : (status.blank ? 'Sprachhilfe wieder einblenden' : 'Sprachhilfe ausblenden');
      var tile = h('button.cr-tile.cr-tile--big', {
        type: 'button', title: label, 'aria-label': label, dataset: { state: state },
        onclick: function () {
          if (projectionStatus().active) toggleProjectionBlank(); else openPopup('projection', tile);
        },
        oncontextmenu: function (event) { event.preventDefault(); openPopup('projection', tile); }
      }, icons.boite(doc, state, status.level));
      tile.style.setProperty('--tile', icons.BOITE_COLORS[state]);
      var menu = h('button.cr-round', {
        type: 'button', title: 'Projektion steuern und Phasen-Presets starten',
        'aria-label': 'Projektion steuern und Phasen-Presets starten',
        onclick: function () { openPopup('projection', tile); }
      }, icons.action(doc, 'menu'));
      anchors.projection = tile;
      return h('div.cr-group', { dataset: { module: 'projection' } },
        h('div.cr-timer__row', {}, menu, tile));
    }

    function buildPhase() {
      var item = classroom.phaseItem();
      var tile = tileNode(doc, item || { name: 'Sozialform wählen', icon: 'phase-placeholder' }, {
        big: true, title: item ? item.name + ' – ändern' : 'Sozialform oder Methode wählen'
      });
      tile.addEventListener('click', function () { openPopup('phase', tile); });
      anchors.phase = tile;
      return h('div.cr-group', { dataset: { module: 'phase' } }, tile);
    }

    function buildMaterials() {
      var items = classroom.materialItems();
      var row = h('div.cr-row');
      if (!items.length) items = [{ name: 'Material wählen', icon: 'material-placeholder' }];
      items.forEach(function (item) {
        var tile = tileNode(doc, item, { title: item.id ? item.name + ' – Material ändern' : 'Material wählen' });
        tile.addEventListener('click', function () { openPopup('materials', row); });
        row.appendChild(tile);
      });
      anchors.materials = row;
      return h('div.cr-group', { dataset: { module: 'materials' } }, row);
    }

    function buildTimer() {
      dial = icons.dial(doc);
      var face = h('button.cr-dial', {
        type: 'button', title: 'Zeit wählen', 'aria-label': 'Timer: Zeit wählen',
        onclick: function () { openPopup('timer', face); }
      }, dial.node);
      toggleButton = h('button.cr-round.cr-round--main', {
        type: 'button', onclick: function () { classroom.toggleTimer(); }
      });
      anchors.timer = face;
      lastTimerPhase = '';
      return h('div.cr-group', { dataset: { module: 'timer' } },
        face,
        h('div.cr-timer__row', {},
          h('button.cr-round', {
            type: 'button', title: 'Eine Minute weniger', 'aria-label': 'Eine Minute weniger',
            onclick: function () { classroom.adjustTimer(-1); }
          }, icons.action(doc, 'minus')),
          toggleButton,
          h('button.cr-round', {
            type: 'button', title: 'Eine Minute mehr', 'aria-label': 'Eine Minute mehr',
            onclick: function () { classroom.adjustTimer(1); }
          }, icons.action(doc, 'plus'))
        ));
    }

    function updateTimer() {
      if (!dial) return;
      var view = classroom.timerView();
      dial.set(view.progress, view.phase);
      if (view.phase === lastTimerPhase) return;
      lastTimerPhase = view.phase;
      var running = view.phase === 'running';
      var label = running ? 'Timer anhalten'
        : view.phase === 'paused' ? 'Timer fortsetzen'
        : view.phase === 'done' ? 'Timer von vorn beginnen'
        : 'Timer starten (' + view.defaultMinutes + ' Minuten)';
      util.clear(toggleButton);
      toggleButton.appendChild(icons.action(doc, running ? 'pause' : 'play'));
      toggleButton.title = label;
      toggleButton.setAttribute('aria-label', label);
      node.dataset.timer = view.phase;
    }

    function render() {
      if (destroyed) return;
      var settings = classroom.settings();
      var show = settings.show;
      util.clear(groups);
      dial = null;
      toggleButton = null;
      anchors = {};

      if (show.sounds) groups.appendChild(buildCoins(settings));
      if (show.projection) groups.appendChild(buildProjection());
      if (show.phase) groups.appendChild(buildPhase());
      if (show.materials) groups.appendChild(buildMaterials());
      if (show.timer) groups.appendChild(buildTimer());

      var visible = !!groups.firstChild;
      node.hidden = !visible;
      if (visible && node.parentNode !== host) host.appendChild(node);
      else if (!visible && node.parentNode) node.parentNode.removeChild(node);
      updateTimer();
      syncTicker();
      layout();
      if (popup) {
        // Der Baustein eines offenen Auswahlfelds ist verschwunden? Dann schließen.
        if (!show[popup.module] || node.hidden) closePopup(); else popup.render();
      }
    }

    function updateCoins() {
      var playing = sounds.playingIndex();
      util.$$('.cr-coin', groups).forEach(function (coin) {
        if (Number(coin.dataset.index) === playing) coin.dataset.playing = 'true';
        else delete coin.dataset.playing;
      });
    }

    /* --- Größe und Lage -------------------------------------------------------------------
       Grundeinheit aus der Höhe der Fläche (wie im Soundboard: 6,2 %). Passt
       die Leiste nicht, schrumpft sie in Schritten, bis sie passt. */

    function freeSpan() {
      var height = host.clientHeight;
      var top = 0;
      var bottom = 0;
      if (kind === 'whiteboard') {
        // Werkzeugleisten der Zeichenfläche freihalten, soweit sie am rechten Rand liegen.
        var box = host.getBoundingClientRect();
        var left = box.right - node.offsetWidth - 8;
        var options_ = host.querySelector('.wb-options');
        var zoom = host.querySelector('.wb-zoom');
        if (options_) {
          var o = options_.getBoundingClientRect();
          if (o.right > left) top = Math.max(top, o.bottom - box.top + 6);
        }
        if (zoom) {
          var z = zoom.getBoundingClientRect();
          if (z.right > left) bottom = Math.max(bottom, box.bottom - z.top + 6);
        }
      }
      return { top: top, bottom: bottom, height: Math.max(0, height - top - bottom) };
    }

    function layout() {
      if (destroyed) return;
      if (node.hidden) { setReserve(0); return; }
      var height = host.clientHeight;
      if (!height) return;                       // noch nicht im Dokument – der Beobachter meldet sich

      var unit = util.clamp(height * 0.062, 14, 96);
      node.style.setProperty('--cu', unit.toFixed(2) + 'px');
      var span = freeSpan();
      var guard = 0;
      while (node.offsetHeight > span.height && unit > 9 && guard < 24) {
        unit *= 0.92;
        node.style.setProperty('--cu', unit.toFixed(2) + 'px');
        guard += 1;
      }
      if (kind === 'whiteboard' && guard) span = freeSpan();

      if (!dragging) {
        var room = Math.max(0, span.height - node.offsetHeight);
        node.style.top = Math.round(span.top + room * classroom.settings().panelY) + 'px';
      }
      setReserve(node.offsetWidth);
      if (popup) popup.place();
    }

    function setReserve(width) {
      if (kind !== 'stage' || width === reserve) return;
      reserve = width;
      if (width) host.style.setProperty('--cr-reserve', width + 'px');
      else host.style.removeProperty('--cr-reserve');
      scheduleReflow();
    }

    /* --- Verschieben ---------------------------------------------------------------------- */

    grip.addEventListener('pointerdown', function (event) {
      if (event.button !== undefined && event.button !== 0) return;
      var span = freeSpan();
      var room = Math.max(0, span.height - node.offsetHeight);
      var startTop = parseFloat(node.style.top) || span.top;
      var startY = event.clientY;
      dragging = true;
      node.dataset.dragging = 'true';
      closePopup();
      try { grip.setPointerCapture(event.pointerId); } catch (err) { /* ältere Browser */ }
      event.preventDefault();

      function move(moveEvent) {
        var top = util.clamp(startTop + moveEvent.clientY - startY, span.top, span.top + room);
        node.style.top = Math.round(top) + 'px';
      }
      function end() {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', end);
        grip.removeEventListener('pointercancel', end);
        dragging = false;
        delete node.dataset.dragging;
        var top = parseFloat(node.style.top) || span.top;
        classroom.setPanelY(room > 0 ? (top - span.top) / room : 0);
        layout();
      }
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
    });

    /* --- Auswahlfelder ---------------------------------------------------------------------- */

    function closePopup() {
      if (!popup) return;
      var closing = popup;
      popup = null;
      doc.removeEventListener('pointerdown', closing.onOutside, true);
      doc.removeEventListener('keydown', closing.onKey, true);
      if (closing.node.parentNode) closing.node.parentNode.removeChild(closing.node);
    }

    function openPopup(module, anchor) {
      if (popup && popup.module === module) { closePopup(); return; }
      closePopup();
      var box = h('div.cr-pop', { role: 'dialog', dataset: { module: module } });
      box.addEventListener('mousedown', keepFocus);
      box.addEventListener('keydown', ownKeys);
      var local = {};                           // Zwischenstand eines Felds (z. B. gewählte Minuten)

      var current = {
        module: module,
        node: box,
        render: function () {
          util.clear(box);
          POPUPS[module](box, local);
          current.place();
        },
        place: function () {
          var area = host.getBoundingClientRect();
          var unit = util.clamp(area.height * 0.11, 30, 66);
          box.style.setProperty('--pu', unit.toFixed(1) + 'px');
          var target = (anchors[module] && anchors[module].isConnected ? anchors[module] : anchor);
          var at = target && target.isConnected ? target.getBoundingClientRect() : node.getBoundingClientRect();
          var panelBox = node.getBoundingClientRect();
          var gap = Math.round(unit * 0.18);
          var right = Math.max(6, area.right - panelBox.left + gap);
          right = Math.min(right, Math.max(6, area.width - box.offsetWidth - 6));
          var top = util.clamp(at.top - area.top, 6, Math.max(6, area.height - box.offsetHeight - 6));
          box.style.right = Math.round(right) + 'px';
          box.style.top = Math.round(top) + 'px';
        },
        onOutside: function (event) {
          var target = event.target;
          if (box.contains(target) || node.contains(target)) return;
          closePopup();
        },
        onKey: function (event) {
          if (event.key !== 'Escape') return;
          event.preventDefault();
          event.stopImmediatePropagation();
          closePopup();
        }
      };
      popup = current;
      host.appendChild(box);
      doc.addEventListener('pointerdown', current.onOutside, true);
      doc.addEventListener('keydown', current.onKey, true);
      current.render();
    }

    function key(label, title, onClick, extra) {
      var button = h('button.cr-key', Object.assign({ type: 'button', title: title, 'aria-label': title }, extra || {}));
      if (typeof label === 'string') button.textContent = label; else button.appendChild(label);
      button.addEventListener('click', onClick);
      return button;
    }

    var POPUPS = {
      /* Sozialform: genau eine. Die Wahl schließt das Feld. */
      phase: function (box) {
        var grid = h('div.cr-pop__grid');
        var selected = classroom.live().phaseId;
        classroom.catalog('phases').forEach(function (item) {
          var tile = tileNode(doc, item, { selected: item.id === selected });
          tile.addEventListener('click', function () { classroom.setPhase(item.id); closePopup(); });
          grid.appendChild(tile);
        });
        var clear = tileNode(doc, { name: 'Auswahl löschen', icon: 'clear' });
        clear.addEventListener('click', function () { classroom.setPhase(''); closePopup(); });
        grid.appendChild(clear);
        box.appendChild(grid);
      },

      /* Material: mehrere. Das Feld bleibt offen, bis daneben geklickt wird. */
      materials: function (box) {
        var grid = h('div.cr-pop__grid');
        var selected = classroom.live().materialIds;
        classroom.catalog('materials').forEach(function (item) {
          var tile = tileNode(doc, item, { selected: selected.indexOf(item.id) >= 0 });
          tile.addEventListener('click', function () { classroom.toggleMaterial(item.id); });
          grid.appendChild(tile);
        });
        var clear = tileNode(doc, { name: 'Auswahl löschen', icon: 'clear' });
        clear.addEventListener('click', function () { classroom.clearMaterials(); });
        grid.appendChild(clear);
        box.appendChild(grid);
      },

      /* Timer: Schnellwahl, eigene Dauer, von vorn, löschen. */
      timer: function (box, local) {
        var settings = classroom.settings();
        var view = classroom.timerView();
        if (!local.minutes) local.minutes = view.totalMinutes || settings.timerMinutes;

        var presets = h('div.cr-pop__row.cr-pop__row--wrap');
        settings.timerPresets.forEach(function (minutes) {
          presets.appendChild(key(String(minutes), minutes + ' Minuten starten', function () {
            classroom.startTimer(minutes);
            closePopup();
          }));
        });
        box.appendChild(presets);

        var value = h('div.cr-pop__value', {}, String(local.minutes), h('small', { text: 'Minuten' }));
        function step(delta) {
          return function () {
            local.minutes = util.clamp(local.minutes + delta, 1, 999);
            popup.render();
          };
        }
        box.appendChild(h('div.cr-pop__row', {},
          key('−5', 'Fünf Minuten weniger', step(-5)),
          key(icons.action(doc, 'minus'), 'Eine Minute weniger', step(-1)),
          value,
          key(icons.action(doc, 'plus'), 'Eine Minute mehr', step(1)),
          key('+5', 'Fünf Minuten mehr', step(5)),
          key(icons.action(doc, 'play'), 'Mit dieser Dauer starten', function () {
            classroom.startTimer(local.minutes);
            closePopup();
          }, { 'aria-pressed': 'true' })
        ));

        box.appendChild(h('div.cr-pop__row', {},
          key(icons.action(doc, 'reset'), 'Von vorn beginnen', function () {
            classroom.resetTimer();
            closePopup();
          }, { disabled: !view.hasValue }),
          key(icons.action(doc, 'stop'), 'Timer löschen', function () {
            classroom.clearTimer();
            closePopup();
          }, { disabled: !view.hasValue })
        ));
      },

      /* Projektion: ausblenden, blättern, Stufe, beenden – und die Phasen-Presets. */
      projection: function (box) {
        var status = projectionStatus();
        var detail = [];
        if (status.group) detail.push(status.group);
        if (status.kind === 'bank' && status.pages) detail.push('Seite ' + status.page + ' von ' + status.pages);
        if (status.blank) detail.push('ausgeblendet');
        box.appendChild(h('div', {},
          h('div.cr-pop__head', { text: status.active ? status.title : 'Keine Projektion' }),
          h('div.cr-pop__detail', { text: status.active ? detail.join(' · ') : 'Wortbank oder Tafel öffnen – oder ein Preset starten.' })
        ));

        var paging = status.kind === 'bank' && status.pages > 1;
        box.appendChild(h('div.cr-pop__row', {},
          key(icons.action(doc, 'prev'), 'Vorherige Seite', function () { BAO.session.prev(); }, { disabled: !paging }),
          key(icons.action(doc, status.blank ? 'eye-off' : 'eye'),
            status.blank ? 'Sprachhilfe wieder einblenden' : 'Sprachhilfe ausblenden',
            toggleProjectionBlank, { disabled: !status.active }),
          key(icons.action(doc, 'next'), 'Nächste Seite', function () { BAO.session.next(false); }, { disabled: !paging })
        ));

        var levels = h('div.cr-pop__row');
        [1, 2, 3].forEach(function (level) {
          levels.appendChild(key(icons.action(doc, 'level' + level), 'Unterstützungsstufe ' + level,
            function () { BAO.session.setLevel(level); },
            { disabled: status.kind !== 'bank', 'aria-pressed': status.kind === 'bank' && status.level === level ? 'true' : 'false' }));
        });
        box.appendChild(levels);

        box.appendChild(h('div.cr-pop__row', {},
          key(icons.action(doc, 'live'), 'Live-Hilfe einblenden', function () {
            closePopup();
            // Der Dialog steht in der Lehreransicht – im Vollbild wäre er unsichtbar.
            if (document.fullscreenElement && document.exitFullscreen) {
              var leaving = document.exitFullscreen();
              if (leaving && leaving.catch) leaving.catch(function () {});
            }
            BAO.app.openLiveHelp();
          }),
          key(icons.action(doc, 'stop'), 'Projektion beenden', function () {
            closePopup();
            stopProjection();
          }, { disabled: !status.active })
        ));

        var list = classroom.presets();
        box.appendChild(h('div.cr-pop__sep'));
        box.appendChild(h('div.cr-pop__label', { text: 'Gemeinsam starten' }));
        if (!list.length) {
          box.appendChild(h('div.cr-pop__detail', { text: 'Noch kein Phasen-Preset angelegt.' }));
        } else {
          var presetList = h('div.cr-pop__list');
          list.forEach(function (item) {
            var info = classroom.presetStatus(item);
            var label = (info.missing ? '⚠ ' : '') + BAO.classroomModel.presetLabel(item);
            presetList.appendChild(key(label, info.missing
              ? 'Das Ziel ist nicht mehr vorhanden – Sozialform, Material und Timer werden trotzdem eingestellt.'
              : 'Projektion, Sozialform, Material und Timer gemeinsam starten',
              function () { closePopup(); startPreset(item.id); },
              { 'class': 'cr-key--wide', dataset: { warn: info.missing ? 'true' : null } }));
          });
          box.appendChild(presetList);
        }
        box.appendChild(key('Presets verwalten …', 'Zur Ansicht „Soundboard“', function () {
          closePopup();
          BAO.app.go('soundboard');
        }, { 'class': 'cr-key--wide' }));
      }
    };

    /* --- Beobachten ------------------------------------------------------------------------- */

    /* Im Beamerfenster tickt die Uhr zusätzlich im eigenen Fenster: Browser
       bremsen ein verdecktes Hauptfenster aus, das sichtbare Beamerfenster nicht. */
    function syncTicker() {
      var needed = !destroyed && win !== window && classroom.live().timer.running;
      if (needed && !ownTicker) {
        ownTicker = win.setInterval(function () { classroom.tick(); }, classroom.TICK_MS);
      } else if (!needed && ownTicker) {
        win.clearInterval(ownTicker);
        ownTicker = null;
      }
    }

    function onProjection() {
      if (destroyed || !classroom.settings().show.projection) return;
      if (projectionSignature(projectionStatus()) === lastProjection) return;
      render();
    }

    var unsubscribe = [
      classroom.subscribe(function (reason) {
        if (destroyed) return;
        if (reason === 'tick') { updateTimer(); return; }
        render();
      }),
      sounds.subscribe(function () { if (!destroyed) updateCoins(); }),
      BAO.session.subscribe(onProjection),
      BAO.board.subscribe(onProjection)
    ];

    var observer = null;
    if (win.ResizeObserver) {
      observer = new win.ResizeObserver(function () { layout(); });
      observer.observe(host, { box: 'border-box' });
    } else {
      win.addEventListener('resize', layout);
    }

    var controller = {
      kind: kind,
      host: host,
      node: node,
      surface: options.surface || null,
      render: render,
      layout: layout,
      isAlive: function () { return !destroyed; },
      destroy: function () {
        if (destroyed) return;
        destroyed = true;
        closePopup();
        unsubscribe.forEach(function (off) { if (off) off(); });
        if (observer) observer.disconnect(); else win.removeEventListener('resize', layout);
        try { if (ownTicker) win.clearInterval(ownTicker); } catch (err) { /* Fenster ist schon zu */ }
        ownTicker = null;
        if (node.parentNode) node.parentNode.removeChild(node);
        try { host.style.removeProperty('--cr-reserve'); } catch (err) { /* Fenster ist schon zu */ }
        var index = panels.indexOf(controller);
        if (index >= 0) panels.splice(index, 1);
      }
    };
    panels.push(controller);
    render();
    return controller;
  }

  /** Startet ein Preset und meldet ein fehlendes Ziel in Worten. */
  function startPreset(id) {
    var item = classroom.preset(id);
    var result = classroom.startPreset(id);
    if (result.ok && result.missing && item) {
      BAO.toast.show('„' + BAO.classroomModel.presetLabel(item) + '“: Das Ziel ist nicht mehr vorhanden. '
        + 'Sozialform, Material und Timer sind eingestellt.', { timeout: 6000 });
    }
    return result;
  }

  /* --- An die Ausgabeflächen hängen -------------------------------------------------------------- */

  /** Entfernt Leisten, deren Fläche es nicht mehr gibt (Vorschau neu gebaut, Fenster zu). */
  function prune() {
    var alive = BAO.output.surfaces();
    panels.slice().forEach(function (panel) {
      if (panel.kind === 'stage' && alive.indexOf(panel.surface) < 0) panel.destroy();
    });
  }

  BAO.output.onSurface(function (surface) {
    prune();
    try {
      mount(surface.stage.root, { kind: 'stage', surface: surface });
    } catch (err) {
      console.error('Die Unterrichtsleiste konnte nicht aufgebaut werden:', err);
    }
  });
  BAO.output.onChange(function (reason) {
    if (reason === 'window-closed' || reason === 'overlay-closed') prune();
  });

  BAO.classroomPanel = {
    mount: mount,
    tileNode: tileNode,
    coinNode: coinNode,
    projectionStatus: projectionStatus,
    startPreset: startPreset,
    /** Für Prüfungen: alle gerade hängenden Leisten. */
    panels: function () { return panels.slice(); }
  };
})(window.BAO = window.BAO || {});

  </script>
