/* styles/tokens.css */
/* ==========================================================================
   Boîte à Oublis – Gestaltungstoken
   Eine einzige Quelle für Farben, Abstände, Radien und Typografie.
   Farben tragen Bedeutung: Fachfarbe, Status, Unterstützungsstufe.
   ========================================================================== */

:root {
  /* --- Typografie: ausschließlich systemeigene Schriften (offline-tauglich) */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
             Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Semibold", var(--font-ui);
  --font-mono: "Cascadia Mono", Consolas, "SF Mono", "DejaVu Sans Mono", monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-md: 0.92rem;
  --fs-lg: 1.05rem;
  --fs-xl: 1.32rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.3rem;

  /* --- Abstände (4px-Raster) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  /* --- Radien und Schatten */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(20, 26, 38, .07), 0 1px 3px rgba(20, 26, 38, .05);
  --shadow-2: 0 6px 16px rgba(20, 26, 38, .10), 0 2px 5px rgba(20, 26, 38, .06);
  --shadow-3: 0 18px 48px rgba(15, 20, 30, .22);

  /* --- Helles Grundthema: warmes Papier, ruhige Tinte */
  --paper: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #fbf9f6;
  --surface-sunken: #efeae3;
  --ink: #1a1f28;
  --ink-2: #3c4553;
  --muted: #6b7382;
  --line: #e0d9d0;
  --line-strong: #cdc3b7;

  --brand: #1f4f6b;
  --brand-ink: #16394d;
  --brand-soft: #e3edf3;
  --accent: #c26240;
  --accent-soft: #f8e9e2;

  --focus: #2b7bb9;
  --danger: #a33a2c;
  --danger-soft: #fbe7e3;
  --ok: #1c7a5c;
  --ok-soft: #e2f2ec;

  /* --- Status des Wortschatzes (durchgängig gleiche Bedeutung) */
  --st-new: #1c7a5c;
  --st-new-soft: #e2f2ec;
  --st-active: #2464a8;
  --st-active-soft: #e5eefa;
  --st-revisit: #9a6512;
  --st-revisit-soft: #f8eeda;
  --st-core: #5c4a99;
  --st-core-soft: #ece8f8;
  --st-archived: #6b7382;
  --st-archived-soft: #eceae7;

  /* --- Genus des Artikels (gleiche Bedeutung wie in der Projektion) */
  --genus-m: #0f3f96;
  --genus-f: #9c1223;
  --genus-n: #10603a;

  --hit: 38px;              /* Mindesthöhe für Bedienelemente */
  --rail-w: 218px;
  --topbar-h: 56px;
  --foot-h: 30px;
}

/* --- Dunkles Thema ------------------------------------------------------ */
:root[data-theme="dark"] {
  --paper: #14181f;
  --surface: #1b212a;
  --surface-2: #202733;
  --surface-sunken: #10141a;
  --ink: #eef1f5;
  --ink-2: #c6cdd8;
  --muted: #9aa4b2;
  --line: #2c3542;
  --line-strong: #3d4857;

  --brand: #7fb8d8;
  --brand-ink: #a9d2ea;
  --brand-soft: #1d2c37;
  --accent: #e2916d;
  --accent-soft: #33241d;

  --focus: #63b3ed;
  --danger: #e88f7f;
  --danger-soft: #35201c;
  --ok: #6dc9a8;
  --ok-soft: #16302a;

  --st-new: #6dc9a8;
  --st-new-soft: #16302a;
  --st-active: #7db2ea;
  --st-active-soft: #172736;
  --st-revisit: #dcb063;
  --st-revisit-soft: #322818;
  --st-core: #b0a0ea;
  --st-core-soft: #262238;
  --st-archived: #9aa4b2;
  --st-archived-soft: #232830;

  --genus-m: #7db0f7;
  --genus-f: #f5919c;
  --genus-n: #77d3a5;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, .45);
  --shadow-3: 0 18px 48px rgba(0, 0, 0, .6);
}

@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --paper: #14181f;
    --surface: #1b212a;
    --surface-2: #202733;

    --st-active: #7db2ea;
    --st-active-soft: #172736;
    --st-revisit: #dcb063;
    --st-revisit-soft: #322818;
    --st-core: #b0a0ea;

  }
}

/* styles/base.css */
/* ==========================================================================
   Grundlagen: Reset, Typografie, wiederkehrende Bedienelemente
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

/* Eigene display-Regeln dürfen [hidden] nicht aushebeln. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; font-weight: 650; }
h1 { font-size: var(--fs-2xl); letter-spacing: -.012em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--brand); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--surface); color: var(--ink);
  padding: var(--sp-2) var(--sp-3); border-radius: 0 0 var(--r-md) 0;
}
.skip-link:focus { left: 0; }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --- Schaltflächen ------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--hit); padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 550; cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, transform .06s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn--primary,
:root[data-theme="auto"] .btn--primary { color: #10171d; }
@media (prefers-color-scheme: light) { :root[data-theme="auto"] .btn--primary { color: #fff; } }
.btn--primary:hover { background: var(--brand-ink); border-color: var(--brand-ink); }

.btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-sunken); }
.btn--danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn--danger:hover { background: var(--danger-soft); }
.btn--sm { min-height: 30px; padding: 0 var(--sp-2); font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn--icon { padding: 0; width: var(--hit); }
.btn--icon.btn--sm { width: 30px; }
.btn--wide { width: 100%; }
.btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }

.ico { font-size: 1.05em; line-height: 1; }
.kbd, kbd {
  font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 4px; background: var(--surface-2); white-space: nowrap;
}

/* --- Formularelemente --------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.field > label, .label {
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
}
.field .hint { font-size: var(--fs-xs); color: var(--muted); }

input[type="text"], input[type="search"], input[type="number"], input[type="date"],
select, textarea {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  padding: 8px var(--sp-3); min-height: var(--hit); width: 100%;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); width: 16px; height: 16px; }

.switch { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); }

/* --- Etiketten und Chips ------------------------------------------------ */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px var(--sp-2); border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em;
  background: var(--surface-sunken); color: var(--ink-2); border: 1px solid transparent;
  white-space: nowrap;
}
.chip--st-new      { background: var(--st-new-soft); color: var(--st-new); }
.chip--st-active   { background: var(--st-active-soft); color: var(--st-active); }
.chip--st-revisit  { background: var(--st-revisit-soft); color: var(--st-revisit); }
.chip--st-core     { background: var(--st-core-soft); color: var(--st-core); }
.chip--st-archived { background: var(--st-archived-soft); color: var(--st-archived); }
.chip--tag { background: transparent; border-color: var(--line-strong); color: var(--muted); font-weight: 500; }
.chip--subject { background: var(--subject-soft, var(--brand-soft)); color: var(--subject-color, var(--brand-ink)); }
.chip--outline { background: transparent; border-color: var(--line-strong); }
.chip--warn { background: var(--danger-soft, var(--st-revisit-soft)); color: var(--danger); border-color: currentColor; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* --- Karten ------------------------------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
}
.card__head h2, .card__head h3 { margin: 0; }
.card__body { padding: var(--sp-4); }
.card__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.spacer { flex: 1 1 auto; }

/* --- Leerezustände ------------------------------------------------------ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--muted);
  border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2);
}
.empty__title { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink-2); font-weight: 650; }
.empty__text { max-width: 46ch; }

/* --- Meldungen ---------------------------------------------------------- */
.note {
  border-left: 3px solid var(--brand); background: var(--brand-soft);
  padding: var(--sp-3); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: var(--fs-sm);
}
.note--warn { border-color: var(--st-revisit); background: var(--st-revisit-soft); }
.note--danger { border-color: var(--danger); background: var(--danger-soft); }

/* --- Toasts ------------------------------------------------------------- */
.toast-root {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  z-index: 90; pointer-events: none; width: min(560px, calc(100vw - 32px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-2); font-size: var(--fs-sm);
  animation: toast-in .16s ease-out;
}
.toast--danger { background: var(--danger); color: #fff; }
.toast--ok { background: var(--ok); color: #fff; }
.toast__text { flex: 1 1 auto; }
.toast .btn {
  background: transparent; border-color: currentColor; color: inherit;
  min-height: 28px; padding: 0 var(--sp-2); font-size: var(--fs-sm);
}
.toast .btn:hover { background: rgba(255,255,255,.14); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Dialoge ------------------------------------------------------------ */
.modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(16, 20, 27, .45);
  display: grid; place-items: center; padding: var(--sp-4);
  animation: fade-in .12s ease-out;
}
.modal {
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  width: min(var(--modal-w, 560px), 100%); max-height: min(90vh, 900px);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line);
}
.modal__head { padding: var(--sp-4) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--line); }
.modal__head h2 { font-size: var(--fs-xl); }
.modal__head p { margin: var(--sp-1) 0 0; color: var(--muted); font-size: var(--fs-sm); }
.modal__body { padding: var(--sp-4) var(--sp-5); overflow: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.modal__foot {
  padding: var(--sp-3) var(--sp-5) var(--sp-4); border-top: 1px solid var(--line);
  display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* --- Formular-Raster ---------------------------------------------------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.stack--tight { gap: var(--sp-2); }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* --- Reduzierte Bewegung ------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* styles/shell.css */
/* ==========================================================================
   Anwendungsrahmen: Kopfzeile, Navigationsleiste, Inhalt, Fußzeile
   ========================================================================== */

.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--foot-h);
  grid-template-areas:
    "topbar topbar"
    "rail   main"
    "foot   foot";
  height: 100vh;
  height: 100dvh;
}
.shell[data-rail="collapsed"] { --rail-w: 62px; }

/* --- Kopfzeile ---------------------------------------------------------- */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.topbar__brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand__mark { color: var(--brand); display: flex; }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand__text strong { font-family: var(--font-display); font-size: var(--fs-lg); letter-spacing: -.01em; }
.brand__text small { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar__context { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 auto; min-width: 0; }
.topbar__actions { display: flex; align-items: center; gap: var(--sp-1); }
.topbar__actions .kbd { margin-left: 2px; }

.ctx-select {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 3px 3px 3px var(--sp-3);
  min-width: 0;
}
.ctx-select__label { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.ctx-select select {
  border: none; background: transparent; min-height: 30px; padding: 0 26px 0 4px;
  font-weight: 600; width: auto; max-width: 26ch;
  background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
}
.ctx-select select:focus-visible { outline-offset: 0; }
.ctx-flag {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: .62rem; font-weight: 700; letter-spacing: -.02em;
  background: var(--subject-soft); color: var(--subject-color);
}

@media (max-width: 1080px) {
  .btn__label { display: none; }
  .topbar__actions .kbd { display: none; }
  .ctx-select__label { display: none; }
}

/* --- Navigationsleiste -------------------------------------------------- */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-3) var(--sp-2);
  overflow-y: auto;
}
.rail__item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 9px var(--sp-3); border-radius: var(--r-md);
  color: var(--ink-2); text-decoration: none; font-weight: 550; font-size: var(--fs-md);
  border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%;
  font-family: inherit;
}
.rail__item:hover { background: var(--surface-sunken); }
.rail__item[aria-current="page"] {

table.mini tr:last-child td { border-bottom: 0; }

/* --- Eintragsformular --------------------------------------------------- */
.entry-form { display: grid; gap: var(--sp-3); }
.entry-form .full { grid-column: 1 / -1; }
.form-more { border-top: 1px dashed var(--line); padding-top: var(--sp-3); }
.form-more summary { cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: var(--fs-sm); }
.form-more[open] summary { margin-bottom: var(--sp-3); }
.tag-input { display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 4px; min-height: var(--hit); }
.tag-input input { border: 0; min-height: 28px; flex: 1 1 120px; width: auto; padding: 0 6px; }
.tag-input .chip { cursor: default; }
.tag-input .chip button { border: 0; background: none; cursor: pointer; color: inherit; padding: 0 0 0 2px; font-size: 1rem; line-height: 1; }

/* --- Virtuelle IPA-Tastatur ---------------------------------------------- */
.ipa-field > label { display: flex; align-items: center; gap: var(--sp-2); }
.ipa-field > label .btn { margin-left: auto; font-weight: 550; }
.ipa-field input {
  font-family: "Segoe UI", "DejaVu Sans", "Charis SIL", "Doulos SIL", system-ui, sans-serif;
  font-size: var(--fs-lg);
  letter-spacing: .01em;
}

.ipa-board {
  margin-top: var(--sp-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface-2);
  padding: var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-2);
}
.ipa-board__tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.ipa-board__tabs .btn[aria-selected="true"] {
  background: var(--brand); border-color: var(--brand); color: #fff;
}
:root[data-theme="dark"] .ipa-board__tabs .btn[aria-selected="true"] { color: #10171d; }

.ipa-board__groups { display: flex; flex-direction: column; gap: var(--sp-2); }
.ipa-group__label {
  font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-weight: 700; margin-bottom: 4px;
}
.ipa-keys { display: flex; flex-wrap: wrap; gap: 4px; }
.ipa-key {
  min-width: 42px; min-height: 38px; padding: 0 var(--sp-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); cursor: pointer;
  font-family: "Segoe UI", "DejaVu Sans", "Charis SIL", "Doulos SIL", system-ui, sans-serif;
  font-size: 1.15rem; line-height: 1;
}
.ipa-key:hover { background: var(--brand-soft); border-color: var(--brand); }
.ipa-key:active { transform: translateY(1px); }

.ipa-board__foot {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
}
.ipa-board__hint {
  font-size: var(--fs-sm); color: var(--muted);
  /* Feste Höhe und kein Umbruch: Der Hinweis wechselt beim Überfahren der
     Tasten ständig – die Tastatur darf dabei nicht springen. */
  height: 1.4em; line-height: 1.4em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-top: 1px solid var(--line); padding-top: var(--sp-2);
  box-sizing: content-box;
}

/* Feld mit Knopf in der Beschriftungszeile (Leerstelle, IPA-Tastatur …) */
.field--action > label,
.ipa-field > label { display: flex; align-items: center; gap: var(--sp-2); }
.field--action > label .btn,
.ipa-field > label .btn { margin-left: auto; font-weight: 550; }

/* --- Verbindung zum Teacher Soundboard (Companion-Modus) ------------------- */
.conn { display: flex; align-items: center; gap: var(--sp-2); }
.conn__dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted); flex: 0 0 auto;
}
.conn__text { font-weight: 550; }
.conn[data-phase="connected"] .conn__dot { background: var(--ok); }
.conn[data-phase="pairing"] .conn__dot,
.conn[data-phase="searching"] .conn__dot {
  background: var(--accent, var(--muted));
  /* Ruhiges Pulsieren: Es läuft eine Suche, es ist aber kein Fehler. */
  animation: conn-pulse 1.6s ease-in-out infinite;
}
.conn[data-phase="denied"] .conn__dot,
.conn[data-phase="superseded"] .conn__dot { background: var(--danger); }

@keyframes conn-pulse {
  0%, 100% { opacity: .35; }
  50% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .conn[data-phase="pairing"] .conn__dot,
.conn[data-phase="searching"] .conn__dot { animation: none; opacity: .7; }
}

  var util = BAO.util;

  var APP_VERSION = '1.2.0';
  var SCHEMA_VERSION = 2;
  var EXPORT_KIND = 'boite-a-oublis.backup';

  /* --- Status eines Wortschatzeintrags ------------------------------------ */
  var STATUS = [
    { id: 'new',      label: 'neu eingeführt',   short: 'neu',        hint: 'Wird gerade zum ersten Mal eingeführt.' },
    { id: 'active',   label: 'aktuell im Einsatz', short: 'aktiv',    hint: 'Gehört zur laufenden Unterrichtsreihe.' },
    { id: 'revisit',  label: 'wieder aufgreifen', short: 'auffrischen', hint: 'Aus einer früheren Reihe, soll reaktiviert werden.' },
    { id: 'core',     label: 'Grundbestand',     short: 'gesichert',  hint: 'Gesicherter Wortschatz der Lerngruppe.' },
    { id: 'archived', label: 'archiviert',       short: 'archiviert', hint: 'Vorläufig aus dem aktiven Bestand genommen.' }
  ];
  var STATUS_ORDER = ['new', 'active', 'revisit', 'core', 'archived'];

  function statusInfo(id) {
    for (var i = 0; i < STATUS.length; i++) if (STATUS[i].id === id) return STATUS[i];
    return STATUS[1];
  }

  /* --- Unterstützungsstufen ----------------------------------------------- */
  var LEVELS = [
    { id: 1, name: 'Impuls',      hint: 'Nur Schlüsselwörter' },
    { id: 2, name: 'Chunks',      hint: 'Wortverbindungen und Satzanfänge' },
    { id: 3, name: 'Vollbild',    hint: 'Erklärung, Beispiel, Übersetzung' }
  ];

  /* --- Projizierbare Felder eines Eintrags --------------------------------
     "level" = ab welcher Unterstützungsstufe das Feld standardmäßig
     eingeblendet wird. Die Lehrkraft kann jedes Feld einzeln übersteuern. */
  var FIELDS = [
    { key: 'article',       label: 'Artikel',          level: 1, kind: 'lex' },
    { key: 'gram',          label: 'Formhinweis',      level: 3, kind: 'lex' },
    { key: 'collocation',   label: 'Wortverbindung',   level: 2, kind: 'lex' },
    { key: 'chunk',         label: 'Chunk',            level: 2, kind: 'lex' },
    { key: 'explanation',   label: 'Erklärung (Zielsprache)', level: 3, kind: 'lex' },
    { key: 'translation',   label: 'Deutsch',          level: 3, kind: 'lex' },
    { key: 'example',       label: 'Beispielsatz',     level: 3, kind: 'lex' },
    { key: 'pronunciation', label: 'Aussprache',       level: 3, kind: 'lex' },
    { key: 'starterTranslation', label: 'Satzanfang: Deutsch', level: 3, kind: 'starter' }
  ];

  function fieldInfo(key) {
    for (var i = 0; i < FIELDS.length; i++) if (FIELDS[i].key === key) return FIELDS[i];
    return null;
  }

  /* --- Kommunikative Funktionen (Datensatz, daher erweiterbar) ------------- */
  function defaultFunctions() {
    var list = [
      ['opinion',   'eine Meinung äußern'],
      ['reason',    'begründen'],
      ['agree',     'zustimmen'],
      ['disagree',  'widersprechen'],
      ['ask',       'nachfragen'],
      ['clarify',   'präzisieren'],
      ['compare',   'vergleichen'],
      ['example',   'ein Beispiel geben'],
      ['continue',  'ein Gespräch weiterführen'],
      ['summarize', 'Ergebnisse zusammenfassen'],
      ['analyse',   'einen Text analysieren'],
      ['mediate',   'sprachmitteln']
    ];
    return list.map(function (pair, index) {
      return { id: 'fn_' + pair[0], label: pair[1], order: index };
    });
  }

  /* --- Unterrichtsszenen --------------------------------------------------- */
  var SCENES = [
    'Partnergespräch', 'Diskussion', 'Rollenspiel', 'Präsentation',
    'Schreibphase', 'Textanalyse', 'Sprachmittlung', 'Reflexion', 'Wortschatzarbeit'
  ];

  var STARTER_VARIANTS = [
    { id: 'einfach',       label: 'einfach',       hint: 'kurze, stark stützende Formulierung' },
    { id: 'standard',      label: 'Standard',      hint: 'Regelvariante für die Lerngruppe' },
    { id: 'anspruchsvoll', label: 'anspruchsvoll', hint: 'für weiter fortgeschrittene Lernende' }
  ];

  /* --- Fabriken ------------------------------------------------------------ */

  function makeSubject(data) {
    return Object.assign({
      id: util.uid('sub'),
      name: 'Neues Fach',
      short: 'NEU',
      color: '#1f4f6b',
      colorSoft: '#e3edf3',
      order: 0,
      createdAt: util.nowISO()
    }, data || {});
  }

  function makeGroup(data) {
    return Object.assign({
      id: util.uid('grp'),
      subjectId: '',
      name: 'Neue Lerngruppe',
      grade: 7,
      schoolYear: util.currentSchoolYear(),
      note: '',
      favorite: false,
      archived: false,
      history: [],
      createdAt: util.nowISO(),
      updatedAt: util.nowISO()
    }, data || {});
  }

  function makeUnit(data) {
    return Object.assign({
      id: util.uid('unt'),
      groupId: '',
      title: 'Neue Unterrichtsreihe',
      description: '',
      schoolYear: util.currentSchoolYear(),
      status: 'current',
      order: 0,
      createdAt: util.nowISO()
    }, data || {});
  }

  function makeLexeme(data) {
    return Object.assign({
      id: util.uid('lex'),
      subjectId: '',
      groupId: '',
      term: '',
      article: '',
      gram: '',
      collocation: '',
      chunk: '',
      explanation: '',
      translation: '',
      example: '',
      pronunciation: '',
      functionId: '',
      topics: [],
      tags: [],
      cefr: '',
      status: 'new',
      introducedUnitId: '',
      introducedSchoolYear: '',
      favorite: false,
      createdAt: util.nowISO(),
      updatedAt: util.nowISO()
    }, data || {});
  }

  function makeStarter(data) {
    return Object.assign({
      id: util.uid('sta'),
      subjectId: '',
      groupId: '',            // leer = im ganzen Fach verfügbar
      text: '',
      translation: '',
      functionId: '',
      variant: 'standard',
      tags: [],
      status: 'active',
      note: '',
      createdAt: util.nowISO(),
      updatedAt: util.nowISO()
    }, data || {});
  }

  function makeBankItem(data) {
    return Object.assign({
      id: util.uid('itm'),
      kind: 'lex',            // 'lex' | 'starter'
      refId: ''
    }, data || {});
  }

  function makeSection(data) {
    return Object.assign({
      id: util.uid('sec'),
      title: 'Neuer Abschnitt',
      layout: 'auto',         // 'auto' | 'cards' | 'impulse' | 'starters'
      items: []
    }, data || {});
  }

  function makeBank(data) {
    return Object.assign({
      id: util.uid('bnk'),
      subjectId: '',
      groupId: '',
      unitId: '',
      title: 'Neue Wortbank',
      scene: 'Partnergespräch',
      note: '',
      favorite: false,
      defaultLevel: 2,
      sections: [],
      createdAt: util.nowISO(),
      updatedAt: util.nowISO(),
      lastUsedAt: ''
    }, data || {});
  }

  /* --- Tafel: die einfache Grundform ---------------------------------------
     Eine Tafel ist eine Fläche mit frei platzierten Elementen. Ein Element ist
     ein Verweis auf einen Eintrag des Bestands – ob dieser aus einem Wort oder
     aus einem ganzen Satz besteht, spielt hier bewusst keine Rolle.
     x und y sind Anteile der Fläche (0…1) und bezeichnen die Mitte des
     Elements. Dadurch sitzt es auf jeder Auflösung an derselben Stelle. */

  function makeBoardItem(data) {
    return Object.assign({
      id: util.uid('bit'),
      kind: 'lex',            // 'lex' | 'starter' – für die Bedienung ohne Bedeutung
      refId: '',
      x: 0.5,
      y: 0.5,
      scale: 1                // 0,5 … 2 – einzelne Elemente hervorheben
    }, data || {});
  }

  function makeBoard(data) {
    return Object.assign({
      id: util.uid('brd'),
      subjectId: '',
      groupId: '',
      unitId: '',
      title: 'Neue Tafel',
      note: '',
      favorite: false,
      showArticle: true,      // vorhandene Artikel farbig mitzeigen
      showTranslation: false, // deutsche Entsprechung einblenden
      items: [],
      createdAt: util.nowISO(),
      updatedAt: util.nowISO(),
      lastUsedAt: ''
    }, data || {});
  }

  /* --- Voreinstellungen ---------------------------------------------------- */
  function defaultSettings() {
    return {
      theme: 'auto',
      // Einfacher Modus: Die Oberfläche zeigt nur Tafeln, Elemente,
      // Lerngruppen und Daten. Alles Weitere bleibt vorhanden und ist über
      // die vollständige Ansicht wieder erreichbar.
      simpleMode: false,
      stageTheme: 'light',
      stageScale: 1,
      autoAdvanceSeconds: 45,
      autoAdvanceLoop: false,
      maxItemsPerSlide: 12,
      showProgressOnStage: true,
      railCollapsed: false,
      scenes: SCENES.slice(),
      fieldLevels: FIELDS.reduce(function (acc, f) { acc[f.key] = f.level; return acc; }, {})
    };
  }

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      meta: {
        appVersion: APP_VERSION,
        createdAt: util.nowISO(),
        updatedAt: util.nowISO()
      },
      settings: defaultSettings(),
      ui: { subjectId: '', groupId: '', recentBanks: [], recentGroups: [] },
      functions: defaultFunctions(),
      subjects: [],
      groups: [],
      units: [],
      lexemes: [],
      starters: [],
      banks: [],
      boards: []
    };
  }

  var COLLECTIONS = ['subjects', 'groups', 'units', 'lexemes', 'starters', 'banks', 'boards', 'functions'];

  /* --- Prüfung und Reparatur ----------------------------------------------- */

  /**
   * Prüft eine geladene oder importierte Struktur.
   * Gibt { ok, errors[], warnings[], state } zurück. Fehlende Felder werden
   * ergänzt, unbekannte Felder bleiben erhalten (vorwärtskompatibel).
   */
  function validateState(input) {
    var errors = [];
    var warnings = [];

    if (!input || typeof input !== 'object' || Array.isArray(input)) {
      return { ok: false, errors: ['Die Datei enthält kein gültiges Datenobjekt.'], warnings: warnings, state: null };
    }

    var state = Object.assign(emptyState(), util.clone(input));
    state.settings = Object.assign(defaultSettings(), input.settings || {});
    state.settings.fieldLevels = Object.assign(defaultSettings().fieldLevels, (input.settings && input.settings.fieldLevels) || {});
    state.meta = Object.assign(emptyState().meta, input.meta || {});
    state.ui = Object.assign({ subjectId: '', groupId: '', recentBanks: [], recentGroups: [] }, input.ui || {});

    COLLECTIONS.forEach(function (name) {
      if (!Array.isArray(state[name])) {
        if (input[name] !== undefined) warnings.push('Die Liste „' + name + '“ war beschädigt und wurde geleert.');
        state[name] = [];
      }
    });

    if (!state.functions.length) state.functions = defaultFunctions();

    // Einträge ohne ID sind nicht referenzierbar -> reparieren statt verwerfen.
    COLLECTIONS.forEach(function (name) {
      var seen = Object.create(null);
      state[name] = state[name].filter(function (item) {
        return item && typeof item === 'object' && !Array.isArray(item);
      }).map(function (item) {
        if (!item.id || seen[item.id]) {
          item.id = util.uid(name.slice(0, 3));
          warnings.push('Ein Eintrag in „' + name + '“ hatte keine eindeutige Kennung und bekam eine neue.');
        }
        seen[item.id] = true;
        return item;
      });
    });

    // Verweise prüfen: Wortbank-Positionen ohne Ziel entfernen.
    var lexIds = new Set(state.lexemes.map(function (l) { return l.id; }));
    var staIds = new Set(state.starters.map(function (s) { return s.id; }));
    var removed = 0;
    state.banks.forEach(function (bank) {
      if (!Array.isArray(bank.sections)) bank.sections = [];
      bank.sections.forEach(function (section) {
        if (!Array.isArray(section.items)) section.items = [];
        section.items = section.items.filter(function (item) {
          if (!item || (item.kind !== 'lex' && item.kind !== 'starter')) return false;
          var exists = item.kind === 'lex' ? lexIds.has(item.refId) : staIds.has(item.refId);
          if (!exists) removed += 1;
          return exists;
        });
      });
    });
    if (removed) warnings.push(removed + ' Wortbank-Einträge verwiesen ins Leere und wurden entfernt.');

    // Dasselbe für die Tafeln, zusätzlich werden Positionen auf die Fläche
    // zurückgeholt: Ein Element außerhalb von 0…1 wäre nicht mehr sichtbar.
    var lostOnBoards = 0;
    state.boards.forEach(function (board) {
      if (!Array.isArray(board.items)) board.items = [];
      board.items = board.items.filter(function (item) {
        if (!item || (item.kind !== 'lex' && item.kind !== 'starter')) return false;
        var exists = item.kind === 'lex' ? lexIds.has(item.refId) : staIds.has(item.refId);
        if (!exists) lostOnBoards += 1;
        return exists;
      }).map(function (item) {
        item.x = util.clamp(typeof item.x === 'number' ? item.x : 0.5, 0, 1);
        item.y = util.clamp(typeof item.y === 'number' ? item.y : 0.5, 0, 1);
        item.scale = util.clamp(typeof item.scale === 'number' ? item.scale : 1, 0.5, 2);
        return item;
      });
    });
    if (lostOnBoards) warnings.push(lostOnBoards + ' Tafel-Elemente verwiesen ins Leere und wurden entfernt.');

    if (typeof state.schemaVersion !== 'number') {
      state.schemaVersion = SCHEMA_VERSION;
      warnings.push('Die Versionsangabe fehlte und wurde ergänzt.');
    }
    if (state.schemaVersion > SCHEMA_VERSION) {
      errors.push('Die Sicherung stammt aus einer neueren Programmversion (Datenversion '
        + state.schemaVersion + '). Bitte zuerst die App aktualisieren.');
    }

    return { ok: errors.length === 0, errors: errors, warnings: warnings, state: state };
  }

  BAO.schema = {
    APP_VERSION: APP_VERSION,
    SCHEMA_VERSION: SCHEMA_VERSION,
    EXPORT_KIND: EXPORT_KIND,
    STATUS: STATUS,
    STATUS_ORDER: STATUS_ORDER,
    statusInfo: statusInfo,
    LEVELS: LEVELS,
    FIELDS: FIELDS,
    fieldInfo: fieldInfo,
    SCENES: SCENES,
    STARTER_VARIANTS: STARTER_VARIANTS,
    COLLECTIONS: COLLECTIONS,
    defaultFunctions: defaultFunctions,
    defaultSettings: defaultSettings,
    emptyState: emptyState,
    validateState: validateState,
    makeSubject: makeSubject,
    makeGroup: makeGroup,
    makeUnit: makeUnit,
    makeLexeme: makeLexeme,
    makeStarter: makeStarter,
    makeBank: makeBank,
    makeSection: makeSection,
    makeBankItem: makeBankItem,
    makeBoard: makeBoard,
    makeBoardItem: makeBoardItem
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/core/migrations.js */
/* ==========================================================================
   Migrationen
   Jede Migration hebt den Datenbestand um genau eine Version an. Dadurch
   lassen sich alte Sicherungen auch nach Jahren noch einlesen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  /**
   * Reihenfolge ist bindend: Index 0 führt von Datenversion 0 auf 1 usw.
   * Eine Migration bekommt den Zustand, verändert ihn und gibt ihn zurück.
   */
  var STEPS = [
    {
      to: 1,
      describe: 'Vorabversionen: fehlende Grundfelder ergänzen',
      run: function (state) {
        // Frühe Testdaten kannten weder Abschnitte in Wortbanken noch Verläufe.
        (state.banks || []).forEach(function (bank) {
          if (!Array.isArray(bank.sections)) {
            bank.sections = [{
              id: BAO.util.uid('sec'),
              title: 'Wortschatz',
              layout: 'auto',
              items: Array.isArray(bank.items) ? bank.items : []
            }];
            delete bank.items;
          }
          if (typeof bank.defaultLevel !== 'number') bank.defaultLevel = 2;
        });
        (state.groups || []).forEach(function (group) {
          if (!Array.isArray(group.history)) group.history = [];
        });
        return state;
      }
    },
    {
      to: 2,
      describe: 'Tafeln und einfacher Modus ergänzt',
      run: function (state) {
        if (!Array.isArray(state.boards)) state.boards = [];
        if (!state.settings) state.settings = {};
        // Ein bestehender Bestand behält die vollständige Oberfläche. Wer die
        // einfache Grundform sehen möchte, schaltet sie in der Kopfzeile um.
        if (typeof state.settings.simpleMode !== 'boolean') state.settings.simpleMode = false;
        return state;
      }
    }
  ];

  /**
   * Hebt den Zustand auf die aktuelle Datenversion.
   * @returns {{state: object, applied: string[], error: string|null}}
   */
  function migrate(state) {
    var applied = [];
    var target = BAO.schema.SCHEMA_VERSION;
    var version = typeof state.schemaVersion === 'number' ? state.schemaVersion : 0;

    if (version > target) {
      return { state: state, applied: applied, error: 'Datenversion ' + version + ' ist neuer als diese Programmversion.' };
    }

    STEPS.forEach(function (step) {
      if (version < step.to && step.to <= target) {
        try {
          state = step.run(state) || state;
          version = step.to;
          state.schemaVersion = version;
          applied.push('v' + step.to + ': ' + step.describe);
        } catch (err) {
          throw new Error('Migration auf Version ' + step.to + ' fehlgeschlagen: ' + err.message);
        }
      }
    });

    state.schemaVersion = target;
    return { state: state, applied: applied, error: null };
  }

  BAO.migrations = { migrate: migrate, STEPS: STEPS };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/core/store.js */
/* ==========================================================================
   Zustandsspeicher
   Ein einziger Zustand, veränderbar nur über commit(). Jeder commit legt eine
   Momentaufnahme für „Rückgängig“ an und speichert verzögert lokal.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var storage = BAO.storage;

  var state = null;
  var listeners = [];
  var undoStack = [];
  var redoStack = [];
  var MAX_HISTORY = 40;
  var storageState = 'ok';       // 'ok' | 'session' | 'error'
  var storageMessage = '';
  var lastSavedAt = '';

  var persist = util.debounce(function () { persistNow(); }, 300);

  function persistNow() {
    if (!state) return;
    state.meta.updatedAt = util.nowISO();
    var result = storage.saveState(state);
    if (result.ok) {
      storageState = 'ok';
      storageMessage = '';
      lastSavedAt = util.nowISO();
    } else if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';
    } else {
      storageState = 'error';
      storageMessage = result.quota
        ? 'Der lokale Speicher ist voll. Bitte exportieren und nicht mehr benötigte Einträge archivieren.'
        : 'Die Daten konnten nicht gespeichert werden.';
    }
    emitStorage();
  }

  function emitStorage() {
    document.dispatchEvent(new CustomEvent('bao:storage', {
      detail: { state: storageState, message: storageMessage, savedAt: lastSavedAt }
    }));
  }

  function notify(meta) {
    listeners.forEach(function (fn) {
      try { fn(state, meta || {}); } catch (err) { console.error('Fehler in einem Zustandsbeobachter:', err); }
    });
  }

  /* --- Initialisierung ---------------------------------------------------- */

  function init(options) {
    options = options || {};
    var loaded = storage.loadState();
    var startedFresh = false;

    if (loaded) {
      try {
        var migrated = BAO.migrations.migrate(loaded);
        if (migrated.error) {
          console.warn(migrated.error);
          storageState = 'error';
          storageMessage = migrated.error;
        }
        var checked = schema.validateState(migrated.state);
        state = checked.state;
        if (checked.warnings.length) console.warn('Daten repariert:', checked.warnings);
      } catch (err) {
        console.error('Der gespeicherte Bestand konnte nicht gelesen werden:', err);
        storage.saveSafetyCopy(loaded);
        state = schema.emptyState();
        startedFresh = true;
        storageState = 'error';
        storageMessage = 'Der gespeicherte Bestand war beschädigt. Eine Sicherungskopie liegt im Bereich „Daten“.';
      }
    } else {
      state = schema.emptyState();
      startedFresh = true;
      if (options.seed !== false && BAO.seed) BAO.seed.fill(state);
    }

    state.meta.appVersion = schema.APP_VERSION;
    if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';
    }
    persistNow();

    window.addEventListener('beforeunload', function () { persist.cancel(); persistNow(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { persist.cancel(); persistNow(); }
    });

    notify({ reason: 'init', startedFresh: startedFresh });
    return state;
  }

  function getState() { return state; }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  /* --- Veränderungen ------------------------------------------------------ */

  /**
   * commit('Eintrag gelöscht', function (draft) { … })
   * options.undoable = false  -> reine Ansichts-/Einstellungsänderung
   */
  function commit(label, mutator, options) {
    options = options || {};
    var undoable = options.undoable !== false;
    var before = undoable ? JSON.stringify(state) : null;
    var draft = util.clone(state);
    var result = mutator(draft);
    if (result === false) return null;           // Mutator hat abgebrochen
    draft.meta.updatedAt = util.nowISO();
    state = draft;

    if (undoable) {
      undoStack.push({ label: label, snapshot: before, at: util.nowISO() });
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack.length = 0;
    }

    persist();
    notify({ reason: 'commit', label: label, undoable: undoable, payload: options.payload });
    return result === undefined ? true : result;
  }

  /** Ersetzt den gesamten Bestand (Import, Wiederherstellung). */
  function replaceState(nextState, label) {
    var before = JSON.stringify(state);
    storage.saveSafetyCopy(JSON.parse(before));
    state = nextState;
    undoStack.push({ label: label || 'Bestand ersetzt', snapshot: before, at: util.nowISO() });
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    persist.cancel();
    persistNow();
    notify({ reason: 'replace', label: label });
  }

  function canUndo() { return undoStack.length > 0; }
  function canRedo() { return redoStack.length > 0; }
  function lastUndoLabel() { return undoStack.length ? undoStack[undoStack.length - 1].label : ''; }

  function undo() {
    if (!undoStack.length) return null;
    var entry = undoStack.pop();
    redoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    persist.cancel();
    persistNow();
    notify({ reason: 'undo', label: entry.label });
    return entry.label;
  }

  function redo() {
    if (!redoStack.length) return null;
    var entry = redoStack.pop();
    undoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    persist.cancel();
    persistNow();
    notify({ reason: 'redo', label: entry.label });
    return entry.label;
  }

  function storageInfo() {
    return {
      state: storageState,
      message: storageMessage,
      savedAt: lastSavedAt,
      bytes: storage.approximateSize(),
      available: storage.isAvailable()
    };
  }

  BAO.store = {
    init: init,
    getState: getState,
    subscribe: subscribe,
    commit: commit,
    replaceState: replaceState,
    undo: undo,
    redo: redo,
    canUndo: canUndo,

/* js/core/backup.js */
/* ==========================================================================
   Sicherung: Export, Prüfung, Wiederherstellen und Zusammenführen
   Grundsatz: Ein Import darf niemals unbemerkt etwas zerstören. Vor jedem
   Schreibvorgang wird der bisherige Bestand als Sicherungskopie abgelegt und
   in den Rückgängig-Verlauf gestellt.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;

  function counts(state) {
    return {
      subjects: (state.subjects || []).length,
      groups: (state.groups || []).length,
      units: (state.units || []).length,
      lexemes: (state.lexemes || []).length,
      starters: (state.starters || []).length,
      banks: (state.banks || []).length,
      boards: (state.boards || []).length
    };
  }

  var COUNT_LABELS = {
    subjects: 'Fächer', groups: 'Lerngruppen', units: 'Unterrichtsreihen',
    lexemes: 'Wortschatzeinträge', starters: 'Satzanfänge', banks: 'Wortbanken',
    boards: 'Tafeln'
  };

  function buildExport(state) {
    return {
      kind: schema.EXPORT_KIND,
      appVersion: schema.APP_VERSION,
      schemaVersion: state.schemaVersion,
      exportedAt: util.nowISO(),
      counts: counts(state),
      data: util.clone(state)
    };
  }

  function suggestFilename(state) {
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var time = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    return 'boite-a-oublis_' + stamp + '_' + time + '.json';
  }

  function exportToFile(state) {
    var payload = buildExport(state);
    util.downloadText(suggestFilename(state), JSON.stringify(payload, null, 2), 'application/json');
    return payload;
  }

  /**
   * Liest und prüft eine Sicherungsdatei.
   * @returns {{ok:boolean, errors:string[], warnings:string[], incoming:object|null, meta:object}}
   */
  function analyse(text, currentState) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      return { ok: false, errors: ['Die Datei ist keine gültige JSON-Datei. (' + err.message + ')'], warnings: [], incoming: null, meta: {} };
    }

    var payload = parsed;
    var meta = {};

    if (parsed && parsed.kind === schema.EXPORT_KIND && parsed.data) {
      payload = parsed.data;
      meta = {
        exportedAt: parsed.exportedAt || '',
        appVersion: parsed.appVersion || '',
        schemaVersion: parsed.schemaVersion
      };
    } else if (parsed && parsed.schemaVersion !== undefined && parsed.lexemes !== undefined) {
      meta = { exportedAt: (parsed.meta && parsed.meta.updatedAt) || '', appVersion: (parsed.meta && parsed.meta.appVersion) || '' };
    } else {
      return {
        ok: false,
        errors: ['Die Datei stammt nicht aus Boîte à Oublis (Kennzeichen „' + schema.EXPORT_KIND + '“ fehlt).'],
        warnings: [], incoming: null, meta: {}
      };
    }

    var migrated;
    try {
      migrated = BAO.migrations.migrate(util.clone(payload));
    } catch (err) {
      return { ok: false, errors: [err.message], warnings: [], incoming: null, meta: meta };
    }
    if (migrated.error) {
      return { ok: false, errors: [migrated.error], warnings: [], incoming: null, meta: meta };
    }

    var checked = schema.validateState(migrated.state);
    if (!checked.ok) {
      return { ok: false, errors: checked.errors, warnings: checked.warnings, incoming: null, meta: meta };
    }

    meta.migrations = migrated.applied;
    meta.counts = counts(checked.state);
    meta.currentCounts = counts(currentState);
    return { ok: true, errors: [], warnings: checked.warnings, incoming: checked.state, meta: meta };
  }

  /* --- Zusammenführen ------------------------------------------------------ */

  var MERGE_COLLECTIONS = ['subjects', 'groups', 'units', 'lexemes', 'starters', 'banks', 'boards', 'functions'];

  function newerThan(a, b) {
    var ta = (a && (a.updatedAt || a.createdAt)) || '';
    var tb = (b && (b.updatedAt || b.createdAt)) || '';
    return ta > tb;
  }

  /**
   * Fügt den eingelesenen Bestand in den vorhandenen ein.
   * Regeln:
   *  - unbekannte Kennung  -> wird hinzugefügt
   *  - bekannte Kennung    -> der jüngere Datensatz gewinnt
   *  - Einstellungen bleiben lokal erhalten
   */
  function merge(currentState, incoming) {
    var result = util.clone(currentState);
    var report = { added: {}, updated: {}, kept: {} };

    MERGE_COLLECTIONS.forEach(function (name) {
      var index = new Map();
      (result[name] || []).forEach(function (item, i) { index.set(item.id, i); });
      report.added[name] = 0;
      report.updated[name] = 0;
      report.kept[name] = 0;

      (incoming[name] || []).forEach(function (item) {
        if (!index.has(item.id)) {
          result[name].push(util.clone(item));
          index.set(item.id, result[name].length - 1);
          report.added[name] += 1;
          return;
        }
        var position = index.get(item.id);
        var existing = result[name][position];
        if (newerThan(item, existing)) {
          result[name][position] = util.clone(item);
          report.updated[name] += 1;
        } else {
          report.kept[name] += 1;
        }
      });
    });

    // Verwaiste Wortbank-Positionen nach dem Zusammenführen bereinigen.
    var checked = schema.validateState(result);
    report.warnings = checked.warnings;
    return { state: checked.state, report: report };
  }

  function summariseReport(report) {
    var lines = [];
    MERGE_COLLECTIONS.forEach(function (name) {
      if (name === 'functions') return;
      var added = report.added[name] || 0;
      var updated = report.updated[name] || 0;
      if (!added && !updated) return;
      lines.push((COUNT_LABELS[name] || name) + ': ' + added + ' neu, ' + updated + ' aktualisiert');
    });
    return lines;
  }

  BAO.backup = {
    buildExport: buildExport,
    exportToFile: exportToFile,
    suggestFilename: suggestFilename,
    analyse: analyse,
    merge: merge,
    counts: counts,
    COUNT_LABELS: COUNT_LABELS,
    summariseReport: summariseReport

    var levels = { einfach: 1, standard: 2, anspruchsvoll: 3 };
    var value = levels[variant] || 2;
    var titles = { 1: 'einfache Variante', 2: 'Standardvariante', 3: 'anspruchsvolle Variante' };
    return h('span.level-pip', { dataset: { level: value }, title: titles[value] },
      h('i'), h('i'), h('i'));
  }

  function favButton(isFavourite, onToggle, label) {
    return h('button.fav', {
      type: 'button',
      'aria-pressed': isFavourite ? 'true' : 'false',
      'aria-label': label || 'Als Favorit merken',
      title: isFavourite ? 'Favorit entfernen' : 'Als Favorit merken',
      text: isFavourite ? '★' : '☆',
      onclick: function (event) { event.stopPropagation(); onToggle(); }
    });
  }

  /* --- Textdarstellung ------------------------------------------------------ */

  /**
   * Der Artikel wird nur angezeigt, wenn er nicht ohnehin schon im Zielwort
   * steht. So bleibt „le stage“ auch dann korrekt, wenn eine importierte
   * Liste den Artikel mit ins Wort geschrieben hat.
   */
  function displayArticle(lex) {
    if (!lex || !lex.article) return '';
    var article = util.fold(lex.article).replace(/\([^)]*\)/g, '').trim();
    var term = util.fold(lex.term);
    if (!article || !term) return lex.article;
    var parts = article.split(/\s*\/\s*/);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      if (term.indexOf(part + ' ') === 0) return '';
      if (part.charAt(part.length - 1) === "'" && term.indexOf(part) === 0) return '';
    }
    return lex.article;
  }

  /** Vollständige Wortform inklusive Artikel und Formhinweis. */
  function termLabel(lex) {
    if (!lex) return '';
    var article = displayArticle(lex);
    if (article && article.charAt(article.length - 1) === '\u2019') return article + lex.term;
    return [article, lex.term].filter(Boolean).join(' ');
  }

  /* --- Genus des Artikels ----------------------------------------------------
     Artikel werden farbig ausgezeichnet: maskulin blau, feminin rot, neutrum
     grün – die aus dem Unterricht vertraute Konvention der/die/das. Die Farbe
     ist die einzige Bedeutung, die sie trägt.

     Erkannt wird das Genus zuerst am Artikel selbst, sonst am Formhinweis
     ("m.", "f.", "n."). Steht dort nichts, bleibt der Artikel neutral grau –
     lieber keine Farbe als eine falsche. */

  var ARTICLE_GENDER = {
    // romanische Sprachen
    le: 'm', la: 'f', un: 'm', une: 'f',
    el: 'm', lo: 'm', il: 'm', uno: 'm', una: 'f',
    // Deutsch
    der: 'm', die: 'f', das: 'n', eine: 'f'
    // Bewusst nicht aufgeführt: les, des, los, las, l', the, ein …
    // Sie sind mehrdeutig und richten sich nach dem Formhinweis.
  };

  /** Genus aus einem Formhinweis wie "m.", "f. pl." oder "neutrum". */
  function genderFromGram(gram) {
    if (!gram) return '';
    var text = ' ' + util.fold(gram).replace(/[.,;:()\[\]/]/g, ' ') + ' ';
    if (/ (f|fem|feminin|feminine|weiblich) /.test(text)) return 'f';
    if (/ (n|neutr|neutrum|neutral|sachlich) /.test(text)) return 'n';
    if (/ (m|masc|mask|maskulin|masculine|mannlich) /.test(text)) return 'm';
    return '';
  }

  function genderOfToken(token) {
    var key = util.fold(token).replace(/[\u2019']/g, '').replace(/[^a-z]/g, '');
    return ARTICLE_GENDER[key] || '';
  }

  /** Genus eines Eintrags, soweit eindeutig bestimmbar. */
  function genderOf(lex) {
    if (!lex) return '';
    var article = displayArticle(lex);
    var found = {};
    String(article).split(/[\s/]+/).forEach(function (token) {
      var gender = genderOfToken(token);
      if (gender) found[gender] = true;
    });
    var list = Object.keys(found);
    if (list.length === 1) return list[0];
    if (list.length > 1) return 'mf';
    return genderFromGram(lex.gram);
  }

  /**
   * Artikel als Knoten – jedes Teilstück bekommt seine eigene Genusfarbe.
   * So wird aus "le / la" ein blaues „le“ und ein rotes „la“.
   */
  function articleNode(lex, doc) {
    doc = doc || document;
    var article = displayArticle(lex);
    if (!article) return null;
    var fallback = genderFromGram(lex.gram);

    var wrap = doc.createElement('span');
    wrap.className = 'art';
    String(article).split(/(\s+|\/)/).forEach(function (token) {
      if (!token) return;
      if (/^(\s+|\/)$/.test(token)) {
        wrap.appendChild(doc.createTextNode(token));
        return;
      }
      var gender = genderOfToken(token) || fallback;
      var part = doc.createElement('span');
      part.className = 'art__part';
      if (gender) part.dataset.gender = gender;
      part.textContent = token;
      wrap.appendChild(part);
    });
    return wrap;
  }

  /**
   * Vollständige Wortform als Knoten: farbiger Artikel, Zielwort, Formhinweis.
   * Wird in der Projektion und in den Listen der Lehreransicht verwendet,
   * damit die Genusfarbe überall dieselbe Bedeutung hat.
   */
  function termNode(lex, options) {
    options = options || {};
    var doc = options.doc || document;
    var fragment = doc.createDocumentFragment();
    if (!lex) return fragment;

    var article = articleNode(lex, doc);
    if (article) {
      fragment.appendChild(article);
      // Elidierte Artikel („l’“) stehen ohne Leerzeichen am Wort.
      var text = article.textContent;
      if (text.charAt(text.length - 1) !== '\u2019') fragment.appendChild(doc.createTextNode(' '));
    }
    fragment.appendChild(doc.createTextNode(lex.term || ''));

    if (options.gram && lex.gram) {
      var gram = doc.createElement('span');
      gram.className = options.gramClass || 'gram';
      gram.textContent = lex.gram;
      fragment.appendChild(gram);
    }
    return fragment;
  }

  /* Als Leerstelle gilt, was Lehrkräfte üblicherweise schreiben: mehrere
     Unterstriche, drei Punkte oder ein Auslassungszeichen. */
  var GAP_SPLIT = /(_{2,}|\.{3,}|\u2026)/;
  var GAP_MATCH = /^(_{2,}|\.{3,}|\u2026)$/;
  var GAP_GLOBAL = /(_{2,}|\.{3,}|\u2026)/g;

  /**
   * Wandelt Leerstellen in ruhige Linien um.
   * Wird sowohl in der Lehreransicht als auch auf dem Beamer verwendet.
   */
  function gapText(text, doc) {
    doc = doc || document;
    var fragment = doc.createDocumentFragment();
    String(text || '').split(GAP_SPLIT).forEach(function (part) {
      if (!part) return;
      if (GAP_MATCH.test(part)) {
        var span = doc.createElement('span');
        span.className = 'gap';
        span.setAttribute('aria-label', 'Leerstelle');
        span.textContent = ' ';
        fragment.appendChild(span);
      } else {
        fragment.appendChild(doc.createTextNode(part));
      }
    });
    return fragment;
  }

  /** Für kompakte Listen: Leerstellen als einzelnes Auslassungszeichen. */
  function plainStarterText(text) {
    return String(text || '').replace(GAP_GLOBAL, '\u2026');
  }

  /* --- Bausteine ----------------------------------------------------------- */

  function emptyState(config) {
    var node = h('div.empty', {},
      config.icon ? h('div', { style: { 'font-size': '2rem' }, text: config.icon }) : null,
      h('div.empty__title', { text: config.title }),
      config.text ? h('p.empty__text', { text: config.text }) : null
    );
    if (config.actionLabel) {
      node.appendChild(h('button.btn.btn--primary', {
        type: 'button', text: config.actionLabel, onclick: config.onAction
      }));
    }
    if (config.secondaryLabel) {
      node.appendChild(h('button.btn.btn--ghost.btn--sm', {
        type: 'button', text: config.secondaryLabel, onclick: config.onSecondary
      }));
    }
    return node;
  }

  function selectField(config) {
    var select = h('select', { 'aria-label': config.ariaLabel || config.label || '' });
    (config.options || []).forEach(function (option) {
      select.appendChild(h('option', {
        value: option.value,
        text: option.label,
        selected: String(option.value) === String(config.value) ? true : null
      }));
    });
    if (config.onChange) select.addEventListener('change', function () { config.onChange(select.value, select); });
    if (!config.label) return select;
    return h('div.field', {}, h('label', { text: config.label }), select);
  }

  function textField(config) {
    var input = h(config.multiline ? 'textarea' : 'input', {
      type: config.multiline ? null : (config.type || 'text'),
      value: config.multiline ? null : (config.value || ''),
      placeholder: config.placeholder || '',
      rows: config.rows || null
    });
    if (config.multiline) input.value = config.value || '';
    if (config.onInput) input.addEventListener('input', function () { config.onInput(input.value, input); });
    if (config.name) input.name = config.name;

    // Optionaler Knopf in der Beschriftungszeile, z. B. „Leerstelle einfügen“.
    var labelNode = null;
    if (config.label) {
      labelNode = h('label', {}, h('span', { text: config.label }));
      if (config.action) {
        labelNode.appendChild(h('button.btn.btn--sm', {
          type: 'button',
          text: config.action.label,
          title: config.action.title || config.action.label,
          // Fokus im Feld lassen, damit die Cursorposition erhalten bleibt.
          onmousedown: function (event) { event.preventDefault(); },
          onclick: function () { config.action.onClick(input); }
        }));
      }
    }

    var field = h('div.field' + (config.full ? '.full' : '') + (config.action ? '.field--action' : ''), {},
      labelNode,
      input,
      config.hint ? h('span.hint', { text: config.hint }) : null
    );
    field.input = input;
    return field;
  }

  /** Freies Schlagwortfeld mit Chips. */
  function tagEditor(values, config) {
    config = config || {};
    var current = (values || []).slice();
    var wrap = h('div.tag-input');
    var input = h('input', { type: 'text', placeholder: config.placeholder || 'Hinzufügen …' });

    function emit() { if (config.onChange) config.onChange(current.slice()); }

    function draw() {
      util.clear(wrap);
      current.forEach(function (tag, index) {
        wrap.appendChild(h('span.chip.chip--tag', {}, tag,
          h('button', {
            type: 'button', 'aria-label': 'Entfernen: ' + tag, text: '×',
            onclick: function () { current.splice(index, 1); draw(); emit(); }
          })
        ));
      });
      wrap.appendChild(input);
    }

    function add(raw) {
      String(raw).split(/[,;]/).forEach(function (piece) {
        var tag = piece.trim();
        if (tag && current.indexOf(tag) < 0) current.push(tag);
      });
      input.value = '';
      draw();
      emit();
    }

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ',') { event.preventDefault(); if (input.value.trim()) add(input.value); }
      else if (event.key === 'Backspace' && !input.value && current.length) { current.pop(); draw(); emit(); }
    });
    input.addEventListener('blur', function () { if (input.value.trim()) add(input.value); });
    wrap.addEventListener('click', function (event) { if (event.target === wrap) input.focus(); });

    draw();
    var field = config.label
      ? h('div.field' + (config.full ? '.full' : ''), {}, h('label', { text: config.label }), wrap)
      : wrap;
    field.getValue = function () { return current.slice(); };
    return field;
  }

  function statusOptions() {
    return schema.STATUS.map(function (s) { return { value: s.id, label: s.label }; });
  }

  function sceneOptions(state) {
    return (state.settings.scenes || schema.SCENES).map(function (s) { return { value: s, label: s }; });
  }

  function unitOptions(state, groupId, includeEmpty) {
    var list = BAO.select.unitsOfGroup(state, groupId).map(function (u) {
      return { value: u.id, label: u.title + ' (' + u.schoolYear + ')' };
    });
    if (includeEmpty !== false) list.unshift({ value: '', label: '– keiner Reihe zugeordnet –' });
    return list;
  }

  /**
   * Eingabefeld für die Verwendung (kommunikative Funktion) eines
   * Satzanfangs. Vorhandene Bezeichnungen lassen sich auswählen, neue
   * einfach eintippen – sie werden beim Speichern angelegt.
   */
  function functionField(config) {
    var functions = BAO.select.functions(config.state);
    var current = functions.filter(function (f) { return f.id === config.value; })[0];
    var listId = util.uid('fnlist');

    var input = h('input', {
      type: 'text',
      value: current ? current.label : '',
      list: listId,
      autocomplete: 'off',
      placeholder: config.placeholder || 'z. B. eine Meinung äußern'
    });
    var datalist = h('datalist', { id: listId });
    functions.forEach(function (fn) { datalist.appendChild(h('option', { value: fn.label })); });

    var field = h('div.field' + (config.full ? '.full' : ''), {},
      h('label', { text: config.label || 'Verwendung' }),
      input,
      datalist,
      h('span.hint', {
        text: config.hint || 'Frei benennbar: vorhandene Bezeichnung wählen oder eine neue eintippen.'
      })
    );
    field.input = input;

    /**
     * Sucht die Bezeichnung im Bestand und legt sie sonst an.
     * Muss innerhalb eines commit-Mutators mit dem Entwurf aufgerufen werden.
     */
    field.resolve = function (draft) {
      var label = input.value.trim();
      if (!label) return '';
      var needle = util.fold(label);
      var match = (draft.functions || []).filter(function (fn) {
        return util.fold(fn.label) === needle;
      })[0];
      if (match) return match.id;
      var created = { id: util.uid('fn'), label: label, order: draft.functions.length };
      draft.functions.push(created);
      return created.id;
    };

    return field;
  }

  function functionOptions(state, includeEmpty) {
    var list = BAO.select.functions(state).map(function (f) { return { value: f.id, label: f.label }; });
    if (includeEmpty) list.unshift({ value: '', label: '– ohne Funktion –' });
    return list;
  }

  BAO.ui = {
    icon: icon,
    statusChip: statusChip,
    subjectChip: subjectChip,
    subjectVars: subjectVars,
    variantPips: variantPips,
    favButton: favButton,
    termLabel: termLabel,
    termNode: termNode,
    displayArticle: displayArticle,
    articleNode: articleNode,
    genderOf: genderOf,
    genderFromGram: genderFromGram,
    gapText: gapText,
    plainStarterText: plainStarterText,
    GAP_MATCH: GAP_MATCH,
    emptyState: emptyState,
    selectField: selectField,
    textField: textField,
    tagEditor: tagEditor,
    statusOptions: statusOptions,
    sceneOptions: sceneOptions,
    unitOptions: unitOptions,
    functionField: functionField,
    functionOptions: functionOptions
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>

   Virtuelle IPA-Tastatur
   Lautschrift lässt sich auf einer gewöhnlichen Tastatur nicht eingeben.
   Deshalb öffnet sich beim Anklicken des Aussprachefelds eine Tastatur mit
   den im Französisch-, Englisch- und Spanischunterricht üblichen Zeichen.

   Grundsätze
   - Zeichen werden an der Cursorposition eingefügt, der Fokus bleibt im Feld.
   - Zu jedem Zeichen gehört ein Beispielwort; es erscheint in der Hinweiszeile,

     kein Ersatz.

(function (BAO) {

  var LAYOUTS = [

        },
        {
          label: 'Konsonanten',
          keys: [['p', 'padre'], ['b', 'boca'], ['β', 'haber'], ['t', 'todo'], ['d', 'dos'],

    },

        },

            { ins: '̃', show: '◌̃', hint: 'Nasalierung (auf das vorige Zeichen)' },
            { ins: '̯', show: '◌̯', hint: 'nicht silbisch' },
            { ins: '̩', show: '◌̩', hint: 'silbisch' },

  /* Diese Zeichen braucht man in jeder Sprache – sie stehen deshalb über
     allen Sprachansichten, nicht nur im Zeichen-Register. */
  var COMMON = {

    keys: [
      { ins: '[]', show: '[ ]', hint: 'phonetische Umschrift', caret: -1 },
      { ins: '//', show: '/ /', hint: 'phonologische Umschrift', caret: -1 },

  /** Passendes Tastaturbild zum Fach: „FR“ → Französisch usw. */
  function layoutForSubject(subject) {
    if (!subject) return LAYOUTS[0].id;
    var text = util.fold(subject.name + ' ' + (subject.short || ''));
    if (/franz|french|francais|\bfr\b/.test(text)) return 'fr';
    if (/engl|\ben\b/.test(text)) return 'en';
    if (/span|espan|\bes\b/.test(text)) return 'es';

  function normaliseKey(key) {
    if (Array.isArray(key)) return { ins: key[0], show: key[0], hint: key[1] || '' };
    if (typeof key === 'string') return { ins: key, show: key, hint: '' };
    return { ins: key.ins, show: key.show || key.ins, hint: key.hint || '', caret: key.caret || 0 };

  /** Kombinierende Zeichen (Tilde, Ring, Bogen …) gehören zum Laut davor. */
  function isCombining(code) {

  function backspace(input) {

    var end = input.selectionEnd === null ? start : input.selectionEnd;
    if (start === end) {

      // Ein Klick auf die Taste hat ein Zeichen eingefügt – ein Klick auf
      // „Löschen“ nimmt es vollständig zurück, samt Kombinationszeichen.
      while (start > 0 && isCombining(input.value.charCodeAt(start - 1))) start -= 1;
      start -= 1;
      var code = input.value.charCodeAt(start);
      if (start > 0 && code >= 0xDC00 && code <= 0xDFFF) start -= 1;   // Ersatzzeichenpaar
    }

      // Impuls: bewusst nur eine einzige Stützzeile, damit die Fläche ruhig bleibt.
      if (fields.chunk && lex.chunk) push('pitem__chunk', lex.chunk);
      else if (fields.collocation && lex.collocation) push('pitem__chunk', lex.collocation);
      else if (fields.translation && lex.translation) push('pitem__de', lex.translation);
      return lines;
    }

    if (fields.collocation) push('pitem__chunk', lex.collocation);
    if (fields.chunk) push('pitem__chunk', lex.chunk);
    if (fields.explanation) push('pitem__expl', lex.explanation);
    if (fields.translation) push('pitem__de', lex.translation);
    if (fields.example) push('pitem__ex', lex.example);
    return lines;
  }

  function lexemeMeta(lex, fields) {
    var parts = [];
    if (fields.pronunciation && lex.pronunciation) parts.push(lex.pronunciation);
    return parts.join(' · ');
  }

  function starterLines(starter, fields) {
    var lines = [];
    if (fields.starterTranslation && starter.translation) {
      lines.push({ cls: 'pitem__de', text: starter.translation });
    }
    return lines;

  /* --- Abschnittsaufbau ---------------------------------------------------- */

  function resolveLayout(section, items, fields) {
    if (section.layout && section.layout !== 'auto') return section.layout;
    var onlyStarters = items.length > 0 && items.every(function (i) { return i.kind === 'starter'; });
    if (onlyStarters) return 'starters';
    if (countSecondary(fields) === 0) return 'impulse';
    return 'cards';
  }

   * render.js korrigiert das anschließend – diese Zahl ist die Obergrenze und
   * sorgt zugleich für die vom Konzept gewünschte Portionierung.
   */

    var secondary = countSecondary(fields);
    if (layout === 'starters') {
      return util.clamp(fields.starterTranslation ? 6 : 8, 3, maxItems);
    }
    if (layout === 'impulse') {
      return util.clamp(9, 3, Math.max(6, maxItems));
    }
    var capacity = maxItems - secondary * 2;
    return util.clamp(capacity, 3, maxItems);

  function buildItems(state, section) {
    var items = [];
    (section.items || []).forEach(function (item) {
      var resolved = select.resolveItem(state, item);
      if (!resolved) return;
      items.push({
        key: item.id,
        kind: resolved.kind,
        ref: resolved.ref,
        item: item
      });
    });
    return items;
  }

  /**
   * Satzanfänge werden nach kommunikativen Funktionen gegliedert, sobald ein
   * Abschnitt mehr als eine Funktion enthält. Die Zwischenüberschrift ist eine
   * eigene Position und wird beim Umbruch nie allein am Seitenende gelassen.
   */
  function withFunctionGroups(state, items, layout) {
    if (layout !== 'starters') return items;
    var functionIds = util.unique(items.map(function (item) {
      return item.kind === 'starter' ? (item.ref.functionId || '') : '';
    }));
    if (functionIds.length < 2) return items;

    var out = [];
    var lastFunction = null;
    items.forEach(function (item) {
      var functionId = item.kind === 'starter' ? (item.ref.functionId || '') : '';
      if (functionId !== lastFunction) {
        out.push({
          key: 'grp_' + functionId + '_' + out.length,
          kind: 'group',
          label: select.functionLabel(state, functionId)
        });
        lastFunction = functionId;
      }
      out.push(item);
    });
    return out;
  }

  function countEntries(items) {
    return items.filter(function (item) { return item.kind !== 'group'; }).length;
  }

  /**
   * build(state, bank, options)
   * options: { level, fields, focusSectionId, liveItems, maxItemsPerSlide }
   */
  function build(state, bank, options) {
    options = options || {};
    var level = options.level || (bank ? bank.defaultLevel : 2) || 2;
    var fields = options.fields || fieldsForLevel(level, state.settings.fieldLevels);
    var maxItems = options.maxItemsPerSlide || state.settings.maxItemsPerSlide || 12;

    var subject = bank ? select.subject(state, bank.subjectId) : null;
    var group = bank ? select.group(state, bank.groupId) : null;

    var deck = {
      bankId: bank ? bank.id : '',
      title: bank ? bank.title : 'Live-Hilfe',
      scene: bank ? bank.scene : '',
      subjectName: subject ? subject.name : '',
      subjectColor: subject ? subject.color : '',
      groupName: group ? group.name : '',
      level: level,
      fields: fields,
      maxItemsPerSlide: maxItems,
      sections: [],
      slides: []
    };

    (bank ? bank.sections || [] : []).forEach(function (section) {
      var items = buildItems(state, section);
      if (!items.length) return;
      if (options.focusSectionId && section.id !== options.focusSectionId) return;
      var layout = resolveLayout(section, items, fields);
      deck.sections.push({
        id: section.id,
        title: section.title,
        layout: layout,
        capacity: estimateCapacity(layout, fields, maxItems),
        items: withFunctionGroups(state, items, layout)
      });
    });

    var live = (options.liveItems || []).filter(Boolean);
    if (live.length && (!options.focusSectionId || options.focusSectionId === LIVE_SECTION_ID)) {
      var liveItems = live.map(function (entry) {
        return { key: entry.id, kind: 'live', ref: entry, item: null };
      });
      deck.sections.push({
        id: LIVE_SECTION_ID,
        title: 'Live-Hilfe',
        layout: liveItems.every(function (i) { return i.ref.type === 'starter'; }) ? 'starters' : 'cards',
        capacity: estimateCapacity('cards', fields, maxItems),
        items: liveItems,
        live: true
      });
    }

    paginate(deck);
    return deck;
  }

  /**
   * Verteilt die Einträge jedes Abschnitts auf Seiten.
   * capacities: optionale Zuordnung { sectionId: anzahl } aus der Messung.
   */
  function paginate(deck, capacities) {
    var slides = [];
    deck.sections.forEach(function (section, sectionIndex) {
      var capacity = Math.max(1, (capacities && capacities[section.id]) || section.capacity);
      var pages = Math.max(1, Math.ceil(section.items.length / capacity));
      // Gleichmäßig verteilen: lieber 2 x 5 als 8 + 2.
      var perPage = Math.ceil(section.items.length / pages);
      for (var page = 0; page < pages; page++) {
        var items = section.items.slice(page * perPage, (page + 1) * perPage);
        if (!items.length) continue;
        slides.push({
          sectionId: section.id,
          sectionTitle: section.title,
          sectionIndex: sectionIndex,
          layout: section.layout,
          live: !!section.live,
          pageInSection: page + 1,
          pagesInSection: pages,
          items: items
        });
      }
    });
    // Seitenzahlen nachtragen, wenn ein Abschnitt tatsächlich mehrfach umbrochen wurde.
    var perSection = {};
    slides.forEach(function (slide) { perSection[slide.sectionId] = (perSection[slide.sectionId] || 0) + 1; });
    slides.forEach(function (slide) { slide.pagesInSection = perSection[slide.sectionId]; });

    deck.slides = slides;
    return deck;
  }

  function isEmpty(deck) { return !deck || !deck.slides.length; }

  function sectionSummary(deck) {
    return deck.sections.map(function (section) {
      var slides = deck.slides.filter(function (s) { return s.sectionId === section.id; });
      return {
        id: section.id,
        title: section.title,
        items: countEntries(section.items),
        slides: slides.length,
        firstSlide: deck.slides.indexOf(slides[0]),
        live: !!section.live
      };
    });
  }

  BAO.deck = {
    LIVE_SECTION_ID: LIVE_SECTION_ID,
    fieldsForLevel: fieldsForLevel,
    countSecondary: countSecondary,
    lexemeLines: lexemeLines,
    lexemeMeta: lexemeMeta,
    starterLines: starterLines,
    estimateCapacity: estimateCapacity,
    build: build,
    paginate: paginate,
    countEntries: countEntries,
    isEmpty: isEmpty,
    sectionSummary: sectionSummary
  };
})(window.BAO = window.BAO || {});
