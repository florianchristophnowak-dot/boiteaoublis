      title: isFavourite ? 'Favorit entfernen' : 'Als Favorit merken',
      text: isFavourite ? '★' : '☆',
      onclick: function (event) { event.stopPropagation(); onToggle(); }
    });
  }

  /* --- Textdarstellung ------------------------------------------------------ */

  /**
   * Der Artikel wird nur angezeigt, wenn er nicht ohnehin schon im Zielwort
   * steht. So bleibt „le stage“ auch dann korrekt, wenn eine importierte
   * Liste den Artikel mit ins Wort geschrieben hat.
   */
  function displayArticle(lex) {
    if (!lex || !lex.article) return '';
    var article = util.fold(lex.article).replace(/\([^)]*\)/g, '').trim();
    var term = util.fold(lex.term);
    if (!article || !term) return lex.article;
    var parts = article.split(/\s*\/\s*/);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      if (term.indexOf(part + ' ') === 0) return '';
      if (part.charAt(part.length - 1) === "'" && term.indexOf(part) === 0) return '';
    }
    return lex.article;
  }

  /** Vollständige Wortform inklusive Artikel und Formhinweis. */
  function termLabel(lex) {
    if (!lex) return '';
    var article = displayArticle(lex);
    if (article && article.charAt(article.length - 1) === '\u2019') return article + lex.term;
    return [article, lex.term].filter(Boolean).join(' ');
  }

  /* --- Genus des Artikels ----------------------------------------------------
     Artikel werden farbig ausgezeichnet: maskulin blau, feminin rot, neutrum
     grün – die aus dem Unterricht vertraute Konvention der/die/das. Die Farbe
     ist die einzige Bedeutung, die sie trägt.

     Erkannt wird das Genus zuerst am Artikel selbst, sonst am Formhinweis
     ("m.", "f.", "n."). Steht dort nichts, bleibt der Artikel neutral grau –
     lieber keine Farbe als eine falsche. */

  var ARTICLE_GENDER = {
    // romanische Sprachen
    le: 'm', la: 'f', un: 'm', une: 'f',
    el: 'm', lo: 'm', il: 'm', uno: 'm', una: 'f',
    // Deutsch
    der: 'm', die: 'f', das: 'n', eine: 'f'
    // Bewusst nicht aufgeführt: les, des, los, las, l', the, ein …
    // Sie sind mehrdeutig und richten sich nach dem Formhinweis.
  };

  /** Genus aus einem Formhinweis wie "m.", "f. pl." oder "neutrum". */
  function genderFromGram(gram) {
    if (!gram) return '';
    var text = ' ' + util.fold(gram).replace(/[.,;:()\[\]/]/g, ' ') + ' ';
    if (/ (f|fem|feminin|feminine|weiblich) /.test(text)) return 'f';
    if (/ (n|neutr|neutrum|neutral|sachlich) /.test(text)) return 'n';
    if (/ (m|masc|mask|maskulin|masculine|mannlich) /.test(text)) return 'm';
    return '';
  }

  function genderOfToken(token) {
    var key = util.fold(token).replace(/[\u2019']/g, '').replace(/[^a-z]/g, '');
    return ARTICLE_GENDER[key] || '';
  }

  /** Genus eines Eintrags, soweit eindeutig bestimmbar. */
  function genderOf(lex) {
    if (!lex) return '';
    var article = displayArticle(lex);
    var found = {};
    String(article).split(/[\s/]+/).forEach(function (token) {
      var gender = genderOfToken(token);
      if (gender) found[gender] = true;
    });
    var list = Object.keys(found);
    if (list.length === 1) return list[0];
    if (list.length > 1) return 'mf';
    return genderFromGram(lex.gram);
  }

  /**
   * Artikel als Knoten – jedes Teilstück bekommt seine eigene Genusfarbe.
   * So wird aus "le / la" ein blaues „le“ und ein rotes „la“.
   */
  function articleNode(lex, doc) {
    doc = doc || document;
    var article = displayArticle(lex);
    if (!article) return null;
    var fallback = genderFromGram(lex.gram);

    var wrap = doc.createElement('span');
    wrap.className = 'art';
    String(article).split(/(\s+|\/)/).forEach(function (token) {
      if (!token) return;
      if (/^(\s+|\/)$/.test(token)) {
        wrap.appendChild(doc.createTextNode(token));
        return;
      }
      var gender = genderOfToken(token) || fallback;
      var part = doc.createElement('span');
      part.className = 'art__part';
      if (gender) part.dataset.gender = gender;
      part.textContent = token;
      wrap.appendChild(part);
    });
    return wrap;
  }

  /**
   * Vollständige Wortform als Knoten: farbiger Artikel, Zielwort, Formhinweis.
   * Wird in der Projektion und in den Listen der Lehreransicht verwendet,
   * damit die Genusfarbe überall dieselbe Bedeutung hat.
   */
  function termNode(lex, options) {
    options = options || {};
    var doc = options.doc || document;
    var fragment = doc.createDocumentFragment();
    if (!lex) return fragment;

    var article = articleNode(lex, doc);
    if (article) {
      fragment.appendChild(article);
      // Elidierte Artikel („l’“) stehen ohne Leerzeichen am Wort.
      var text = article.textContent;
      if (text.charAt(text.length - 1) !== '\u2019') fragment.appendChild(doc.createTextNode(' '));
    }
    fragment.appendChild(doc.createTextNode(lex.term || ''));

    if (options.gram && lex.gram) {
      var gram = doc.createElement('span');
      gram.className = options.gramClass || 'gram';
      gram.textContent = lex.gram;
      fragment.appendChild(gram);
    }
    return fragment;
  }

  /* Als Leerstelle gilt, was Lehrkräfte üblicherweise schreiben: mehrere
     Unterstriche, drei Punkte oder ein Auslassungszeichen. */
  var GAP_SPLIT = /(_{2,}|\.{3,}|\u2026)/;
  var GAP_MATCH = /^(_{2,}|\.{3,}|\u2026)$/;
  var GAP_GLOBAL = /(_{2,}|\.{3,}|\u2026)/g;

  /**
   * Wandelt Leerstellen in ruhige Linien um.
   * Wird sowohl in der Lehreransicht als auch auf dem Beamer verwendet.
   */
  function gapText(text, doc) {
    doc = doc || document;
    var fragment = doc.createDocumentFragment();
    String(text || '').split(GAP_SPLIT).forEach(function (part) {
      if (!part) return;
      if (GAP_MATCH.test(part)) {
        var span = doc.createElement('span');
        span.className = 'gap';
        span.setAttribute('aria-label', 'Leerstelle');
        span.textContent = ' ';
        fragment.appendChild(span);
      } else {
        fragment.appendChild(doc.createTextNode(part));
      }
    });
    return fragment;
  }

  /** Für kompakte Listen: Leerstellen als einzelnes Auslassungszeichen. */
  function plainStarterText(text) {
    return String(text || '').replace(GAP_GLOBAL, '\u2026');
  }

  /* --- Bausteine ----------------------------------------------------------- */

  function emptyState(config) {
    var node = h('div.empty', {},
      config.icon ? h('div', { style: { 'font-size': '2rem' }, text: config.icon }) : null,
      h('div.empty__title', { text: config.title }),
      config.text ? h('p.empty__text', { text: config.text }) : null
    );
    if (config.actionLabel) {
      node.appendChild(h('button.btn.btn--primary', {
        type: 'button', text: config.actionLabel, onclick: config.onAction
      }));
    }
    if (config.secondaryLabel) {
      node.appendChild(h('button.btn.btn--ghost.btn--sm', {
        type: 'button', text: config.secondaryLabel, onclick: config.onSecondary
      }));
    }
    return node;
  }

  function selectField(config) {
    var select = h('select', { 'aria-label': config.ariaLabel || config.label || '' });
    (config.options || []).forEach(function (option) {
      select.appendChild(h('option', {
        value: option.value,
        text: option.label,
        selected: String(option.value) === String(config.value) ? true : null
      }));
    });
    if (config.onChange) select.addEventListener('change', function () { config.onChange(select.value, select); });
    if (!config.label) return select;
    return h('div.field', {}, h('label', { text: config.label }), select);
  }

  function textField(config) {
    var input = h(config.multiline ? 'textarea' : 'input', {
      type: config.multiline ? null : (config.type || 'text'),
      value: config.multiline ? null : (config.value || ''),
      placeholder: config.placeholder || '',
      rows: config.rows || null
    });
    if (config.multiline) input.value = config.value || '';
    if (config.onInput) input.addEventListener('input', function () { config.onInput(input.value, input); });
    if (config.name) input.name = config.name;

    // Optionaler Knopf in der Beschriftungszeile, z. B. „Leerstelle einfügen“.
    var labelNode = null;
    if (config.label) {
      labelNode = h('label', {}, h('span', { text: config.label }));
      if (config.action) {
        labelNode.appendChild(h('button.btn.btn--sm', {
          type: 'button',
          text: config.action.label,
          title: config.action.title || config.action.label,
          // Fokus im Feld lassen, damit die Cursorposition erhalten bleibt.
          onmousedown: function (event) { event.preventDefault(); },
          onclick: function () { config.action.onClick(input); }
        }));
      }
    }

    var field = h('div.field' + (config.full ? '.full' : '') + (config.action ? '.field--action' : ''), {},
      labelNode,
      input,
      config.hint ? h('span.hint', { text: config.hint }) : null
    );
    field.input = input;
    return field;
  }

  /** Freies Schlagwortfeld mit Chips. */
  function tagEditor(values, config) {
    config = config || {};
    var current = (values || []).slice();
    var wrap = h('div.tag-input');
    var input = h('input', { type: 'text', placeholder: config.placeholder || 'Hinzufügen …' });

    function emit() { if (config.onChange) config.onChange(current.slice()); }

    function draw() {
      util.clear(wrap);
      current.forEach(function (tag, index) {
        wrap.appendChild(h('span.chip.chip--tag', {}, tag,
          h('button', {
            type: 'button', 'aria-label': 'Entfernen: ' + tag, text: '×',
            onclick: function () { current.splice(index, 1); draw(); emit(); }
          })
        ));
      });
      wrap.appendChild(input);
    }

    function add(raw) {
      String(raw).split(/[,;]/).forEach(function (piece) {
        var tag = piece.trim();
        if (tag && current.indexOf(tag) < 0) current.push(tag);
      });
      input.value = '';
      draw();
      emit();
    }

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ',') { event.preventDefault(); if (input.value.trim()) add(input.value); }
      else if (event.key === 'Backspace' && !input.value && current.length) { current.pop(); draw(); emit(); }
    });
    input.addEventListener('blur', function () { if (input.value.trim()) add(input.value); });
    wrap.addEventListener('click', function (event) { if (event.target === wrap) input.focus(); });

    draw();
    var field = config.label
      ? h('div.field' + (config.full ? '.full' : ''), {}, h('label', { text: config.label }), wrap)
      : wrap;
    field.getValue = function () { return current.slice(); };
    return field;
  }

  function statusOptions() {
    return schema.STATUS.map(function (s) { return { value: s.id, label: s.label }; });
  }

  function sceneOptions(state) {
    return (state.settings.scenes || schema.SCENES).map(function (s) { return { value: s, label: s }; });
  }

  function unitOptions(state, groupId, includeEmpty) {
    var list = BAO.select.unitsOfGroup(state, groupId).map(function (u) {
      return { value: u.id, label: u.title + ' (' + u.schoolYear + ')' };
    });
    if (includeEmpty !== false) list.unshift({ value: '', label: '– keiner Reihe zugeordnet –' });
    return list;
  }

  /**
   * Eingabefeld für die Verwendung (kommunikative Funktion) eines
   * Satzanfangs. Vorhandene Bezeichnungen lassen sich auswählen, neue
   * einfach eintippen – sie werden beim Speichern angelegt.
   */
  function functionField(config) {
    var functions = BAO.select.functions(config.state);
    var current = functions.filter(function (f) { return f.id === config.value; })[0];
    var listId = util.uid('fnlist');

    var input = h('input', {
      type: 'text',
      value: current ? current.label : '',
      list: listId,
      autocomplete: 'off',
      placeholder: config.placeholder || 'z. B. eine Meinung äußern'
    });
    var datalist = h('datalist', { id: listId });
    functions.forEach(function (fn) { datalist.appendChild(h('option', { value: fn.label })); });

    var field = h('div.field' + (config.full ? '.full' : ''), {},
      h('label', { text: config.label || 'Verwendung' }),
      input,
      datalist,
      h('span.hint', {
        text: config.hint || 'Frei benennbar: vorhandene Bezeichnung wählen oder eine neue eintippen.'
      })
    );
    field.input = input;

    /**
     * Sucht die Bezeichnung im Bestand und legt sie sonst an.
     * Muss innerhalb eines commit-Mutators mit dem Entwurf aufgerufen werden.
     */
    field.resolve = function (draft) {
      var label = input.value.trim();
      if (!label) return '';
      var needle = util.fold(label);
      var match = (draft.functions || []).filter(function (fn) {
        return util.fold(fn.label) === needle;
      })[0];
      if (match) return match.id;
      var created = { id: util.uid('fn'), label: label, order: draft.functions.length };
      draft.functions.push(created);
      return created.id;
    };

    return field;
  }

  function functionOptions(state, includeEmpty) {
    var list = BAO.select.functions(state).map(function (f) { return { value: f.id, label: f.label }; });
    if (includeEmpty) list.unshift({ value: '', label: '– ohne Funktion –' });
    return list;
  }

  BAO.ui = {
    icon: icon,
    statusChip: statusChip,
    subjectChip: subjectChip,
    subjectVars: subjectVars,
    variantPips: variantPips,
    favButton: favButton,
    termLabel: termLabel,
    termNode: termNode,
    displayArticle: displayArticle,
    articleNode: articleNode,
    genderOf: genderOf,
    genderFromGram: genderFromGram,
    gapText: gapText,
    plainStarterText: plainStarterText,
    GAP_MATCH: GAP_MATCH,
    emptyState: emptyState,
    selectField: selectField,
    textField: textField,
    tagEditor: tagEditor,
    statusOptions: statusOptions,
    sceneOptions: sceneOptions,
    unitOptions: unitOptions,
    functionField: functionField,
    functionOptions: functionOptions
  };
})(window.BAO = window.BAO || {});

  function layoutById(id) {
    for (var i = 0; i < LAYOUTS.length; i++) if (LAYOUTS[i].id === id) return LAYOUTS[i];
    return null;
  }

  /** Passendes Tastaturbild zum Fach: „FR“ → Französisch usw. */
  function layoutForSubject(subject) {
    if (!subject) return LAYOUTS[0].id;
    var text = util.fold(subject.name + ' ' + (subject.short || ''));
    if (/franz|french|francais|\bfr\b/.test(text)) return 'fr';
    if (/engl|\ben\b/.test(text)) return 'en';
    if (/span|espan|\bes\b/.test(text)) return 'es';
    return 'zeichen';
  }

  function normaliseKey(key) {
    if (Array.isArray(key)) return { ins: key[0], show: key[0], hint: key[1] || '' };
    if (typeof key === 'string') return { ins: key, show: key, hint: '' };
    return { ins: key.ins, show: key.show || key.ins, hint: key.hint || '', caret: key.caret || 0 };
  }

  /* --- Einfügen ------------------------------------------------------------ */

  var insert = util.insertAtCursor;

  /** Kombinierende Zeichen (Tilde, Ring, Bogen …) gehören zum Laut davor. */
  function isCombining(code) {
    return (code >= 0x0300 && code <= 0x036F)
      || (code >= 0x1AB0 && code <= 0x1AFF)
      || (code >= 0x1DC0 && code <= 0x1DFF)
      || (code >= 0x20D0 && code <= 0x20FF);
  }

  function backspace(input) {
    var start = input.selectionStart === null ? input.value.length : input.selectionStart;
    var end = input.selectionEnd === null ? start : input.selectionEnd;
    if (start === end) {
      if (start === 0) { input.focus(); return; }
      // Ein Klick auf die Taste hat ein Zeichen eingefügt – ein Klick auf
      // „Löschen“ nimmt es vollständig zurück, samt Kombinationszeichen.
      while (start > 0 && isCombining(input.value.charCodeAt(start - 1))) start -= 1;
      start -= 1;
      var code = input.value.charCodeAt(start);
      if (start > 0 && code >= 0xDC00 && code <= 0xDFFF) start -= 1;   // Ersatzzeichenpaar
    }
    input.value = input.value.slice(0, start) + input.value.slice(end);
    input.focus();
    try { input.setSelectionRange(start, start); } catch (err) { /* egal */ }
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* --- Feld mit Tastatur --------------------------------------------------- */

  /**
   * field({ label, value, placeholder, hint, subject, full })
   * Rückgabe: Feldelement mit .input (wie ui.textField).
   */
  function field(config) {
    config = config || {};
    var input = h('input', {
      type: 'text',
      value: config.value || '',
      placeholder: config.placeholder || '[staʒ]',
      autocomplete: 'off',
      spellcheck: 'false',
      'aria-describedby': 'ipa-hint'
    });

    var currentId = lastLayoutId || layoutForSubject(config.subject);
    if (!layoutById(currentId)) currentId = LAYOUTS[0].id;

    var tabs = h('div.ipa-board__tabs', { role: 'tablist' });
    var groups = h('div.ipa-board__groups');
    var hintLine = h('div.ipa-board__hint', {
      id: 'ipa-hint',
      text: 'Zeichen werden an der Cursorposition eingefügt.'
    });

    var board = h('div.ipa-board', { hidden: true },
      tabs,
      groups,
      // Eigene Zeile mit fester Höhe: Sonst ändert der Hinweis beim Überfahren
      // der Tasten die Höhe der Tastatur und alles springt.
      hintLine,
      h('div.ipa-board__foot', {},
        h('button.btn.btn--sm', {
          type: 'button', title: 'Leerzeichen einfügen',
          onmousedown: function (event) { event.preventDefault(); },
          onclick: function () { insert(input, ' '); }
        }, 'Leerzeichen'),
        h('button.btn.btn--sm', {
          type: 'button', title: 'Letztes Zeichen löschen',
          onmousedown: function (event) { event.preventDefault(); },
          onclick: function () { backspace(input); }
        }, '⌫ Löschen'),
        h('span.spacer'),
        h('button.btn.btn--sm.btn--ghost', {
          type: 'button', text: 'Fertig',
          onclick: function () { close(); input.focus(); }
        })
      )
    );

    function setHint(text) {
      hintLine.textContent = text || 'Zeichen werden an der Cursorposition eingefügt.';
    }

    function keyButton(raw) {
      var key = normaliseKey(raw);
      var describe = key.hint ? key.show + ' – ' + key.hint : key.show;
      return h('button.ipa-key', {
        type: 'button',
        title: describe,
        'aria-label': describe,
        // Der Fokus muss im Eingabefeld bleiben, sonst geht die Cursorposition verloren.
        onmousedown: function (event) { event.preventDefault(); },
        onclick: function () { insert(input, key.ins, key.caret); },
        onmouseenter: function () { setHint(describe); },
        onmouseleave: function () { setHint(''); },
        onfocus: function () { setHint(describe); },
        onblur: function () { setHint(''); }
      }, key.show);
    }

    function drawGroups() {
      var layout = layoutById(currentId) || LAYOUTS[0];
      util.clear(groups);
      var visible = layout.id === 'zeichen' ? layout.groups : [COMMON].concat(layout.groups);
      visible.forEach(function (group) {
        var keys = h('div.ipa-keys');
        group.keys.forEach(function (key) { keys.appendChild(keyButton(key)); });
        groups.appendChild(h('div.ipa-group', {},
          h('div.ipa-group__label', { text: group.label }),
          keys
        ));
      });
      util.$$('button', tabs).forEach(function (button) {
        button.setAttribute('aria-selected', button.dataset.layout === currentId ? 'true' : 'false');
      });
    }

    LAYOUTS.forEach(function (layout) {
      tabs.appendChild(h('button.btn.btn--sm', {
        type: 'button',
        role: 'tab',
        dataset: { layout: layout.id },
        text: layout.label,
        onmousedown: function (event) { event.preventDefault(); },
        onclick: function () {
          currentId = layout.id;
          lastLayoutId = layout.id;
          drawGroups();
        }
      }));
    });
    drawGroups();

    var releaseEscape = null;

    function open() {
      if (!board.hidden) return;
      board.hidden = false;
      toggle.setAttribute('aria-expanded', 'true');
      // Im Dialog steht das Feld weit unten – die Tastatur muss sichtbar werden.
      window.requestAnimationFrame(function () {
        try { board.scrollIntoView({ block: 'end' }); }
        catch (err) { board.scrollIntoView(false); }
      });
      if (BAO.modal && BAO.modal.onEscape) {
        releaseEscape = BAO.modal.onEscape(function () {
          if (board.hidden) return false;
          close();
          input.focus();
          return true;
        });
      }
    }

    function close() {
      if (board.hidden) return;
      board.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      if (releaseEscape) { releaseEscape(); releaseEscape = null; }
    }

    var toggle = h('button.btn.btn--sm.ipa-toggle', {
      type: 'button',
      'aria-expanded': 'false',
      title: 'Virtuelle Tastatur für Lautschrift ein- und ausblenden',
      onclick: function () { if (board.hidden) { open(); input.focus(); } else { close(); } }
    }, 'IPA-Tastatur');

    input.addEventListener('focus', open);
    input.addEventListener('click', open);

    var wrapper = h('div.field.ipa-field' + (config.full ? '.full' : ''), {},
      h('label', {},
        h('span', { text: config.label || 'Aussprache / Betonung' }),
        toggle
      ),
      input,
      config.hint ? h('span.hint', { text: config.hint }) : null,
      board
    );

    // Die Tastatur schließt, wenn der Fokus tatsächlich in einem anderen
    // Bedienelement landet. Ein vorübergehender Fokusverlust (etwa beim
    // Scrollen) darf sie nicht zuklappen – sonst bricht die Eingabe mitten
    // im Wort ab.
    wrapper.addEventListener('focusout', function () {
      window.setTimeout(function () {
        var active = document.activeElement;
        if (!active || active === document.body) return;
        if (!wrapper.contains(active)) close();
      }, 0);
    });

    // Ein Klick irgendwo außerhalb schließt sie ebenfalls.
    function onOutsidePointer(event) {
      if (board.hidden) return;
      if (wrapper.contains(event.target)) return;
      close();
    }
    document.addEventListener('mousedown', onOutsidePointer, true);

    wrapper.input = input;
    wrapper.openBoard = open;
    wrapper.closeBoard = close;
    return wrapper;
  }

  BAO.ipa = {
    LAYOUTS: LAYOUTS,
    field: field,
    insert: insert,
    backspace: backspace,
    layoutForSubject: layoutForSubject
  };
})(window.BAO = window.BAO || {});

  <script>
/* js/ui/print.js */
/* ==========================================================================
   Drucken und Weitergeben
   Aus dem Bestand wird ein Blatt für die Lernenden: eine Wortliste zum
   Mitnehmen oder ein Vokabeltest mit einer leeren Spalte. Gedruckt wird über
   den Druckdialog des Browsers – dort lässt sich das Blatt auch als PDF
   speichern. Dieselben Zeilen gehen als Text in die Zwischenablage, etwa für
   ein Arbeitsblatt oder die Lernplattform.

   Eine Liste besteht aus Abschnitten mit Zeilen (siehe BAO.stock):
     { title, rows: [{ kind, term, translation, extra, sortKey }] }
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;

  var MODES = [
    { id: 'list', label: 'Wortliste – beide Spalten ausgefüllt' },
    { id: 'recall', label: 'Vokabeltest – Deutsch steht da, die Fremdsprache wird ergänzt' },
    { id: 'recognise', label: 'Vokabeltest – die Fremdsprache steht da, Deutsch wird ergänzt' }
  ];
  var ORDERS = [
    { id: 'given', label: 'wie angezeigt' },
    { id: 'alpha', label: 'alphabetisch' },
    { id: 'shuffle', label: 'gemischt' }
  ];

  // Die zuletzt gewählte Einstellung gilt für das nächste Blatt weiter.
  var last = { mode: 'list', order: 'given', extra: false };

  function isTest(mode) { return mode === 'recall' || mode === 'recognise'; }

  function countRows(sections) {
    return (sections || []).reduce(function (sum, section) { return sum + section.rows.length; }, 0);
  }

  /* Zufallszahlen aus einem Startwert: Dieselbe Mischung lässt sich so ein
     zweites Mal erzeugen – das gedruckte Blatt gleicht der Vorschau. */
  function randomFrom(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function newSeed() { return Math.floor(Math.random() * 4294967296); }

  function shuffled(list, random) {
    var copy = list.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(random() * (i + 1));
      var swap = copy[i]; copy[i] = copy[j]; copy[j] = swap;
    }
    return copy;
  }

  /**
   * Wendet Art und Reihenfolge auf die Zeilen an.
   * Für einen Test taugt nur, was eine deutsche Entsprechung hat – der Rest
   * wird ausgelassen und gezählt. options.seed legt die Mischung fest.
   * @returns {{sections: Array, total: number, skipped: number}}
   */
  function prepare(sections, options) {
    options = options || {};
    var skipped = 0;
    var random = options.seed === undefined ? Math.random : randomFrom(options.seed);
    var result = (sections || []).map(function (section) {
      var rows = section.rows.slice();
      if (isTest(options.mode)) {
        rows = rows.filter(function (row) {
          if (row.translation) return true;
          skipped += 1;
          return false;
        });
      }
      if (options.order === 'alpha') {
        rows.sort(function (a, b) {
          return String(a.sortKey || util.fold(a.term)).localeCompare(String(b.sortKey || util.fold(b.term)), 'de');
        });
      } else if (options.order === 'shuffle') {
        rows = shuffled(rows, random);
      }
      return { title: section.title || '', rows: rows };
    }).filter(function (section) { return section.rows.length; });
    return { sections: result, total: countRows(result), skipped: skipped };
  }

  /* --- Das Blatt ---------------------------------------------------------------- */

  function cell(className, content) {
    var td = h('td' + (className ? '.' + className : ''));
    if (content && content.nodeType) td.appendChild(content);
    else if (content) td.textContent = content;
    return td;
  }

  /** Text mit Leerstellen als Linien – wie auf der Tafel. */
  function withGaps(text) { return ui.gapText(text, document); }

  /**
   * Baut das Blatt. options: { mode, order, extra, title, seed }
   * Wird sowohl für die Vorschau im Dialog als auch für den Druck verwendet.
   */
  function buildSheet(config, options) {
    options = Object.assign({ mode: 'list', order: 'given', extra: false }, options || {});
    var prepared = prepare(config.sections, options);
    var test = isTest(options.mode);
    var showExtra = !test && options.extra && prepared.sections.some(function (section) {
      return section.rows.some(function (row) { return row.extra; });
    });

    var sheet = h('div.sheet', { dataset: { mode: options.mode } });
    var head = h('div.sheet__head', {},
      h('h1', { text: options.title || config.title || 'Wortliste' }),
      config.subtitle ? h('p.sheet__sub', { text: config.subtitle }) : null
    );
    if (test) {
      head.appendChild(h('div.sheet__name', {},
        h('span', { text: 'Name:' }),
        h('span', { text: 'Datum:' }),
        h('span.sheet__points', { text: 'Punkte:        / ' + prepared.total })
      ));
    }
    sheet.appendChild(head);

    var number = 0;
    prepared.sections.forEach(function (section) {
      var body = h('tbody');
      section.rows.forEach(function (row) {
        number += 1;
        var tr = h('tr', {}, cell('sheet__no', String(number)));
        if (options.mode === 'recall') {
          tr.appendChild(cell('sheet__term', row.translation));
          tr.appendChild(cell('sheet__blank', ''));
        } else if (options.mode === 'recognise') {
          tr.appendChild(cell('sheet__term', withGaps(row.term)));
          tr.appendChild(cell('sheet__blank', ''));
        } else {
          tr.appendChild(cell('sheet__term', withGaps(row.term)));
          tr.appendChild(cell('sheet__de', row.translation));
          if (showExtra) tr.appendChild(cell('sheet__extra', row.extra));
        }
        body.appendChild(tr);
      });
      sheet.appendChild(h('div.sheet__section', {},
        section.title && prepared.sections.length > 1 ? h('h2', { text: section.title }) : null,
        h('table.sheet__table', {}, body)
      ));
    });
    sheet.rowCount = prepared.total;
    sheet.skipped = prepared.skipped;
    return sheet;
  }

  /* --- Drucken ------------------------------------------------------------------ */

  /**
   * Übergibt einen Knoten an den Druckdialog. Solange gedruckt wird, zeigt
   * das Dokument nur ihn (siehe styles/print.css); danach ist alles wie zuvor.
   */
  function printNode(node, title) {
    var root = document.getElementById('print-root');
    if (!root) return false;
    var html = document.documentElement;
    var previousTitle = document.title;
    var done = false;

    function cleanup() {
      if (done) return;
      done = true;
      window.removeEventListener('afterprint', cleanup);
      document.removeEventListener('pointerdown', cleanup, true);
      document.removeEventListener('keydown', cleanup, true);
      html.classList.remove('is-printing');
      util.clear(root);
      document.title = previousTitle;
    }

    util.clear(root);
    root.appendChild(node);
    html.classList.add('is-printing');
    // Der Titel wird zum vorgeschlagenen Dateinamen beim Speichern als PDF.
    if (title) document.title = title;
    window.addEventListener('afterprint', cleanup);
    try {
      window.print();
    } catch (err) {
      cleanup();
      BAO.toast.error('Der Druckdialog ließ sich nicht öffnen.');
      return false;
    }
    // Manche Browser melden das Ende des Druckens nicht: Dann räumt die
    // nächste Eingabe auf.
    window.setTimeout(function () {
      if (done) return;
      document.addEventListener('pointerdown', cleanup, true);
      document.addEventListener('keydown', cleanup, true);
    }, 0);
    return true;
  }

  /* --- Dialog ------------------------------------------------------------------- */

  /**
   * Fragt Art und Reihenfolge ab und druckt oder kopiert die Liste.
   * config: { title, subtitle, sections: [{ title, rows }] }
   */
  function openWordList(config) {
    var total = countRows(config.sections);
    if (!total) {
      BAO.toast.show('Hier gibt es noch nichts zu drucken.');
      return null;
    }

    // Eine Mischung je Wahl der Reihenfolge: Gedruckt wird, was die Vorschau zeigt.
    var seed = newSeed();
    var fieldTitle = ui.textField({ label: 'Überschrift', value: config.title || 'Wortliste' });
    var fieldMode = ui.selectField({
      label: 'Art des Blatts', value: last.mode,
      options: MODES.map(function (mode) { return { value: mode.id, label: mode.label }; }),
      onChange: refresh
    });
    var fieldOrder = ui.selectField({
      label: 'Reihenfolge', value: last.order,
      options: ORDERS.map(function (order) { return { value: order.id, label: order.label }; }),
      onChange: function () { seed = newSeed(); refresh(); }
    });
    var extraId = util.uid('chk');
    var extraBox = h('input', { type: 'checkbox', id: extraId, checked: last.extra ? true : null, onchange: refresh });
    var extraRow = h('div.toggle-row', {}, extraBox,
      h('label', { for: extraId, text: 'Wortverbindung oder Beispiel als dritte Spalte' }));
    var info = h('span.hint');
    var preview = h('div.sheet-preview', { 'aria-label': 'Vorschau des Blatts' });

    function options() {
      return {
        mode: util.$('select', fieldMode).value,
        order: util.$('select', fieldOrder).value,
        extra: extraBox.checked,
        title: fieldTitle.input.value.trim() || config.title || 'Wortliste',
        seed: seed
      };
    }

    function refresh() {
      var chosen = options();
      last = { mode: chosen.mode, order: chosen.order, extra: chosen.extra };
      extraRow.hidden = isTest(chosen.mode);
      var sheet = buildSheet(config, chosen);
      util.clear(preview);
      preview.appendChild(sheet);
      info.textContent = sheet.rowCount + ' ' + util.plural(sheet.rowCount, 'Zeile', 'Zeilen')
        + (sheet.skipped
          ? ' · ' + sheet.skipped + ' ohne deutsche Entsprechung '
            + util.plural(sheet.skipped, 'bleibt', 'bleiben') + ' im Test außen vor'
          : '');
      return sheet;
    }

    fieldTitle.input.addEventListener('input', refresh);
    refresh();

    return BAO.modal.open({
      title: 'Wortliste drucken',
      subtitle: 'Als Liste zum Mitnehmen oder als Vokabeltest. Im Druckdialog lässt sich das Blatt auch als PDF speichern.',
      width: '680px',
      body: h('div.stack', {},
        fieldTitle,
        h('div.grid2', {}, fieldMode, fieldOrder),
        extraRow,
        preview,
        info
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Als Text kopieren',
          onSelect: function () {
            var prepared = prepare(config.sections, { mode: 'list', order: options().order, seed: seed });
            util.copyText(BAO.stock.rowsToText(prepared.sections)).then(function (ok) {
              if (ok) {
                BAO.toast.ok(prepared.total + ' ' + util.plural(prepared.total, 'Zeile', 'Zeilen')
                  + ' kopiert – einfügen in Textverarbeitung, Tabelle oder Lernplattform.');
              } else {
                BAO.toast.error('Der Browser hat das Kopieren nicht erlaubt.');
              }
            });
            return false;
          }
        },
        {
          label: 'Drucken', kind: 'primary',
          onSelect: function () {
            var chosen = options();
            var sheet = buildSheet(config, chosen);
            if (!sheet.rowCount) {
              BAO.toast.error('Für einen Test braucht jeder Eintrag eine deutsche Entsprechung.');
              return false;
            }
            // Erst schließen, dann drucken – der Druckdialog hält die Seite an.
            window.setTimeout(function () { printNode(sheet, chosen.title); }, 30);
            return true;
          }
        }
      ]
    });
  }

  BAO.print = {
    MODES: MODES,
    prepare: prepare,
    buildSheet: buildSheet,
    printNode: printNode,
    openWordList: openWordList
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/ui/handover.js */
/* ==========================================================================
   Weitergeben innerhalb des Bestands
   - Eine Tafel, ein Whiteboard oder eine Wortbank für eine andere Lerngruppe
     desselben Fachs kopieren – die Parallelklasse bekommt dieselbe Stunde.
   - Der Hinweis auf die mitgelieferten Beispieldaten.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var select = BAO.select;

  var KINDS = {
    board: { label: 'Tafel', copy: 'copyBoardTo', path: 'tafel/', withStock: true },
    whiteboard: { label: 'Whiteboard', copy: 'copyWhiteboardTo', path: 'whiteboard/', withStock: false },
    bank: { label: 'Wortbank', copy: 'copyBankTo', path: 'wortbank/', withStock: true }
  };

  /** Gibt es eine Lerngruppe, für die sich eine Kopie anlegen ließe? */
  function canCopy(state, item) {
    return !!item && BAO.stock.siblingGroups(state, item).length > 0;
  }

  /**
   * Fragt die Ziel-Lerngruppe ab und legt die Kopie an.
   * kind: 'board' | 'whiteboard' | 'bank'
   */
  function copyToGroup(kind, item, app) {
    var info = KINDS[kind];
    var state = BAO.store.getState();
    var groups = info ? BAO.stock.siblingGroups(state, item) : [];
    if (!groups.length) return null;

    var groupSelect = ui.selectField({
      label: 'Für welche Lerngruppe?',
      value: groups[0].id,
      options: groups.map(function (g) { return { value: g.id, label: g.name + ' · Jg. ' + g.grade }; })
    });

    return BAO.modal.open({
      title: info.label + ' für eine andere Lerngruppe kopieren',
      subtitle: '„' + item.title + '“ – zum Beispiel für die Parallelklasse.',
      width: '520px',
      body: h('div.stack', {},
        groupSelect,
        h('div.note', {
          text: info.withStock
            ? 'Was es im Bestand der anderen Lerngruppe noch nicht gibt, kommt dort als „neu“ hinzu. '
              + 'Einträge, die dort schon stehen, werden verwendet – es entstehen keine Dubletten.'
            : 'Die Handschrift wird vollständig kopiert. Das Original bleibt unverändert.'
        })
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Kopie anlegen', kind: 'primary',
          onSelect: function () {
            var targetId = util.$('select', groupSelect).value;
            var report = null;
            BAO.store.commit(info.label + ' für eine andere Lerngruppe kopiert', function (draft) {
              report = BAO.stock[info.copy](draft, item.id, targetId);
              if (!report) return false;
            });
            if (!report) { BAO.toast.error('Die Kopie ließ sich nicht anlegen.'); return false; }
            var target = { id: report.group.id, subjectId: report.group.subjectId, name: report.group.name };
            var parts = [];
            if (report.created) parts.push(report.created + ' ' + util.plural(report.created, 'Eintrag', 'Einträge') + ' neu im Bestand');
            if (report.reused) parts.push(report.reused + ' dort schon vorhanden');
            BAO.toast.show('Kopie für ' + target.name + ' angelegt' + (parts.length ? ' – ' + parts.join(', ') : '') + '.', {
              actionLabel: 'Öffnen', timeout: 9000,
              onAction: function () {
                app.setContext(target.subjectId, target.id);
                app.go(info.path + report.id);
              }

/* js/projection/deck.js */
/* ==========================================================================
   Vorlage für die Projektion ("Deck")
   Übersetzt eine Wortbank zusammen mit der gewählten Unterstützungsstufe in
   Abschnitte und daraus in einzelne Bildschirmseiten. Die endgültige
   Aufteilung entsteht in render.js durch Messung – hier steht die inhaltliche
   Vorarbeit und eine belastbare Schätzung.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var select = BAO.select;

  var LIVE_SECTION_ID = '__live';

  /** Feldsichtbarkeit für eine Unterstützungsstufe. */
  function fieldsForLevel(level, fieldLevels) {
    var levels = fieldLevels || schema.defaultSettings().fieldLevels;
    var out = {};
    schema.FIELDS.forEach(function (field) {
      var threshold = levels[field.key] === undefined ? field.level : levels[field.key];
      out[field.key] = level >= threshold;
    });
    return out;
  }

  function countSecondary(fields) {
    return ['collocation', 'chunk', 'explanation', 'translation', 'example', 'pronunciation']
      .filter(function (key) { return fields[key]; }).length;
  }

  /* --- Zeilen eines Eintrags ---------------------------------------------- */

  function lexemeLines(lex, fields, layout) {
    var lines = [];
    function push(cls, text) { if (text) lines.push({ cls: cls, text: text }); }

    if (layout === 'impulse') {
      // Impuls: bewusst nur eine einzige Stützzeile, damit die Fläche ruhig bleibt.
      if (fields.chunk && lex.chunk) push('pitem__chunk', lex.chunk);
      else if (fields.collocation && lex.collocation) push('pitem__chunk', lex.collocation);
      else if (fields.translation && lex.translation) push('pitem__de', lex.translation);
      return lines;
    }

    if (fields.collocation) push('pitem__chunk', lex.collocation);
    if (fields.chunk) push('pitem__chunk', lex.chunk);
    if (fields.explanation) push('pitem__expl', lex.explanation);
    if (fields.translation) push('pitem__de', lex.translation);
    if (fields.example) push('pitem__ex', lex.example);
    return lines;
  }

  function lexemeMeta(lex, fields) {
    var parts = [];
    if (fields.pronunciation && lex.pronunciation) parts.push(lex.pronunciation);
    return parts.join(' · ');

  function starterLines(starter, fields) {
    var lines = [];
    if (fields.starterTranslation && starter.translation) {
      lines.push({ cls: 'pitem__de', text: starter.translation });
    }
    return lines;
  }

  /* --- Abschnittsaufbau ---------------------------------------------------- */

  function resolveLayout(section, items, fields) {
    if (section.layout && section.layout !== 'auto') return section.layout;
    var onlyStarters = items.length > 0 && items.every(function (i) { return i.kind === 'starter'; });
    if (onlyStarters) return 'starters';

   * sorgt zugleich für die vom Konzept gewünschte Portionierung.

    var secondary = countSecondary(fields);

    }
    if (layout === 'impulse') {
      return util.clamp(9, 3, Math.max(6, maxItems));
    }
    var capacity = maxItems - secondary * 2;
    return util.clamp(capacity, 3, maxItems);

  function buildItems(state, section) {
    var items = [];
    (section.items || []).forEach(function (item) {
      var resolved = select.resolveItem(state, item);
      if (!resolved) return;
      items.push({
        key: item.id,
        kind: resolved.kind,
        ref: resolved.ref,
        item: item
      });
    });
    return items;
  }

  /**
   * Satzanfänge werden nach kommunikativen Funktionen gegliedert, sobald ein
   * Abschnitt mehr als eine Funktion enthält. Die Zwischenüberschrift ist eine
   * eigene Position und wird beim Umbruch nie allein am Seitenende gelassen.
   */
  function withFunctionGroups(state, items, layout) {
    if (layout !== 'starters') return items;

      return item.kind === 'starter' ? (item.ref.functionId || '') : '';

    if (functionIds.length < 2) return items;

    var out = [];
    var lastFunction = null;
    items.forEach(function (item) {
      var functionId = item.kind === 'starter' ? (item.ref.functionId || '') : '';
      if (functionId !== lastFunction) {
        out.push({
          key: 'grp_' + functionId + '_' + out.length,
          kind: 'group',
          label: select.functionLabel(state, functionId)
        });
        lastFunction = functionId;
      }
      out.push(item);
    });
    return out;
  }

  function countEntries(items) {
    return items.filter(function (item) { return item.kind !== 'group'; }).length;
  }

  /**
   * build(state, bank, options)
   * options: { level, fields, focusSectionId, liveItems, maxItemsPerSlide }
   */
  function build(state, bank, options) {
    options = options || {};
    var level = options.level || (bank ? bank.defaultLevel : 2) || 2;
    var fields = options.fields || fieldsForLevel(level, state.settings.fieldLevels);
    var maxItems = options.maxItemsPerSlide || state.settings.maxItemsPerSlide || 12;

    var subject = bank ? select.subject(state, bank.subjectId) : null;
    var group = bank ? select.group(state, bank.groupId) : null;

    var deck = {
      bankId: bank ? bank.id : '',
      title: bank ? bank.title : 'Live-Hilfe',
      scene: bank ? bank.scene : '',
      subjectName: subject ? subject.name : '',
      subjectColor: subject ? subject.color : '',
      groupName: group ? group.name : '',
      level: level,
      fields: fields,
      maxItemsPerSlide: maxItems,
      sections: [],
      slides: []
    };

    (bank ? bank.sections || [] : []).forEach(function (section) {
      var items = buildItems(state, section);
      if (!items.length) return;
      if (options.focusSectionId && section.id !== options.focusSectionId) return;
      var layout = resolveLayout(section, items, fields);
      deck.sections.push({
        id: section.id,
        title: section.title,
        layout: layout,
        capacity: estimateCapacity(layout, fields, maxItems),
        items: withFunctionGroups(state, items, layout)
      });
    });

    var live = (options.liveItems || []).filter(Boolean);
    if (live.length && (!options.focusSectionId || options.focusSectionId === LIVE_SECTION_ID)) {
      var liveItems = live.map(function (entry) {
        return { key: entry.id, kind: 'live', ref: entry, item: null };
      });
      deck.sections.push({
        id: LIVE_SECTION_ID,
        title: 'Live-Hilfe',
        layout: liveItems.every(function (i) { return i.ref.type === 'starter'; }) ? 'starters' : 'cards',
        capacity: estimateCapacity('cards', fields, maxItems),
        items: liveItems,
        live: true
      });
    }

    paginate(deck);
    return deck;
  }

  /**
   * Verteilt die Einträge jedes Abschnitts auf Seiten.
   * capacities: optionale Zuordnung { sectionId: anzahl } aus der Messung.
   */
  function paginate(deck, capacities) {
    var slides = [];
    deck.sections.forEach(function (section, sectionIndex) {
      var capacity = Math.max(1, (capacities && capacities[section.id]) || section.capacity);
      var pages = Math.max(1, Math.ceil(section.items.length / capacity));
      // Gleichmäßig verteilen: lieber 2 x 5 als 8 + 2.
      var perPage = Math.ceil(section.items.length / pages);
      for (var page = 0; page < pages; page++) {
        var items = section.items.slice(page * perPage, (page + 1) * perPage);
        if (!items.length) continue;
        slides.push({
          sectionId: section.id,
          sectionTitle: section.title,
          sectionIndex: sectionIndex,
          layout: section.layout,
          live: !!section.live,
          pageInSection: page + 1,
          pagesInSection: pages,
          items: items
        });
      }
    });
    // Seitenzahlen nachtragen, wenn ein Abschnitt tatsächlich mehrfach umbrochen wurde.
    var perSection = {};
    slides.forEach(function (slide) { perSection[slide.sectionId] = (perSection[slide.sectionId] || 0) + 1; });
    slides.forEach(function (slide) { slide.pagesInSection = perSection[slide.sectionId]; });

    deck.slides = slides;
    return deck;
  }

  function isEmpty(deck) { return !deck || !deck.slides.length; }

  function sectionSummary(deck) {
    return deck.sections.map(function (section) {
      var slides = deck.slides.filter(function (s) { return s.sectionId === section.id; });
      return {
        id: section.id,
        title: section.title,
        items: countEntries(section.items),
        slides: slides.length,
        firstSlide: deck.slides.indexOf(slides[0]),
        live: !!section.live
      };
    });
  }

  BAO.deck = {
    LIVE_SECTION_ID: LIVE_SECTION_ID,
    fieldsForLevel: fieldsForLevel,
    countSecondary: countSecondary,
    lexemeLines: lexemeLines,
    lexemeMeta: lexemeMeta,
    starterLines: starterLines,
    estimateCapacity: estimateCapacity,
    build: build,
    paginate: paginate,
    countEntries: countEntries,
    isEmpty: isEmpty,
    sectionSummary: sectionSummary
  };
})(window.BAO = window.BAO || {});

  <script>
/* js/projection/render.js */
/* ==========================================================================
   Darstellung der Bühne
   Baut die Projektionsansicht in ein beliebiges Dokument – in die eingebettete
   Vorschau, in die Vollbild-Überlagerung oder in das separate Beamerfenster.
   Die Aufteilung auf mehrere Seiten entsteht durch echtes Messen: Inhalte
   werden nie unbegrenzt verkleinert, sondern portioniert.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var ui = BAO.ui;
  var deckLib = BAO.deck;

  /** Sorgt dafür, dass ein Dokument die Bühnengestaltung kennt. */
  function ensureStyle(doc, includeDocumentStyle) {

    var style = doc.createElement('style');
    style.id = 'bao-stage-style';
    style.textContent = (includeDocumentStyle ? BAO.stageDocumentStyle : '') + BAO.stageStyle;

  /** Erzeugt das Grundgerüst einer Bühne in einem Zieldokument. */
  function createStage(doc) {
    var h = function (tag, props) {
      var args = Array.prototype.slice.call(arguments, 2);
      props = Object.assign({ ownerDocument: doc }, props || {});
      return util.h.apply(null, [tag, props].concat(args));
    };

    var crumb = h('div.stage__crumb');
    var title = h('h1.stage__title');
    var pos = h('div.stage__pos');
    var body = h('div.stage__body');
    var dots = h('div.stage__dots');
    var badges = h('div.stage__badges', { style: { display: 'flex', gap: '.6em' } });
    var timerFill = h('i');
    var timer = h('div.stage__timer', {}, timerFill);
    var foot = h('footer.stage__foot', {}, dots, badges, timer);
    var head = h('header.stage__head', {}, crumb, title, pos);
    var root = h('div.bao-stage', { dataset: { stageTheme: 'light' } }, head, body, foot);

      doc: doc, root: root, head: head, crumb: crumb, title: title, pos: pos,
      body: body, foot: foot, dots: dots, badges: badges, timer: timer, timerFill: timerFill,
      hint: null

  /* --- Einzelne Einträge ---------------------------------------------------- */

  function buildLexemeNode(doc, lex, deck, layout, live) {
    var node = doc.createElement('article');
    node.className = 'pitem pitem--lex' + (live ? ' pitem--live' : '');

    var term = doc.createElement('div');
    term.className = 'pitem__term';

      doc: doc,
      gram: !!(deck.fields.gram && lex.gram)
    }));
    node.appendChild(term);

    deckLib.lexemeLines(lex, deck.fields, layout).forEach(function (line) {
      var p = doc.createElement('p');
      p.className = 'pitem__line ' + line.cls;
      p.textContent = line.text;
      node.appendChild(p);
    });

    var meta = deckLib.lexemeMeta(lex, deck.fields);
    if (meta && layout !== 'impulse') {
      var metaNode = doc.createElement('p');
      metaNode.className = 'pitem__meta';
      metaNode.textContent = meta;
      node.appendChild(metaNode);
    }
    return node;
  }

  function buildStarterNode(doc, starter, deck, live) {
    var node = doc.createElement('article');
    node.className = 'pitem pitem--starter' + (live ? ' pitem--live' : '');
    node.dataset.variant = starter.variant || 'standard';

    var text = doc.createElement('p');
    text.className = 'pitem__starter';
    text.appendChild(ui.gapText(starter.text, doc));
    node.appendChild(text);

    deckLib.starterLines(starter, deck.fields).forEach(function (line) {
      var p = doc.createElement('p');
      p.className = 'pitem__line ' + line.cls;
      p.textContent = line.text;
      node.appendChild(p);

   * deshalb beides.

  }

    return { kind: 'group', key: group.key + '__c' + index, label: group.label };
  }

  /**
   * Verteilt einen Abschnitt gleichmäßig auf eine vorgegebene Seitenzahl.
   * Zwischenüberschriften bleiben nie allein am Seitenende stehen und werden
   * auf der Folgeseite wiederholt.
   */
  function balance(items, pageCount) {
    var total = deckLib.countEntries(items);
    if (pageCount <= 1 || !total) return [items.slice()];
    var target = Math.ceil(total / pageCount);
    var pages = [];
    var current = [];
    var currentGroup = null;
    var used = 0;
    var placed = 0;

    items.forEach(function (item) {
      if (item.kind === 'group') { currentGroup = item; current.push(item); return; }
      current.push(item);
      used += 1;
      placed += 1;
      var remaining = total - placed;
      if (used >= target && remaining > 0 && pages.length < pageCount - 1) {
        pages.push(current);
        current = currentGroup ? [continuation(currentGroup, pages.length)] : [];
        used = 0;
      }
    });

    return pages.length === pageCount ? pages : null;
  }

    var doc = stage.doc;
    return pages.every(function (items) {

      var pages = [];
      var current = [];

        if (deckLib.countEntries(page)) pages.push(page);
        var next = moved.concat(carry || []);
        if (currentGroup && (!next.length || next[0].kind !== 'group')) {

        }

      }

      util.clear(stage.body);
      section.items.forEach(function (item) {
        if (item.kind === 'group') currentGroup = item;
        stage.body.appendChild(buildItemNode(doc, item, deck, section.layout));
        current.push(item);

        var entries = deckLib.countEntries(current);
        if (overflows(stage) && entries > 1) {
          current.pop();
          current = closePage([item]);
          drawPage(current);
        } else if (entries >= maxItems) {
          current = closePage([]);
          drawPage(current);
        }
      });
      if (deckLib.countEntries(current)) pages.push(current);

  var util = BAO.util;
  var render = BAO.render;

  var surfaces = [];              // { kind, stage, doc, win }
  var keyHandlers = [];
  var changeHandlers = [];
  var surfaceHandlers = [];
  var beamerWindow = null;
  var overlayNode = null;
  var watchTimer = null;

  function notifyChange(reason) {
    changeHandlers.forEach(function (fn) { fn(reason); });
  }

  function emitKey(event, source) {
    keyHandlers.forEach(function (fn) { fn(event, source); });
  }

  function addSurface(kind, stage, doc, win) {
    var surface = { kind: kind, stage: stage, doc: doc, win: win || null };
    surfaces.push(surface);
    // Wer an jeder Fläche etwas anbringt – die Unterrichtsleiste des
    // Soundboards –, erfährt hier von der neuen.
    surfaceHandlers.forEach(function (fn) { fn(surface); });
    return surface;

  function removeSurface(kind) {
    surfaces = surfaces.filter(function (s) { return s.kind !== kind; });
  }

  function getSurface(kind) {
    for (var i = 0; i < surfaces.length; i++) if (surfaces[i].kind === kind) return surfaces[i];
    return null;
  }

  function all() { return surfaces.slice(); }

  /* --- Beamerfenster -------------------------------------------------------- */

  function screenPlacement() {
    // Auf erweiterten Anzeigen möglichst rechts neben dem Hauptbildschirm
    // starten. Wenn der Browser nichts darüber verrät, bleibt es beim
    // gewohnten Fenster, das die Lehrkraft selbst verschieben kann.
    var width = 1280;
    var height = 760;
    var left = 60;
    var top = 60;
    try {
      if (window.screen && window.screen.isExtended && window.screen.availWidth) {
        left = window.screen.availWidth + 20;
        top = 0;
      }
    } catch (err) { /* Bildschirmangaben nicht verfügbar */ }

      + ',menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=yes';

    ['Leertaste', 'Automatik'],

      var kbd = doc.createElement('kbd');
      kbd.textContent = pair[0];

      span.appendChild(doc.createTextNode(pair[1]));

    var hint = buildHint(doc);
    stage.hint = hint;
    doc.body.appendChild(stage.root);
    doc.body.appendChild(hint);
    showHint(stage, 8000);

    doc.addEventListener('keydown', function (event) { emitKey(event, 'window'); });
    doc.addEventListener('mousemove', function () { showHint(stage, 2500); });

    win.addEventListener('pagehide', handleWindowClosed);
    win.addEventListener('unload', handleWindowClosed);

    removeSurface('window');
    addSurface('window', stage, doc, win);

    if (watchTimer) clearInterval(watchTimer);
    watchTimer = setInterval(function () {

  }

  function handleWindowClosed() {
    if (!getSurface('window') && !beamerWindow) return;
    if (beamerWindow && !beamerWindow.closed) return;   // pagehide ohne Schließen
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    beamerWindow = null;
    removeSurface('window');
    notifyChange('window-closed');
  }

  function isWindowOpen() { return !!(beamerWindow && !beamerWindow.closed); }

  function closeWindow() {
    if (beamerWindow && !beamerWindow.closed) beamerWindow.close();
    beamerWindow = null;
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    removeSurface('window');
    notifyChange('window-closed');
  }

  function focusWindow() {
    if (isWindowOpen()) { try { beamerWindow.focus(); } catch (err) { /* egal */ } }
  }

  function requestWindowFullscreen() {
    if (!isWindowOpen()) return false;
    try {
      var element = beamerWindow.document.documentElement;
      if (element.requestFullscreen) { element.requestFullscreen(); return true; }
    } catch (err) { /* Browser verweigert ohne direkte Nutzeraktion */ }

  }

  /* --- Vollbild-Überlagerung ------------------------------------------------ */

  function openOverlay() {

    render.ensureStyle(document, false);
    overlayNode = util.h('div.stage-overlay', { role: 'region', 'aria-label': 'Projektion' });
    var stage = render.createStage(document);
    var hint = buildHint(document);
    stage.hint = hint;
    overlayNode.appendChild(stage.root);
    overlayNode.appendChild(hint);
    document.getElementById('overlay-root').appendChild(overlayNode);
    // Kurzmeldungen der Lehreransicht dürfen nicht auf der Leinwand landen.
    document.body.dataset.projecting = 'true';
    showHint(stage, 6000);

    overlayNode.addEventListener('mousemove', function () { showHint(stage, 2500); });

    var surface = addSurface('overlay', stage, document, window);
    notifyChange('overlay-opened');

    if (overlayNode.requestFullscreen) {
      var promise = overlayNode.requestFullscreen();
      if (promise && promise.catch) promise.catch(function () { /* Vollbild abgelehnt */ });

  function closeOverlay() {

    if (document.fullscreenElement === overlayNode && document.exitFullscreen) {

      if (promise && promise.catch) promise.catch(function () { /* egal */ });
    }
    if (overlayNode.parentNode) overlayNode.parentNode.removeChild(overlayNode);
    overlayNode = null;
    delete document.body.dataset.projecting;
    removeSurface('overlay');
    notifyChange('overlay-closed');

  function isOverlayOpen() { return !!overlayNode; }

  function toggleOverlayFullscreen() {
    if (!overlayNode) return;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (overlayNode.requestFullscreen) {

  /* --- Vorschau in der Lehreransicht ---------------------------------------- */

  function attachPreview(container) {
    render.ensureStyle(document, false);

    util.clear(container);
    var stage = render.createStage(document);
    container.appendChild(stage.root);

  function detachPreview() { removeSurface('preview'); }

  /* --- Ereignisse ----------------------------------------------------------- */

  function onKey(handler) { keyHandlers.push(handler); }
  function onChange(handler) { changeHandlers.push(handler); }
  function onSurface(handler) { surfaceHandlers.push(handler); }

  window.addEventListener('beforeunload', function () {
    if (beamerWindow && !beamerWindow.closed) beamerWindow.close();
  });
  window.addEventListener('resize', function () { notifyChange('resize'); });

  BAO.output = {
    openWindow: openWindow,
    closeWindow: closeWindow,
    isWindowOpen: isWindowOpen,
    focusWindow: focusWindow,
    requestWindowFullscreen: requestWindowFullscreen,
    openOverlay: openOverlay,
    closeOverlay: closeOverlay,
    isOverlayOpen: isOverlayOpen,
    toggleOverlayFullscreen: toggleOverlayFullscreen,
    attachPreview: attachPreview,
    detachPreview: detachPreview,

    onKey: onKey,

})(window.BAO = window.BAO || {});

/* js/projection/session.js */
/* ==========================================================================

   Der Zustandsautomat hinter der Projektion: Unterstützungsstufe, Blättern,
   Automatik, Fokus, Abschreibmodus, Live-Hilfe. Alle Ausgabeflächen zeigen

(function (BAO) {
  'use strict';

  var util = BAO.util;
  var render = BAO.render;
  var output = BAO.output;
  var deckLib = BAO.deck;
  var select = BAO.select;

  var TICK_MS = 200;

  var state = {
    active: false,
    bankId: '',
    deck: null,
    level: 2,
    fields: null,
    focusSectionId: '',
    index: 0,
    blank: false,
    copyMode: false,
    scale: 1,
    theme: 'light',
    auto: { playing: false, seconds: 45, remaining: 45, reachedEnd: false },
    live: []

  var listeners = [];
  var ticker = null;

  function subscribe(fn) {

  /* --- Ausgabeflächen ------------------------------------------------------- */

    root.style.setProperty('--u', Math.max(unit, 2) + 'px');

      blank: state.blank,
      copyMode: state.copyMode,
      focus: !!state.focusSectionId,
      theme: state.theme,
      scale: state.scale,
      autoPlaying: state.auto.playing,
      autoSeconds: state.auto.seconds,
      autoRemaining: state.auto.remaining,
      showProgress: BAO.store.getState().settings.showProgressOnStage !== false,
      emptyText: state.bankId

    state.auto.reachedEnd = false;
    renderAll({ reason: reason || 'navigate', relayout: false });

      state.auto.reachedEnd = true;

        var loop = BAO.store.getState().settings.autoAdvanceLoop;
        if (loop) { goTo(0, 'auto'); return true; }

        emit('reached-end');

      return false;

    goTo(state.index - 1, 'navigate');

  /* --- Unterstützungsstufen -------------------------------------------------- */

  function setLevel(level) {
