  <script>
/* js/projection/render.js */
/* ==========================================================================
   Darstellung der Bühne
   Baut die Projektionsansicht in ein beliebiges Dokument – in die eingebettete
   Vorschau, in die Vollbild-Überlagerung oder in das separate Beamerfenster.
   Die Aufteilung auf mehrere Seiten entsteht durch echtes Messen: Inhalte
   werden nie unbegrenzt verkleinert, sondern portioniert.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var ui = BAO.ui;
  var deckLib = BAO.deck;

  /** Sorgt dafür, dass ein Dokument die Bühnengestaltung kennt. */
  function ensureStyle(doc, includeDocumentStyle) {
    if (doc.getElementById('bao-stage-style')) return;
    var style = doc.createElement('style');
    style.id = 'bao-stage-style';
    style.textContent = (includeDocumentStyle ? BAO.stageDocumentStyle : '') + BAO.stageStyle;
    (doc.head || doc.documentElement).appendChild(style);
  }

  /** Erzeugt das Grundgerüst einer Bühne in einem Zieldokument. */
  function createStage(doc) {
    var h = function (tag, props) {
      var args = Array.prototype.slice.call(arguments, 2);
      props = Object.assign({ ownerDocument: doc }, props || {});
      return util.h.apply(null, [tag, props].concat(args));
    };

    var crumb = h('div.stage__crumb');
    var title = h('h1.stage__title');
    var pos = h('div.stage__pos');
    var body = h('div.stage__body');
    var dots = h('div.stage__dots');
    var badges = h('div.stage__badges', { style: { display: 'flex', gap: '.6em' } });
    var timerFill = h('i');
    var timer = h('div.stage__timer', {}, timerFill);
    var foot = h('footer.stage__foot', {}, dots, badges, timer);
    var head = h('header.stage__head', {}, crumb, title, pos);
    var root = h('div.bao-stage', { dataset: { stageTheme: 'light' } }, head, body, foot);

    return {
      doc: doc, root: root, head: head, crumb: crumb, title: title, pos: pos,
      body: body, foot: foot, dots: dots, badges: badges, timer: timer, timerFill: timerFill,
      hint: null
    };
  }

  /* --- Einzelne Einträge ---------------------------------------------------- */

  function buildLexemeNode(doc, lex, deck, layout, live) {
    var node = doc.createElement('article');
    node.className = 'pitem pitem--lex' + (live ? ' pitem--live' : '');

    var term = doc.createElement('div');
    term.className = 'pitem__term';
    // Artikel farbig nach Genus, Zielwort, optionaler Formhinweis.
    term.appendChild(ui.termNode(deck.fields.article ? lex : Object.assign({}, lex, { article: '' }), {
      doc: doc,
      gram: !!(deck.fields.gram && lex.gram)
    }));
    node.appendChild(term);

    deckLib.lexemeLines(lex, deck.fields, layout).forEach(function (line) {
      var p = doc.createElement('p');
      p.className = 'pitem__line ' + line.cls;
      p.textContent = line.text;
      node.appendChild(p);
    });

    var meta = deckLib.lexemeMeta(lex, deck.fields);
    if (meta && layout !== 'impulse') {
      var metaNode = doc.createElement('p');
      metaNode.className = 'pitem__meta';
      metaNode.textContent = meta;
      node.appendChild(metaNode);
    }
    return node;
  }

  function buildStarterNode(doc, starter, deck, live) {
    var node = doc.createElement('article');
    node.className = 'pitem pitem--starter' + (live ? ' pitem--live' : '');
    node.dataset.variant = starter.variant || 'standard';

    var text = doc.createElement('p');
    text.className = 'pitem__starter';
    text.appendChild(ui.gapText(starter.text, doc));
    node.appendChild(text);

    deckLib.starterLines(starter, deck.fields).forEach(function (line) {
      var p = doc.createElement('p');
      p.className = 'pitem__line ' + line.cls;
      p.textContent = line.text;
      node.appendChild(p);
    });
    return node;
  }

  function buildLiveNode(doc, entry, deck) {
    if (entry.type === 'starter') {
      return buildStarterNode(doc, { text: entry.text, translation: entry.translation, variant: 'standard' }, deck, true);
    }
    return buildLexemeNode(doc, {
      term: entry.text, article: '', gram: '', collocation: '', chunk: '',
      explanation: '', translation: entry.translation || '', example: '', pronunciation: ''
    }, deck, 'cards', true);
  }

  function buildGroupNode(doc, item) {
    var node = doc.createElement('div');
    node.className = 'pgroup';
    node.textContent = item.label;
    return node;
  }

  function buildItemNode(doc, item, deck, layout) {
    if (item.kind === 'group') return buildGroupNode(doc, item);
    if (item.kind === 'starter') return buildStarterNode(doc, item.ref, deck, false);
    if (item.kind === 'live') return buildLiveNode(doc, item.ref, deck);
    return buildLexemeNode(doc, item.ref, deck, layout, false);
  }

  /* --- Spaltenzahl ---------------------------------------------------------- */

  function probeFontSize(stage) {
    var doc = stage.doc;
    var probe = doc.createElement('div');
    probe.className = 'pitem__term';
    probe.style.position = 'absolute';
    probe.style.visibility = 'hidden';
    probe.textContent = 'M';
    stage.body.appendChild(probe);
    var size = parseFloat(doc.defaultView.getComputedStyle(probe).fontSize) || 32;
    stage.body.removeChild(probe);
    return size;
  }

  function averageLength(items) {
    var entries = items.filter(function (item) { return item.kind !== 'group'; });
    if (!entries.length) return 0;
    var total = entries.reduce(function (sum, item) {
      var ref = item.ref || {};
      return sum + String(ref.text || ref.term || '').length;
    }, 0);
    return total / entries.length;
  }

  function computeColumns(stage, layout, items) {
    var width = stage.body.clientWidth || 960;
    var fontSize = probeFontSize(stage);
    if (layout === 'starters') {
      var avg = averageLength(items);
      var wide = width >= 1000 && avg > 0 && avg < 42 && items.length > 4;
      return wide ? 2 : 1;
    }
    if (layout === 'impulse') {
      return util.clamp(Math.floor(width / (fontSize * 1.3 * 5.2)), 1, 4);
    }
    return util.clamp(Math.floor(width / (fontSize * 8.2)), 1, 3);

  /* --- Messbasierte Seitenaufteilung ---------------------------------------- */

  /**
   * Läuft der Inhalt über die Seite hinaus?
   * Das Raster wächst nach unten, der Spaltenfluss nach rechts – geprüft wird
   * deshalb beides.
   */
  function overflows(stage) {
    var body = stage.body;
    return body.scrollHeight > body.clientHeight + 1 || body.scrollWidth > body.clientWidth + 1;
  }

  /** Kopie einer Zwischenüberschrift für die Fortsetzung auf der nächsten Seite. */
  function continuation(group, index) {
    return { kind: 'group', key: group.key + '__c' + index, label: group.label };
  }

  /**
   * Verteilt einen Abschnitt gleichmäßig auf eine vorgegebene Seitenzahl.
   * Zwischenüberschriften bleiben nie allein am Seitenende stehen und werden
   * auf der Folgeseite wiederholt.
   */
  function balance(items, pageCount) {
    var total = deckLib.countEntries(items);
    if (pageCount <= 1 || !total) return [items.slice()];
    var target = Math.ceil(total / pageCount);
    var pages = [];
    var current = [];
    var currentGroup = null;
    var used = 0;
    var placed = 0;

    items.forEach(function (item) {
      if (item.kind === 'group') { currentGroup = item; current.push(item); return; }
      current.push(item);
      used += 1;
      placed += 1;
      var remaining = total - placed;
      if (used >= target && remaining > 0 && pages.length < pageCount - 1) {
        pages.push(current);
        current = currentGroup ? [continuation(currentGroup, pages.length)] : [];
        used = 0;
      }
    });
    if (deckLib.countEntries(current)) pages.push(current);
    return pages.length === pageCount ? pages : null;
  }

  /** Prüft, ob jede Seite tatsächlich vollständig sichtbar ist. */
  function fits(stage, deck, section, pages, maxItems) {
    var doc = stage.doc;
    return pages.every(function (items) {
      if (deckLib.countEntries(items) > maxItems) return false;
      util.clear(stage.body);
      items.forEach(function (item) { stage.body.appendChild(buildItemNode(doc, item, deck, section.layout)); });
      return !overflows(stage);
    });
  }

  /**
   * Verteilt jeden Abschnitt so auf Seiten, dass nichts abgeschnitten wird.
   * Vorgehen: gierig füllen (garantiert passend), danach gleichmäßig
   * ausbalancieren und das Ergebnis erneut messen.
   */
  function relayout(stage, deck) {
    if (!deck || !deck.sections.length) { deck.slides = []; return deck; }
    if (!stage.body.clientHeight) return deck;          // noch nicht im Layout

    var doc = stage.doc;
    var previousLayout = stage.body.dataset.layout;
    var slides = [];
    stage.body.dataset.measuring = 'true';

    deck.sections.forEach(function (section, sectionIndex) {
      var cols = computeColumns(stage, section.layout, section.items);
      stage.body.dataset.layout = section.layout;
      stage.body.style.setProperty('--cols', cols);

      var maxItems = Math.max(1, deck.maxItemsPerSlide);
      var pages = [];
      var current = [];
      var currentGroup = null;

      function drawPage(items) {
        util.clear(stage.body);
        items.forEach(function (item) {
          stage.body.appendChild(buildItemNode(doc, item, deck, section.layout));
        });
      }

      /** Seite abschließen; überzählige Überschriften wandern mit. */
      function closePage(carry) {
        var page = current.slice();
        var moved = [];
        while (page.length && page[page.length - 1].kind === 'group') moved.unshift(page.pop());
        if (deckLib.countEntries(page)) pages.push(page);
        var next = moved.concat(carry || []);
        if (currentGroup && (!next.length || next[0].kind !== 'group')) {
          next = [continuation(currentGroup, pages.length)].concat(next);
        }
        return next;
      }

      util.clear(stage.body);
      section.items.forEach(function (item) {
        if (item.kind === 'group') currentGroup = item;
        stage.body.appendChild(buildItemNode(doc, item, deck, section.layout));
        current.push(item);

        var entries = deckLib.countEntries(current);
        if (overflows(stage) && entries > 1) {
          current.pop();
          current = closePage([item]);
          drawPage(current);
        } else if (entries >= maxItems) {
          current = closePage([]);
          drawPage(current);
        }
      });
      if (deckLib.countEntries(current)) pages.push(current);
      if (!pages.length) pages = [[]];

      // Ausbalancieren: gleich große Seiten lesen sich ruhiger.
      var balanced = balance(section.items, pages.length);
      if (balanced && fits(stage, deck, section, balanced, maxItems)) pages = balanced;

      pages.forEach(function (items, pageIndex) {
        if (!deckLib.countEntries(items)) return;
        slides.push({
          sectionId: section.id,
          sectionTitle: section.title,
          sectionIndex: sectionIndex,
          layout: section.layout,
          live: !!section.live,
          columns: cols,
          pageInSection: pageIndex + 1,
          pagesInSection: pages.length,
          items: items
        });
      });
    });

    util.clear(stage.body);
    delete stage.body.dataset.measuring;
    if (previousLayout) stage.body.dataset.layout = previousLayout;

    // Seitenzahlen je Abschnitt nachtragen (übersprungene Seiten zählen nicht).
    var perSection = {};
    slides.forEach(function (slide) { perSection[slide.sectionId] = (perSection[slide.sectionId] || 0) + 1; });
    var counter = {};
    slides.forEach(function (slide) {
      counter[slide.sectionId] = (counter[slide.sectionId] || 0) + 1;
      slide.pageInSection = counter[slide.sectionId];
      slide.pagesInSection = perSection[slide.sectionId];
    });

    deck.slides = slides;
    return deck;
  }

  /* --- Vollständige Darstellung --------------------------------------------- */

  function renderStage(stage, deck, view) {
    var doc = stage.doc;
    var root = stage.root;
    view = view || {};

    root.dataset.stageTheme = view.theme || 'light';
    root.dataset.focus = view.focus ? 'true' : 'false';
    root.dataset.blank = view.blank ? 'true' : 'false';
    root.setAttribute('data-blank-hint', 'Bildschirm geleert – Taste B blendet die Wortbank wieder ein');
    root.style.setProperty('--user-scale', view.scale || 1);

    if (!deck || !deck.slides.length) {
      util.clear(stage.crumb);
      stage.crumb.textContent = deck ? [deck.subjectName, deck.groupName].filter(Boolean).join(' · ') : '';
      stage.title.textContent = deck ? deck.title : 'Boîte à Oublis';
      stage.pos.textContent = '';
      util.clear(stage.body);
      delete stage.body.dataset.layout;
      var empty = doc.createElement('div');
      empty.className = 'stage__empty';
      empty.textContent = view.emptyText || 'Diese Wortbank enthält noch keine Einträge.';
      stage.body.appendChild(empty);
      stage.foot.dataset.hidden = 'true';
      return;
    }

    var index = util.clamp(view.index || 0, 0, deck.slides.length - 1);
    var slide = deck.slides[index];

    util.clear(stage.crumb);
    var crumbParts = [deck.subjectName, deck.groupName, deck.scene].filter(Boolean);
    if (crumbParts.length) {
      var strong = doc.createElement('b');
      strong.textContent = crumbParts[0];
      stage.crumb.appendChild(strong);
      if (crumbParts.length > 1) stage.crumb.appendChild(doc.createTextNode(' · ' + crumbParts.slice(1).join(' · ')));
    }

    stage.title.textContent = slide.sectionTitle
      + (slide.pagesInSection > 1 ? ' (' + slide.pageInSection + '/' + slide.pagesInSection + ')' : '');

    util.clear(stage.pos);
    var current = doc.createElement('b');
    current.textContent = String(index + 1);
    stage.pos.appendChild(current);
    stage.pos.appendChild(doc.createTextNode(' / ' + deck.slides.length));

    // Inhalt
    util.clear(stage.body);
    stage.body.dataset.layout = slide.layout;
    stage.body.style.setProperty('--cols', slide.columns || computeColumns(stage, slide.layout, slide.items));
    slide.items.forEach(function (item) {
      stage.body.appendChild(buildItemNode(doc, item, deck, slide.layout));
    });

    // Fußzeile
    var showProgress = view.showProgress !== false;
    stage.foot.dataset.hidden = showProgress ? 'false' : 'true';
    util.clear(stage.dots);
    if (deck.slides.length <= 24) {
      deck.slides.forEach(function (item, i) {
        var dot = doc.createElement('span');
        dot.className = 'stage__dot';
        dot.dataset.state = i === index ? 'current' : (i < index ? 'done' : 'todo');
        stage.dots.appendChild(dot);
      });
    }

    util.clear(stage.badges);
    if (view.copyMode) stage.badges.appendChild(badge(doc, 'copy', 'Abschreiben'));
    if (slide.live) stage.badges.appendChild(badge(doc, 'live', 'Live'));

    var showTimer = !!view.autoPlaying && !view.copyMode;
    stage.timer.style.display = showTimer ? '' : 'none';
    if (showTimer) {
      var ratio = view.autoSeconds ? (1 - (view.autoRemaining / view.autoSeconds)) : 0;
      stage.timerFill.style.width = Math.round(util.clamp(ratio, 0, 1) * 100) + '%';
    }
  }

  function badge(doc, kind, text) {
    var node = doc.createElement('span');
    node.className = 'stage__badge';
    node.dataset.kind = kind;
    node.textContent = text;
    return node;
  }

  /** Nur den Zeitbalken aktualisieren – ohne die Seite neu aufzubauen. */
  function updateTimer(stage, view) {
    if (!stage || !stage.timerFill) return;
    var showTimer = !!view.autoPlaying && !view.copyMode;
    stage.timer.style.display = showTimer ? '' : 'none';
    if (!showTimer) return;
    var ratio = view.autoSeconds ? (1 - (view.autoRemaining / view.autoSeconds)) : 0;
    stage.timerFill.style.width = Math.round(util.clamp(ratio, 0, 1) * 100) + '%';
  }

  BAO.render = {
    ensureStyle: ensureStyle,
    createStage: createStage,
    renderStage: renderStage,
    relayout: relayout,
    updateTimer: updateTimer,
    buildItemNode: buildItemNode,
    computeColumns: computeColumns
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/projection/output.js */
/* ==========================================================================
   Ausgabeflächen der Projektion

     3. kleine Vorschau in der Steuerungsansicht

  var render = BAO.render;

  var surfaces = [];              // { kind, stage, doc, win }
  var keyHandlers = [];
  var changeHandlers = [];
  var beamerWindow = null;
  var overlayNode = null;
  var watchTimer = null;

  function notifyChange(reason) {

  function emitKey(event, source) {

  function addSurface(kind, stage, doc, win) {

    surfaces.push(surface);
    return surface;

  function removeSurface(kind) {

  }

  function getSurface(kind) {
    for (var i = 0; i < surfaces.length; i++) if (surfaces[i].kind === kind) return surfaces[i];
    return null;

  function screenPlacement() {

    // starten. Wenn der Browser nichts darüber verrät, bleibt es beim
    // gewohnten Fenster, das die Lehrkraft selbst verschieben kann.
    var width = 1280;
    var height = 760;
    var left = 60;
    var top = 60;
    try {
      if (window.screen && window.screen.isExtended && window.screen.availWidth) {
        left = window.screen.availWidth + 20;
        top = 0;
      }

    doc.body.appendChild(stage.root);
    doc.body.appendChild(hint);

    doc.addEventListener('keydown', function (event) { emitKey(event, 'window'); });
    doc.addEventListener('mousemove', function () { showHint(stage, 2500); });

    win.addEventListener('pagehide', handleWindowClosed);
    win.addEventListener('unload', handleWindowClosed);

    removeSurface('window');
    addSurface('window', stage, doc, win);

    if (watchTimer) clearInterval(watchTimer);
    watchTimer = setInterval(function () {
      if (!beamerWindow || beamerWindow.closed) handleWindowClosed();
    }, 1000);

    notifyChange('window-opened');
    return { ok: true, window: win, stage: stage };
  }

  function handleWindowClosed() {
    if (!getSurface('window') && !beamerWindow) return;
    if (beamerWindow && !beamerWindow.closed) return;   // pagehide ohne Schließen
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    beamerWindow = null;
    removeSurface('window');
    notifyChange('window-closed');
  }

  function isWindowOpen() { return !!(beamerWindow && !beamerWindow.closed); }

  function closeWindow() {
    if (beamerWindow && !beamerWindow.closed) beamerWindow.close();
    beamerWindow = null;
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    removeSurface('window');
    notifyChange('window-closed');
  }

  function focusWindow() {
    if (isWindowOpen()) { try { beamerWindow.focus(); } catch (err) { /* egal */ } }
  }

  function requestWindowFullscreen() {
    if (!isWindowOpen()) return false;
    try {
      var element = beamerWindow.document.documentElement;
      if (element.requestFullscreen) { element.requestFullscreen(); return true; }
    } catch (err) { /* Browser verweigert ohne direkte Nutzeraktion */ }
    return false;
  }

  /* --- Vollbild-Überlagerung ------------------------------------------------ */

  function openOverlay() {
    if (overlayNode) return getSurface('overlay');
    render.ensureStyle(document, false);
    overlayNode = util.h('div.stage-overlay', { role: 'region', 'aria-label': 'Projektion' });
    var stage = render.createStage(document);
    var hint = buildHint(document);
    stage.hint = hint;
    overlayNode.appendChild(stage.root);
    overlayNode.appendChild(hint);
    document.getElementById('overlay-root').appendChild(overlayNode);
    // Kurzmeldungen der Lehreransicht dürfen nicht auf der Leinwand landen.
    document.body.dataset.projecting = 'true';

    notifyChange('overlay-opened');

      if (promise && promise.catch) promise.catch(function () { /* egal */ });
    }
    if (overlayNode.parentNode) overlayNode.parentNode.removeChild(overlayNode);
    overlayNode = null;
    delete document.body.dataset.projecting;
    removeSurface('overlay');
    notifyChange('overlay-closed');

  function isOverlayOpen() { return !!overlayNode; }

  function toggleOverlayFullscreen() {

    if (document.fullscreenElement) {

  function attachPreview(container) {
    render.ensureStyle(document, false);
    removeSurface('preview');
    util.clear(container);
    var stage = render.createStage(document);
    container.appendChild(stage.root);
    return addSurface('preview', stage, document, window);

  function onKey(handler) { keyHandlers.push(handler); }
  function onChange(handler) { changeHandlers.push(handler); }

  document.addEventListener('fullscreenchange', function () { notifyChange('fullscreen'); });
  window.addEventListener('beforeunload', function () {
    if (beamerWindow && !beamerWindow.closed) beamerWindow.close();
  });
  window.addEventListener('resize', function () { notifyChange('resize'); });

  BAO.output = {
    openWindow: openWindow,
    closeWindow: closeWindow,
    isWindowOpen: isWindowOpen,
    focusWindow: focusWindow,
    requestWindowFullscreen: requestWindowFullscreen,
    openOverlay: openOverlay,
    closeOverlay: closeOverlay,
    isOverlayOpen: isOverlayOpen,
    toggleOverlayFullscreen: toggleOverlayFullscreen,
    attachPreview: attachPreview,
    detachPreview: detachPreview,
    setHint: setHint,
    DEFAULT_HINT: DEFAULT_HINT,
    surfaces: all,
    getSurface: getSurface,
    showHint: showHint,
    onKey: onKey,
    onChange: onChange
  };
})(window.BAO = window.BAO || {});

  <script>
/* js/projection/session.js */
/* ==========================================================================
   Unterrichtssitzung
   Der Zustandsautomat hinter der Projektion: Unterstützungsstufe, Blättern,
   Automatik, Fokus, Abschreibmodus, Live-Hilfe. Alle Ausgabeflächen zeigen
   stets denselben Stand.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var render = BAO.render;
  var output = BAO.output;
  var deckLib = BAO.deck;
  var select = BAO.select;

  var TICK_MS = 200;

  var state = {
    active: false,
    bankId: '',
    deck: null,
    level: 2,
    fields: null,
    focusSectionId: '',
    index: 0,
    blank: false,
    copyMode: false,
    scale: 1,
    theme: 'light',
    auto: { playing: false, seconds: 45, remaining: 45, reachedEnd: false },
    live: []
  };

  var listeners = [];
  var ticker = null;

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function emit(reason) {
    listeners.forEach(function (fn) {

    });
  }

  /* --- Ausgabeflächen ------------------------------------------------------- */

  /** Die maßgebliche Fläche für die Seitenaufteilung: echtes Ausgabegerät zuerst. */

    return output.getSurface('window') || output.getSurface('overlay') || output.getSurface('preview');
  }

  /** Grundeinheit der Schriftgröße aus der tatsächlichen Flächengröße. */

    var width = root.clientWidth || 960;
    var height = root.clientHeight || 540;
    var unit = Math.min(width * 0.0105, height * 0.0185);
    root.style.setProperty('--u', Math.max(unit, 2) + 'px');

      blank: state.blank,
      copyMode: state.copyMode,
      focus: !!state.focusSectionId,
      theme: state.theme,
      scale: state.scale,
      autoPlaying: state.auto.playing,
      autoSeconds: state.auto.seconds,
      autoRemaining: state.auto.remaining,
      showProgress: BAO.store.getState().settings.showProgressOnStage !== false,
      emptyText: state.bankId

  function renderAll(options) {

    var view = viewState();
    surfaces.forEach(function (surface) {

  function buildDeck() {

    if (!state.fields) state.fields = deckLib.fieldsForLevel(state.level, store.settings.fieldLevels);
    state.deck = deckLib.build(store, bank, {
      level: state.level,
      fields: state.fields,
      focusSectionId: state.focusSectionId,
      liveItems: state.live,
      maxItemsPerSlide: store.settings.maxItemsPerSlide

    clampIndex();
    return state.deck;

  /** Startet eine Wortbank (oder eine reine Live-Sitzung ohne Wortbank). */
  function start(bankId, options) {

    var bank = bankId ? select.bank(store, bankId) : null;

    // Es gibt nur eine Leinwand: Eine laufende Tafel gibt sie hier ab.
    if (BAO.board && BAO.board.isActive()) BAO.board.stop();
    output.setHint(output.DEFAULT_HINT);

    state.active = true;
    state.bankId = bank ? bank.id : '';
    state.level = options.level || (bank && bank.defaultLevel) || 2;
    state.fields = deckLib.fieldsForLevel(state.level, store.settings.fieldLevels);
    state.focusSectionId = '';
    state.index = 0;
    state.blank = false;
    state.copyMode = false;
    state.scale = store.settings.stageScale || 1;
    state.theme = store.settings.stageTheme || 'light';
    state.auto.seconds = store.settings.autoAdvanceSeconds || 45;
    state.auto.remaining = state.auto.seconds;
    state.auto.playing = false;
    state.auto.reachedEnd = false;
    if (options.keepLive !== true) state.live = [];

    buildDeck();

    if (bank) {
      BAO.store.commit('Wortbank geöffnet', function (draft) {
        var target = select.bank(draft, bank.id);
        if (target) target.lastUsedAt = util.nowISO();
        draft.ui.recentBanks = [bank.id].concat((draft.ui.recentBanks || [])

    state.bankId = '';
    state.deck = null;
    state.live = [];

  function rebuild(options) {

    buildDeck();
    renderAll(Object.assign({ reason: 'rebuild' }, options || {}));

  function totalSlides() { return state.deck ? state.deck.slides.length : 0; }

  function goTo(index, reason) {

    state.index = util.clamp(index, 0, total - 1);
    state.auto.remaining = state.auto.seconds;
    state.auto.reachedEnd = false;
    renderAll({ reason: reason || 'navigate', relayout: false });
  }

  function next(fromAuto) {

    if (!total) return false;
    if (state.index >= total - 1) {
      // Kein überraschender Neustart: Am Ende bleibt die letzte Seite stehen.
      state.auto.reachedEnd = true;

        var loop = BAO.store.getState().settings.autoAdvanceLoop;
        if (loop) { goTo(0, 'auto'); return true; }
        pause();
        emit('reached-end');

    goTo(state.index + 1, fromAuto ? 'auto' : 'navigate');
    return true;

  function prev() {

    goTo(state.index - 1, 'navigate');

  function goToSection(sectionId) {

  /* --- Unterstützungsstufen -------------------------------------------------- */

  function setLevel(level) {

    rebuild({ reason: 'level' });

    state.fields[key] = !state.fields[key];

    rebuild({ reason: 'fields' });

    rebuild({ reason: 'scale' });

    BAO.store.commit('Darstellung der Projektion', function (draft) {

    renderAll({ reason: 'theme', relayout: false });

    state.auto.remaining = state.auto.seconds;
    if (ticker) clearInterval(ticker);

    return true;

  function pause() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (!state.auto.playing) return;
    state.auto.playing = false;
    renderAll({ reason: 'pause', relayout: false });

  function toggleAuto() { return state.auto.playing ? (pause(), false) : play(); }

  function setSeconds(seconds) {
    state.auto.seconds = util.clamp(Math.round(seconds), 5, 600);
    state.auto.remaining = state.auto.seconds;
    BAO.store.commit('Intervall der Automatik', function (draft) {
      draft.settings.autoAdvanceSeconds = state.auto.seconds;
    }, { undoable: false });
    emit('interval');
  }

  /* --- Live-Hilfe ------------------------------------------------------------ */

  function addLive(entry) {
    var item = {
      id: util.uid('live'),
      type: entry.type === 'starter' ? 'starter' : 'word',
      text: String(entry.text || '').trim(),
      translation: String(entry.translation || '').trim(),
      createdAt: util.nowISO()
    };
    if (!item.text) return null;
    state.live.push(item);
    pause();                                  // Live-Änderung hält die Automatik an
    state.blank = false;
    buildDeck();
    renderAll({ reason: 'live-added' });
    // Nach der Messung auf die letzte Seite der Live-Hilfe springen.
    for (var i = state.deck.slides.length - 1; i >= 0; i--) {

    return item;
  }

  function removeLive(id) {
    state.live = state.live.filter(function (item) { return item.id !== id; });
    rebuild({ reason: 'live-removed' });
  }

  function clearLive() {
    state.live = [];
    rebuild({ reason: 'live-cleared' });
  }

  function getLive(id) {

  }

  /* --- Zugriff --------------------------------------------------------------- */

  function getState() { return state; }
  function getDeck() { return state.deck; }
  function currentSlide() { return state.deck ? state.deck.slides[state.index] || null : null; }

  function summary() {

    return deckLib.sectionSummary(state.deck);
  }

  output.onChange(function (reason) {
    if (!state.active) return;
    if (reason === 'resize' || reason === 'window-opened' || reason === 'overlay-opened' || reason === 'fullscreen') {
      renderAll({ reason: reason });
    } else if (reason === 'window-closed' || reason === 'overlay-closed') {

    getState: getState,
    getDeck: getDeck,
    currentSlide: currentSlide,
    summary: summary,
    totalSlides: totalSlides,
    start: start,
    stop: stop,
    rebuild: rebuild,

    next: next,
    prev: prev,
    goTo: goTo,
    goToSection: goToSection,
    setLevel: setLevel,
    toggleField: toggleField,
    setField: setField,
    toggleFocus: toggleFocus,
    setScale: setScale,
    setTheme: setTheme,
    toggleBlank: toggleBlank,
    toggleCopyMode: toggleCopyMode,
    play: play,
    pause: pause,
    toggleAuto: toggleAuto,
    setSeconds: setSeconds,
    addLive: addLive,
    removeLive: removeLive,

    leadingSurface: leadingSurface

/* js/projection/board.js */
/* ==========================================================================
   Tafel – die einfache Grundform der Projektion
   Eine Fläche, auf der Elemente frei stehen. Ein Element ist ein Eintrag des
   Bestands; ob dahinter ein einzelnes Wort oder ein ganzer Satzanfang steht,
   spielt für die Bedienung keine Rolle.

   Alles, was hier geschieht, geschieht auf jeder Ausgabefläche gleichzeitig:
   in der Vorschau der Lehreransicht, in der Vollbild-Überlagerung und im
   eigenen Beamerfenster. Verschieben und Anlegen funktionieren auf allen
   dreien – auch direkt auf dem Beamerbild.
   ========================================================================== */
(function (BAO) {

  var util = BAO.util;
  var ui = BAO.ui;
  var output = BAO.output;
  var select = BAO.select;
  var schema = BAO.schema;

  var MIN_SCALE = 0.6;
  var MAX_SCALE = 2.2;
  var NUDGE = 0.012;              // Pfeiltaste: knapp über einem Prozent

  var BOARD_HINT = [
    ['Doppelklick', 'Element anlegen'],
    ['Ziehen', 'verschieben'],
    ['F', 'Vollbild'],
    ['B', 'Bildschirm leeren']
  ];

  var state = {
    active: false,
    boardId: '',
    selectedId: '',
    theme: 'light',
    scale: 1,
    blank: false
  };

  var listeners = [];
  var drag = null;                // { itemId, node, grabX, grabY, box, moved }
  var composer = null;            // { surface, node, input, itemId, x, y, closing }
  var keysBound = false;

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  function emit(reason) {
    listeners.forEach(function (fn) {
      try { fn(state, reason); } catch (err) { console.error('Fehler im Tafelbeobachter:', err); }
    });
  }

  /* --- Zugriff auf den Bestand --------------------------------------------- */

  function currentBoard(source) {
    var store = source || BAO.store.getState();
    if (!store || !state.boardId) return null;
    return select.board(store, state.boardId);
  }

  function entries(board) {
    return board ? select.boardEntries(BAO.store.getState(), board) : [];
  }

  function itemOf(board, itemId) {
    if (!board) return null;
    return (board.items || []).filter(function (item) { return item.id === itemId; })[0] || null;
  }

  /* --- Aufbau eines Elements ------------------------------------------------ */

  function cardNode(doc, entry, board) {
    var node = doc.createElement('div');
    node.className = 'bcard';
    node.dataset.itemId = entry.item.id;
    node.dataset.selected = entry.item.id === state.selectedId ? 'true' : 'false';
    node.tabIndex = 0;
    node.setAttribute('role', 'button');
    node.setAttribute('aria-label', entry.text + ' – ziehen zum Verschieben');
    node.style.left = (entry.item.x * 100) + '%';
    node.style.top = (entry.item.y * 100) + '%';
    node.style.setProperty('--card-scale', entry.item.scale || 1);

    var text = doc.createElement('div');
    text.className = 'bcard__text';
    // Ein vorhandener Artikel wird farbig nach Genus mitgezeigt – aber nur,
    // wenn einer gepflegt ist. Elemente ohne weitere Angaben bleiben schlicht.
    if (board.showArticle && entry.kind === 'lex') {
      var article = ui.articleNode(entry.ref, doc);
      if (article) {
        text.appendChild(article);
        var written = article.textContent;
        if (written.charAt(written.length - 1) !== '’') text.appendChild(doc.createTextNode(' '));
      }
    }
    text.appendChild(ui.gapText(entry.text, doc));
    node.appendChild(text);

    if (board.showTranslation && entry.ref.translation) {
      var translation = doc.createElement('div');
      translation.className = 'bcard__de';
      translation.textContent = entry.ref.translation;
      node.appendChild(translation);
    }
    return node;
  }

  /**
   * Holt ein Element vollständig in die Fläche zurück.
   * Gespeichert ist die Mitte als Anteil der Fläche; wie breit ein Element
   * dabei tatsächlich wird, hängt von Text und Auflösung ab. Deshalb wird die
   * Anzeige nach dem Messen nachjustiert – der gespeicherte Wert bleibt.
   */
  function fitIntoSurface(body) {
    var width = body.clientWidth;
    var height = body.clientHeight;
    if (!width || !height) return;
    util.$$('.bcard', body).forEach(function (node) {
      var halfX = (node.offsetWidth / 2) / width;
      var halfY = (node.offsetHeight / 2) / height;
      var x = parseFloat(node.style.left) / 100;
      var y = parseFloat(node.style.top) / 100;
      if (halfX < 0.5) node.style.left = (util.clamp(x, halfX, 1 - halfX) * 100) + '%';
      if (halfY < 0.5) node.style.top = (util.clamp(y, halfY, 1 - halfY) * 100) + '%';
    });
  }

  /* --- Zeichnen ------------------------------------------------------------- */

  /** Grundeinheit der Schriftgröße aus der tatsächlichen Flächengröße. */
  function applyUnit(surface) {
    var root = surface.stage.root;
    var width = root.clientWidth || 960;
    var height = root.clientHeight || 540;
    var unit = Math.min(width * 0.0105, height * 0.0185);
    root.style.setProperty('--u', Math.max(unit, 2) + 'px');
  }

  function renderSurface(surface, board, store) {
    var stage = surface.stage;
    var doc = stage.doc;

    stage.root.dataset.stageTheme = state.theme;
    stage.root.dataset.blank = state.blank ? 'true' : 'false';
    stage.root.dataset.focus = 'false';
    stage.root.setAttribute('data-blank-hint', 'Bildschirm geleert – Taste B zeigt die Tafel wieder');
    stage.root.style.setProperty('--user-scale', state.scale);

    var subject = board ? select.subject(store, board.subjectId) : null;
    var group = board ? select.group(store, board.groupId) : null;

    util.clear(stage.crumb);
    if (subject) {
      var strong = doc.createElement('b');
      strong.textContent = subject.name;
      stage.crumb.appendChild(strong);
      if (group) stage.crumb.appendChild(doc.createTextNode(' · ' + group.name));
    }
    stage.title.textContent = board ? board.title : 'Tafel';

    var list = board ? entries(board) : [];
    stage.pos.textContent = list.length
      ? list.length + ' ' + util.plural(list.length, 'Element', 'Elemente')
      : '';
    stage.foot.dataset.hidden = 'true';

    util.clear(stage.body);
    stage.body.dataset.layout = 'board';
    stage.body.style.removeProperty('--cols');

    if (!list.length) {
      var empty = doc.createElement('div');
      empty.className = 'stage__empty';
      empty.textContent = 'Doppelklick auf die Fläche legt ein Element an.';
      stage.body.appendChild(empty);
    } else {
      list.forEach(function (entry) { stage.body.appendChild(cardNode(doc, entry, board)); });
      fitIntoSurface(stage.body);
    }

    bindSurface(surface);
  }

  function renderAll(reason) {
    var store = BAO.store.getState();
    var board = currentBoard(store);
    var surfaces = output.surfaces();
    surfaces.forEach(function (surface) {
      applyUnit(surface);
      renderSurface(surface, board, store);
    });
    restoreFocus();
    emit(reason || 'render');
  }

  /** Nach einem Neuaufbau steht die Auswahl wieder unter der Tastatur. */
  var focusWanted = false;
  function restoreFocus() {
    if (!focusWanted || !state.selectedId) return;
    focusWanted = false;
    var surfaces = output.surfaces();
    for (var i = 0; i < surfaces.length; i++) {
      var node = cardIn(surfaces[i], state.selectedId);
      if (node) { try { node.focus({ preventScroll: true }); } catch (err) { node.focus(); } return; }
    }
  }

  function cardIn(surface, itemId) {
    return surface.stage.body.querySelector('.bcard[data-item-id="' + itemId + '"]');
  }

  function eachCard(itemId, fn) {
    output.surfaces().forEach(function (surface) {
      var node = cardIn(surface, itemId);
      if (node) fn(node, surface);
    });
  }

  /* --- Auswahl -------------------------------------------------------------- */

  function select_(itemId) {
    state.selectedId = itemId || '';
    output.surfaces().forEach(function (surface) {
      util.$$('.bcard', surface.stage.body).forEach(function (node) {
        node.dataset.selected = node.dataset.itemId === state.selectedId ? 'true' : 'false';
      });
    });
    emit('select');
  }

  /* --- Verschieben ---------------------------------------------------------- */

  function beginDrag(event, node, surface) {
    if (event.button !== undefined && event.button !== 0) return;
    var body = surface.stage.body;
    var box = body.getBoundingClientRect();
    var rect = node.getBoundingClientRect();
    drag = {
      itemId: node.dataset.itemId,
      // Abstand vom Mittelpunkt: Das Element springt beim Anfassen nicht.
      grabX: event.clientX - (rect.left + rect.width / 2),
      grabY: event.clientY - (rect.top + rect.height / 2),
      halfX: (rect.width / 2) / box.width,
      halfY: (rect.height / 2) / box.height,
      box: box,
      moved: false
    };
    select_(drag.itemId);
    eachCard(drag.itemId, function (twin) { twin.dataset.dragging = 'true'; });
    try { node.setPointerCapture(event.pointerId); } catch (err) { /* ältere Browser */ }
    event.preventDefault();
  }

  function moveDrag(event) {
    if (!drag) return;
    var x = (event.clientX - drag.grabX - drag.box.left) / drag.box.width;
    var y = (event.clientY - drag.grabY - drag.box.top) / drag.box.height;
    drag.x = util.clamp(x, Math.min(drag.halfX, 0.5), Math.max(1 - drag.halfX, 0.5));
    drag.y = util.clamp(y, Math.min(drag.halfY, 0.5), Math.max(1 - drag.halfY, 0.5));
    drag.moved = true;
    // Während des Ziehens folgen alle Flächen sofort – ohne Umweg über den
    // Bestand, damit das Bild auf dem Beamer nicht ruckelt.
    eachCard(drag.itemId, function (twin) {
      twin.style.left = (drag.x * 100) + '%';
      twin.style.top = (drag.y * 100) + '%';
    });
  }

  function endDrag() {
    if (!drag) return;
    var finished = drag;
    drag = null;
    eachCard(finished.itemId, function (twin) { delete twin.dataset.dragging; });
    if (!finished.moved || finished.x === undefined) return;
    moveItem(finished.itemId, finished.x, finished.y);
  }

  function moveItem(itemId, x, y) {
    return BAO.store.commit('Element verschoben', function (draft) {
      var board = select.board(draft, state.boardId);
      var item = itemOf(board, itemId);
      if (!item) return false;
      item.x = util.clamp(x, 0, 1);
      item.y = util.clamp(y, 0, 1);
      board.updatedAt = util.nowISO();
    });
  }

  /* --- Eingabe unmittelbar auf der Fläche ------------------------------------ */

  function closeComposer(commitText) {
    if (!composer || composer.closing) return;
    composer.closing = true;
    var text = composer.input.value;
    var target = composer;
    if (target.node.parentNode) target.node.parentNode.removeChild(target.node);
    composer = null;
    if (commitText && text.trim()) {
      if (target.itemId) setText(target.itemId, text.trim());
      else addAt(text, target.x, target.y);
    } else if (!commitText) {
      emit('composer-cancelled');
    }
  }

  /**
   * Öffnet ein Eingabefeld mitten auf der Fläche – auch im Beamerfenster.
   * options: { x, y } für ein neues Element, { itemId } zum Ändern.
   */
  function openComposer(surface, options) {
    closeComposer(false);
    if (!state.active) return null;
    var doc = surface.stage.doc;
    var board = currentBoard();
    if (!board) return null;

    var x = options.x;
    var y = options.y;
    var value = '';
    if (options.itemId) {
      var entry = select.resolveBoardItem(BAO.store.getState(), itemOf(board, options.itemId));
      if (!entry) return null;
      x = entry.item.x;
      y = entry.item.y;
      value = entry.text;
    }

    var input = doc.createElement('input');
    input.type = 'text';
    input.className = 'bcomposer__input';
    input.value = value;
    input.setAttribute('aria-label', options.itemId ? 'Element ändern' : 'Neues Element');
    input.placeholder = options.itemId ? '' : 'Wort oder Satz …';

    var node = doc.createElement('div');
    node.className = 'bcomposer';
    node.style.left = (x * 100) + '%';
    node.style.top = (y * 100) + '%';
    node.appendChild(input);

    var hint = doc.createElement('div');
    hint.className = 'bcomposer__hint';
    hint.textContent = 'Enter übernimmt · Esc bricht ab';
    node.appendChild(hint);

    surface.stage.body.appendChild(node);
    composer = { surface: surface, node: node, input: input, itemId: options.itemId || '', x: x, y: y, closing: false };

    input.addEventListener('keydown', function (event) {
      // Die Tastatur gehört jetzt dem Eingabefeld – nicht der Projektion.
      event.stopPropagation();
      if (event.key === 'Enter') { event.preventDefault(); closeComposer(true); }
      else if (event.key === 'Escape') { event.preventDefault(); closeComposer(false); }
    });
    input.addEventListener('blur', function () { closeComposer(true); });
    input.addEventListener('paste', function (event) {
      var text = event.clipboardData ? event.clipboardData.getData('text') : '';
      if (!/[\r\n]/.test(text)) return;
      // Mehrere Zeilen auf einmal: jede Zeile wird ein eigenes Element.
      event.preventDefault();
      var target = composer;
      closeComposer(false);
      addAt(text, target.x, target.y);
    });

    try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    input.select();
    emit('composer-opened');
    return composer;
  }

  function isComposing() { return !!composer; }

  /* --- Elemente anlegen, ändern, entfernen ----------------------------------- */

  /**
   * Legt aus einem oder mehreren Textzeilen Elemente an.
   * Jedes Element ist ein gewöhnlicher Eintrag des Bestands und lässt sich
   * später um Artikel, Übersetzung, Beispiel und alles Weitere ergänzen.
   */
  function addAt(text, x, y) {
    var lines = String(text || '').split(/\r?\n/).map(function (line) { return line.trim(); })
      .filter(Boolean);
    if (!lines.length) return null;

    var created = [];
    var ok = BAO.store.commit(lines.length > 1 ? lines.length + ' Elemente angelegt' : 'Element angelegt', function (draft) {
      var board = select.board(draft, state.boardId);
      if (!board) return false;
      var group = select.group(draft, board.groupId);
      var unit = board.unitId ? select.unit(draft, board.unitId) : select.currentUnit(draft, board.groupId);
      lines.forEach(function (line, index) {
        var lexeme = schema.makeLexeme({
          subjectId: board.subjectId,
          groupId: board.groupId,
          term: line,
          status: 'new',
          introducedUnitId: unit ? unit.id : '',
          introducedSchoolYear: group ? group.schoolYear : ''
        });
        draft.lexemes.push(lexeme);
        var item = schema.makeBoardItem({
          kind: 'lex',
          refId: lexeme.id,
          // Mehrere Zeilen legen sich versetzt ab, statt sich zu verdecken.
          x: util.clamp(x + index * 0.035, 0.05, 0.95),
          y: util.clamp(y + index * 0.075, 0.06, 0.94)
        });
        board.items.push(item);
        created.push(item.id);
      });
      board.updatedAt = util.nowISO();
    });
    if (!ok) return null;
    select_(created[created.length - 1] || '');
    emit('added');
    return created;
  }

  /** Legt ein Element an einer noch freien Stelle der Fläche an. */
  function add(text) {
    var spot = freeSpot();
    return addAt(text, spot.x, spot.y);
  }

  /** Setzt einen vorhandenen Eintrag des Bestands auf die Tafel. */
  function place(kind, refId, position) {
    var spot = position || freeSpot();
    var newId = null;
    var ok = BAO.store.commit('Element auf die Tafel gelegt', function (draft) {
      var board = select.board(draft, state.boardId);
      if (!board) return false;
      var ref = kind === 'starter' ? select.starter(draft, refId) : select.lexeme(draft, refId);
      // Eine Tafel gehört einer Lerngruppe. Ein Eintrag aus einer anderen
      // Sprache käme sonst mitsamt seinem Artikel auf die Fläche.
      if (!select.belongsToBoard(ref, board)) return false;
      var item = schema.makeBoardItem({ kind: kind, refId: refId, x: spot.x, y: spot.y });
      board.items.push(item);
      board.updatedAt = util.nowISO();
      newId = item.id;
    });
    if (!ok) return null;
    select_(newId);
    emit('added');
    return newId;
  }

  function setText(itemId, text) {
    var value = String(text || '').trim();
    if (!value) return false;
    return BAO.store.commit('Element geändert', function (draft) {
      var board = select.board(draft, state.boardId);
      var item = itemOf(board, itemId);
      if (!item) return false;
      var ref = item.kind === 'starter' ? select.starter(draft, item.refId) : select.lexeme(draft, item.refId);
      if (!ref) return false;
      if (item.kind === 'starter') ref.text = value; else ref.term = value;
      ref.updatedAt = util.nowISO();
      board.updatedAt = util.nowISO();
    });
  }

  /** Nimmt ein Element von der Tafel – der Eintrag selbst bleibt im Bestand. */
  function removeItem(itemId) {
    var removed = null;
    var ok = BAO.store.commit('Element von der Tafel genommen', function (draft) {
      var board = select.board(draft, state.boardId);
      if (!board) return false;
      var before = board.items.length;
      board.items = board.items.filter(function (item) {
        if (item.id !== itemId) return true;
        removed = item;
        return false;
      });
      if (board.items.length === before) return false;
      board.updatedAt = util.nowISO();
    });
    if (!ok) return null;
    if (state.selectedId === itemId) state.selectedId = '';
    return removed;
  }

  function setScaleOf(itemId, scale) {
    return BAO.store.commit('Elementgröße geändert', function (draft) {
      var board = select.board(draft, state.boardId);
      var item = itemOf(board, itemId);
      if (!item) return false;
      item.scale = util.clamp(Math.round(scale * 20) / 20, MIN_SCALE, MAX_SCALE);
      board.updatedAt = util.nowISO();
    });
  }

  /* --- Freie Stelle und Ordnen ---------------------------------------------- */

  /** Sucht die Stelle mit dem größten Abstand zu allem, was schon dasteht. */
  function freeSpot() {
    var board = currentBoard();
    var placed = board ? (board.items || []) : [];
    if (!placed.length) return { x: 0.5, y: 0.45 };
    var best = { x: 0.5, y: 0.5 };
    var bestDistance = -1;
    for (var col = 0; col < 6; col++) {
      for (var row = 0; row < 4; row++) {
        var x = 0.14 + col * 0.144;
        var y = 0.16 + row * 0.226;
        var nearest = Infinity;
        placed.forEach(function (item) {
          var dx = item.x - x;
          var dy = (item.y - y) * 0.6;      // waagerecht ist mehr Platz
          nearest = Math.min(nearest, dx * dx + dy * dy);
        });
        if (nearest > bestDistance) { bestDistance = nearest; best = { x: x, y: y }; }
      }
    }
    return best;
  }

  /** Verteilt alle Elemente gleichmäßig – der Weg zurück aus dem Durcheinander. */
  function arrange() {
    return BAO.store.commit('Tafel geordnet', function (draft) {
      var board = select.board(draft, state.boardId);
      if (!board || !board.items.length) return false;
      var count = board.items.length;
      var cols = Math.max(1, Math.min(5, Math.ceil(Math.sqrt(count * 1.6))));
      var rows = Math.ceil(count / cols);
      board.items.forEach(function (item, index) {
        var col = index % cols;
        var row = Math.floor(index / cols);
        item.x = (col + 0.5) / cols;
        item.y = (row + 0.5) / rows;
      });
      board.updatedAt = util.nowISO();
    });
  }

  /* --- Ereignisse einer Ausgabefläche ---------------------------------------- */

  function positionInBody(event, body) {
    var box = body.getBoundingClientRect();
    return {
      x: util.clamp((event.clientX - box.left) / box.width, 0.06, 0.94),
      y: util.clamp((event.clientY - box.top) / box.height, 0.08, 0.92)
    };
  }

  function bindSurface(surface) {
    var stage = surface.stage;
    if (stage.__boardBound) return;
    stage.__boardBound = true;
    var body = stage.body;

    body.addEventListener('pointerdown', function (event) {
      if (!state.active || !event.target.closest) return;
      if (event.target.closest('.bcomposer')) return;
      var card = event.target.closest('.bcard');
      var itemId = card ? card.dataset.itemId : '';
      // Eine offene Eingabe wird zuerst übernommen – das kann die Fläche neu
      // aufbauen, deshalb wird das angefasste Element danach neu gesucht.
      if (composer) closeComposer(true);
      if (itemId) { beginDrag(event, cardIn(surface, itemId) || card, surface); return; }
      select_('');
    });
    body.addEventListener('pointermove', function (event) {
      if (state.active) moveDrag(event);
    });
    body.addEventListener('pointerup', function () { if (state.active) endDrag(); });
    body.addEventListener('pointercancel', function () { if (state.active) endDrag(); });

    body.addEventListener('dblclick', function (event) {
      if (!state.active) return;
      var card = event.target.closest ? event.target.closest('.bcard') : null;
      event.preventDefault();
      if (card) { openComposer(surface, { itemId: card.dataset.itemId }); return; }
      if (event.target.closest && event.target.closest('.bcomposer')) return;
      var spot = positionInBody(event, body);
      openComposer(surface, spot);
    });
  }

  /* --- Tastatur -------------------------------------------------------------- */

  function isTyping(event) {
    var target = event.target;
    if (!target) return false;
    var tag = (target.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;
  }

  function surfaceFor(source) {
    if (source === 'window') return output.getSurface('window');
    return output.getSurface('overlay') || output.getSurface('preview');
  }

  function handleKey(event, source) {
    if (!state.active || composer) return;
    if (source !== 'window') {
      var route = BAO.app.currentRoute();
      if (route.path !== 'tafel' && !output.isOverlayOpen()) return;
      if (isTyping(event)) return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      var modalRoot = document.getElementById('modal-root');
      if (modalRoot && modalRoot.firstChild) return;
    }

    var step = event.shiftKey ? NUDGE * 4 : NUDGE;
    var board = currentBoard();
    var selected = itemOf(board, state.selectedId);
    var handled = true;

    switch (event.key) {
      case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown':
        if (!selected) { handled = false; break; }
        focusWanted = true;
        moveItem(selected.id,
          selected.x + (event.key === 'ArrowLeft' ? -step : event.key === 'ArrowRight' ? step : 0),
          selected.y + (event.key === 'ArrowUp' ? -step : event.key === 'ArrowDown' ? step : 0));
        break;
      case 'Delete': case 'Backspace':
        if (!selected) { handled = false; break; }
        removeItem(selected.id);
        break;
      case 'Enter': case 'F2':
        if (!selected) { handled = false; break; }
        openComposer(surfaceFor(source), { itemId: selected.id });
        break;
      case '+':
        if (!selected) { handled = false; break; }
        focusWanted = true;
        setScaleOf(selected.id, (selected.scale || 1) + 0.1);
        break;
      case '-':
        if (!selected) { handled = false; break; }
        focusWanted = true;
        setScaleOf(selected.id, (selected.scale || 1) - 0.1);
        break;
      case 'b': case 'B': toggleBlank(); break;
      case 'f': case 'F':
        if (source === 'window') output.requestWindowFullscreen();
        else if (output.isOverlayOpen()) output.toggleOverlayFullscreen();
        else output.openOverlay();
        break;
      case 'Escape':
        if (state.selectedId) { select_(''); break; }
        if (source === 'window') { handled = false; break; }
        if (output.isOverlayOpen()) output.closeOverlay(); else handled = false;
        break;
      default:
        // Einfach lostippen: Ein druckbares Zeichen öffnet die Eingabe.
        if (event.key.length === 1 && event.key !== ' '
          && !event.ctrlKey && !event.metaKey && !event.altKey) {
          var surface = surfaceFor(source);
          if (!surface) { handled = false; break; }
          var made = openComposer(surface, freeSpot());
          if (made) made.input.value = event.key;
          else handled = false;
        } else {
          handled = false;
        }
    }
    if (handled) event.preventDefault();
  }

  function bindKeys() {
    if (keysBound) return;
    keysBound = true;
    document.addEventListener('keydown', function (event) { handleKey(event, 'document'); });
    output.onKey(handleKey);
  }

  /* --- Darstellung ----------------------------------------------------------- */

  function setTheme(theme) {

    BAO.store.commit('Darstellung der Projektion', function (draft) {

    renderAll('theme');

  function setScale(scale) {

    BAO.store.commit('Schriftgröße der Projektion', function (draft) {
      draft.settings.stageScale = state.scale;

  function setOption(key, value) {
    return BAO.store.commit('Tafel-Einstellung geändert', function (draft) {

/* js/companion/protocol.js */
/* ==========================================================================
   Companion-Protokoll
   Das gemeinsame Nachrichtenformat zwischen Boîte à Oublis und dem Teacher
   Soundboard. Bewusst winzig, versioniert und ohne jede Fremdbibliothek.

   Grundsatz: Es gibt eine feste Liste erlaubter Befehle. Alles andere wird
   verworfen – kein freies JavaScript, kein Dateizugriff, keine Umwege. Jede
   eingehende Nachricht wird auf Protokollnamen, Version, Typ und Inhalt
   geprüft, bevor sie überhaupt betrachtet wird.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var PROTOCOL = 'bao-companion';
  var VERSION = 1;

  // Dieselbe Liste steht im Teacher Soundboard. Der erste erreichbare Port
  // gewinnt; mehr als diese drei werden nie probiert.
  var PORTS = [8317, 8318, 8319];

  var MAX_BYTES = 64 * 1024;

  var SERVER_TYPES = { welcome: true, pending: true, denied: true, command: true, ping: true };

  /* --- Prüfung einzelner Werte --------------------------------------------- */

  function text(value, limit) {
    if (typeof value === 'number' && isFinite(value)) value = String(value);
    if (typeof value !== 'string') return '';
    return value.replace(/[\r\n]+/g, ' ').trim().slice(0, limit || 300);
  }

  function level(value) {
    var parsed = typeof value === 'number' ? value : parseInt(value, 10);
    return (parsed === 1 || parsed === 2 || parsed === 3) ? parsed : 0;
  }

  /* --- Erlaubte Befehle ------------------------------------------------------
     Jeder Eintrag liefert entweder geprüfte Parameter oder null. null heißt:
     Der Befehl wird nicht ausgeführt. */
  var COMMANDS = {
    'page.next': function () { return {}; },
    'page.prev': function () { return {}; },
    'level.set': function (args) {
      var value = level(args.level);
      return value ? { level: value } : null;
    },
    'blank.toggle': function () { return {}; },
    'blank.set': function (args) { return { blank: !!args.blank }; },
    'live.add': function (args) {
      var value = text(args.text, 240);
      if (!value) return null;
      return {
        text: value,
        translation: text(args.translation, 240),
        kind: args.kind === 'starter' ? 'starter' : 'word'
      };
    },
    'session.stop': function () { return {}; },
    'output.open': function () { return {}; },
    'library.list': function () { return {}; },
    'preset.start': function (args) {
      var id = text(args.id, 120);
      if (!id) return null;
      var payload = { id: id, kind: args.kind === 'board' ? 'board' : 'bank' };
      var wanted = level(args.level);
      if (wanted) payload.level = wanted;
      return payload;
    },
    'status.request': function () { return {}; }
  };

  /* --- Nachrichten ----------------------------------------------------------- */

  function build(type, fields) {
    var message = { protocol: PROTOCOL, v: VERSION, type: type };
    Object.keys(fields || {}).forEach(function (key) {
      if (fields[key] !== undefined && fields[key] !== null) message[key] = fields[key];
    });
    return JSON.stringify(message);
  }

  /**
   * Prüft eine Nachricht der Gegenstelle.
   * Gibt null zurück, sobald irgendetwas nicht stimmt: kaputtes JSON, fremdes
   * Protokoll, andere Version, unbekannter Typ, zu groß.
   */
  function parse(raw) {
    if (typeof raw !== 'string' || !raw || raw.length > MAX_BYTES) return null;
    var data;
    try { data = JSON.parse(raw); } catch (err) { return null; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
    if (data.protocol !== PROTOCOL) return null;
    if (data.v !== VERSION) return null;
    if (typeof data.type !== 'string' || !SERVER_TYPES[data.type]) return null;
    return data;
  }

  /** Geprüfte Parameter eines Befehls oder null. */
  function commandArgs(name, args) {
    if (typeof name !== 'string' || !Object.prototype.hasOwnProperty.call(COMMANDS, name)) return null;
    return COMMANDS[name](args && typeof args === 'object' ? args : {});
  }

  function isCommand(name) {
    return typeof name === 'string' && Object.prototype.hasOwnProperty.call(COMMANDS, name);
  }

  BAO.companionProtocol = {
    PROTOCOL: PROTOCOL,
    VERSION: VERSION,
    PORTS: PORTS,
    MAX_BYTES: MAX_BYTES,
    COMMAND_NAMES: Object.keys(COMMANDS),
    build: build,
    parse: parse,
    commandArgs: commandArgs,
    isCommand: isCommand,
    text: text,
    level: level
  };
})(window.BAO = window.BAO || {});
