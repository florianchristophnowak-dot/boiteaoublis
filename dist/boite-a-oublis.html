  <script>
/* js/views/dashboard.js */
/* ==========================================================================
   Startansicht
   Der schnellste Weg in den Unterricht: zuletzt verwendete Wortbanken,
   Favoriten, der Bestand der aktuellen Lerngruppe und die wichtigsten
   Sofortaktionen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var select = BAO.select;

  function greeting() {
    var hour = new Date().getHours();
    if (hour < 11) return 'Guten Morgen';
    if (hour < 17) return 'Guten Tag';
    return 'Guten Abend';
  }

  function bankTile(state, bank, app) {
    var group = select.group(state, bank.groupId);
    var subject = select.subject(state, bank.subjectId);
    var count = select.bankItemCount(bank);

    return h('div.tile', {
      style: ui.subjectVars(subject),
      onclick: function () { app.go('wortbank/' + bank.id); }
    },
      h('span.tile__accent'),
      h('div.tile__top', {},
        h('span.tile__title', { text: bank.title }),
        h('span.spacer'),
        ui.favButton(bank.favorite, function () {
          BAO.store.commit('Favorit geändert', function (draft) {
            var target = select.bank(draft, bank.id);
            if (target) target.favorite = !target.favorite;
          });
        })
      ),
      h('div.tile__meta', {
        text: [bank.scene, group ? group.name : '', count + ' ' + util.plural(count, 'Eintrag', 'Einträge')]
          .filter(Boolean).join(' · ')
      }),
      bank.lastUsedAt ? h('div.tile__meta', { text: 'zuletzt: ' + util.relativeDate(bank.lastUsedAt) }) : null,
      h('div.tile__foot', {},
        h('button.btn.btn--primary.btn--sm', {
          type: 'button',
          onclick: function (event) { event.stopPropagation(); app.projectBank(bank.id); }
        }, ui.icon('play', 15), 'Projizieren'),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Bearbeiten',
          onclick: function (event) { event.stopPropagation(); app.go('wortbank/' + bank.id); }
        })
      )
    );
  }

  function statBlock(label, value, hint) {
    return h('div.stat', { title: hint || '' },
      h('span.stat__value', { text: String(value) }),
      h('span.stat__label', { text: label })
    );
  }

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var view = h('div.view.dash');

    if (!state.subjects.length) {
      view.appendChild(ui.emptyState({
        title: 'Willkommen bei Boîte à Oublis',
        text: 'Lege zuerst ein Fach und eine Lerngruppe an. Danach kannst du Wortschatz sammeln, '
          + 'Wortbanken zusammenstellen und sie über den Beamer einblenden.',
        actionLabel: 'Fach und Lerngruppe anlegen',
        onAction: function () { app.go('verwaltung'); }
      }));
      host.appendChild(view);
      return;
    }

    var counts = ctx.group ? select.statusCounts(state, ctx.group.id) : { total: 0, new: 0, active: 0, revisit: 0, core: 0 };
    var banks = ctx.group ? select.banksOfGroup(state, ctx.group.id) : [];
    var starters = ctx.group && ctx.subject ? select.startersOfGroup(state, ctx.group.id, ctx.subject.id) : [];
    var recents = select.recentBanks(state, 6);
    var favourites = select.favouriteBanks(state);

    /* --- Kopfbereich ---------------------------------------------------- */
    var hero = h('div.dash__hero', { style: ui.subjectVars(ctx.subject) },
      h('div', { style: { flex: '1 1 340px', 'min-width': '0' } },
        h('h1', { text: greeting() + '.' }),
        h('p', {
          text: ctx.group
            ? 'Aktuell geöffnet: ' + ctx.subject.name + ' · ' + ctx.group.name + ' (Jahrgang ' + ctx.group.grade
              + ', ' + ctx.group.schoolYear + ')' + (ctx.unit ? ' – Reihe „' + ctx.unit.title + '“.' : '.')
            : 'Für dieses Fach ist noch keine Lerngruppe angelegt.'
        }),
        h('div.dash__heroActions', {},
          recents[0]
            ? h('button.btn.btn--primary', {
              type: 'button',
              onclick: function () { app.projectBank(recents[0].id); }
            }, ui.icon('play', 16), 'Weiter mit „' + recents[0].title + '“')
            : h('button.btn.btn--primary', {
              type: 'button', text: 'Erste Wortbank anlegen',
              onclick: function () { app.go('wortbanken'); }
            }),
          h('button.btn', {
            type: 'button', onclick: function () { app.openLiveHelp(); }
          }, ui.icon('plus', 16), 'Live-Hilfe'),
          h('button.btn', {
            type: 'button',
            title: 'Beamerfenster öffnen oder schließen (Strg + B)',
            onclick: function () {
              if (BAO.output.isWindowOpen()) {
                BAO.output.closeWindow();
                BAO.toast.show('Beamerfenster geschlossen.');
              } else {
                var result = BAO.output.openWindow();
                if (!result.ok) {
                  BAO.toast.error('Das Beamerfenster wurde vom Browser blockiert. '
                    + 'Bitte Pop-ups für diese Seite erlauben – oder den Vollbildmodus verwenden.');
                  BAO.output.openOverlay();
                } else {
                  BAO.toast.ok('Beamerfenster geöffnet. Auf den zweiten Bildschirm ziehen und dort F drücken.');
                  if (BAO.session.getState().active) BAO.session.renderAll({ reason: 'window-opened' });
                }
              }
            }
          }, ui.icon('beamer', 16), 'Beamerfenster')
        )
      ),
      h('div.dash__stats', {},
        statBlock('Wortschatz', counts.total, 'Einträge dieser Lerngruppe insgesamt'),
        statBlock('neu', counts.new, 'Einträge mit Status „neu eingeführt“'),
        statBlock('auffrischen', counts.revisit, 'Einträge, die wieder aufgegriffen werden sollen'),
        statBlock('Grundbestand', counts.core, 'gesicherter Wortschatz'),
        statBlock('Satzanfänge', starters.length),
        statBlock('Wortbanken', banks.length)
      )
    );
    view.appendChild(hero);

    /* --- Zuletzt verwendet ------------------------------------------------ */
    var recentSection = h('section.section', {},
      h('div.section__head', {},
        h('h2', { text: 'Zuletzt verwendet' }),
        h('span.spacer'),
        h('button.btn.btn--ghost.btn--sm', {
          type: 'button', text: 'Alle Wortbanken', onclick: function () { app.go('wortbanken'); }
        })
      )
    );
    if (recents.length) {
      var tiles = h('div.tiles');
      recents.forEach(function (bank) { tiles.appendChild(bankTile(state, bank, app)); });
      recentSection.appendChild(tiles);
    } else {
      recentSection.appendChild(ui.emptyState({
        title: 'Noch keine Wortbank geöffnet',
        text: 'Stelle aus deinem Wortschatz eine Wortbank für eine konkrete Unterrichtsphase zusammen.',
        actionLabel: 'Wortbank anlegen',
        onAction: function () { app.go('wortbanken'); }
      }));
    }
    view.appendChild(recentSection);

    /* --- Favoriten -------------------------------------------------------- */
    if (favourites.length) {
      var favSection = h('section.section', {},
        h('div.section__head', {}, h('h2', { text: 'Favoriten' }),
          h('span.sub', { text: 'für den schnellen Zugriff angeheftet' }))
      );
      var favTiles = h('div.tiles');
      favourites.forEach(function (bank) { favTiles.appendChild(bankTile(state, bank, app)); });
      favSection.appendChild(favTiles);
      view.appendChild(favSection);
    }

    /* --- Lerngruppen ------------------------------------------------------ */
    var groupSection = h('section.section', {},
      h('div.section__head', {},
        h('h2', { text: 'Lerngruppen' }),
        h('span.spacer'),
        h('button.btn.btn--ghost.btn--sm', {
          type: 'button', text: 'Verwalten', onclick: function () { app.go('verwaltung'); }
        })
      )
    );
    var groupTiles = h('div.tiles');
    state.subjects.forEach(function (subject) {
      select.groupsOfSubject(state, subject.id).forEach(function (group) {
        var groupCounts = select.statusCounts(state, group.id);
        var groupBanks = select.banksOfGroup(state, group.id).length;
        groupTiles.appendChild(h('div.tile', {
          style: ui.subjectVars(subject),
          onclick: function () { app.setContext(subject.id, group.id); app.go('wortschatz'); }
        },
          h('span.tile__accent'),
          h('div.tile__top', {},
            h('span.tile__title', { text: group.name }),
            h('span.chip.chip--subject', { style: ui.subjectVars(subject), text: subject.name }),
            h('span.spacer'),
            ui.favButton(group.favorite, function () {
              BAO.store.commit('Favorit geändert', function (draft) {
                var target = select.group(draft, group.id);
                if (target) target.favorite = !target.favorite;
              });
            })
          ),
          h('div.tile__meta', { text: 'Jahrgang ' + group.grade + ' · ' + group.schoolYear }),
          h('div.tile__foot', {},
            h('span.chip', { text: groupCounts.total + ' Wörter' }),
            groupCounts.revisit ? h('span.chip.chip--st-revisit', {}, h('i.dot'), groupCounts.revisit + ' auffrischen') : null,
            h('span.chip', { text: groupBanks + ' ' + util.plural(groupBanks, 'Wortbank', 'Wortbanken') })
          )
        ));
      });
    });
    groupTiles.appendChild(h('button.tile.tile--add', {
      type: 'button', onclick: function () { app.go('verwaltung'); }
    }, ui.icon('plus', 22), h('span', { text: 'Lerngruppe anlegen' })));
    groupSection.appendChild(groupTiles);
    view.appendChild(groupSection);

    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.dashboard = { render: render };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/views/vocab.js */
/* ==========================================================================
   Wortschatz der Lerngruppe
   Der langfristige Bestand: suchen, filtern, ergänzen, Status pflegen und
   Einträge in Wortbanken übernehmen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var filters = { query: '', status: 'all', unitId: 'all', topic: 'all', sort: 'recent' };
  var selection = {};
  var lastGroupId = '';

  function selectedIds() { return Object.keys(selection).filter(function (id) { return selection[id]; }); }
  function clearSelection() { selection = {}; }

  /* --- Formular -------------------------------------------------------------- */

  /**
   * Öffnet den Eintragseditor. Wird auch aus anderen Ansichten verwendet.
   * @param {object|null} lexeme  vorhandener Eintrag oder null für einen neuen
   * @param {object} defaults     Vorgaben (groupId, subjectId, unitId, status)
   */
  function openEditor(lexeme, defaults) {
    var state = BAO.store.getState();
    defaults = defaults || {};
    var isNew = !lexeme;
    var data = lexeme ? util.clone(lexeme) : schema.makeLexeme({
      groupId: defaults.groupId, subjectId: defaults.subjectId,
      introducedUnitId: defaults.unitId || '', status: defaults.status || 'new',
      introducedSchoolYear: defaults.schoolYear || ''
    });

    var fieldTerm = ui.textField({ label: 'Zielwort oder Ausdruck', value: data.term, placeholder: 'le stage' });
    var fieldArticle = ui.textField({ label: 'Artikel / Genus', value: data.article, placeholder: 'le, la, l’ (m.)' });
    var fieldTranslation = ui.textField({ label: 'Deutsch (optional)', value: data.translation, placeholder: 'das Praktikum' });
    var fieldGram = ui.textField({ label: 'Form- oder Pluralhinweis', value: data.gram, placeholder: 'pl. les stages' });
    var fieldCollocation = ui.textField({ label: 'Typische Wortverbindung', value: data.collocation, placeholder: 'faire un stage en entreprise' });
    var fieldChunk = ui.textField({ label: 'Chunk', value: data.chunk, placeholder: 'J’ai fait un stage chez …' });
    var fieldExplanation = ui.textField({ label: 'Erklärung in der Zielsprache', value: data.explanation, full: true, placeholder: 'une période de travail pour découvrir un métier' });
    var fieldExample = ui.textField({ label: 'Beispielsatz', value: data.example, full: true, placeholder: 'J’ai fait un stage dans une boulangerie.' });
    var fieldPronunciation = ui.textField({ label: 'Aussprache / Betonung', value: data.pronunciation, placeholder: '[staʒ]' });
    var fieldCefr = ui.textField({ label: 'Niveau', value: data.cefr, placeholder: 'A2, B1 …' });

    var topics = (data.topics || []).slice();
    var tags = (data.tags || []).slice();
    var fieldTopics = ui.tagEditor(topics, { label: 'Themen / Wortfelder', placeholder: 'le monde du travail', onChange: function (v) { topics = v; } });
    var fieldTags = ui.tagEditor(tags, { label: 'Schlagwörter', placeholder: 'mündlich, Klausur …', onChange: function (v) { tags = v; } });

    var fieldStatus = ui.selectField({ label: 'Status', value: data.status, options: ui.statusOptions() });
    var fieldUnit = ui.selectField({
      label: 'Eingeführt in Reihe', value: data.introducedUnitId,
      options: ui.unitOptions(state, data.groupId)
    });
    var fieldFunction = ui.selectField({
      label: 'Kommunikative Funktion', value: data.functionId,
      options: ui.functionOptions(state, true)
    });

    function collect() {
      return {
        term: fieldTerm.input.value.trim(),
        article: fieldArticle.input.value.trim(),
        translation: fieldTranslation.input.value.trim(),
        gram: fieldGram.input.value.trim(),
        collocation: fieldCollocation.input.value.trim(),
        chunk: fieldChunk.input.value.trim(),
        explanation: fieldExplanation.input.value.trim(),
        example: fieldExample.input.value.trim(),
        pronunciation: fieldPronunciation.input.value.trim(),
        cefr: fieldCefr.input.value.trim(),
        topics: topics,
        tags: tags,
        status: util.$('select', fieldStatus).value,
        introducedUnitId: util.$('select', fieldUnit).value,
        functionId: util.$('select', fieldFunction).value
      };
    }

    function save(values) {
      var unit = values.introducedUnitId ? select.unit(BAO.store.getState(), values.introducedUnitId) : null;
      BAO.store.commit(isNew ? 'Eintrag angelegt' : 'Eintrag bearbeitet', function (draft) {
        if (isNew) {
          draft.lexemes.push(Object.assign(data, values, {
            introducedSchoolYear: unit ? unit.schoolYear : data.introducedSchoolYear,
            updatedAt: util.nowISO()
          }));
        } else {
          var target = select.lexeme(draft, data.id);
          if (!target) return false;
          Object.assign(target, values, { updatedAt: util.nowISO() });
          if (unit) target.introducedSchoolYear = unit.schoolYear;
        }
      });
    }

    var actions = [
      { label: 'Abbrechen', value: null, kind: 'ghost' }
    ];
    if (isNew) {
      actions.push({
        label: 'Speichern und weiter', kind: 'ghost',
        onSelect: function (api) {
          var values = collect();
          if (!values.term) { fieldTerm.input.focus(); return false; }
          save(values);
          BAO.toast.undoable('„' + values.term + '“ gespeichert.');
          // Formular für den nächsten Eintrag leeren, Vorgaben behalten.
          [fieldTerm, fieldArticle, fieldTranslation, fieldGram, fieldCollocation, fieldChunk,
            fieldExplanation, fieldExample, fieldPronunciation].forEach(function (field) { field.input.value = ''; });
          data = schema.makeLexeme({
            groupId: data.groupId, subjectId: data.subjectId,
            introducedUnitId: values.introducedUnitId, status: values.status
          });
          fieldTerm.input.focus();
          return false;
        }
      });
    }
    actions.push({
      label: isNew ? 'Speichern' : 'Änderungen übernehmen', kind: 'primary',
      onSelect: function () {
        var values = collect();
        if (!values.term) { fieldTerm.input.focus(); return false; }
        save(values);
        BAO.toast.undoable(isNew ? '„' + values.term + '“ angelegt.' : 'Eintrag aktualisiert.');
        return true;
      }
    });

    return BAO.modal.open({
      title: isNew ? 'Neuer Wortschatzeintrag' : 'Eintrag bearbeiten',
      subtitle: 'Pflichtfeld ist nur das Zielwort. Alles andere ist optional – und wird nur projiziert, wenn es gebraucht wird.',
      width: '720px',
      initialFocus: 'input',
      body: h('div.stack', {},
        h('div.grid2.entry-form', {}, fieldTerm, fieldArticle, fieldTranslation, fieldGram,
          fieldCollocation, fieldChunk, fieldExplanation, fieldExample),
        h('details.form-more', { open: isNew ? null : true },
          h('summary', { text: 'Weitere Angaben: Aussprache, Themen, Status, Reihe' }),
          h('div.grid2.entry-form', {}, fieldPronunciation, fieldCefr, fieldFunction, fieldStatus,
            fieldUnit, h('div'), fieldTopics, fieldTags)
        )
      ),
      actions: actions
    });
  }

  /* --- Schnelleingabe mehrerer Zeilen ---------------------------------------- */

  function openQuickAdd(groupId, subjectId, unitId) {
    var state = BAO.store.getState();
    var area = h('textarea', {
      rows: 9,
      placeholder: 'Eine Zeile je Eintrag, zum Beispiel:\n'
        + 'le stage = das Praktikum\n'
        + 'l’entreprise – das Unternehmen\n'
        + 'postuler; sich bewerben; postuler pour un poste'
    });
    var preview = h('div.import-preview');
    var fieldStatus = ui.selectField({ label: 'Status für alle', value: 'new', options: ui.statusOptions() });
    var fieldUnit = ui.selectField({ label: 'Reihe', value: unitId || '', options: ui.unitOptions(state, groupId) });

    function parsed() { return BAO.csv.parseQuickLines(area.value); }

    function refresh() {
      var rows = parsed();
      util.clear(preview);
      if (!rows.length) {
        preview.appendChild(h('span.hint', { text: 'Noch nichts erkannt.' }));
        return;
      }
      preview.appendChild(h('strong', { text: rows.length + ' ' + util.plural(rows.length, 'Eintrag', 'Einträge') + ' erkannt:' }));
      rows.slice(0, 6).forEach(function (row) {
        preview.appendChild(h('div.diffline', {},
          h('span.diffline__val', { text: row.term }),
          h('span.diffline__label', { text: row.translation || '—' }),
          row.collocation ? h('span.lex__chunk', { text: row.collocation }) : null
        ));
      });
      if (rows.length > 6) preview.appendChild(h('span.hint', { text: '… und ' + (rows.length - 6) + ' weitere.' }));
    }

    area.addEventListener('input', refresh);
    refresh();

    return BAO.modal.open({
      title: 'Mehrere Einträge einfügen',
      subtitle: 'Trennzeichen: „=“, „–“, „-“, Semikolon oder Tabulator. Ideal zum Einfügen aus einer Liste.',
      width: '640px',
      body: h('div.stack', {},
        h('div.field', {}, h('label', { text: 'Zeilen' }), area),
        h('div.grid2', {}, fieldStatus, fieldUnit),
        preview
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Einträge anlegen', kind: 'primary',
          onSelect: function () {
            var rows = parsed();
            if (!rows.length) return false;
            var status = util.$('select', fieldStatus).value;
            var selectedUnit = util.$('select', fieldUnit).value;
            var unit = selectedUnit ? select.unit(BAO.store.getState(), selectedUnit) : null;
            BAO.store.commit(rows.length + ' Einträge angelegt', function (draft) {
              rows.forEach(function (row) {
                draft.lexemes.push(schema.makeLexeme({
                  groupId: groupId, subjectId: subjectId,
                  term: row.term, translation: row.translation, collocation: row.collocation,
                  status: status, introducedUnitId: selectedUnit,
                  introducedSchoolYear: unit ? unit.schoolYear : ''
                }));
              });
            });
            BAO.toast.undoable(rows.length + ' Einträge angelegt.');
            return true;
          }
        }
      ]
    });
  }

  /* --- In eine Wortbank übernehmen -------------------------------------------- */

  function openAddToBank(ids, kind, groupId, subjectId) {
    var state = BAO.store.getState();
    var banks = select.banksOfGroup(state, groupId);
    var bankSelect = ui.selectField({
      label: 'Wortbank',
      value: banks.length ? banks[0].id : '__new',
      options: banks.map(function (b) { return { value: b.id, label: b.title + ' (' + b.scene + ')' }; })
        .concat([{ value: '__new', label: '+ Neue Wortbank anlegen' }])
    });
    var sectionWrap = h('div');
    var titleField = ui.textField({ label: 'Titel der neuen Wortbank', value: 'Neue Wortbank' });

    function refreshSections() {
      util.clear(sectionWrap);
      var value = util.$('select', bankSelect).value;
      if (value === '__new') { sectionWrap.appendChild(titleField); return; }
      var bank = select.bank(BAO.store.getState(), value);
      if (!bank) return;
      var options = (bank.sections || []).map(function (s) { return { value: s.id, label: s.title }; });
      options.push({ value: '__newsection', label: '+ Neuer Abschnitt' });
      sectionWrap.appendChild(ui.selectField({ label: 'Abschnitt', value: options[0].value, options: options }));
    }
    util.$('select', bankSelect).addEventListener('change', refreshSections);
    refreshSections();

    return BAO.modal.open({
      title: ids.length + ' ' + util.plural(ids.length, 'Eintrag', 'Einträge') + ' übernehmen',
      width: '520px',
      body: h('div.stack', {}, bankSelect, sectionWrap),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Übernehmen', kind: 'primary',
          onSelect: function () {
            var bankValue = util.$('select', bankSelect).value;
            var sectionSelect = util.$('select', sectionWrap);
            var sectionValue = sectionSelect ? sectionSelect.value : '__newsection';
            var newBankId = null;
            BAO.store.commit('Einträge in Wortbank übernommen', function (draft) {
              var bank;
              if (bankValue === '__new') {
                bank = schema.makeBank({
                  groupId: groupId, subjectId: subjectId,
                  title: titleField.input.value.trim() || 'Neue Wortbank'
                });
                draft.banks.push(bank);
                newBankId = bank.id;
              } else {
                bank = select.bank(draft, bankValue);
              }
              if (!bank) return false;
              var section = null;
              if (sectionValue && sectionValue !== '__newsection') {
                section = (bank.sections || []).filter(function (s) { return s.id === sectionValue; })[0];
              }
              if (!section) {
                section = schema.makeSection({ title: kind === 'starter' ? 'Satzanfänge' : 'Wortschatz' });
                bank.sections.push(section);
              }
              var present = {};
              section.items.forEach(function (item) { present[item.kind + ':' + item.refId] = true; });
              ids.forEach(function (id) {
                if (present[kind + ':' + id]) return;
                section.items.push(schema.makeBankItem({ kind: kind, refId: id }));
              });
              bank.updatedAt = util.nowISO();
            });
            BAO.toast.undoable(ids.length + ' ' + util.plural(ids.length, 'Eintrag', 'Einträge') + ' übernommen.');
            if (newBankId) BAO.app.go('wortbank/' + newBankId);
            return true;
          }
        }
      ]
    });
  }

  /* --- Löschen ---------------------------------------------------------------- */

  function deleteLexemes(ids) {
    var state = BAO.store.getState();
    var usage = 0;
    ids.forEach(function (id) { usage += select.usageOfEntry(state, id, 'lex').length; });
    var first = select.lexeme(state, ids[0]);

    return BAO.modal.confirm({
      title: ids.length === 1 ? 'Eintrag löschen?' : ids.length + ' Einträge löschen?',
      text: ids.length === 1 && first
        ? '„' + ui.termLabel(first) + '“ wird aus dem Bestand der Lerngruppe entfernt.'
        : 'Die Einträge werden aus dem Bestand der Lerngruppe entfernt.',
      detail: usage
        ? 'Achtung: ' + usage + ' ' + util.plural(usage, 'Verwendung', 'Verwendungen')
          + ' in Wortbanken werden ebenfalls entfernt. Das lässt sich rückgängig machen.'
        : 'Das lässt sich direkt rückgängig machen.',
      confirmLabel: 'Löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return false;
      BAO.store.commit(ids.length === 1 ? 'Eintrag gelöscht' : ids.length + ' Einträge gelöscht', function (draft) {
        draft.lexemes = draft.lexemes.filter(function (l) { return ids.indexOf(l.id) < 0; });
        draft.banks.forEach(function (bank) {
          (bank.sections || []).forEach(function (section) {
            section.items = section.items.filter(function (item) {
              return !(item.kind === 'lex' && ids.indexOf(item.refId) >= 0);
            });
          });
        });
      });
      clearSelection();
      BAO.toast.undoable(ids.length === 1 ? 'Eintrag gelöscht.' : ids.length + ' Einträge gelöscht.');
      return true;
    });
  }

  function setStatus(ids, status) {
    BAO.store.commit('Status geändert', function (draft) {
      draft.lexemes.forEach(function (lex) {
        if (ids.indexOf(lex.id) >= 0) { lex.status = status; lex.updatedAt = util.nowISO(); }
      });
    });
    BAO.toast.undoable('Status „' + schema.statusInfo(status).label + '“ für '
      + ids.length + ' ' + util.plural(ids.length, 'Eintrag', 'Einträge') + ' gesetzt.');
  }

  /* --- Liste ------------------------------------------------------------------ */

  function applyFilters(state, list) {
    var needle = util.fold(filters.query);
    return list.filter(function (lex) {
      if (filters.status !== 'all' && lex.status !== filters.status) return false;
      if (filters.status === 'all' && !filters.query && lex.status === 'archived') return false;
      if (filters.unitId !== 'all' && lex.introducedUnitId !== filters.unitId) return false;
      if (filters.topic !== 'all' && (lex.topics || []).indexOf(filters.topic) < 0) return false;
      if (needle && !BAO.search.matchesLexeme(lex, needle)) return false;
      return true;
    }).sort(function (a, b) {
      if (filters.sort === 'alpha') return util.fold(a.term).localeCompare(util.fold(b.term), 'de');
      if (filters.sort === 'status') {
        var d = schema.STATUS_ORDER.indexOf(a.status) - schema.STATUS_ORDER.indexOf(b.status);
        return d !== 0 ? d : util.fold(a.term).localeCompare(util.fold(b.term), 'de');
      }
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    });
  }

  function lexemeRow(state, lex, ctx, app) {
    var info = schema.statusInfo(lex.status);
    var unit = lex.introducedUnitId ? select.unit(state, lex.introducedUnitId) : null;

    var row = h('div.lex', {
      style: { '--status-color': 'var(--st-' + info.id + ')' },
      dataset: { selected: selection[lex.id] ? 'true' : 'false', id: lex.id }
    },
      h('input', {
        type: 'checkbox', 'aria-label': 'Auswählen: ' + lex.term,
        checked: selection[lex.id] ? true : null,
        onchange: function (event) {
          selection[lex.id] = event.target.checked;
          BAO.app.scheduleRender();
        }
      }),
      h('div.lex__mid', {},
        h('div.lex__term', {}, ui.termLabel(lex),
          lex.gram ? h('span.gram', { text: lex.gram }) : null),
        lex.collocation ? h('div.lex__chunk', { text: lex.collocation }) : null,
        lex.chunk && !lex.collocation ? h('div.lex__chunk', { text: lex.chunk }) : null
      ),
      h('div.lex__mid.lex__col-hide', {},
        lex.translation ? h('div.lex__de', { text: lex.translation }) : null,
        lex.explanation ? h('div.lex__sub', { text: lex.explanation }) : null
      ),
      h('div.lex__mid.lex__col-hide', {},
        h('div', {}, ui.statusChip(lex.status)),
        h('div.lex__tags', {},
          (lex.topics || []).slice(0, 2).map(function (topic) { return h('span.chip.chip--tag', { text: topic }); }),
          unit ? h('span.chip.chip--tag', { title: 'eingeführt in', text: unit.title }) : null
        )
      ),
      h('div.lex__actions', {},
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'In eine Wortbank übernehmen',
          onclick: function () { openAddToBank([lex.id], 'lex', ctx.group.id, ctx.subject.id); }
        }, ui.icon('grid', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Bearbeiten',
          onclick: function () { openEditor(lex); }
        }, ui.icon('edit', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Löschen',
          onclick: function () { deleteLexemes([lex.id]); }
        }, ui.icon('trash', 15))
      )
    );
    row.addEventListener('dblclick', function () { openEditor(lex); });
    return row;
  }

  /* --- Ansicht ---------------------------------------------------------------- */

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var view = h('div.view');

    if (!ctx.group) {
      view.appendChild(ui.emptyState({
        title: 'Noch keine Lerngruppe',
        text: 'Der Wortschatz gehört immer zu einer Lerngruppe – so wächst er über die Schuljahre mit.',
        actionLabel: 'Lerngruppe anlegen',
        onAction: function () { app.go('verwaltung'); }
      }));
      host.appendChild(view);
      return;
    }

    if (lastGroupId !== ctx.group.id) { clearSelection(); lastGroupId = ctx.group.id; }

    var all = select.lexemesOfGroup(state, ctx.group.id);
    var counts = select.statusCounts(state, ctx.group.id);
    var visible = applyFilters(state, all);

    // Vorausgewählter Eintrag aus der Schnellsuche
    if (context.params[0]) {
      var target = select.lexeme(state, context.params[0]);
      if (target) { setTimeout(function () { openEditor(target); }, 0); window.location.hash = '#/wortschatz'; }
    }

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: 'Wortschatz' }),
        h('span.sub', {
          text: ctx.subject.name + ' · ' + ctx.group.name + ' · Jahrgang ' + ctx.group.grade
            + ' · ' + all.length + ' ' + util.plural(all.length, 'Eintrag', 'Einträge')
        })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        h('button.btn.btn--sm', {
          type: 'button', text: 'Mehrere Zeilen einfügen',
          onclick: function () { openQuickAdd(ctx.group.id, ctx.subject.id, ctx.unit ? ctx.unit.id : ''); }
        }),
        h('button.btn.btn--primary', {
          type: 'button',
          onclick: function () {
            openEditor(null, {
              groupId: ctx.group.id, subjectId: ctx.subject.id,
              unitId: ctx.unit ? ctx.unit.id : '', schoolYear: ctx.group.schoolYear
            });
          }
        }, ui.icon('plus', 16), 'Neuer Eintrag')
      )
    ));

    /* --- Werkzeugleiste --------------------------------------------------- */
    var searchInput = h('input', {
      type: 'search', value: filters.query, placeholder: 'Im Bestand suchen …',
      'aria-label': 'Wortschatz durchsuchen',
      oninput: function (event) { filters.query = event.target.value; app.scheduleRender(); }
    });

    var statusButtons = h('div.filterbar', {});
    [{ id: 'all', label: 'Alle', count: counts.total }].concat(schema.STATUS.map(function (s) {
      return { id: s.id, label: s.short, count: counts[s.id] || 0 };
    })).forEach(function (entry) {
      statusButtons.appendChild(h('button.btn', {
        type: 'button',
        'aria-pressed': filters.status === entry.id ? 'true' : 'false',
        title: entry.id === 'all' ? 'Alle anzeigen (ohne Archiv)' : schema.statusInfo(entry.id).hint,
        onclick: function () { filters.status = entry.id; app.scheduleRender(); }
      }, entry.label + ' ' + entry.count));
    });

    var toolbar = h('div.toolbar', {},
      searchInput,
      statusButtons,
      ui.selectField({
        value: filters.unitId,
        ariaLabel: 'Nach Unterrichtsreihe filtern',
        options: [{ value: 'all', label: 'Alle Reihen' }].concat(select.unitsOfGroup(state, ctx.group.id).map(function (u) {
          return { value: u.id, label: u.title + ' (' + u.schoolYear + ')' };
        })),
        onChange: function (value) { filters.unitId = value; app.scheduleRender(); }
      }),
      ui.selectField({
        value: filters.topic,
        ariaLabel: 'Nach Thema filtern',
        options: [{ value: 'all', label: 'Alle Themen' }].concat(select.topicsOfGroup(state, ctx.group.id).map(function (t) {
          return { value: t, label: t };
        })),
        onChange: function (value) { filters.topic = value; app.scheduleRender(); }
      }),
      h('span.spacer'),
      ui.selectField({
        value: filters.sort,
        ariaLabel: 'Sortierung',
        options: [
          { value: 'recent', label: 'zuletzt bearbeitet' },
          { value: 'alpha', label: 'alphabetisch' },
          { value: 'status', label: 'nach Status' }
        ],
        onChange: function (value) { filters.sort = value; app.scheduleRender(); }
      })
    );
    view.appendChild(toolbar);

    /* --- Liste ------------------------------------------------------------- */
    if (!all.length) {
      view.appendChild(ui.emptyState({
        title: 'Der Bestand ist noch leer',
        text: 'Lege einzelne Einträge an oder füge mehrere Zeilen auf einmal ein. '
          + 'Ein Eintrag braucht nur ein Zielwort – alles Weitere kann später dazukommen.',
        actionLabel: 'Ersten Eintrag anlegen',
        onAction: function () {
          openEditor(null, { groupId: ctx.group.id, subjectId: ctx.subject.id, unitId: ctx.unit ? ctx.unit.id : '' });
        },
        secondaryLabel: 'Mehrere Zeilen einfügen',
        onSecondary: function () { openQuickAdd(ctx.group.id, ctx.subject.id, ctx.unit ? ctx.unit.id : ''); }
      }));
    } else if (!visible.length) {
      view.appendChild(ui.emptyState({
        title: 'Kein Treffer',
        text: 'Zu dieser Kombination aus Suche und Filtern gibt es keinen Eintrag.',
        actionLabel: 'Filter zurücksetzen',
        onAction: function () {
          filters = { query: '', status: 'all', unitId: 'all', topic: 'all', sort: filters.sort };
          app.scheduleRender();
        }
      }));
    } else {
      var list = h('div.lex-list');
      visible.forEach(function (lex) { list.appendChild(lexemeRow(state, lex, ctx, app)); });
      view.appendChild(list);
    }

    /* --- Sammelaktionen ----------------------------------------------------- */
    var chosen = selectedIds();
    if (chosen.length) {
      view.appendChild(h('div.bulkbar', {},
        h('strong', { text: chosen.length + ' ausgewählt' }),
        ui.selectField({
          value: '', ariaLabel: 'Status setzen',
          options: [{ value: '', label: 'Status setzen …' }].concat(ui.statusOptions()),
          onChange: function (value, node) {
            if (!value) return;
            setStatus(chosen, value);
            node.value = '';
            clearSelection();
            app.scheduleRender();
          }
        }),
        h('button.btn.btn--sm', {
          type: 'button', text: 'In Wortbank',
          onclick: function () { openAddToBank(chosen, 'lex', ctx.group.id, ctx.subject.id); }
        }),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Löschen',
          onclick: function () { deleteLexemes(chosen).then(function () { app.scheduleRender(); }); }
        }),
        h('span.spacer'),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Auswahl aufheben',
          onclick: function () { clearSelection(); app.scheduleRender(); }
        })
      ));
    }

    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.vocab = {
    render: render,
    openEditor: openEditor,
    openQuickAdd: openQuickAdd,
    openAddToBank: openAddToBank
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/views/starters.js */
/* ==========================================================================
   Satzanfänge und kommunikative Sprachmittel
   Eigener Inhaltstyp, geordnet nach kommunikativen Funktionen und in drei
   Anspruchsvarianten. Leerstellen werden als "___" geschrieben und ruhig als
   Linie dargestellt.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var filters = { query: '', variant: 'all', functionId: 'all' };

  function openEditor(starter, defaults) {
    var state = BAO.store.getState();
    defaults = defaults || {};
    var isNew = !starter;
    var data = starter ? util.clone(starter) : schema.makeStarter({
      subjectId: defaults.subjectId, groupId: defaults.groupId,
      functionId: defaults.functionId || (state.functions[0] && state.functions[0].id) || '',
      variant: defaults.variant || 'standard',
      text: defaults.text || ''
    });

    var fieldText = ui.textField({
      label: 'Satzanfang', value: data.text, full: true,
      placeholder: 'À mon avis, ___.',
      hint: 'Drei Unterstriche „___“ erzeugen eine ruhige Leerstelle in der Projektion.'
    });
    var fieldTranslation = ui.textField({ label: 'Deutsche Entsprechung (optional)', value: data.translation, full: true });
    var fieldFunction = ui.selectField({
      label: 'Kommunikative Funktion', value: data.functionId, options: ui.functionOptions(state, true)
    });
    var fieldVariant = ui.selectField({
      label: 'Anspruch', value: data.variant,
      options: schema.STARTER_VARIANTS.map(function (v) { return { value: v.id, label: v.label + ' – ' + v.hint }; })
    });
    var fieldScope = ui.selectField({
      label: 'Verfügbar für', value: data.groupId ? 'group' : 'subject',
      options: [
        { value: 'group', label: 'nur diese Lerngruppe' },
        { value: 'subject', label: 'alle Lerngruppen des Fachs' }
      ]
    });
    var tags = (data.tags || []).slice();
    var fieldTags = ui.tagEditor(tags, { label: 'Schlagwörter', onChange: function (v) { tags = v; } });

    var preview = h('div.starter', {}, h('div.starter__text'));
    function refreshPreview() {
      var node = util.$('.starter__text', preview);
      util.clear(node);
      node.appendChild(ui.gapText(fieldText.input.value || '…', document));
    }
    fieldText.input.addEventListener('input', refreshPreview);
    refreshPreview();

    return BAO.modal.open({
      title: isNew ? 'Neuer Satzanfang' : 'Satzanfang bearbeiten',
      width: '620px',
      initialFocus: 'input',
      body: h('div.stack', {},
        fieldText, preview, fieldTranslation,
        h('div.grid2', {}, fieldFunction, fieldVariant, fieldScope, fieldTags)
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: isNew ? 'Speichern' : 'Änderungen übernehmen', kind: 'primary',
          onSelect: function () {
            var text = fieldText.input.value.trim();
            if (!text) { fieldText.input.focus(); return false; }
            var values = {
              text: text,
              translation: fieldTranslation.input.value.trim(),
              functionId: util.$('select', fieldFunction).value,
              variant: util.$('select', fieldVariant).value,
              groupId: util.$('select', fieldScope).value === 'group' ? (data.groupId || defaults.groupId) : '',
              tags: tags,
              updatedAt: util.nowISO()
            };
            BAO.store.commit(isNew ? 'Satzanfang angelegt' : 'Satzanfang bearbeitet', function (draft) {
              if (isNew) draft.starters.push(Object.assign(data, values));
              else {
                var target = select.starter(draft, data.id);
                if (target) Object.assign(target, values);
              }
            });
            BAO.toast.undoable(isNew ? 'Satzanfang angelegt.' : 'Satzanfang aktualisiert.');
            return true;
          }
        }
      ]
    });
  }

  function duplicateAsVariant(starter) {
    var order = ['einfach', 'standard', 'anspruchsvoll'];
    var nextVariant = order[Math.min(order.indexOf(starter.variant) + 1, order.length - 1)];
    var copyId = null;
    BAO.store.commit('Variante angelegt', function (draft) {
      var copy = schema.makeStarter(Object.assign(util.clone(starter), {
        id: util.uid('sta'), variant: nextVariant, createdAt: util.nowISO(), updatedAt: util.nowISO()
      }));
      draft.starters.push(copy);
      copyId = copy.id;
    });
    BAO.toast.undoable('Variante angelegt – jetzt anpassen.');
    var created = select.starter(BAO.store.getState(), copyId);
    if (created) openEditor(created);
  }

  function remove(starter) {
    var usage = select.usageOfEntry(BAO.store.getState(), starter.id, 'starter').length;
    BAO.modal.confirm({
      title: 'Satzanfang löschen?',
      text: ui.plainStarterText(starter.text),
      detail: usage
        ? 'Er wird in ' + usage + ' ' + util.plural(usage, 'Wortbank', 'Wortbanken') + ' verwendet und dort ebenfalls entfernt.'
        : 'Das lässt sich direkt rückgängig machen.',
      confirmLabel: 'Löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      BAO.store.commit('Satzanfang gelöscht', function (draft) {
        draft.starters = draft.starters.filter(function (s) { return s.id !== starter.id; });
        draft.banks.forEach(function (bank) {
          (bank.sections || []).forEach(function (section) {
            section.items = section.items.filter(function (item) {
              return !(item.kind === 'starter' && item.refId === starter.id);
            });
          });
        });
      });
      BAO.toast.undoable('Satzanfang gelöscht.');
    });
  }

  function starterRow(starter, ctx) {
    var text = h('div.starter__text');
    text.appendChild(ui.gapText(starter.text, document));

    return h('div.starter', {},
      ui.variantPips(starter.variant),
      h('div', { style: { flex: '1 1 auto', 'min-width': '0' } },
        text,
        starter.translation ? h('div.starter__de', { text: starter.translation }) : null
      ),
      !starter.groupId ? h('span.chip.chip--tag', { title: 'gilt für alle Lerngruppen des Fachs', text: 'fachweit' }) : null,
      h('div.starter__actions', {},
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'In eine Wortbank übernehmen',
          onclick: function () { BAO.views.vocab.openAddToBank([starter.id], 'starter', ctx.group.id, ctx.subject.id); }
        }, ui.icon('grid', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Variante mit anderem Anspruch anlegen',
          onclick: function () { duplicateAsVariant(starter); }
        }, ui.icon('copy', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Bearbeiten', onclick: function () { openEditor(starter); }
        }, ui.icon('edit', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Löschen', onclick: function () { remove(starter); }
        }, ui.icon('trash', 15))
      )
    );
  }

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var view = h('div.view');

    if (!ctx.group) {
      view.appendChild(ui.emptyState({
        title: 'Noch keine Lerngruppe',
        text: 'Satzanfänge gehören zu einem Fach und können einer Lerngruppe zugeordnet werden.',
        actionLabel: 'Lerngruppe anlegen', onAction: function () { app.go('verwaltung'); }
      }));
      host.appendChild(view);
      return;
    }

    var all = select.startersOfGroup(state, ctx.group.id, ctx.subject.id);
    var needle = util.fold(filters.query);
    var visible = all.filter(function (starter) {
      if (filters.variant !== 'all' && starter.variant !== filters.variant) return false;
      if (filters.functionId !== 'all' && starter.functionId !== filters.functionId) return false;
      if (needle && !BAO.search.matchesStarter(starter, needle)) return false;
      return true;
    });

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: 'Satzanfänge' }),
        h('span.sub', {
          text: ctx.subject.name + ' · ' + ctx.group.name + ' · ' + all.length + ' Formulierungen in '
            + select.functions(state).length + ' kommunikativen Funktionen'
        })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        h('button.btn.btn--primary', {
          type: 'button',
          onclick: function () {
            openEditor(null, {
              subjectId: ctx.subject.id, groupId: ctx.group.id,
              functionId: filters.functionId !== 'all' ? filters.functionId : ''
            });
          }
        }, ui.icon('plus', 16), 'Neuer Satzanfang')
      )
    ));

    view.appendChild(h('div.toolbar', {},
      h('input', {
        type: 'search', value: filters.query, placeholder: 'Satzanfänge durchsuchen …',
        'aria-label': 'Satzanfänge durchsuchen',
        oninput: function (event) { filters.query = event.target.value; app.scheduleRender(); }
      }),
      ui.selectField({
        value: filters.functionId, ariaLabel: 'Nach Funktion filtern',
        options: [{ value: 'all', label: 'Alle Funktionen' }].concat(ui.functionOptions(state, false)),
        onChange: function (value) { filters.functionId = value; app.scheduleRender(); }
      }),
      ui.selectField({
        value: filters.variant, ariaLabel: 'Nach Anspruch filtern',
        options: [{ value: 'all', label: 'Alle Varianten' }].concat(schema.STARTER_VARIANTS.map(function (v) {
          return { value: v.id, label: v.label };
        })),
        onChange: function (value) { filters.variant = value; app.scheduleRender(); }
      }),
      h('span.spacer'),
      h('span.hint', { style: { display: 'flex', gap: 'var(--sp-2)', 'align-items': 'center' } },
        schema.STARTER_VARIANTS.map(function (variant) {
          return h('span', { style: { display: 'flex', gap: '4px', 'align-items': 'center' } },
            ui.variantPips(variant.id), variant.label);
        })
      )
    ));

    if (!visible.length) {
      view.appendChild(ui.emptyState({
        title: all.length ? 'Kein Treffer' : 'Noch keine Satzanfänge',
        text: all.length
          ? 'Andere Funktion oder Variante wählen – oder die Suche leeren.'
          : 'Sammle typische Formulierungen: eine Meinung äußern, begründen, widersprechen, zusammenfassen …',
        actionLabel: all.length ? 'Filter zurücksetzen' : 'Ersten Satzanfang anlegen',
        onAction: function () {
          if (all.length) { filters = { query: '', variant: 'all', functionId: 'all' }; app.scheduleRender(); }
          else openEditor(null, { subjectId: ctx.subject.id, groupId: ctx.group.id });
        }
      }));
      host.appendChild(view);
      return;
    }

    var byFunction = util.groupBy(visible, function (s) { return s.functionId || ''; });
    select.functions(state).concat([{ id: '', label: 'ohne Funktion', order: 999 }]).forEach(function (fn) {
      var list = byFunction.get(fn.id);
      if (!list || !list.length) return;
      var order = { einfach: 0, standard: 1, anspruchsvoll: 2 };
      list = list.slice().sort(function (a, b) { return (order[a.variant] || 1) - (order[b.variant] || 1); });

      var group = h('section.func-group', {},

            }
          })

      );
      list.forEach(function (starter) { group.appendChild(starterRow(starter, ctx)); });
      view.appendChild(group);
    });

    host.appendChild(view);

  BAO.views = BAO.views || {};
  BAO.views.starters = { render: render, openEditor: openEditor };
})(window.BAO = window.BAO || {});

/* js/views/banks.js */
/* ==========================================================================
   Wortbanken der Lerngruppe
   Übersicht aller zusammengestellten Wortbanken samt Unterrichtsszene.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var filters = { query: '', scene: 'all', unitId: 'all' };

  function createBank(ctx, app) {
    var state = BAO.store.getState();
    var fieldTitle = ui.textField({ label: 'Titel', value: '', placeholder: 'z. B. Partnergespräch über das Praktikum' });
    var fieldScene = ui.selectField({ label: 'Unterrichtsszene', value: 'Partnergespräch', options: ui.sceneOptions(state) });
    var fieldUnit = ui.selectField({
      label: 'Unterrichtsreihe', value: ctx.unit ? ctx.unit.id : '',
      options: ui.unitOptions(state, ctx.group.id)
    });
    var fieldLevel = ui.selectField({
      label: 'Start-Unterstützungsstufe', value: '2',
      options: schema.LEVELS.map(function (l) { return { value: String(l.id), label: l.id + ' – ' + l.name + ' (' + l.hint + ')' }; })
    });

    return BAO.modal.open({
      title: 'Neue Wortbank',
      subtitle: 'Eine Wortbank ist die Zusammenstellung für eine konkrete Unterrichtsphase.',
      width: '560px',
      initialFocus: 'input',
      body: h('div.stack', {}, fieldTitle, h('div.grid2', {}, fieldScene, fieldUnit), fieldLevel),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Anlegen und öffnen', kind: 'primary',
          onSelect: function () {
            var title = fieldTitle.input.value.trim();
            if (!title) { fieldTitle.input.focus(); return false; }
            var newId = null;
            BAO.store.commit('Wortbank angelegt', function (draft) {
              var bank = schema.makeBank({
                subjectId: ctx.subject.id, groupId: ctx.group.id,
                title: title,
                scene: util.$('select', fieldScene).value,
                unitId: util.$('select', fieldUnit).value,
                defaultLevel: parseInt(util.$('select', fieldLevel).value, 10) || 2,
                sections: [schema.makeSection({ title: 'Wortschatz' })]
              });
              draft.banks.push(bank);
              newId = bank.id;
            });
            BAO.toast.undoable('Wortbank „' + title + '“ angelegt.');
            if (newId) app.go('wortbank/' + newId);
            return true;
          }
        }
      ]
    });
  }

  function duplicate(bank, app) {
    var newId = null;
    BAO.store.commit('Wortbank dupliziert', function (draft) {
      var copy = util.clone(bank);
      copy.id = util.uid('bnk');
      copy.title = bank.title + ' (Kopie)';
      copy.favorite = false;
      copy.lastUsedAt = '';
      copy.createdAt = util.nowISO();
      copy.updatedAt = util.nowISO();
      copy.sections = (copy.sections || []).map(function (section) {
        section.id = util.uid('sec');
        section.items = (section.items || []).map(function (item) {
          item.id = util.uid('itm');
          return item;
        });
        return section;
      });
      draft.banks.push(copy);
      newId = copy.id;
    });
    BAO.toast.undoable('Kopie angelegt.');
    if (newId && app) app.go('wortbank/' + newId);
  }

  function remove(bank) {
    return BAO.modal.confirm({
      title: 'Wortbank löschen?',
      text: '„' + bank.title + '“ wird entfernt.',
      detail: 'Die enthaltenen Wortschatzeinträge und Satzanfänge bleiben im Bestand der Lerngruppe erhalten.',
      confirmLabel: 'Löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      BAO.store.commit('Wortbank gelöscht', function (draft) {
        draft.banks = draft.banks.filter(function (b) { return b.id !== bank.id; });
        draft.ui.recentBanks = (draft.ui.recentBanks || []).filter(function (id) { return id !== bank.id; });
      });
      BAO.toast.undoable('Wortbank gelöscht.');
    });
  }

  function bankTile(state, bank, app) {
    var count = select.bankItemCount(bank);
    var unit = bank.unitId ? select.unit(state, bank.unitId) : null;
    var subject = select.subject(state, bank.subjectId);
    var sections = (bank.sections || []).length;

    return h('div.tile', {
      style: ui.subjectVars(subject),
      onclick: function () { app.go('wortbank/' + bank.id); }
    },
      h('span.tile__accent'),
      h('div.tile__top', {},
        h('span.tile__title', { text: bank.title }),
        h('span.spacer'),
        ui.favButton(bank.favorite, function () {
          BAO.store.commit('Favorit geändert', function (draft) {
            var target = select.bank(draft, bank.id);
            if (target) target.favorite = !target.favorite;
          });
        })
      ),
      h('div.row', {},
        h('span.chip.chip--outline', { text: bank.scene }),
        h('span.chip', { text: 'Stufe ' + bank.defaultLevel }),
        h('span.chip', { text: count + ' ' + util.plural(count, 'Eintrag', 'Einträge') }),
        h('span.chip', { text: sections + ' ' + util.plural(sections, 'Abschnitt', 'Abschnitte') })
      ),
      unit ? h('div.tile__meta', { text: 'Reihe: ' + unit.title }) : null,
      bank.note ? h('div.tile__meta', { text: bank.note }) : null,
      h('div.tile__foot', {},
        h('button.btn.btn--primary.btn--sm', {
          type: 'button',
          onclick: function (event) { event.stopPropagation(); app.projectBank(bank.id); }
        }, ui.icon('play', 15), 'Projizieren'),
        h('button.btn.btn--sm.btn--icon', {
          type: 'button', title: 'Duplizieren',
          onclick: function (event) { event.stopPropagation(); duplicate(bank, app); }
        }, ui.icon('copy', 15)),
        h('button.btn.btn--sm.btn--icon', {
          type: 'button', title: 'Löschen',
          onclick: function (event) { event.stopPropagation(); remove(bank); }
        }, ui.icon('trash', 15))
      )
    );
  }

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var view = h('div.view');

    if (!ctx.group) {
      view.appendChild(ui.emptyState({
        title: 'Noch keine Lerngruppe',
        text: 'Wortbanken werden für eine Lerngruppe zusammengestellt.',
        actionLabel: 'Lerngruppe anlegen', onAction: function () { app.go('verwaltung'); }
      }));
      host.appendChild(view);
      return;
    }

    var all = select.banksOfGroup(state, ctx.group.id);
    var needle = util.fold(filters.query);
    var visible = all.filter(function (bank) {
      if (filters.scene !== 'all' && bank.scene !== filters.scene) return false;
      if (filters.unitId !== 'all' && bank.unitId !== filters.unitId) return false;
      if (needle && util.fold(bank.title + ' ' + bank.scene + ' ' + (bank.note || '')).indexOf(needle) < 0) return false;
      return true;
    });

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: 'Wortbanken' }),
        h('span.sub', {
          text: ctx.subject.name + ' · ' + ctx.group.name + ' · '
            + all.length + ' ' + util.plural(all.length, 'Wortbank', 'Wortbanken')
        })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        h('button.btn.btn--primary', {
          type: 'button', onclick: function () { createBank(ctx, app); }
        }, ui.icon('plus', 16), 'Neue Wortbank')
      )
    ));

    if (all.length) {
      view.appendChild(h('div.toolbar', {},
        h('input', {
          type: 'search', value: filters.query, placeholder: 'Wortbanken durchsuchen …',
          'aria-label': 'Wortbanken durchsuchen',
          oninput: function (event) { filters.query = event.target.value; app.scheduleRender(); }
        }),
        ui.selectField({
          value: filters.scene, ariaLabel: 'Nach Szene filtern',
          options: [{ value: 'all', label: 'Alle Szenen' }].concat(ui.sceneOptions(state)),
          onChange: function (value) { filters.scene = value; app.scheduleRender(); }
        }),
        ui.selectField({
          value: filters.unitId, ariaLabel: 'Nach Reihe filtern',
          options: [{ value: 'all', label: 'Alle Reihen' }].concat(select.unitsOfGroup(state, ctx.group.id).map(function (u) {
            return { value: u.id, label: u.title };
          })),
          onChange: function (value) { filters.unitId = value; app.scheduleRender(); }
        })
      ));
    }

    if (!all.length) {
      view.appendChild(ui.emptyState({
        title: 'Noch keine Wortbank',
        text: 'Eine Wortbank ist eine kleine, gezielte Auswahl aus dem Gesamtbestand – '
          + 'für ein Partnergespräch, eine Diskussion oder eine Schreibphase.',
        actionLabel: 'Erste Wortbank anlegen',
        onAction: function () { createBank(ctx, app); }
      }));
    } else if (!visible.length) {
      view.appendChild(ui.emptyState({
        title: 'Kein Treffer',
        text: 'Mit diesen Filtern gibt es keine Wortbank.',
        actionLabel: 'Filter zurücksetzen',
        onAction: function () { filters = { query: '', scene: 'all', unitId: 'all' }; app.scheduleRender(); }
      }));
    } else {
      var tiles = h('div.tiles.tiles--wide');
      visible.forEach(function (bank) { tiles.appendChild(bankTile(state, bank, app)); });
      tiles.appendChild(h('button.tile.tile--add', {
        type: 'button', onclick: function () { createBank(ctx, app); }
      }, ui.icon('plus', 22), h('span', { text: 'Neue Wortbank' })));
      view.appendChild(tiles);
    }

    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.banks = { render: render, duplicate: duplicate, remove: remove, createBank: createBank };
})(window.BAO = window.BAO || {});

  <script>
/* js/views/bank-editor.js */
/* ==========================================================================
   Wortbank zusammenstellen
   Links die Abschnitte der Wortbank (verschiebbar per Ziehen), rechts der
   Bestand der Lerngruppe zum Hinzufügen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var activeSectionByBank = {};
  var picker = { tab: 'lex', query: '', status: 'all', functionId: 'all' };

  function updateBank(bankId, label, mutator) {
    BAO.store.commit(label, function (draft) {
      var bank = select.bank(draft, bankId);
      if (!bank) return false;
      var result = mutator(bank, draft);
      bank.updatedAt = util.nowISO();
      return result;
    });
  }

  function itemLabel(state, item) {
    var resolved = select.resolveItem(state, item);
    if (!resolved) return { text: '(fehlender Eintrag)', meta: '' };
    if (resolved.kind === 'starter') {
      return { text: ui.plainStarterText(resolved.ref.text), meta: select.functionLabel(state, resolved.ref.functionId) };
    }
    return {
      text: ui.termLabel(resolved.ref),
      meta: resolved.ref.translation || resolved.ref.collocation || '',
      status: resolved.ref.status
    };
  }

  /* --- Ziehen und Ablegen ----------------------------------------------------- */

  function moveItem(bankId, fromSectionId, itemId, toSectionId, toIndex) {
    updateBank(bankId, 'Reihenfolge geändert', function (bank) {
      var from = bank.sections.filter(function (s) { return s.id === fromSectionId; })[0];
      var to = bank.sections.filter(function (s) { return s.id === toSectionId; })[0];
      if (!from || !to) return false;
      var index = from.items.findIndex(function (i) { return i.id === itemId; });
      if (index < 0) return false;
      var moved = from.items.splice(index, 1)[0];
      var target = toIndex;
      if (from === to && index < toIndex) target -= 1;
      to.items.splice(util.clamp(target, 0, to.items.length), 0, moved);
    });
  }

  function bindDragAndDrop(node, bankId, sectionId, itemId, index) {
    node.setAttribute('draggable', 'true');
    node.addEventListener('dragstart', function (event) {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', JSON.stringify({ sectionId: sectionId, itemId: itemId }));
      node.classList.add('is-dragging');
    });
    node.addEventListener('dragend', function () {
      node.classList.remove('is-dragging');
      util.$('.drop-before, .drop-after').forEach(function (el) { el.classList.remove('drop-before', 'drop-after'); });
    });
    node.addEventListener('dragover', function (event) {
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      var rect = node.getBoundingClientRect();
      var after = event.clientY > rect.top + rect.height / 2;
      node.classList.toggle('drop-after', after);
      node.classList.toggle('drop-before', !after);
    });
    node.addEventListener('dragleave', function () {
      node.classList.remove('drop-before', 'drop-after');
    });
    node.addEventListener('drop', function (event) {
      event.preventDefault();
      event.stopPropagation();
      var after = node.classList.contains('drop-after');
      node.classList.remove('drop-before', 'drop-after');
      var payload;
      try { payload = JSON.parse(event.dataTransfer.getData('text/plain')); } catch (err) { return; }
      if (!payload || !payload.itemId) return;
      moveItem(bankId, payload.sectionId, payload.itemId, sectionId, index + (after ? 1 : 0));
    });
  }

  function bindSectionDrop(node, bankId, sectionId) {
    node.addEventListener('dragover', function (event) {
      event.preventDefault();
      node.classList.add('is-dropzone');
    });
    node.addEventListener('dragleave', function () { node.classList.remove('is-dropzone'); });
    node.addEventListener('drop', function (event) {
      event.preventDefault();
      node.classList.remove('is-dropzone');
      var payload;
      try { payload = JSON.parse(event.dataTransfer.getData('text/plain')); } catch (err) { return; }
      if (!payload || !payload.itemId) return;
      var count = util.$('.bitem', node).length;
      moveItem(bankId, payload.sectionId, payload.itemId, sectionId, count);
    });
  }

  /* --- Abschnitte -------------------------------------------------------------- */

  function sectionNode(state, bank, section, sectionIndex, app) {
    var isActive = activeSectionByBank[bank.id] === section.id;

    var titleInput = h('input', {
      type: 'text', value: section.title, 'aria-label': 'Titel des Abschnitts',
      onchange: function (event) {
        var value = event.target.value.trim() || 'Abschnitt';
        updateBank(bank.id, 'Abschnitt umbenannt', function (b) {
          var target = b.sections.filter(function (s) { return s.id === section.id; })[0];
          if (target) target.title = value;
        });
      }
    });

    var items = h('div.bsection__items');
    bindSectionDrop(items, bank.id, section.id);

    (section.items || []).forEach(function (item, index) {
      var label = itemLabel(state, item);
      var node = h('div.bitem', { dataset: { id: item.id } },
        h('span.bitem__grip', { text: '⠿', title: 'Zum Verschieben ziehen' }),
        item.kind === 'starter' ? ui.icon('quote', 14) : ui.icon('list', 14),
        h('span.bitem__label', { title: label.text + (label.meta ? ' – ' + label.meta : '') },
          label.text,
          label.meta ? h('span.bitem__kind', { text: '  ' + label.meta }) : null
        ),
        label.status ? ui.statusChip(label.status) : null,
        h('div.bitem__actions', {},
          h('button.btn.btn--ghost.btn--sm.btn--icon', {
            type: 'button', title: 'Aus der Wortbank entfernen',
            onclick: function () {
              updateBank(bank.id, 'Eintrag aus Wortbank entfernt', function (b) {
                var target = b.sections.filter(function (s) { return s.id === section.id; })[0];
                if (target) target.items = target.items.filter(function (i) { return i.id !== item.id; });
              });
              BAO.toast.undoable('Eintrag entfernt.');
            }
          }, '×')
        )
      );
      bindDragAndDrop(node, bank.id, section.id, item.id, index);
      items.appendChild(node);
    });

    if (!section.items.length) {
      items.appendChild(h('span.hint', {
        text: 'Noch leer – rechts Einträge anklicken oder Einträge hierher ziehen.'
      }));
    }

    return h('div.bsection', {
      dataset: { active: isActive ? 'true' : 'false' },
      style: isActive ? { 'border-color': 'var(--brand)' } : null,
      onclick: function () {
        if (activeSectionByBank[bank.id] === section.id) return;
        activeSectionByBank[bank.id] = section.id;
        app.scheduleRender();
      }
    },
      h('div.bsection__head', {},
        titleInput,
        ui.selectField({
          value: section.layout || 'auto', ariaLabel: 'Darstellung',
          options: [
            { value: 'auto', label: 'Darstellung: automatisch' },
            { value: 'cards', label: 'Darstellung: Einträge' },
            { value: 'impulse', label: 'Darstellung: Impulse' },
            { value: 'starters', label: 'Darstellung: Satzanfänge' }
          ],
          onChange: function (value) {
            updateBank(bank.id, 'Darstellung geändert', function (b) {
              var target = b.sections.filter(function (s) { return s.id === section.id; })[0];
              if (target) target.layout = value;
            });
          }
        }),
        h('span.chip', { text: section.items.length + '' }),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Nach oben', 'aria-label': 'Abschnitt nach oben',
          disabled: sectionIndex === 0 ? true : null,
          onclick: function () {
            updateBank(bank.id, 'Abschnitt verschoben', function (b) {
              util.moveInArray(b.sections, sectionIndex, sectionIndex - 1);
            });
          }
        }, '↑'),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Nach unten', 'aria-label': 'Abschnitt nach unten',
          disabled: sectionIndex === bank.sections.length - 1 ? true : null,
          onclick: function () {
            updateBank(bank.id, 'Abschnitt verschoben', function (b) {
              util.moveInArray(b.sections, sectionIndex, sectionIndex + 1);
            });
          }
        }, '↓'),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Abschnitt löschen',
          onclick: function () {
            BAO.modal.confirm({
              title: 'Abschnitt löschen?',
              text: '„' + section.title + '“ mit ' + section.items.length + ' Einträgen wird aus der Wortbank entfernt.',
              detail: 'Die Einträge selbst bleiben im Bestand erhalten.',
              confirmLabel: 'Löschen', danger: true
            }).then(function (confirmed) {
              if (!confirmed) return;
              updateBank(bank.id, 'Abschnitt gelöscht', function (b) {
                b.sections = b.sections.filter(function (s) { return s.id !== section.id; });
              });
              BAO.toast.undoable('Abschnitt gelöscht.');
            });
          }
        }, ui.icon('trash', 15))
      ),
      items
    );
  }

  /* --- Auswahlbereich ---------------------------------------------------------- */

  function addToActiveSection(bank, kind, refId, app) {
    var sectionId = activeSectionByBank[bank.id] || (bank.sections[0] && bank.sections[0].id);
    updateBank(bank.id, 'Eintrag hinzugefügt', function (b) {
      var section = b.sections.filter(function (s) { return s.id === sectionId; })[0];
      if (!section) {
        section = schema.makeSection({ title: kind === 'starter' ? 'Satzanfänge' : 'Wortschatz' });
        b.sections.push(section);
        activeSectionByBank[b.id] = section.id;
      }
      var exists = section.items.some(function (i) { return i.kind === kind && i.refId === refId; });
      if (exists) return false;
      section.items.push(schema.makeBankItem({ kind: kind, refId: refId }));
    });
  }

  function pickerCard(state, bank, ctx, app) {
    var inBank = {};
    (bank.sections || []).forEach(function (section) {
      (section.items || []).forEach(function (item) { inBank[item.kind + ':' + item.refId] = true; });
    });

    var list = h('div.picker__list');
    var needle = util.fold(picker.query);

    if (picker.tab === 'lex') {
      var lexemes = select.lexemesOfGroup(state, ctx.group.id).filter(function (lex) {
        if (picker.status !== 'all' && lex.status !== picker.status) return false;
        if (picker.status === 'all' && lex.status === 'archived') return false;
        if (needle && !BAO.search.matchesLexeme(lex, needle)) return false;
        return true;
      }).sort(function (a, b) { return util.fold(a.term).localeCompare(util.fold(b.term), 'de'); });

      if (!lexemes.length) {
        list.appendChild(h('span.hint', { text: 'Kein passender Eintrag im Bestand.' }));
      }
      lexemes.forEach(function (lex) {
        var used = inBank['lex:' + lex.id];
        list.appendChild(h('button.picker__item', {
          type: 'button', dataset: { inBank: used ? 'true' : 'false' },
          title: used ? 'Bereits in dieser Wortbank' : 'Zum aktiven Abschnitt hinzufügen',
          onclick: function () { addToActiveSection(bank, 'lex', lex.id, app); }
        },
          h('span.plus', { text: used ? '✓' : '+' }),
          h('span.bitem__label', {}, ui.termLabel(lex),
            lex.translation ? h('span.bitem__kind', { text: '  ' + lex.translation }) : null),
          ui.statusChip(lex.status)
        ));
      });
    } else {
      var starters = select.startersOfGroup(state, ctx.group.id, ctx.subject.id).filter(function (starter) {
        if (picker.functionId !== 'all' && starter.functionId !== picker.functionId) return false;
        if (needle && !BAO.search.matchesStarter(starter, needle)) return false;
        return true;
      });
      if (!starters.length) list.appendChild(h('span.hint', { text: 'Kein passender Satzanfang.' }));
      var byFunction = util.groupBy(starters, function (s) { return s.functionId; });
      select.functions(state).forEach(function (fn) {
        var group = byFunction.get(fn.id);
        if (!group) return;
        list.appendChild(h('div.palette__group', { text: fn.label }));
        group.forEach(function (starter) {
          var used = inBank['starter:' + starter.id];
          list.appendChild(h('button.picker__item', {
            type: 'button', dataset: { inBank: used ? 'true' : 'false' },
            onclick: function () { addToActiveSection(bank, 'starter', starter.id, app); }
          },
            h('span.plus', { text: used ? '✓' : '+' }),
            h('span.bitem__label', { text: ui.plainStarterText(starter.text) }),
            ui.variantPips(starter.variant)
          ));
        });
      });
    }

    var activeSection = (bank.sections || []).filter(function (s) {
      return s.id === (activeSectionByBank[bank.id] || (bank.sections[0] && bank.sections[0].id));
    })[0];

    return h('div.card.picker', {},
      h('div.card__head', {},
        h('h3', { text: 'Aus dem Bestand hinzufügen' })
      ),
      h('div.card__body', { style: { padding: 'var(--sp-3)', display: 'grid', gap: 'var(--sp-2)' } },
        h('div.row', {},
          h('button.btn.btn--sm', {
            type: 'button', 'aria-pressed': picker.tab === 'lex' ? 'true' : 'false',
            text: 'Wortschatz',
            onclick: function () { picker.tab = 'lex'; app.scheduleRender(); }
          }),
          h('button.btn.btn--sm', {
            type: 'button', 'aria-pressed': picker.tab === 'starter' ? 'true' : 'false',
            text: 'Satzanfänge',
            onclick: function () { picker.tab = 'starter'; app.scheduleRender(); }
          })
        ),
        h('input', {
          type: 'search', value: picker.query, placeholder: 'Suchen …', 'aria-label': 'Bestand durchsuchen',
          oninput: function (event) { picker.query = event.target.value; app.scheduleRender(); }
        }),
        picker.tab === 'lex'
          ? ui.selectField({
            value: picker.status, ariaLabel: 'Nach Status filtern',
            options: [{ value: 'all', label: 'Alle Status' }].concat(ui.statusOptions()),
            onChange: function (value) { picker.status = value; app.scheduleRender(); }
          })
          : ui.selectField({
            value: picker.functionId, ariaLabel: 'Nach Funktion filtern',
            options: [{ value: 'all', label: 'Alle Funktionen' }].concat(ui.functionOptions(state, false)),
            onChange: function (value) { picker.functionId = value; app.scheduleRender(); }
          }),
        h('div.note', {
          text: activeSection
            ? 'Neue Einträge kommen in den Abschnitt „' + activeSection.title + '“. Anderen Abschnitt anklicken, um dorthin zu ergänzen.'
            : 'Lege zuerst einen Abschnitt an.'
        })
      ),
      list
    );
  }

  /* --- Ansicht ------------------------------------------------------------------ */

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var bank = select.bank(state, context.params[0]);
    var view = h('div.view');

    if (!bank) {
      view.appendChild(ui.emptyState({
        title: 'Wortbank nicht gefunden',
        text: 'Vielleicht wurde sie gelöscht oder die Adresse ist veraltet.',
        actionLabel: 'Zur Übersicht', onAction: function () { app.go('wortbanken'); }
      }));
      host.appendChild(view);
      return;
    }

    // Kontext an die Wortbank anpassen, damit der Bestand rechts passt.
    if (bank.groupId && state.ui.groupId !== bank.groupId) {
      app.setContext(bank.subjectId, bank.groupId);
      return;
    }
    if (!activeSectionByBank[bank.id] && bank.sections.length) {
      activeSectionByBank[bank.id] = bank.sections[0].id;
    }

    var count = select.bankItemCount(bank);

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('div.row', {},
          h('button.btn.btn--ghost.btn--sm', {
            type: 'button', text: '← Wortbanken', onclick: function () { app.go('wortbanken'); }
          }),
          ui.favButton(bank.favorite, function () {
            updateBank(bank.id, 'Favorit geändert', function (b) { b.favorite = !b.favorite; });
          })
        ),
        h('input', {
          type: 'text', value: bank.title, 'aria-label': 'Titel der Wortbank',
          style: {
            'font-size': 'var(--fs-2xl)', 'font-weight': '650', border: '1px solid transparent',
            background: 'transparent', padding: '2px 6px', 'font-family': 'var(--font-display)'
          },
          onchange: function (event) {
            var value = event.target.value.trim() || 'Wortbank';
            updateBank(bank.id, 'Wortbank umbenannt', function (b) { b.title = value; });
          }
        }),
        h('span.sub', {
          text: ctx.subject.name + ' · ' + ctx.group.name + ' · ' + count + ' '
            + util.plural(count, 'Eintrag', 'Einträge') + ' in ' + bank.sections.length + ' '
            + util.plural(bank.sections.length, 'Abschnitt', 'Abschnitten')
        })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        h('button.btn.btn--sm', {
          type: 'button', text: 'Duplizieren',
          onclick: function () { BAO.views.banks.duplicate(bank, app); }
        }),
        h('button.btn.btn--primary', {
          type: 'button',
          onclick: function () { app.projectBank(bank.id); }
        }, ui.icon('play', 16), 'Projizieren')
      )
    ));

    /* --- Eigenschaften ----------------------------------------------------- */
    var settings = h('div.card', {},
      h('div.card__body', {},
        h('div.grid3', {},
          ui.selectField({
            label: 'Unterrichtsszene', value: bank.scene, options: ui.sceneOptions(state),
            onChange: function (value) { updateBank(bank.id, 'Szene geändert', function (b) { b.scene = value; }); }
          }),
          ui.selectField({
            label: 'Unterrichtsreihe', value: bank.unitId, options: ui.unitOptions(state, bank.groupId),
            onChange: function (value) { updateBank(bank.id, 'Reihe geändert', function (b) { b.unitId = value; }); }
          }),
          ui.selectField({
            label: 'Start-Unterstützungsstufe', value: String(bank.defaultLevel),
            options: schema.LEVELS.map(function (l) { return { value: String(l.id), label: l.id + ' – ' + l.name }; }),
            onChange: function (value) {
              updateBank(bank.id, 'Stufe geändert', function (b) { b.defaultLevel = parseInt(value, 10) || 2; });
            }
          })
        ),
        ui.textField({
          label: 'Notiz für dich (erscheint nie auf dem Beamer)', value: bank.note, full: true,
          placeholder: 'z. B. Fishbowl, 20 Minuten, danach Stufe 1',
          onInput: util.debounce(function (value) {
            updateBank(bank.id, 'Notiz geändert', function (b) { b.note = value; });
          }, 600)
        })
      )
    );

    var sections = h('div.bank-sections');
    sections.appendChild(settings);
    (bank.sections || []).forEach(function (section, index) {
      sections.appendChild(sectionNode(state, bank, section, index, app));
    });
    sections.appendChild(h('button.btn.btn--wide', {
      type: 'button',
      onclick: function () {
        var newSectionId = null;
        updateBank(bank.id, 'Abschnitt angelegt', function (b) {
          var section = schema.makeSection({ title: 'Neuer Abschnitt' });
          b.sections.push(section);
          newSectionId = section.id;
        });
        if (newSectionId) activeSectionByBank[bank.id] = newSectionId;
      }
    }, ui.icon('plus', 15), 'Abschnitt hinzufügen'));

    view.appendChild(h('div.bank-editor', {}, sections, pickerCard(state, bank, ctx, app)));
    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.bankEditor = { render: render };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/views/present.js */
/* ==========================================================================
   Steuerungsansicht der Projektion
   Links die Vorschau dessen, was die Lernenden sehen, rechts alles, was nur
   die Lehrkraft sieht: Unterstützungsstufen, Abschnitte, Automatik und
   Live-Hilfe.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var refs = {};
  var isRendering = false;
  var keysBound = false;

  var FULL_RENDER_REASONS = {
    start: true, rebuild: true, level: true, fields: true, focus: true, stop: true,
    'live-added': true, 'live-removed': true, 'live-cleared': true,
    'window-opened': true, 'window-closed': true, 'overlay-opened': true, 'overlay-closed': true
  };
