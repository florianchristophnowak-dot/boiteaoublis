/* styles/tokens.css */
/* ==========================================================================
   Boîte à Oublis – Gestaltungstoken
   Eine einzige Quelle für Farben, Abstände, Radien und Typografie.
   Farben tragen Bedeutung: Fachfarbe, Status, Unterstützungsstufe.
   ========================================================================== */

:root {
  /* --- Typografie: ausschließlich systemeigene Schriften (offline-tauglich) */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
             Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Semibold", var(--font-ui);
  --font-mono: "Cascadia Mono", Consolas, "SF Mono", "DejaVu Sans Mono", monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-md: 0.92rem;
  --fs-lg: 1.05rem;
  --fs-xl: 1.32rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.3rem;

  /* --- Abstände (4px-Raster) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  /* --- Radien und Schatten */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(20, 26, 38, .07), 0 1px 3px rgba(20, 26, 38, .05);
  --shadow-2: 0 6px 16px rgba(20, 26, 38, .10), 0 2px 5px rgba(20, 26, 38, .06);
  --shadow-3: 0 18px 48px rgba(15, 20, 30, .22);

  /* --- Helles Grundthema: warmes Papier, ruhige Tinte */
  --paper: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #fbf9f6;
  --surface-sunken: #efeae3;
  --ink: #1a1f28;
  --ink-2: #3c4553;
  --muted: #6b7382;
  --line: #e0d9d0;
  --line-strong: #cdc3b7;

  --brand: #1f4f6b;
  --brand-ink: #16394d;
  --brand-soft: #e3edf3;
  --accent: #c26240;
  --accent-soft: #f8e9e2;

  --focus: #2b7bb9;
  --danger: #a33a2c;
  --danger-soft: #fbe7e3;
  --ok: #1c7a5c;
  --ok-soft: #e2f2ec;

  /* --- Status des Wortschatzes (durchgängig gleiche Bedeutung) */
  --st-new: #1c7a5c;
  --st-new-soft: #e2f2ec;
  --st-active: #2464a8;
  --st-active-soft: #e5eefa;
  --st-revisit: #9a6512;
  --st-revisit-soft: #f8eeda;
  --st-core: #5c4a99;
  --st-core-soft: #ece8f8;
  --st-archived: #6b7382;
  --st-archived-soft: #eceae7;

  /* --- Genus des Artikels (gleiche Bedeutung wie in der Projektion) */
  --genus-m: #0f3f96;
  --genus-f: #9c1223;
  --genus-n: #10603a;

  --hit: 38px;              /* Mindesthöhe für Bedienelemente */
  --rail-w: 218px;
  --topbar-h: 56px;
  --foot-h: 30px;
}

/* --- Dunkles Thema ------------------------------------------------------ */
:root[data-theme="dark"] {
  --paper: #14181f;
  --surface: #1b212a;
  --surface-2: #202733;
  --surface-sunken: #10141a;
  --ink: #eef1f5;
  --ink-2: #c6cdd8;
  --muted: #9aa4b2;
  --line: #2c3542;
  --line-strong: #3d4857;

  --brand: #7fb8d8;
  --brand-ink: #a9d2ea;
  --brand-soft: #1d2c37;
  --accent: #e2916d;
  --accent-soft: #33241d;

  --focus: #63b3ed;
  --danger: #e88f7f;
  --danger-soft: #35201c;
  --ok: #6dc9a8;
  --ok-soft: #16302a;

  --st-new: #6dc9a8;
  --st-new-soft: #16302a;
  --st-active: #7db2ea;
  --st-active-soft: #172736;
  --st-revisit: #dcb063;

  --st-core: #b0a0ea;
  --st-core-soft: #262238;
  --st-archived: #9aa4b2;
  --st-archived-soft: #232830;

  --genus-m: #7db0f7;
  --genus-f: #f5919c;
  --genus-n: #77d3a5;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, .45);
  --shadow-3: 0 18px 48px rgba(0, 0, 0, .6);
}

@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --paper: #14181f;
    --surface: #1b212a;

    --st-revisit: #dcb063;
    --st-revisit-soft: #322818;
    --st-core: #b0a0ea;

  }

/* styles/base.css */
/* ==========================================================================
   Grundlagen: Reset, Typografie, wiederkehrende Bedienelemente
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

/* Eigene display-Regeln dürfen [hidden] nicht aushebeln. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; font-weight: 650; }
h1 { font-size: var(--fs-2xl); letter-spacing: -.012em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--brand); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--surface); color: var(--ink);
  padding: var(--sp-2) var(--sp-3); border-radius: 0 0 var(--r-md) 0;
}
.skip-link:focus { left: 0; }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --- Schaltflächen ------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--hit); padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 550; cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, transform .06s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn--primary,
:root[data-theme="auto"] .btn--primary { color: #10171d; }
@media (prefers-color-scheme: light) { :root[data-theme="auto"] .btn--primary { color: #fff; } }
.btn--primary:hover { background: var(--brand-ink); border-color: var(--brand-ink); }

.btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-sunken); }
.btn--danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn--danger:hover { background: var(--danger-soft); }
.btn--sm { min-height: 30px; padding: 0 var(--sp-2); font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn--icon { padding: 0; width: var(--hit); }
.btn--icon.btn--sm { width: 30px; }
.btn--wide { width: 100%; }

/* Mit dem Finger bedient (Tablet, interaktive Tafel): Kleine Knöpfe und
   Kästchen bekommen eine Trefferfläche, die man nicht verfehlt. */
@media (pointer: coarse) {
  .btn--sm { min-height: 36px; padding: 0 var(--sp-3); }
  .btn--icon.btn--sm { width: 38px; padding: 0; }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; }
}
.btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }

.ico { font-size: 1.05em; line-height: 1; }
.kbd, kbd {
  font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 4px; background: var(--surface-2); white-space: nowrap;
}

/* --- Formularelemente --------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.field > label, .label {
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
}
.field .hint { font-size: var(--fs-xs); color: var(--muted); }

input[type="text"], input[type="search"], input[type="number"], input[type="date"],
select, textarea {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  padding: 8px var(--sp-3); min-height: var(--hit); width: 100%;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); width: 16px; height: 16px; }

.switch { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); }

/* --- Etiketten und Chips ------------------------------------------------ */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px var(--sp-2); border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em;
  background: var(--surface-sunken); color: var(--ink-2); border: 1px solid transparent;
  white-space: nowrap;
}
.chip--st-new      { background: var(--st-new-soft); color: var(--st-new); }
.chip--st-active   { background: var(--st-active-soft); color: var(--st-active); }
.chip--st-revisit  { background: var(--st-revisit-soft); color: var(--st-revisit); }
.chip--st-core     { background: var(--st-core-soft); color: var(--st-core); }
.chip--st-archived { background: var(--st-archived-soft); color: var(--st-archived); }
.chip--tag { background: transparent; border-color: var(--line-strong); color: var(--muted); font-weight: 500; }
.chip--subject { background: var(--subject-soft, var(--brand-soft)); color: var(--subject-color, var(--brand-ink)); }
.chip--outline { background: transparent; border-color: var(--line-strong); }
.chip--warn { background: var(--danger-soft, var(--st-revisit-soft)); color: var(--danger); border-color: currentColor; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* --- Karten ------------------------------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
}
.card__head h2, .card__head h3 { margin: 0; }
.card__body { padding: var(--sp-4); }
.card__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.spacer { flex: 1 1 auto; }

/* --- Leerezustände ------------------------------------------------------ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--muted);
  border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2);
}
.empty__title { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink-2); font-weight: 650; }
.empty__text { max-width: 46ch; }

/* --- Meldungen ---------------------------------------------------------- */
.note {
  border-left: 3px solid var(--brand); background: var(--brand-soft);
  padding: var(--sp-3); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: var(--fs-sm);
}
.note--warn { border-color: var(--st-revisit); background: var(--st-revisit-soft); }
.note--danger { border-color: var(--danger); background: var(--danger-soft); }
.note--ok { border-color: var(--ok); background: var(--ok-soft); }

/* --- Toasts ------------------------------------------------------------- */
.toast-root {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  z-index: 90; pointer-events: none; width: min(560px, calc(100vw - 32px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-2); font-size: var(--fs-sm);
  animation: toast-in .16s ease-out;
}
.toast--danger { background: var(--danger); color: #fff; }
.toast--ok { background: var(--ok); color: #fff; }
.toast__text { flex: 1 1 auto; }
.toast .btn {
  background: transparent; border-color: currentColor; color: inherit;
  min-height: 28px; padding: 0 var(--sp-2); font-size: var(--fs-sm);
}
.toast .btn:hover { background: rgba(255,255,255,.14); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Dialoge ------------------------------------------------------------ */
.modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(16, 20, 27, .45);
  display: grid; place-items: center; padding: var(--sp-4);
  animation: fade-in .12s ease-out;
}
.modal {
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  width: min(var(--modal-w, 560px), 100%); max-height: min(90vh, 900px);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line);
}
.modal__head { padding: var(--sp-4) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--line); }
.modal__head h2 { font-size: var(--fs-xl); }
.modal__head p { margin: var(--sp-1) 0 0; color: var(--muted); font-size: var(--fs-sm); }
.modal__body { padding: var(--sp-4) var(--sp-5); overflow: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.modal__foot {
  padding: var(--sp-3) var(--sp-5) var(--sp-4); border-top: 1px solid var(--line);
  display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* --- Formular-Raster ---------------------------------------------------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.stack--tight { gap: var(--sp-2); }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* --- Reduzierte Bewegung ------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* styles/shell.css */
/* ==========================================================================
   Anwendungsrahmen: Kopfzeile, Navigationsleiste, Inhalt, Fußzeile
   ========================================================================== */

.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--foot-h);
  grid-template-areas:
    "topbar topbar"
    "rail   main"
    "foot   foot";
  height: 100vh;
  height: 100dvh;
}
.shell[data-rail="collapsed"] { --rail-w: 62px; }

/* --- Kopfzeile ---------------------------------------------------------- */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.topbar__brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand__mark { color: var(--brand); display: flex; }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand__text strong { font-family: var(--font-display); font-size: var(--fs-lg); letter-spacing: -.01em; }
.brand__text small { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar__context { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 auto; min-width: 0; }
.topbar__actions { display: flex; align-items: center; gap: var(--sp-1); }
.topbar__actions .kbd { margin-left: 2px; }

.ctx-select {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 3px 3px 3px var(--sp-3);
  min-width: 0;
}
.ctx-select__label { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.ctx-select select {
  border: none; background: transparent; min-height: 30px; padding: 0 26px 0 4px;
  font-weight: 600; width: auto; max-width: 26ch;
  background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
}
.ctx-select select:focus-visible { outline-offset: 0; }
.ctx-flag {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: .62rem; font-weight: 700; letter-spacing: -.02em;
  background: var(--subject-soft); color: var(--subject-color);
}

@media (max-width: 1080px) {
  .btn__label { display: none; }
  .topbar__actions .kbd { display: none; }
  .ctx-select__label { display: none; }
}

/* --- Navigationsleiste -------------------------------------------------- */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-3) var(--sp-2);
  overflow-y: auto;
}
.rail__item {
  display: flex; align-items: center; gap: var(--sp-3);

.ipa-field > label .btn { margin-left: auto; font-weight: 550; }
.ipa-field input {

.ipa-board {

  border: 1px solid var(--line-strong);

.ipa-key {

.field--action > label,
.ipa-field > label { display: flex; align-items: center; gap: var(--sp-2); }
.field--action > label .btn,
.ipa-field > label .btn { margin-left: auto; font-weight: 550; }

/* --- Bedienung ohne Maus -------------------------------------------------- */
/* Ohne Maus gibt es kein „Darüberfahren“: Die Aktionen der Zeilen sind dann

@media (hover: none) {
  .lex__actions, .starter__actions, .bitem__actions, .belem__actions { opacity: 1; }
}
/* Auf dem Handy bleibt die Werkzeugleiste nicht stehen – sie nähme der Liste

@media (max-width: 640px) {

  .toolbar input[type="search"] { min-width: 0; }

}

.sb-timer__controls { display: flex; flex-direction: column; gap: var(--sp-2); flex: 1 1 300px; min-width: 0; }
.sb-timer__controls input[type="number"] { width: 6.5em; min-height: 30px; padding: 2px var(--sp-2); }

  display: flex; flex-direction: column; gap: var(--sp-2);
  padding-top: var(--sp-3); border-top: 1px solid var(--line);

.sb-setup__row .label { min-width: 11ch; }
.sb-setup__row .spacer { flex: 1 1 auto; }
.sb-setup__value { min-width: 0; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sb-presets { display: flex; flex-direction: column; gap: var(--sp-2); }

  display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3);

.sb-preset__actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }

/* --- Symbole ---------------------------------------------------------------------- */
.sb-symbols { display: flex; flex-direction: column; gap: 2px; }
.sb-symbol { display: flex; align-items: center; gap: var(--sp-3); padding: 4px var(--sp-2); border-radius: var(--r-sm); }

.sb-symbol .spacer { flex: 1 1 auto; }

.sb-keys { align-items: baseline; row-gap: 6px; }

.stage-frame {

  overflow: hidden;
  border-bottom: 1px solid var(--line);

  content: "Spiegel des Beamerfensters";
  position: absolute; right: 8px; top: 8px;
  background: rgba(16, 21, 28, .72); color: #fff;
  font-size: 11px; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em;
}

/* Vollbild-Überlagerung als Rückfallebene ohne zweites Fenster */
.overlay-root:empty { display: none; }
.stage-overlay {
  position: fixed; inset: 0; z-index: 70; background: #05070a; overflow: hidden;

.stage-overlay .bao-stage { position: absolute; inset: 0; }

body[data-projecting="true"] .toast-root { display: none; }

.sheet__blank { border-bottom-color: #111 !important; }

.sheet .gap {

/* --- Vorschau im Dialog --------------------------------------------------- */

.sheet-preview {

   App auch, wenn sie direkt als Datei geöffnet wird (file://), wo IndexedDB in

  var available = null;
  var lastError = null;

    if (available !== null) return available;

   * Sicherheitskopie, beiseitegelegte beschädigte Stände).

   Keine Uhr, keine Oberfläche: Jede Funktion bekommt den Stand und die
   aktuelle Zeit und gibt einen neuen Stand zurück. So lässt sich der Timer
   ohne Wartezeit prüfen und übersteht ein Neuladen der Seite – gespeichert
   wird nicht „noch 4 Minuten“, sondern der Zeitpunkt, an dem er endet.

   Stand:  { total, remaining, deadline, running, paused }
     total      Gesamtdauer in Sekunden (0 = kein Timer gesetzt)
     remaining  Rest in Sekunden, solange der Timer nicht läuft
     deadline   Zeitpunkt des Endes (Millisekunden seit 1970), solange er läuft
     running    die Uhr läuft

    return { total: 0, remaining: 0, deadline: 0, running: false, paused: false };
  }

  }

   * Ein Timer, der abgelaufen ist oder in der Zwischenzeit abgelaufen wäre,

   * rote Scheibe von gestern sehen noch ihr Signal hören.
   */

    if (total <= 0) return empty();

    if (raw.running === true) {
      var deadline = finite(raw.deadline);
      var rest = (deadline - now) / 1000;

      // läuft als seine Gesamtdauer.

/* js/classroom/model.js */
/* ==========================================================================
   Datenmodell des Soundboards
   Das Soundboard bringt zwei Dinge mit: Klangtasten („Münzen“) und die
   textfreie Unterrichtsleiste mit Sozialform, Material und Timer. Hier steht,
   was davon gespeichert wird – Voreinstellungen, Prüfung und Reparatur.

    { id: 'projection', label: 'Projektion', hint: 'Sprachhilfe ein- und ausblenden, blättern, Presets starten' },
    { id: 'phase',      label: 'Sozialform', hint: 'die aktuelle Sozialform oder Methode als Symbol' },
    { id: 'materials',  label: 'Material',   hint: 'was die Lernenden bereitlegen' },
    { id: 'timer',      label: 'Timer',      hint: 'verbleibende Zeit als Kreisfläche, ohne Ziffern' }
  ];

  var VIDEO_MODES = [
    { id: 'large', label: 'groß in der Mitte' },
    { id: 'full',  label: 'bildfüllend' },
    { id: 'burst', label: 'kurz bildfüllend, dann groß' }
  ];

  var DEFAULT_PHASES = [
    ['phase-plenum',       'Plenum',          'plenum'],
    ['phase-individual',   'Einzelarbeit',    'individual'],
    ['phase-partner',      'Partnerarbeit',   'partner'],
    ['phase-group',        'Gruppenarbeit',   'group'],
    ['phase-presentation', 'Präsentation',    'presentation'],
    ['phase-stations',     'Stationenarbeit', 'stations']
  ];

  var DEFAULT_MATERIALS = [
    ['material-binder',     'Hefter',          'binder'],
    ['material-book',       'Buch',            'book'],
    ['material-workbook',   'Arbeitsheft',     'workbook'],
    ['material-sheet',      'Arbeitsblatt',    'worksheet'],
    ['material-pen',        'Stift',           'pen'],
    ['material-tablet',     'Tablet/Computer', 'tablet'],
    ['material-headphones', 'Kopfhörer',       'headphones']
  ];

  function catalog(rows) {
    return rows.map(function (row) { return { id: row[0], name: row[1], icon: row[2], imageId: '' }; });
  }

  function defaultMaterials() { return catalog(DEFAULT_MATERIALS); }

    return { mediaId: '', name: '', kind: '', imageId: '', imageName: '' };
  }

  function defaults() {
    var buttons = [];
    for (var i = 0; i < MAX_BUTTONS; i++) buttons.push(emptyButton());
    return {
      // Welche Bausteine die Leiste auf Projektion und Whiteboard zeigt.
      // Anfangs keiner: Eine bestehende Projektion sieht aus wie bisher.
      show: { sounds: false, projection: false, phase: false, materials: false, timer: false },
      panelY: 0.08,                  // senkrechte Lage der Leiste am rechten Rand (0 … 1)
      phases: defaultPhases(),
      materials: defaultMaterials(),
      timerPresets: [5, 8, 10],      // Minuten für die Schnellwahl
      timerMinutes: 5,               // zuletzt gewählte Dauer

      phaseId: '',

    result.materials = repairCatalog(raw.materials, defaultMaterials);
    result.timerPresets = repairTimerPresets(raw.timerPresets);
    result.timerMinutes = boundedInt(raw.timerMinutes, base.timerMinutes, timer.MIN_MINUTES, timer.MAX_MINUTES);

/* js/core/migrations.js */
/* ==========================================================================
   Migrationen
   Jede Migration hebt den Datenbestand um genau eine Version an. Dadurch
   lassen sich alte Sicherungen auch nach Jahren noch einlesen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  /**
   * Reihenfolge ist bindend: Index 0 führt von Datenversion 0 auf 1 usw.
   * Eine Migration bekommt den Zustand, verändert ihn und gibt ihn zurück.
   */
  var STEPS = [
    {
      to: 1,
      describe: 'Vorabversionen: fehlende Grundfelder ergänzen',
      run: function (state) {
        // Frühe Testdaten kannten weder Abschnitte in Wortbanken noch Verläufe.
        (state.banks || []).forEach(function (bank) {
          if (!Array.isArray(bank.sections)) {
            bank.sections = [{
              id: BAO.util.uid('sec'),
              title: 'Wortschatz',
              layout: 'auto',
              items: Array.isArray(bank.items) ? bank.items : []
            }];
            delete bank.items;
          }
          if (typeof bank.defaultLevel !== 'number') bank.defaultLevel = 2;
        });
        (state.groups || []).forEach(function (group) {
          if (!Array.isArray(group.history)) group.history = [];
        });
        return state;
      }
    },
    {
      to: 2,
      describe: 'Tafeln und einfacher Modus ergänzt',
      run: function (state) {
        if (!Array.isArray(state.boards)) state.boards = [];
        if (!state.settings) state.settings = {};
        // Ein bestehender Bestand behält die vollständige Oberfläche. Wer die
        // einfache Grundform sehen möchte, schaltet sie in der Kopfzeile um.
        if (typeof state.settings.simpleMode !== 'boolean') state.settings.simpleMode = false;
        return state;
      }
    },
    {
      to: 3,
      describe: 'Whiteboards für Handschrift ergänzt',
      run: function (state) {
        if (!Array.isArray(state.whiteboards)) state.whiteboards = [];
        if (!state.settings) state.settings = {};
        if (!state.settings.whiteboard || typeof state.settings.whiteboard !== 'object') state.settings.whiteboard = {};
        return state;
      }
    },
    {
      to: 4,
      describe: 'Soundboard ergänzt: Klänge, Unterrichtsleiste, Phasen-Presets',
      run: function (state) {
        if (!Array.isArray(state.presets)) state.presets = [];
        // Die Einzelheiten ergänzt die Prüfung (classroom/model.js). Anfangs
        // zeigt die Leiste nichts: Eine bestehende Projektion bleibt, wie sie war.
        if (!state.classroom || typeof state.classroom !== 'object' || Array.isArray(state.classroom)) {
          state.classroom = BAO.classroomModel.defaults();
        }
        return state;
      }
    }

  /**
   * Hebt den Zustand auf die aktuelle Datenversion.
   * @returns {{state: object, applied: string[], error: string|null}}
   */
  function migrate(state) {
    var applied = [];
    var target = BAO.schema.SCHEMA_VERSION;
    var version = typeof state.schemaVersion === 'number' ? state.schemaVersion : 0;

    if (version > target) {
      return { state: state, applied: applied, error: 'Datenversion ' + version + ' ist neuer als diese Programmversion.' };
    }

    STEPS.forEach(function (step) {
      if (version < step.to && step.to <= target) {
        try {
          state = step.run(state) || state;
          version = step.to;
          state.schemaVersion = version;
          applied.push('v' + step.to + ': ' + step.describe);
        } catch (err) {
          throw new Error('Migration auf Version ' + step.to + ' fehlgeschlagen: ' + err.message);
        }
      }
    });

    state.schemaVersion = target;
    return { state: state, applied: applied, error: null };
  }

/* ==========================================================================
   Zustandsspeicher
   Ein einziger Zustand, veränderbar nur über commit(). Jeder commit legt eine
   Momentaufnahme für „Rückgängig“ an und speichert verzögert lokal.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var storage = BAO.storage;

  var state = null;
  var listeners = [];
  var undoStack = [];
  var redoStack = [];
  var MAX_HISTORY = 40;
  var storageState = 'ok';       // 'ok' | 'session' | 'error'
  var storageMessage = '';
  var lastSavedAt = '';

  var persist = util.debounce(function () { persistNow(); }, 300);

  function persistNow() {
    if (!state) return;
    state.meta.updatedAt = util.nowISO();
    var result = storage.saveState(state);
    // Speicher voll? Dann weicht zuerst die Sicherheitskopie eines früheren
    // Imports – der laufende Bestand ist wichtiger als sie.
    if (!result.ok && result.quota && storage.dropSafetyCopy()) result = storage.saveState(state);
    if (result.ok) {
      storageState = 'ok';
      storageMessage = '';
      lastSavedAt = util.nowISO();
    } else if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';
    } else {
      storageState = 'error';
      storageMessage = result.quota
        ? 'Der lokale Speicher ist voll. Bitte exportieren und nicht mehr benötigte Einträge archivieren.'
        : 'Die Daten konnten nicht gespeichert werden.';
    }
    emitStorage();
  }

  function emitStorage() {
    document.dispatchEvent(new CustomEvent('bao:storage', {
      detail: { state: storageState, message: storageMessage, savedAt: lastSavedAt }
    }));
  }

  function notify(meta) {
    listeners.forEach(function (fn) {
      try { fn(state, meta || {}); } catch (err) { console.error('Fehler in einem Zustandsbeobachter:', err); }
    });
  }

  /**
   * Der Bestand merkt sich, seit wann es Änderungen ohne Sicherungsdatei gibt
   * (meta.unsavedSince) und wann zuletzt exportiert wurde (meta.lastBackupAt).
   * Ein Bestand aus einer älteren Programmversion kennt beides noch nicht: Er
   * gilt ab jetzt als ungesichert – niemand weiß, ob es eine Datei gibt.
   * Ein frisch angelegter Bestand hat dagegen noch nichts zu sichern.
   */

    var meta = target.meta;
    if (meta.changedAt === undefined) {
      var legacy = !fresh && !meta.lastBackupAt;
      meta.changedAt = legacy ? (meta.updatedAt || util.nowISO()) : '';
      if (meta.unsavedSince === undefined) meta.unsavedSince = legacy ? util.nowISO() : '';

  /* --- Initialisierung ---------------------------------------------------- */

  function init(options) {
    options = options || {};
    var loaded = storage.loadState();
    var startedFresh = false;

    if (loaded) {
      try {

        if (migrated.error) {
          console.warn(migrated.error);
          storageState = 'error';
          storageMessage = migrated.error;
        }
        var checked = schema.validateState(migrated.state);
        state = checked.state;
        if (checked.warnings.length) console.warn('Daten repariert:', checked.warnings);
      } catch (err) {
        console.error('Der gespeicherte Bestand konnte nicht gelesen werden:', err);
        storage.saveSafetyCopy(loaded);
        state = schema.emptyState();
        startedFresh = true;
        storageState = 'error';
        storageMessage = 'Der gespeicherte Bestand war beschädigt. Eine Sicherungskopie liegt im Bereich „Daten“.';
      }

      state = schema.emptyState();
      startedFresh = true;
      if (options.seed !== false && BAO.seed) BAO.seed.fill(state);
    }

    state.meta.appVersion = schema.APP_VERSION;
    trackBackupFields(state, startedFresh);
    if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';

    window.addEventListener('beforeunload', function () { persist.cancel(); persistNow(); });

  /**

  function commit(label, mutator, options) {

  /** Ersetzt den gesamten Bestand (Import, Wiederherstellung). */

    if (undoStack.length > MAX_HISTORY) undoStack.shift();

    var entry = undoStack.pop();
    var previousMeta = state.meta;
    redoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    keepBackupTrack(previousMeta);
    persist.cancel();
    persistNow();
    notify({ reason: 'undo', label: entry.label });
    return entry.label;
  }

  function redo() {
    if (!redoStack.length) return null;
    var entry = redoStack.pop();
    var previousMeta = state.meta;
    undoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    keepBackupTrack(previousMeta);
    persist.cancel();
    persistNow();
    notify({ reason: 'redo', label: entry.label });
    return entry.label;
  }

    return {
      state: storageState,
      message: storageMessage,
      savedAt: lastSavedAt,
      bytes: storage.approximateSize(),
      usage: storage.usage(),
      available: storage.isAvailable()

/* js/core/search.js */
/* ==========================================================================
   Suche
   Eine einfache, aber akzentunempfindliche Volltextsuche über den gesamten
   Bestand. Kein Index nötig: bei realistischen Größen (einige Tausend
   Einträge) ist die lineare Suche schnell genug und bleibt nachvollziehbar.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var select = BAO.select;

  function haystackLexeme(lex) {
    return [lex.term, lex.article, lex.translation, lex.collocation, lex.chunk,
      lex.explanation, lex.example, lex.gram, (lex.topics || []).join(' '), (lex.tags || []).join(' ')]
      .join('  ');
  }

  function haystackStarter(sta) {
    return [sta.text, sta.translation, sta.note, (sta.tags || []).join(' ')].join('  ');
  }

  /** Bewertung: Treffer am Wortanfang wiegen schwerer als irgendwo im Text. */
  function score(haystack, needle) {
    var hay = util.fold(haystack);
    var pos = hay.indexOf(needle);
    if (pos < 0) return 0;
    if (pos === 0) return 100;
    var before = hay.charAt(pos - 1);
    if (/[\s'’(\[«-]/.test(before)) return 70;
    return 40;
  }

  function matchesLexeme(lex, needle) { return score(haystackLexeme(lex), needle) > 0; }
  function matchesStarter(sta, needle) { return score(haystackStarter(sta), needle) > 0; }

   * Globale Suche über Lerngruppen, Wortbanken, Wortschatz und Satzanfänge.
   * Liefert eine flache, nach Relevanz sortierte Liste mit Sprungzielen.
   */
  function global(state, query, options) {
    options = options || {};
    var needle = util.fold(query);
    var results = [];
    if (needle.length < 1) return results;
    var limit = options.limit || 40;

    state.groups.forEach(function (g) {
      var sub = select.subject(state, g.subjectId);
      var s = score((sub ? sub.name + ' ' : '') + g.name + ' Klasse ' + g.grade, needle);
      if (s) results.push({ type: 'group', score: s + 12, title: g.name + ' · ' + (sub ? sub.name : ''),
        meta: 'Lerngruppe · Jahrgang ' + g.grade + ' · ' + g.schoolYear, id: g.id, groupId: g.id, subjectId: g.subjectId });
    });

    state.banks.forEach(function (b) {
      var g = select.group(state, b.groupId);
      var s = score(b.title + ' ' + b.scene + ' ' + (b.note || ''), needle);
      if (s) results.push({ type: 'bank', score: s + 16, title: b.title,
        meta: 'Wortbank · ' + b.scene + (g ? ' · ' + g.name : ''), id: b.id, groupId: b.groupId, subjectId: b.subjectId });
    });

    (state.boards || []).forEach(function (b) {
      var g = select.group(state, b.groupId);
      var s = score(b.title + ' ' + (b.note || ''), needle);
      if (s) results.push({ type: 'board', score: s + 16, title: b.title,
        meta: 'Tafel · ' + (b.items || []).length + ' Elemente' + (g ? ' · ' + g.name : ''),
        id: b.id, groupId: b.groupId, subjectId: b.subjectId });
    });

    (state.whiteboards || []).forEach(function (w) {
      var g = select.group(state, w.groupId);
      var s = score(w.title + ' ' + (w.note || ''), needle);
      if (s) results.push({ type: 'whiteboard', score: s + 16, title: w.title,
        meta: 'Whiteboard · ' + (w.strokes || []).length + ' Striche' + (g ? ' · ' + g.name : ''),
        id: w.id, groupId: w.groupId, subjectId: w.subjectId });
    });

    state.units.forEach(function (u) {
      var g = select.group(state, u.groupId);
      var s = score(u.title + ' ' + (u.description || ''), needle);
      if (s) results.push({ type: 'unit', score: s, title: u.title,
        meta: 'Unterrichtsreihe · ' + (g ? g.name + ' · ' : '') + u.schoolYear, id: u.id, groupId: u.groupId,
        subjectId: g ? g.subjectId : '' });
    });

    state.lexemes.forEach(function (l) {
      var s = score(haystackLexeme(l), needle);
      if (s) {
        var g = select.group(state, l.groupId);
        results.push({ type: 'lexeme', score: s, title: (l.article ? l.article + ' ' : '') + l.term,
          meta: [l.translation, g ? g.name : '', BAO.schema.statusInfo(l.status).short].filter(Boolean).join(' · '),

    state.starters.forEach(function (sta) {
      var s = score(haystackStarter(sta), needle);

          meta: 'Satzanfang · ' + select.functionLabel(state, sta.functionId),
          id: sta.id, groupId: sta.groupId, subjectId: sta.subjectId });
      }
    });

    results.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.title.localeCompare(b.title, 'de');
    });

    global: global,
    matchesLexeme: matchesLexeme,
    matchesStarter: matchesStarter,
    score: score
  };

/* js/core/csv.js */
/* ==========================================================================

   Bewusst tolerant: erkennt Trennzeichen selbst, akzeptiert Anführungszeichen
   und ordnet gängige Spaltennamen automatisch zu. Die Zuordnung bleibt aber

  'use strict';

  var util = BAO.util;

  /** Erkennt das wahrscheinlichste Trennzeichen der ersten Zeilen. */
  function detectDelimiter(text) {
    var sample = text.split(/\r?\n/).slice(0, 5).join('\n');
    var candidates = [';', ',', '\t', '|'];
    var best = ';';
    var bestCount = 0;
    candidates.forEach(function (d) {
      var count = sample.split(d).length - 1;
      if (count > bestCount) { bestCount = count; best = d; }
    });
    return bestCount === 0 ? ';' : best;
  }

  /** Vollständiger CSV-Parser (Anführungszeichen, eingebettete Zeilenumbrüche). */
  function parse(text, delimiter) {
    var d = delimiter || detectDelimiter(text);
    var rows = [];
    var row = [];
    var value = '';
    var inQuotes = false;
    var i = 0;

    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // BOM entfernen

    while (i < text.length) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { value += '"'; i += 2; continue; }
          inQuotes = false; i += 1; continue;
        }
        value += ch; i += 1; continue;
      }
      if (ch === '"' && value === '') { inQuotes = true; i += 1; continue; }
      if (ch === d) { row.push(value); value = ''; i += 1; continue; }
      if (ch === '\r') { i += 1; continue; }
      if (ch === '\n') { row.push(value); rows.push(row); row = []; value = ''; i += 1; continue; }
      value += ch; i += 1;
    }
    row.push(value);
    rows.push(row);

    rows = rows.filter(function (r) {
      return r.some(function (cell) { return String(cell).trim() !== ''; });
    }).map(function (r) {
      return r.map(function (cell) { return String(cell).trim(); });
    });

    return { delimiter: d, rows: rows };

  var ALIASES = {
    term:          ['zielwort', 'wort', 'vokabel', 'begriff', 'ausdruck', 'term', 'word', 'expression', 'fremdsprache'],
    article:       ['artikel', 'article', 'genus'],
    gram:          ['form', 'formhinweis', 'grammatik', 'plural', 'grammar'],
    collocation:   ['wortverbindung', 'kollokation', 'collocation', 'verbindung'],
    chunk:         ['chunk', 'baustein', 'wendung'],
    explanation:   ['erklaerung', 'erklärung', 'definition', 'explanation', 'umschreibung'],
    translation:   ['deutsch', 'uebersetzung', 'übersetzung', 'translation', 'german', 'bedeutung'],
    example:       ['beispiel', 'beispielsatz', 'example', 'satz'],
    pronunciation: ['aussprache', 'lautschrift', 'pronunciation', 'ipa', 'betonung'],
    topics:        ['thema', 'themen', 'topic', 'topics', 'wortfeld'],
    tags:          ['tag', 'tags', 'schlagwort', 'schlagwoerter', 'schlagwörter'],
    cefr:          ['niveau', 'level', 'cefr', 'ger'],
    status:        ['status', 'zustand']

   * Wandelt Datenzeilen in Wortschatzeinträge um.
   * @returns {{entries: object[], skipped: number, duplicates: object[]}}
   */
  function toLexemes(rows, mapping, defaults, existing) {

    rows.forEach(function (row) {

        gram: cell('gram'),
        collocation: cell('collocation'),
        chunk: cell('chunk'),
        explanation: cell('explanation'),
        translation: cell('translation'),
        example: cell('example'),
        pronunciation: cell('pronunciation'),

        tags: splitList(cell('tags')),
        cefr: cell('cefr'),
        status: normaliseStatus(cell('status'), defaults.status || 'new'),

  }

  /* --- Export --------------------------------------------------------------- */

  var EXPORT_FIELDS = ['term', 'article', 'gram', 'collocation', 'chunk', 'explanation',
    'translation', 'example', 'pronunciation', 'topics', 'tags', 'cefr', 'status'];

  function escapeCell(value) {
    var text = value === null || value === undefined ? '' : String(value);
    if (/["\n;]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  function lexemesToCsv(lexemes) {
    var lines = [EXPORT_FIELDS.map(function (f) { return FIELD_LABELS[f]; }).join(';')];
    lexemes.forEach(function (lex) {

  /**
   * Zerlegt eingefügte Zeilen der Form

    var filename = suggestFilename(state);
    var current = !!BAO.store && BAO.store.getState() === state;
    var plan = BAO.media ? BAO.media.planExport(BAO.classroomModel.mediaIds(state)) : { included: [], skipped: [], bytes: 0 };
    var summary = {
      files: plan.included.length, bytes: plan.bytes,
      skipped: plan.skipped.map(function (entry) { return entry.name; })
    };
    var done;

    if (!plan.included.length) {
      util.downloadText(filename, JSON.stringify(payload, null, 2), 'application/json');
      if (current) markBackedUp(payload.exportedAt);
      done = Promise.resolve(summary);
    } else {
      // Stück für Stück zusammensetzen: Eine einzige Zeichenkette mit allen
      // Dateien wäre für den Browser unnötig schwer.
      var head = JSON.stringify(payload, null, 2);
      var parts = [head.slice(0, head.lastIndexOf('}')).replace(/\s+$/, '') + ',\n  "media": [\n'];
      done = plan.included.reduce(function (chain, entry, index) {
        return chain.then(function () { return BAO.media.exportEntry(entry.id); }).then(function (item) {
          if (item) parts.push((index ? ',\n' : '') + '    ' + JSON.stringify(item));
        });
      }, Promise.resolve()).then(function () {
        parts.push('\n  ]\n}\n');
        util.downloadBlob(filename, new Blob(parts, { type: 'application/json;charset=utf-8' }));
        if (current && BAO.store.getState().meta) markBackedUp(payload.exportedAt);
        return summary;
      });
    }
    // Nicht aufzählbar: gehört nicht in die Datei.
    Object.defineProperty(payload, 'done', { value: done, enumerable: false });
    return payload;
  }

  /* --- Stand der Sicherung ---------------------------------------------------
     Alles liegt nur im Browser dieses Rechners. Eine Sicherungsdatei ist der
     einzige Schutz vor einem geleerten Browserspeicher – und der Weg auf einen
     anderen Rechner. Deshalb merkt sich der Bestand, wann zuletzt exportiert
     wurde und seit wann es ungesicherte Änderungen gibt. */

  var DAY = 24 * 60 * 60 * 1000;
  var REMIND_AFTER_DAYS = 7;

  function markBackedUp(at) {
    BAO.store.commit('Sicherung erstellt', function (draft) {
      draft.meta.lastBackupAt = at || util.nowISO();
      draft.meta.unsavedSince = '';
    }, { undoable: false });
  }

  /**
   * @returns {{last: string, never: boolean, dirty: boolean, ageDays: number|null,
   *            unsavedDays: number, due: boolean}}
   * due = es gibt seit mindestens einer Woche Änderungen ohne Sicherungsdatei.
   */
  function status(state, now) {
    var meta = (state && state.meta) || {};
    var nowMs = now ? new Date(now).getTime() : Date.now();
    var last = meta.lastBackupAt || '';
    var since = meta.unsavedSince || '';
    function daysSince(iso) {
      var t = new Date(iso).getTime();
      return isNaN(t) ? 0 : Math.max(0, Math.floor((nowMs - t) / DAY));
    }
    var unsavedDays = since ? daysSince(since) : 0;
    return {
      last: last,
      never: !last,
      dirty: !!since,
      ageDays: last ? daysSince(last) : null,
      unsavedDays: unsavedDays,
      due: !!since && unsavedDays >= REMIND_AFTER_DAYS
    };
  }

  /** Kurze Auskunft für Fußzeile und Datenansicht. */
  function statusLabel(info) {
    if (info.never) return info.dirty ? 'Noch keine Sicherungsdatei' : 'Noch nichts zu sichern';
    var when = util.relativeDate(info.last);
    return info.dirty ? 'Letzte Sicherungsdatei: ' + when : 'Sicherungsdatei: ' + when;
  }

  /**
   * Liest und prüft eine Sicherungsdatei.
   * @returns {{ok:boolean, errors:string[], warnings:string[], incoming:object|null, meta:object, media:object[]}}
   *          media = die mitgesicherten Klang- und Bilddateien des Soundboards
   */
  function analyse(text, currentState) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      return { ok: false, errors: ['Die Datei ist keine gültige JSON-Datei. (' + err.message + ')'], warnings: [], incoming: null, meta: {} };
    }

    var payload = parsed;
    var meta = {};
    var media = [];

    if (parsed && parsed.kind === schema.EXPORT_KIND && parsed.data) {
      payload = parsed.data;
      if (Array.isArray(parsed.media)) media = parsed.media;
      meta = {
        exportedAt: parsed.exportedAt || '',
        appVersion: parsed.appVersion || '',
        schemaVersion: parsed.schemaVersion
      };
    } else if (parsed && parsed.schemaVersion !== undefined && parsed.lexemes !== undefined) {
      meta = { exportedAt: (parsed.meta && parsed.meta.updatedAt) || '', appVersion: (parsed.meta && parsed.meta.appVersion) || '' };
    } else {
      return {
        ok: false,
        errors: ['Die Datei stammt nicht aus Boîte à Oublis (Kennzeichen „' + schema.EXPORT_KIND + '“ fehlt).'],
        warnings: [], incoming: null, meta: {}
      };
    }

    var migrated;
    try {
      migrated = BAO.migrations.migrate(util.clone(payload));
    } catch (err) {
      return { ok: false, errors: [err.message], warnings: [], incoming: null, meta: meta };
    }
    if (migrated.error) {
      return { ok: false, errors: [migrated.error], warnings: [], incoming: null, meta: meta };
    }

    var checked = schema.validateState(migrated.state);
    if (!checked.ok) {
      return { ok: false, errors: checked.errors, warnings: checked.warnings, incoming: null, meta: meta };
    }

    meta.migrations = migrated.applied;
    meta.counts = counts(checked.state);
    meta.currentCounts = counts(currentState);
    return { ok: true, errors: [], warnings: checked.warnings, incoming: checked.state, meta: meta, media: media };
  }

  /**
   * Übernimmt aus einer eingelesenen Sicherung die Dateien, die der neue
   * Bestand braucht – nicht mehr. Was schon in der Medienablage liegt, bleibt.
   * @returns {Promise<{added: number, failed: number}>}
   */
  function restoreMedia(media, state) {
    if (!BAO.media || !media || !media.length) return Promise.resolve({ added: 0, failed: 0 });
    return BAO.media.importEntries(media, BAO.classroomModel.mediaIds(state));
  }

  /* --- Zusammenführen ------------------------------------------------------ */

  var MERGE_COLLECTIONS = ['subjects', 'groups', 'units', 'lexemes', 'starters', 'banks', 'boards', 'whiteboards', 'presets', 'functions'];

  function newerThan(a, b) {
    var ta = (a && (a.updatedAt || a.createdAt)) || '';
    var tb = (b && (b.updatedAt || b.createdAt)) || '';
    return ta > tb;
  }

  /**
   * Fügt den eingelesenen Bestand in den vorhandenen ein.
   * Regeln:
   *  - unbekannte Kennung  -> wird hinzugefügt
   *  - bekannte Kennung    -> der jüngere Datensatz gewinnt
   *  - Einstellungen bleiben lokal erhalten – auch die des Soundboards
   *    (Klangtasten, Symbole, Leiste); nur seine Phasen-Presets kommen hinzu
   */
  function merge(currentState, incoming) {
    var result = util.clone(currentState);
    var report = { added: {}, updated: {}, kept: {} };

    MERGE_COLLECTIONS.forEach(function (name) {
      var index = new Map();
      (result[name] || []).forEach(function (item, i) { index.set(item.id, i); });
      report.added[name] = 0;
      report.updated[name] = 0;
      report.kept[name] = 0;

      (incoming[name] || []).forEach(function (item) {
        if (!index.has(item.id)) {
          result[name].push(util.clone(item));
          index.set(item.id, result[name].length - 1);
          report.added[name] += 1;
          return;
        }
        var position = index.get(item.id);
        var existing = result[name][position];
        if (newerThan(item, existing)) {
          result[name][position] = util.clone(item);
          report.updated[name] += 1;
        } else {
          report.kept[name] += 1;
        }
      });
    });

    // Verwaiste Wortbank-Positionen nach dem Zusammenführen bereinigen.
    var checked = schema.validateState(result);
    report.warnings = checked.warnings;
    return { state: checked.state, report: report };
  }

  function summariseReport(report) {
    var lines = [];
    MERGE_COLLECTIONS.forEach(function (name) {
      if (name === 'functions') return;
      var added = report.added[name] || 0;
      var updated = report.updated[name] || 0;
      if (!added && !updated) return;
      lines.push((COUNT_LABELS[name] || name) + ': ' + added + ' neu, ' + updated + ' aktualisiert');
    });
    return lines;
  }

  BAO.backup = {
    buildExport: buildExport,
    exportToFile: exportToFile,
    markBackedUp: markBackedUp,
    status: status,
    statusLabel: statusLabel,
    REMIND_AFTER_DAYS: REMIND_AFTER_DAYS,
    suggestFilename: suggestFilename,
    analyse: analyse,
    restoreMedia: restoreMedia,
    merge: merge,
    counts: counts,
    COUNT_LABELS: COUNT_LABELS,
    summariseReport: summariseReport
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/core/stock.js */
/* ==========================================================================
   Bestandspflege
   Alles, was mehrere Ansichten über den Bestand wissen müssen und was über
   eine reine Abfrage hinausgeht:

   - Einträge am Text wiedererkennen (damit beim Tippen keine Dubletten
     entstehen),
   - Lerngruppen und Fächer vollständig entfernen – mitsamt Tafeln und
     Whiteboards,
   - Tafeln, Whiteboards und Wortbanken für eine andere Lerngruppe kopieren
     (die Parallelklasse),
   - Einträge auf eine Tafel legen,
   - Wortlisten für Druck und Zwischenablage zusammenstellen.

   Die verändernden Funktionen erwarten den Entwurf eines commit-Mutators.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var select = BAO.select;

  /* --- Wiedererkennen --------------------------------------------------------- */

  /**
   * Vergleichsform eines Textes: Apostrophe und Leerraum vereinheitlicht,
   * Leerstellen in jeder Schreibweise gleich. Groß- und Kleinschreibung sowie
   * Akzente bleiben bedeutsam – „ou“ ist nicht „où“.
   */
  function normalize(text) {
    return String(text == null ? '' : text)
      .replace(/[‘’']/g, "'")
      .replace(/(_{2,}|\.{3,}|…)/g, '___')
      .replace(/\s+/g, ' ')
      .trim();
  }

  /** So, wie der Eintrag geschrieben dasteht: „le stage“, „l’entreprise“. */
  function labelOf(lex) { return BAO.ui.termLabel(lex); }

  /**
   * Sucht im Bestand einer Lerngruppe den Eintrag, der genau so geschrieben
   * wird. Die vollständige Form mit Artikel hat Vorrang vor dem bloßen
   * Zielwort.
   */
  function findLexeme(state, groupId, text, exceptId) {
    var needle = normalize(text);
    if (!needle || !groupId) return null;
    var byTerm = null;
    var list = select.lexemesOfGroup(state, groupId);
    for (var i = 0; i < list.length; i++) {
      var lex = list[i];
      if (lex.id === exceptId) continue;
      if (normalize(labelOf(lex)) === needle) return lex;
      if (!byTerm && normalize(lex.term) === needle) byTerm = lex;
    }
    return byTerm;
  }

  /** Dasselbe für Satzanfänge der Lerngruppe (einschließlich der fachweiten). */
  function findStarter(state, groupId, subjectId, text, exceptId) {
    var needle = normalize(text);
    if (!needle) return null;
    var list = select.startersOfGroup(state, groupId, subjectId);
    for (var i = 0; i < list.length; i++) {
      if (list[i].id !== exceptId && normalize(list[i].text) === needle) return list[i];
    }
    return null;
  }

  /**
   * Was steht zu einem getippten Text schon im Bestand?
   * @returns {{kind: 'lex'|'starter', ref: object}|null}
   */
  function findEntry(state, groupId, subjectId, text) {
    var lex = findLexeme(state, groupId, text);
    if (lex) return { kind: 'lex', ref: lex };
    var starter = findStarter(state, groupId, subjectId, text);
    return starter ? { kind: 'starter', ref: starter } : null;
  }

  /* --- Lerngruppen und Fächer entfernen ---------------------------------------- */

  function idMap(ids) {
    var map = Object.create(null);
    (ids || []).forEach(function (id) { map[id] = true; });
    return map;
  }

  /** Was hängt an diesen Lerngruppen? Für die Rückfrage vor dem Löschen. */
  function contentOfGroups(state, groupIds) {
    var gone = idMap(groupIds);
    function count(list) { return (list || []).filter(function (item) { return gone[item.groupId]; }).length; }
    return {
      groups: (groupIds || []).length,
      units: count(state.units),
      lexemes: count(state.lexemes),
      starters: count(state.starters),
      banks: count(state.banks),
      boards: count(state.boards),
      whiteboards: count(state.whiteboards)
    };
  }

  /** Dasselbe für ein ganzes Fach – fachweite Satzanfänge zählen mit. */
  function contentOfSubject(state, subjectId) {
    function count(list) { return (list || []).filter(function (item) { return item.subjectId === subjectId; }).length; }
    var groupIds = state.groups.filter(function (g) { return g.subjectId === subjectId; }).map(function (g) { return g.id; });
    var gone = idMap(groupIds);
    return {
      groups: groupIds.length,
      units: state.units.filter(function (u) { return gone[u.groupId]; }).length,
      lexemes: count(state.lexemes),
      starters: count(state.starters),
      banks: count(state.banks),
      boards: count(state.boards),
      whiteboards: count(state.whiteboards)
    };
  }

  /** „12 Wortschatzeinträge, 2 Tafeln und 1 Whiteboard“ – nur was vorhanden ist. */
  function describeContent(counts) {
    var parts = [];
    function add(n, one, many) { if (n) parts.push(n + ' ' + util.plural(n, one, many)); }
    add(counts.lexemes, 'Wortschatzeintrag', 'Wortschatzeinträge');
    add(counts.starters, 'Satzanfang', 'Satzanfänge');
    add(counts.banks, 'Wortbank', 'Wortbanken');
    add(counts.boards, 'Tafel', 'Tafeln');
    add(counts.whiteboards, 'Whiteboard', 'Whiteboards');
    add(counts.units, 'Unterrichtsreihe', 'Unterrichtsreihen');
    if (!parts.length) return '';
    if (parts.length === 1) return parts[0];
    return parts.slice(0, -1).join(', ') + ' und ' + parts[parts.length - 1];
  }

  function cleanRecents(draft) {
    var bankIds = idMap(draft.banks.map(function (b) { return b.id; }));
    var groupIds = idMap(draft.groups.map(function (g) { return g.id; }));
    draft.ui.recentBanks = (draft.ui.recentBanks || []).filter(function (id) { return bankIds[id]; });
    draft.ui.recentGroups = (draft.ui.recentGroups || []).filter(function (id) { return groupIds[id]; });
  }

  /**
   * Entfernt Lerngruppen mit allem, was ihnen gehört: Reihen, Wortschatz,
   * Satzanfänge, Wortbanken – und ebenso Tafeln und Whiteboards, die sonst
   * unsichtbar im Bestand zurückblieben.
   */
  function removeGroups(draft, groupIds) {
    var gone = idMap(groupIds);
    function keep(item) { return !gone[item.groupId]; }
    draft.groups = draft.groups.filter(function (g) { return !gone[g.id]; });
    draft.units = draft.units.filter(keep);
    draft.lexemes = draft.lexemes.filter(keep);
    draft.starters = draft.starters.filter(keep);
    draft.banks = draft.banks.filter(keep);
    draft.boards = (draft.boards || []).filter(keep);
    draft.whiteboards = (draft.whiteboards || []).filter(keep);
    if (gone[draft.ui.groupId]) draft.ui.groupId = '';
    cleanRecents(draft);
  }

  /** Entfernt ein Fach vollständig. */
  function removeSubject(draft, subjectId) {
    var groupIds = draft.groups.filter(function (g) { return g.subjectId === subjectId; })
      .map(function (g) { return g.id; });
    removeGroups(draft, groupIds);
    function keep(item) { return item.subjectId !== subjectId; }
    draft.subjects = draft.subjects.filter(function (s) { return s.id !== subjectId; });
    draft.lexemes = draft.lexemes.filter(keep);
    draft.starters = draft.starters.filter(keep);
    draft.banks = draft.banks.filter(keep);
    draft.boards = (draft.boards || []).filter(keep);
    draft.whiteboards = (draft.whiteboards || []).filter(keep);
    if (draft.ui.subjectId === subjectId) {
      draft.ui.subjectId = draft.subjects[0] ? draft.subjects[0].id : '';
      draft.ui.groupId = '';
    }
    cleanRecents(draft);
  }

  /** Löst die Zuordnung zu einer Unterrichtsreihe – überall, wo sie steht. */
  function detachUnit(draft, unitId) {
    draft.lexemes.forEach(function (l) { if (l.introducedUnitId === unitId) l.introducedUnitId = ''; });
    [draft.banks, draft.boards || [], draft.whiteboards || []].forEach(function (list) {
      list.forEach(function (item) { if (item.unitId === unitId) item.unitId = ''; });
    });
  }

  /* --- Beispieldaten ----------------------------------------------------------- */

  var SAMPLE_GROUPS = ['grp_fr9b', 'grp_en10a'];

  /** Die mitgelieferten Beispiel-Lerngruppen, soweit sie noch im Bestand liegen. */
  function sampleGroups(state) {
    if (!state || !state.meta || !state.meta.seededAt) return [];
    return state.groups.filter(function (g) { return SAMPLE_GROUPS.indexOf(g.id) >= 0; });
  }

  function hasSampleData(state) { return sampleGroups(state).length > 0; }

  /**
   * Entfernt die Beispiel-Lerngruppen mit allem, was ihnen gehört. Die Fächer
   * bleiben – unter ihnen liegen oft schon die eigenen Lerngruppen.
   */
  function removeSampleData(draft) {
    var ids = sampleGroups(draft).map(function (g) { return g.id; });
    removeGroups(draft, ids);
    // Der Arbeitskontext zeigt danach auf etwas Eigenes, falls vorhanden.
    var subject = select.subject(draft, draft.ui.subjectId);
    var own = subject ? select.groupsOfSubject(draft, subject.id) : [];
    if (!own.length) {
      var other = draft.groups.filter(function (g) { return !g.archived; })[0];
      if (other) { draft.ui.subjectId = other.subjectId; draft.ui.groupId = other.id; }
    } else if (!draft.ui.groupId) {
      draft.ui.groupId = own[0].id;
    }
    return ids.length;
  }

  /* --- Für eine andere Lerngruppe kopieren -------------------------------------- */

  /** Lerngruppen, in die sich etwas kopieren lässt: dasselbe Fach, nicht archiviert. */
  function siblingGroups(state, item) {
    return select.groupsOfSubject(state, item.subjectId).filter(function (g) { return g.id !== item.groupId; });
  }

  /**
   * Sucht zu einem Eintrag das Gegenstück in der Ziel-Lerngruppe oder legt es
   * dort an. Fachweite Satzanfänge gelten ohnehin für alle Lerngruppen.
   */
  function counterpart(draft, kind, refId, target, cache, report) {
    var key = kind + ':' + refId;
    if (cache[key] !== undefined) return cache[key];
    var now = util.nowISO();
    var unit = select.currentUnit(draft, target.id);

    if (kind === 'starter') {
      var starter = select.starter(draft, refId);
      if (!starter) return (cache[key] = null);
      if (!starter.groupId && starter.subjectId === target.subjectId) return (cache[key] = starter.id);
      var sameStarter = findStarter(draft, target.id, target.subjectId, starter.text);
      if (sameStarter) { report.reused += 1; return (cache[key] = sameStarter.id); }
      var starterCopy = Object.assign(util.clone(starter), {
        id: util.uid('sta'), subjectId: target.subjectId, groupId: target.id,
        createdAt: now, updatedAt: now
      });
      draft.starters.push(starterCopy);
      report.created += 1;
      return (cache[key] = starterCopy.id);
    }

    var lex = select.lexeme(draft, refId);
    if (!lex) return (cache[key] = null);
    var sameLexeme = findLexeme(draft, target.id, labelOf(lex));
    if (sameLexeme) { report.reused += 1; return (cache[key] = sameLexeme.id); }
    var lexCopy = Object.assign(util.clone(lex), {
      id: util.uid('lex'), subjectId: target.subjectId, groupId: target.id,
      status: 'new', favorite: false,
      introducedUnitId: unit ? unit.id : '', introducedSchoolYear: target.schoolYear || '',
      createdAt: now, updatedAt: now
    });
    draft.lexemes.push(lexCopy);
    report.created += 1;
    return (cache[key] = lexCopy.id);
  }

  function freshCopy(source, target, draft, prefix) {
    var now = util.nowISO();
    var unit = select.currentUnit(draft, target.id);
    return Object.assign(util.clone(source), {
      id: util.uid(prefix), subjectId: target.subjectId, groupId: target.id,
      unitId: unit ? unit.id : '', favorite: false, lastUsedAt: '',
      createdAt: now, updatedAt: now
    });
  }

  function newReport(target) { return { id: '', group: target, created: 0, reused: 0, items: 0 }; }

  /** Kopiert eine Tafel; ihre Elemente verweisen danach auf den Bestand der Zielgruppe. */
  function copyBoardTo(draft, boardId, targetGroupId) {
    var board = select.board(draft, boardId);
    var target = select.group(draft, targetGroupId);
    if (!board || !target) return null;
    var report = newReport(target);
    var cache = {};
    var copy = freshCopy(board, target, draft, 'brd');
    copy.items = (board.items || []).map(function (item) {
      var refId = counterpart(draft, item.kind, item.refId, target, cache, report);
      if (!refId) return null;
      return Object.assign(util.clone(item), { id: util.uid('bit'), refId: refId });
    }).filter(Boolean);
    draft.boards.push(copy);
    report.id = copy.id;
    report.items = copy.items.length;
    return report;
  }

  /** Kopiert eine Wortbank samt Abschnitten. */
  function copyBankTo(draft, bankId, targetGroupId) {
    var bank = select.bank(draft, bankId);
    var target = select.group(draft, targetGroupId);
    if (!bank || !target) return null;
    var report = newReport(target);
    var cache = {};
    var copy = freshCopy(bank, target, draft, 'bnk');
    copy.sections = (bank.sections || []).map(function (section) {
      var sectionCopy = Object.assign(util.clone(section), { id: util.uid('sec') });
      sectionCopy.items = (section.items || []).map(function (item) {
        var refId = counterpart(draft, item.kind, item.refId, target, cache, report);
        if (!refId) return null;
        report.items += 1;
        return Object.assign(util.clone(item), { id: util.uid('itm'), refId: refId });
      }).filter(Boolean);
      return sectionCopy;
    });
    draft.banks.push(copy);
    report.id = copy.id;
    return report;
  }

  /** Kopiert ein Whiteboard – Handschrift hängt an keinem Bestand. */
  function copyWhiteboardTo(draft, whiteboardId, targetGroupId) {
    var board = select.whiteboard(draft, whiteboardId);
    var target = select.group(draft, targetGroupId);
    if (!board || !target) return null;
    var report = newReport(target);
    var copy = freshCopy(board, target, draft, 'wbd');
    copy.strokes = (copy.strokes || []).map(function (stroke) {
      stroke.id = util.uid('stk');
      return stroke;
    });
    draft.whiteboards.push(copy);
    report.id = copy.id;
    report.items = copy.strokes.length;
    return report;
  }

  /* --- Zuletzt verwendet ----------------------------------------------------------- */

  var WORK_LABEL = { board: 'Tafel', whiteboard: 'Whiteboard', bank: 'Wortbank' };
  var WORK_ROUTE = { board: 'tafel/', whiteboard: 'whiteboard/', bank: 'wortbank/' };

  /**
   * Woran zuletzt gearbeitet wurde – Tafeln, Whiteboards und Wortbanken aller
   * Lerngruppen in einer Liste, das Jüngste zuerst. Für Startseite und
   * Schnellsuche: Der Weg in die nächste Stunde beginnt meist dort, wo die
   * letzte aufgehört hat.
   * options.banks === false lässt die Wortbanken aus (einfache Grundform).
   */
  function recentWork(state, limit, options) {
    options = options || {};
    var list = [];
    function collect(type, items) {
      (items || []).forEach(function (item) {
        var group = select.group(state, item.groupId);

      type: 'button', 'aria-label': 'Meldung schließen', text: '×', onclick: close

   Entscheidungen. Tastaturbedienung inklusive: Esc schließt, Enter in einem

     Esc-Taste zuerst bekommen – sonst schließt Esc gleich den ganzen Dialog

      // Formular. Bewusst erst in der Aufstiegsphase: Ein Feld, das Enter
