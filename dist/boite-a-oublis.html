/* styles/tokens.css */
/* ==========================================================================
   Boîte à Oublis – Gestaltungstoken
   Eine einzige Quelle für Farben, Abstände, Radien und Typografie.
   Farben tragen Bedeutung: Fachfarbe, Status, Unterstützungsstufe.
   ========================================================================== */

:root {
  /* --- Typografie: ausschließlich systemeigene Schriften (offline-tauglich) */
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
             Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Semibold", var(--font-ui);
  --font-mono: "Cascadia Mono", Consolas, "SF Mono", "DejaVu Sans Mono", monospace;

  --fs-xs: 0.72rem;
  --fs-sm: 0.82rem;
  --fs-md: 0.92rem;
  --fs-lg: 1.05rem;
  --fs-xl: 1.32rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.3rem;

  /* --- Abstände (4px-Raster) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  /* --- Radien und Schatten */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(20, 26, 38, .07), 0 1px 3px rgba(20, 26, 38, .05);
  --shadow-2: 0 6px 16px rgba(20, 26, 38, .10), 0 2px 5px rgba(20, 26, 38, .06);
  --shadow-3: 0 18px 48px rgba(15, 20, 30, .22);

  /* --- Helles Grundthema: warmes Papier, ruhige Tinte */
  --paper: #f6f3ee;
  --surface: #ffffff;
  --surface-2: #fbf9f6;
  --surface-sunken: #efeae3;
  --ink: #1a1f28;
  --ink-2: #3c4553;
  --muted: #6b7382;
  --line: #e0d9d0;
  --line-strong: #cdc3b7;

  --brand: #1f4f6b;
  --brand-ink: #16394d;
  --brand-soft: #e3edf3;
  --accent: #c26240;
  --accent-soft: #f8e9e2;

  --focus: #2b7bb9;
  --danger: #a33a2c;
  --danger-soft: #fbe7e3;
  --ok: #1c7a5c;
  --ok-soft: #e2f2ec;

  /* --- Status des Wortschatzes (durchgängig gleiche Bedeutung) */
  --st-new: #1c7a5c;
  --st-new-soft: #e2f2ec;
  --st-active: #2464a8;
  --st-active-soft: #e5eefa;
  --st-revisit: #9a6512;
  --st-revisit-soft: #f8eeda;
  --st-core: #5c4a99;
  --st-core-soft: #ece8f8;
  --st-archived: #6b7382;
  --st-archived-soft: #eceae7;

  --hit: 38px;              /* Mindesthöhe für Bedienelemente */
  --rail-w: 218px;
  --topbar-h: 56px;
  --foot-h: 30px;
}

/* --- Dunkles Thema ------------------------------------------------------ */
:root[data-theme="dark"] {
  --paper: #14181f;
  --surface: #1b212a;
  --surface-2: #202733;
  --surface-sunken: #10141a;

  --danger: #e88f7f;
  --danger-soft: #35201c;
  --ok: #6dc9a8;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 6px 18px rgba(0, 0, 0, .45);

}

/* styles/base.css */
/* ==========================================================================
   Grundlagen: Reset, Typografie, wiederkehrende Bedienelemente
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.2; font-weight: 650; }
h1 { font-size: var(--fs-2xl); letter-spacing: -.012em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
p { margin: 0 0 var(--sp-3); }
a { color: var(--brand); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--surface); color: var(--ink);
  padding: var(--sp-2) var(--sp-3); border-radius: 0 0 var(--r-md) 0;
}
.skip-link:focus { left: 0; }

.visually-hidden {
  position: absolute !important; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --- Schaltflächen ------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--hit); padding: 0 var(--sp-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 550; cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, transform .06s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }

.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
:root[data-theme="dark"] .btn--primary,
:root[data-theme="auto"] .btn--primary { color: #10171d; }
@media (prefers-color-scheme: light) { :root[data-theme="auto"] .btn--primary { color: #fff; } }
.btn--primary:hover { background: var(--brand-ink); border-color: var(--brand-ink); }

.btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-sunken); }
.btn--danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn--danger:hover { background: var(--danger-soft); }
.btn--sm { min-height: 30px; padding: 0 var(--sp-2); font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn--icon { padding: 0; width: var(--hit); }
.btn--icon.btn--sm { width: 30px; }
.btn--wide { width: 100%; }
.btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }

.ico { font-size: 1.05em; line-height: 1; }
.kbd, kbd {
  font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 1px 4px; background: var(--surface-2); white-space: nowrap;
}

/* --- Formularelemente --------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.field > label, .label {
  font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2);
}
.field .hint { font-size: var(--fs-xs); color: var(--muted); }

input[type="text"], input[type="search"], input[type="number"], input[type="date"],
select, textarea {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  padding: 8px var(--sp-3); min-height: var(--hit); width: 100%;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .85; }
select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); width: 16px; height: 16px; }

.switch { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); }

/* --- Etiketten und Chips ------------------------------------------------ */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px var(--sp-2); border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em;
  background: var(--surface-sunken); color: var(--ink-2); border: 1px solid transparent;
  white-space: nowrap;
}
.chip--st-new      { background: var(--st-new-soft); color: var(--st-new); }
.chip--st-active   { background: var(--st-active-soft); color: var(--st-active); }
.chip--st-revisit  { background: var(--st-revisit-soft); color: var(--st-revisit); }
.chip--st-core     { background: var(--st-core-soft); color: var(--st-core); }
.chip--st-archived { background: var(--st-archived-soft); color: var(--st-archived); }
.chip--tag { background: transparent; border-color: var(--line-strong); color: var(--muted); font-weight: 500; }
.chip--subject { background: var(--subject-soft, var(--brand-soft)); color: var(--subject-color, var(--brand-ink)); }
.chip--outline { background: transparent; border-color: var(--line-strong); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* --- Karten ------------------------------------------------------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
}
.card__head h2, .card__head h3 { margin: 0; }
.card__body { padding: var(--sp-4); }
.card__foot { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); }
.spacer { flex: 1 1 auto; }

/* --- Leerezustände ------------------------------------------------------ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--muted);
  border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2);
}
.empty__title { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink-2); font-weight: 650; }
.empty__text { max-width: 46ch; }

/* --- Meldungen ---------------------------------------------------------- */
.note {
  border-left: 3px solid var(--brand); background: var(--brand-soft);
  padding: var(--sp-3); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: var(--fs-sm);
}
.note--warn { border-color: var(--st-revisit); background: var(--st-revisit-soft); }
.note--danger { border-color: var(--danger); background: var(--danger-soft); }

/* --- Toasts ------------------------------------------------------------- */
.toast-root {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  z-index: 90; pointer-events: none; width: min(560px, calc(100vw - 32px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-2); font-size: var(--fs-sm);
  animation: toast-in .16s ease-out;
}
.toast--danger { background: var(--danger); color: #fff; }
.toast--ok { background: var(--ok); color: #fff; }
.toast__text { flex: 1 1 auto; }
.toast .btn {
  background: transparent; border-color: currentColor; color: inherit;
  min-height: 28px; padding: 0 var(--sp-2); font-size: var(--fs-sm);
}
.toast .btn:hover { background: rgba(255,255,255,.14); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* --- Dialoge ------------------------------------------------------------ */
.modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(16, 20, 27, .45);
  display: grid; place-items: center; padding: var(--sp-4);
  animation: fade-in .12s ease-out;
}
.modal {
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  width: min(var(--modal-w, 560px), 100%); max-height: min(90vh, 900px);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line);
}
.modal__head { padding: var(--sp-4) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--line); }
.modal__head h2 { font-size: var(--fs-xl); }
.modal__head p { margin: var(--sp-1) 0 0; color: var(--muted); font-size: var(--fs-sm); }
.modal__body { padding: var(--sp-4) var(--sp-5); overflow: auto; display: flex; flex-direction: column; gap: var(--sp-4); }
.modal__foot {
  padding: var(--sp-3) var(--sp-5) var(--sp-4); border-top: 1px solid var(--line);
  display: flex; gap: var(--sp-2); justify-content: flex-end; flex-wrap: wrap;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* --- Formular-Raster ---------------------------------------------------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.stack--tight { gap: var(--sp-2); }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* --- Reduzierte Bewegung ------------------------------------------------ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* styles/shell.css */
/* ==========================================================================
   Anwendungsrahmen: Kopfzeile, Navigationsleiste, Inhalt, Fußzeile
   ========================================================================== */

.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: var(--topbar-h) minmax(0, 1fr) var(--foot-h);
  grid-template-areas:
    "topbar topbar"
    "rail   main"
    "foot   foot";
  height: 100vh;
  height: 100dvh;
}
.shell[data-rail="collapsed"] { --rail-w: 62px; }

/* --- Kopfzeile ---------------------------------------------------------- */
.topbar {
  grid-area: topbar;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-4);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.topbar__brand { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.brand__mark { color: var(--brand); display: flex; }
.brand__text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand__text strong { font-family: var(--font-display); font-size: var(--fs-lg); letter-spacing: -.01em; }
.brand__text small { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar__context { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 auto; min-width: 0; }
.topbar__actions { display: flex; align-items: center; gap: var(--sp-1); }
.topbar__actions .kbd { margin-left: 2px; }

.ctx-select {
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 3px 3px 3px var(--sp-3);
  min-width: 0;
}
.ctx-select__label { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.ctx-select select {
  border: none; background: transparent; min-height: 30px; padding: 0 26px 0 4px;
  font-weight: 600; width: auto; max-width: 26ch;
  background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
}
.ctx-select select:focus-visible { outline-offset: 0; }
.ctx-flag {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: .62rem; font-weight: 700; letter-spacing: -.02em;
  background: var(--subject-soft); color: var(--subject-color);
}

@media (max-width: 1080px) {
  .btn__label { display: none; }
  .topbar__actions .kbd { display: none; }
  .ctx-select__label { display: none; }
}

/* --- Navigationsleiste -------------------------------------------------- */
.rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-3) var(--sp-2);
  overflow-y: auto;
}
.rail__item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 9px var(--sp-3); border-radius: var(--r-md);
  color: var(--ink-2); text-decoration: none; font-weight: 550; font-size: var(--fs-md);
  border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%;
  font-family: inherit;
}
.rail__item:hover { background: var(--surface-sunken); }
.rail__item[aria-current="page"] {
  background: var(--brand-soft); color: var(--brand-ink); border-color: color-mix(in srgb, var(--brand) 25%, transparent);
}
.rail__icon { width: 20px; text-align: center; font-size: 1.05rem; flex: none; }
.rail__count { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.rail__sep { height: 1px; background: var(--line); margin: var(--sp-3) var(--sp-2); }
.rail__title {
  font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); padding: var(--sp-2) var(--sp-3) var(--sp-1); font-weight: 700;
}
.shell[data-rail="collapsed"] .rail__label,
.shell[data-rail="collapsed"] .rail__count,
.shell[data-rail="collapsed"] .rail__title { display: none; }

  /** Kurze, aber kollisionssichere ID (kein externer Dienst nötig). */

    return (prefix || 'id') + '_' + Date.now().toString(36) + rnd + counter.toString(36);

  function clone(value) {

      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(self, args); }, wait);
    }
    wrapped.cancel = function () { if (t) { clearTimeout(t); t = null; } };
    wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn.call(this); } };

    var s = String(text).toLowerCase();
    if (s.normalize) s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return s.replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();

  /**
   * h('div.card#main', { text: 'Hallo', onclick: fn, dataset: {…} }, kind1, kind2)

    var doc = (props && props.ownerDocument) || document;
    var parts = String(tag).split(/(?=[.#])/);
    var node = doc.createElement(parts[0] || 'div');
    for (var i = 1; i < parts.length; i++) {
      var p = parts[i];
      if (p[0] === '.') node.classList.add(p.slice(1));
      else if (p[0] === '#') node.id = p.slice(1);
    }
    if (props) {
      Object.keys(props).forEach(function (key) {
        var value = props[key];
        if (value === null || value === undefined || value === false) return;
        if (key === 'ownerDocument') return;
        if (key === 'class' || key === 'className') { String(value).split(/\s+/).forEach(function (c) { if (c) node.classList.add(c); }); return; }

  function append(parent, child) {
    if (child === null || child === undefined || child === false || child === true) return parent;

    parent.appendChild((parent.ownerDocument || document).createTextNode(String(child)));
    return parent;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  /** Ereignisdelegation: on(root, 'click', '[data-action]', handler) */
  function on(root, type, selector, handler) {
    root.addEventListener(type, function (event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var match = target.closest(selector);
      if (match && root.contains(match)) handler.call(match, event, match);
    });
  }

  /* --- Text und Formate --------------------------------------------------- */

  function plural(n, one, many) { return n === 1 ? one : (many || one + 'e'); }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function formatDateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function relativeDate(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return '';
    var min = Math.round(diff / 60000);
    if (min < 1) return 'gerade eben';
    if (min < 60) return 'vor ' + min + ' Min.';
    var hrs = Math.round(min / 60);
    if (hrs < 24) return 'vor ' + hrs + ' Std.';
    var days = Math.round(hrs / 24);
    if (days === 1) return 'gestern';
    if (days < 7) return 'vor ' + days + ' Tagen';
    return formatDate(iso);
  }

  /** Aktuelles Schuljahr in der Form "2025/26" (Wechsel Anfang August). */
  function currentSchoolYear(date) {
    var d = date ? new Date(date) : new Date();
    var y = d.getFullYear();
    var start = d.getMonth() >= 7 ? y : y - 1;
    return start + '/' + String((start + 1) % 100).padStart(2, '0');
  }

  function nextSchoolYear(year) {

  function sortBy(list, keyFn) {

  function groupBy(list, keyFn) {

    list.forEach(function (item) {

      if (!map.has(key)) map.set(key, []);
      map.get(key).push(item);
    });

  }

  function unique(list) { return Array.from(new Set(list)); }

  function moveInArray(list, from, to) {
    if (from === to || from < 0 || from >= list.length) return list;
    var item = list.splice(from, 1)[0];
    list.splice(Math.max(0, Math.min(list.length, to)), 0, item);
    return list;
  }

  /* --- Dateien ------------------------------------------------------------ */

  function downloadText(filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function readFileAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = function () { reject(new Error('Die Datei konnte nicht gelesen werden.')); };
      reader.readAsText(file, 'utf-8');
    });
  }

  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = document.createElement('input');
      input.type = 'file';
      if (accept) input.accept = accept;
      input.style.display = 'none';
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var file = input.files && input.files[0] ? input.files[0] : null;
        document.body.removeChild(input);
        resolve(file);
      });
      input.click();
    });
  }

    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

    uid: uid, nowISO: nowISO, clone: clone, debounce: debounce, clamp: clamp,
    fold: fold, escapeHtml: escapeHtml,
    h: h, append: append, clear: clear, $: $, $: $, on: on,
    plural: plural, formatDate: formatDate, formatDateTime: formatDateTime, relativeDate: relativeDate,

})(window.BAO = window.BAO || {});

  <script>
/* js/core/storage.js */
/* ==========================================================================
   Lokale Speicherung
   Bewusst schlicht: ein JSON-Dokument im localStorage. Damit funktioniert die
   App auch, wenn sie direkt als Datei geöffnet wird (file://), wo IndexedDB in
   manchen Browsern gesperrt ist. Fällt die Speicherung aus, arbeitet die App
   weiter – dann aber sichtbar im Nur-Sitzung-Modus.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var KEY = 'bao.state.v1';
  var SAFETY_KEY = 'bao.safety.v1';   // Sicherungskopie vor riskanten Aktionen

  var memory = Object.create(null);
  var available = null;
  var lastError = null;

  function probe() {
    if (available !== null) return available;
    try {
      var probeKey = 'bao.probe';
      window.localStorage.setItem(probeKey, '1');
      window.localStorage.removeItem(probeKey);
      available = true;
    } catch (err) {
      lastError = err;
      available = false;
    }
    return available;
  }

  function read(key) {
    if (probe()) {
      try { return window.localStorage.getItem(key); }
      catch (err) { lastError = err; }
    }
    return key in memory ? memory[key] : null;
  }

  function write(key, value) {
    if (probe()) {
      try {
        window.localStorage.setItem(key, value);
        memory[key] = value;
        return { ok: true };
      } catch (err) {
        lastError = err;
        memory[key] = value;
        var quota = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
        return { ok: false, quota: !!quota, error: err };
      }
    }
    memory[key] = value;
    return { ok: false, error: lastError };
  }

  function remove(key) {
    delete memory[key];
    if (probe()) { try { window.localStorage.removeItem(key); } catch (err) { lastError = err; } }
  }

  function loadState() {
    var raw = read(KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (err) {
      // Beschädigte Daten niemals stillschweigend überschreiben.
      write(KEY + '.broken.' + Date.now(), raw);
      lastError = err;
      return null;
    }
  }

  function saveState(state) { return write(KEY, JSON.stringify(state)); }

  function saveSafetyCopy(state) {
    return write(SAFETY_KEY, JSON.stringify({ savedAt: new Date().toISOString(), state: state }));
  }

  function loadSafetyCopy() {
    var raw = read(SAFETY_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (err) { return null; }
  }

  function approximateSize() {
    var raw = read(KEY);
    return raw ? raw.length : 0;
  }

  BAO.storage = {
    KEY: KEY,
    isAvailable: probe,
    lastError: function () { return lastError; },
    loadState: loadState,
    saveState: saveState,
    saveSafetyCopy: saveSafetyCopy,
    loadSafetyCopy: loadSafetyCopy,
    approximateSize: approximateSize,
    clearAll: function () { remove(KEY); remove(SAFETY_KEY); }
  };
})(window.BAO = window.BAO || {});

(function (BAO) {

    { id: 'archived', label: 'archiviert',       short: 'archiviert', hint: 'Vorläufig aus dem aktiven Bestand genommen.' }
  ];

  function statusInfo(id) {

    return STATUS[1];

    }

    var state = Object.assign(emptyState(), util.clone(input));
    state.settings = Object.assign(defaultSettings(), input.settings || {});
    state.settings.fieldLevels = Object.assign(defaultSettings().fieldLevels, (input.settings && input.settings.fieldLevels) || {});
    state.meta = Object.assign(emptyState().meta, input.meta || {});
    state.ui = Object.assign({ subjectId: '', groupId: '', recentBanks: [], recentGroups: [] }, input.ui || {});

    COLLECTIONS.forEach(function (name) {
      if (!Array.isArray(state[name])) {
        if (input[name] !== undefined) warnings.push('Die Liste „' + name + '“ war beschädigt und wurde geleert.');
        state[name] = [];
      }
    });

    if (!state.functions.length) state.functions = defaultFunctions();

    // Einträge ohne ID sind nicht referenzierbar -> reparieren statt verwerfen.
    COLLECTIONS.forEach(function (name) {
      var seen = Object.create(null);
      state[name] = state[name].filter(function (item) {
        return item && typeof item === 'object' && !Array.isArray(item);
      }).map(function (item) {
        if (!item.id || seen[item.id]) {
          item.id = util.uid(name.slice(0, 3));
          warnings.push('Ein Eintrag in „' + name + '“ hatte keine eindeutige Kennung und bekam eine neue.');
        }
        seen[item.id] = true;
        return item;

    });

    // Verweise prüfen: Wortbank-Positionen ohne Ziel entfernen.
    var lexIds = new Set(state.lexemes.map(function (l) { return l.id; }));
    var staIds = new Set(state.starters.map(function (s) { return s.id; }));
    var removed = 0;
    state.banks.forEach(function (bank) {
      if (!Array.isArray(bank.sections)) bank.sections = [];

    if (state.schemaVersion > SCHEMA_VERSION) {

    }

/* ==========================================================================
   Migrationen
   Jede Migration hebt den Datenbestand um genau eine Version an. Dadurch
   lassen sich alte Sicherungen auch nach Jahren noch einlesen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  /**
   * Reihenfolge ist bindend: Index 0 führt von Datenversion 0 auf 1 usw.
   * Eine Migration bekommt den Zustand, verändert ihn und gibt ihn zurück.
   */
  var STEPS = [
    {
      to: 1,
      describe: 'Vorabversionen: fehlende Grundfelder ergänzen',
      run: function (state) {
        // Frühe Testdaten kannten weder Abschnitte in Wortbanken noch Verläufe.
        (state.banks || []).forEach(function (bank) {
          if (!Array.isArray(bank.sections)) {
            bank.sections = [{
              id: BAO.util.uid('sec'),
              title: 'Wortschatz',
              layout: 'auto',
              items: Array.isArray(bank.items) ? bank.items : []
            }];
            delete bank.items;
          }
          if (typeof bank.defaultLevel !== 'number') bank.defaultLevel = 2;
        });
        (state.groups || []).forEach(function (group) {
          if (!Array.isArray(group.history)) group.history = [];
        });
        return state;
      }
    }
  ];

  /**
   * Hebt den Zustand auf die aktuelle Datenversion.
   * @returns {{state: object, applied: string[], error: string|null}}
   */
  function migrate(state) {
    var applied = [];
    var target = BAO.schema.SCHEMA_VERSION;
    var version = typeof state.schemaVersion === 'number' ? state.schemaVersion : 0;

    if (version > target) {
      return { state: state, applied: applied, error: 'Datenversion ' + version + ' ist neuer als diese Programmversion.' };
    }

    STEPS.forEach(function (step) {
      if (version < step.to && step.to <= target) {
        try {
          state = step.run(state) || state;
          version = step.to;
          state.schemaVersion = version;
          applied.push('v' + step.to + ': ' + step.describe);
        } catch (err) {
          throw new Error('Migration auf Version ' + step.to + ' fehlgeschlagen: ' + err.message);
        }
      }
    });

    state.schemaVersion = target;
    return { state: state, applied: applied, error: null };
  }

  BAO.migrations = { migrate: migrate, STEPS: STEPS };
})(window.BAO = window.BAO || {});

/* js/core/store.js */
/* ==========================================================================
   Zustandsspeicher
   Ein einziger Zustand, veränderbar nur über commit(). Jeder commit legt eine
   Momentaufnahme für „Rückgängig“ an und speichert verzögert lokal.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var storage = BAO.storage;

  var state = null;
  var listeners = [];
  var undoStack = [];
  var redoStack = [];
  var MAX_HISTORY = 40;
  var storageState = 'ok';       // 'ok' | 'session' | 'error'
  var storageMessage = '';
  var lastSavedAt = '';

  var persist = util.debounce(function () { persistNow(); }, 300);

  function persistNow() {
    if (!state) return;
    state.meta.updatedAt = util.nowISO();
    var result = storage.saveState(state);
    if (result.ok) {
      storageState = 'ok';
      storageMessage = '';
      lastSavedAt = util.nowISO();
    } else if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';
    } else {
      storageState = 'error';
      storageMessage = result.quota
        ? 'Der lokale Speicher ist voll. Bitte exportieren und nicht mehr benötigte Einträge archivieren.'
        : 'Die Daten konnten nicht gespeichert werden.';
    }
    emitStorage();
  }

  function emitStorage() {
    document.dispatchEvent(new CustomEvent('bao:storage', {
      detail: { state: storageState, message: storageMessage, savedAt: lastSavedAt }
    }));
  }

  function notify(meta) {
    listeners.forEach(function (fn) {
      try { fn(state, meta || {}); } catch (err) { console.error('Fehler in einem Zustandsbeobachter:', err); }
    });
  }

  /* --- Initialisierung ---------------------------------------------------- */

  function init(options) {
    options = options || {};
    var loaded = storage.loadState();
    var startedFresh = false;

    if (loaded) {
      try {
        var migrated = BAO.migrations.migrate(loaded);
        if (migrated.error) {
          console.warn(migrated.error);
          storageState = 'error';
          storageMessage = migrated.error;
        }
        var checked = schema.validateState(migrated.state);
        state = checked.state;
        if (checked.warnings.length) console.warn('Daten repariert:', checked.warnings);
      } catch (err) {
        console.error('Der gespeicherte Bestand konnte nicht gelesen werden:', err);
        storage.saveSafetyCopy(loaded);
        state = schema.emptyState();
        startedFresh = true;
        storageState = 'error';
        storageMessage = 'Der gespeicherte Bestand war beschädigt. Eine Sicherungskopie liegt im Bereich „Daten“.';
      }
    } else {
      state = schema.emptyState();
      startedFresh = true;
      if (options.seed !== false && BAO.seed) BAO.seed.fill(state);
    }

    state.meta.appVersion = schema.APP_VERSION;
    if (!storage.isAvailable()) {
      storageState = 'session';
      storageMessage = 'Der Browser erlaubt keine lokale Speicherung. Die Daten bleiben nur für diese Sitzung erhalten – bitte exportieren.';
    }
    persistNow();

    window.addEventListener('beforeunload', function () { persist.cancel(); persistNow(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { persist.cancel(); persistNow(); }
    });

    notify({ reason: 'init', startedFresh: startedFresh });
    return state;
  }

  function getState() { return state; }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  }

  /* --- Veränderungen ------------------------------------------------------ */

  /**
   * commit('Eintrag gelöscht', function (draft) { … })
   * options.undoable = false  -> reine Ansichts-/Einstellungsänderung
   */
  function commit(label, mutator, options) {
    options = options || {};
    var undoable = options.undoable !== false;
    var before = undoable ? JSON.stringify(state) : null;
    var draft = util.clone(state);
    var result = mutator(draft);
    if (result === false) return null;           // Mutator hat abgebrochen
    draft.meta.updatedAt = util.nowISO();
    state = draft;

    if (undoable) {
      undoStack.push({ label: label, snapshot: before, at: util.nowISO() });
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack.length = 0;
    }

    persist();
    notify({ reason: 'commit', label: label, undoable: undoable, payload: options.payload });
    return result === undefined ? true : result;
  }

  /** Ersetzt den gesamten Bestand (Import, Wiederherstellung). */
  function replaceState(nextState, label) {
    var before = JSON.stringify(state);
    storage.saveSafetyCopy(JSON.parse(before));
    state = nextState;
    undoStack.push({ label: label || 'Bestand ersetzt', snapshot: before, at: util.nowISO() });
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    persist.cancel();
    persistNow();
    notify({ reason: 'replace', label: label });
  }

  function canUndo() { return undoStack.length > 0; }
  function canRedo() { return redoStack.length > 0; }
  function lastUndoLabel() { return undoStack.length ? undoStack[undoStack.length - 1].label : ''; }

  function undo() {
    if (!undoStack.length) return null;
    var entry = undoStack.pop();
    redoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    persist.cancel();
    persistNow();
    notify({ reason: 'undo', label: entry.label });
    return entry.label;
  }

  function redo() {
    if (!redoStack.length) return null;
    var entry = redoStack.pop();
    undoStack.push({ label: entry.label, snapshot: JSON.stringify(state), at: util.nowISO() });
    state = JSON.parse(entry.snapshot);
    persist.cancel();
    persistNow();
    notify({ reason: 'redo', label: entry.label });
    return entry.label;
  }

  function storageInfo() {
    return {
      state: storageState,
      message: storageMessage,
      savedAt: lastSavedAt,
      bytes: storage.approximateSize(),
      available: storage.isAvailable()
    };
  }

  BAO.store = {
    init: init,
    getState: getState,
    subscribe: subscribe,
    commit: commit,
    replaceState: replaceState,
    undo: undo,
    redo: redo,
    canUndo: canUndo,
    canRedo: canRedo,
    lastUndoLabel: lastUndoLabel,
    flush: function () { persist.cancel(); persistNow(); },
    storageInfo: storageInfo
  };

        subjectId: g ? g.subjectId : '' });
    });

    state.lexemes.forEach(function (l) {
      var s = score(haystackLexeme(l), needle);
      if (s) {
        var g = select.group(state, l.groupId);
        results.push({ type: 'lexeme', score: s, title: (l.article ? l.article + ' ' : '') + l.term,
          meta: [l.translation, g ? g.name : '', BAO.schema.statusInfo(l.status).short].filter(Boolean).join(' · '),
          id: l.id, groupId: l.groupId, subjectId: l.subjectId });
      }
    });

    state.starters.forEach(function (sta) {
      var s = score(haystackStarter(sta), needle);
      if (s) {
        results.push({ type: 'starter', score: s - 4, title: sta.text.replace(/_{2,}/g, '…'),
          meta: 'Satzanfang · ' + select.functionLabel(state, sta.functionId),
          id: sta.id, groupId: sta.groupId, subjectId: sta.subjectId });
      }

  <script>
/* js/core/csv.js */
/* ==========================================================================
   CSV-Import und -Export für Wortschatzlisten
   Bewusst tolerant: erkennt Trennzeichen selbst, akzeptiert Anführungszeichen
   und ordnet gängige Spaltennamen automatisch zu. Die Zuordnung bleibt aber
   sichtbar und veränderbar.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;

  /** Erkennt das wahrscheinlichste Trennzeichen der ersten Zeilen. */
  function detectDelimiter(text) {
    var sample = text.split(/\r?\n/).slice(0, 5).join('\n');
    var candidates = [';', ',', '\t', '|'];
    var best = ';';
    var bestCount = 0;
    candidates.forEach(function (d) {
      var count = sample.split(d).length - 1;
      if (count > bestCount) { bestCount = count; best = d; }
    });
    return bestCount === 0 ? ';' : best;
  }

  /** Vollständiger CSV-Parser (Anführungszeichen, eingebettete Zeilenumbrüche). */
  function parse(text, delimiter) {
    var d = delimiter || detectDelimiter(text);
    var rows = [];
    var row = [];
    var value = '';
    var inQuotes = false;
    var i = 0;

    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // BOM entfernen

    while (i < text.length) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { value += '"'; i += 2; continue; }
          inQuotes = false; i += 1; continue;
        }
        value += ch; i += 1; continue;
      }
      if (ch === '"' && value === '') { inQuotes = true; i += 1; continue; }
      if (ch === d) { row.push(value); value = ''; i += 1; continue; }
      if (ch === '\r') { i += 1; continue; }
      if (ch === '\n') { row.push(value); rows.push(row); row = []; value = ''; i += 1; continue; }
      value += ch; i += 1;
    }
    row.push(value);
    rows.push(row);

    rows = rows.filter(function (r) {
      return r.some(function (cell) { return String(cell).trim() !== ''; });
    }).map(function (r) {
      return r.map(function (cell) { return String(cell).trim(); });
    });

    return { delimiter: d, rows: rows };
  }

  /* --- Spaltenzuordnung ---------------------------------------------------- */

  var ALIASES = {
    term:          ['zielwort', 'wort', 'vokabel', 'begriff', 'ausdruck', 'term', 'word', 'expression', 'fremdsprache'],
    article:       ['artikel', 'article', 'genus'],
    gram:          ['form', 'formhinweis', 'grammatik', 'plural', 'grammar'],
    collocation:   ['wortverbindung', 'kollokation', 'collocation', 'verbindung'],
    chunk:         ['chunk', 'baustein', 'wendung'],
    explanation:   ['erklaerung', 'erklärung', 'definition', 'explanation', 'umschreibung'],
    translation:   ['deutsch', 'uebersetzung', 'übersetzung', 'translation', 'german', 'bedeutung'],
    example:       ['beispiel', 'beispielsatz', 'example', 'satz'],
    pronunciation: ['aussprache', 'lautschrift', 'pronunciation', 'ipa', 'betonung'],
    topics:        ['thema', 'themen', 'topic', 'topics', 'wortfeld'],
    tags:          ['tag', 'tags', 'schlagwort', 'schlagwoerter', 'schlagwörter'],
    cefr:          ['niveau', 'level', 'cefr', 'ger'],
    status:        ['status', 'zustand']
  };

  var FIELD_LABELS = {
    term: 'Zielwort', article: 'Artikel', gram: 'Formhinweis', collocation: 'Wortverbindung',
    chunk: 'Chunk', explanation: 'Erklärung', translation: 'Deutsch', example: 'Beispielsatz',
    pronunciation: 'Aussprache', topics: 'Themen', tags: 'Tags', cefr: 'Niveau', status: 'Status'
  };

  /** Ordnet Kopfzeilen automatisch Feldern zu. Rückgabe: { feld: spaltenindex } */
  function guessMapping(header) {
    var mapping = {};
    header.forEach(function (name, index) {
      var folded = util.fold(name).replace(/[^a-z0-9äöüß]/g, '');
      Object.keys(ALIASES).forEach(function (field) {
        if (mapping[field] !== undefined) return;
        var hit = ALIASES[field].some(function (alias) {
          var a = util.fold(alias).replace(/[^a-z0-9äöüß]/g, '');
          return a === folded || (folded.length > 3 && folded.indexOf(a) === 0);
        });
        if (hit) mapping[field] = index;
      });
    });
    return mapping;
  }

  /** Sieht die erste Zeile nach Spaltenüberschriften aus? */
  function looksLikeHeader(row) {
    var mapping = guessMapping(row);
    return Object.keys(mapping).length >= 2;
  }

  var VALID_STATUS = ['new', 'active', 'revisit', 'core', 'archived'];
  var STATUS_ALIASES = {
    neu: 'new', new: 'new', aktiv: 'active', active: 'active',
    auffrischen: 'revisit', wiederaufgreifen: 'revisit', revisit: 'revisit',
    grundbestand: 'core', gesichert: 'core', core: 'core',
    archiviert: 'archived', archived: 'archived'
  };

  function normaliseStatus(value, fallback) {
    if (!value) return fallback;
    var key = util.fold(value).replace(/[^a-z]/g, '');
    return STATUS_ALIASES[key] || (VALID_STATUS.indexOf(value) >= 0 ? value : fallback);
  }

  function splitList(value) {
    if (!value) return [];
    return value.split(/[;,/]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }

  /**
   * Wandelt Datenzeilen in Wortschatzeinträge um.
   * @returns {{entries: object[], skipped: number, duplicates: object[]}}
   */
  function toLexemes(rows, mapping, defaults, existing) {
    var entries = [];
    var duplicates = [];
    var skipped = 0;
    var known = new Map();
    (existing || []).forEach(function (l) { known.set(util.fold(l.term), l); });

    rows.forEach(function (row) {
      function cell(field) {
        var index = mapping[field];
        if (index === undefined || index === null) return '';
        return (row[index] || '').trim();
      }
      var term = cell('term');
      if (!term) { skipped += 1; return; }

      var entry = BAO.schema.makeLexeme({
        subjectId: defaults.subjectId,
        groupId: defaults.groupId,
        term: term,
        article: cell('article'),
        gram: cell('gram'),
        collocation: cell('collocation'),
        chunk: cell('chunk'),
        explanation: cell('explanation'),
        translation: cell('translation'),
        example: cell('example'),
        pronunciation: cell('pronunciation'),
        topics: splitList(cell('topics')),
        tags: splitList(cell('tags')),
        cefr: cell('cefr'),
        status: normaliseStatus(cell('status'), defaults.status || 'new'),
        introducedUnitId: defaults.unitId || '',
        introducedSchoolYear: defaults.schoolYear || ''
      });

      var clash = known.get(util.fold(term));
      if (clash) duplicates.push({ entry: entry, existing: clash });
      entries.push(entry);
    });

    return { entries: entries, skipped: skipped, duplicates: duplicates };
  }

  /* --- Export --------------------------------------------------------------- */

  var EXPORT_FIELDS = ['term', 'article', 'gram', 'collocation', 'chunk', 'explanation',
    'translation', 'example', 'pronunciation', 'topics', 'tags', 'cefr', 'status'];

  function escapeCell(value) {
    var text = value === null || value === undefined ? '' : String(value);
    if (/["\n;]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
    return text;
  }

  function lexemesToCsv(lexemes) {
    var lines = [EXPORT_FIELDS.map(function (f) { return FIELD_LABELS[f]; }).join(';')];
    lexemes.forEach(function (lex) {
      lines.push(EXPORT_FIELDS.map(function (field) {
        var value = lex[field];
        if (Array.isArray(value)) value = value.join(', ');
        return escapeCell(value);
      }).join(';'));
    });
    return lines.join('\r\n');
  }

  /* --- Schnelleingabe mehrerer Zeilen -------------------------------------- */

  /**
   * Zerlegt eingefügte Zeilen der Form
   *   "le stage = das Praktikum"  |  "le stage - das Praktikum"
   *   "le stage;das Praktikum;faire un stage"
   * in Zielwort, Übersetzung und (optional) Wortverbindung.
   */
  function parseQuickLines(text) {
    var out = [];
    String(text).split(/\r?\n/).forEach(function (line) {
      var trimmed = line.trim();
      if (!trimmed) return;
      var parts;
      if (trimmed.indexOf('\t') >= 0) parts = trimmed.split('\t');
      else if (trimmed.indexOf(';') >= 0) parts = trimmed.split(';');
      else if (trimmed.indexOf(' = ') >= 0) parts = trimmed.split(' = ');
      else if (trimmed.indexOf(' – ') >= 0) parts = trimmed.split(' – ');
      else if (trimmed.indexOf(' — ') >= 0) parts = trimmed.split(' — ');
      else if (trimmed.indexOf(' - ') >= 0) parts = trimmed.split(' - ');
      else parts = [trimmed];
      parts = parts.map(function (p) { return p.trim(); });
      if (!parts[0]) return;
      out.push({ term: parts[0], translation: parts[1] || '', collocation: parts[2] || '' });
    });
    return out;
  }

  BAO.csv = {
    detectDelimiter: detectDelimiter,
    parse: parse,
    guessMapping: guessMapping,
    looksLikeHeader: looksLikeHeader,
    toLexemes: toLexemes,
    lexemesToCsv: lexemesToCsv,
    parseQuickLines: parseQuickLines,
    FIELD_LABELS: FIELD_LABELS,
    EXPORT_FIELDS: EXPORT_FIELDS
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/core/backup.js */
/* ==========================================================================
   Sicherung: Export, Prüfung, Wiederherstellen und Zusammenführen
   Grundsatz: Ein Import darf niemals unbemerkt etwas zerstören. Vor jedem
   Schreibvorgang wird der bisherige Bestand als Sicherungskopie abgelegt und
   in den Rückgängig-Verlauf gestellt.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;

  function counts(state) {
    return {
      subjects: (state.subjects || []).length,
      groups: (state.groups || []).length,
      units: (state.units || []).length,
      lexemes: (state.lexemes || []).length,
      starters: (state.starters || []).length,
      banks: (state.banks || []).length
    };
  }

  var COUNT_LABELS = {
    subjects: 'Fächer', groups: 'Lerngruppen', units: 'Unterrichtsreihen',
    lexemes: 'Wortschatzeinträge', starters: 'Satzanfänge', banks: 'Wortbanken'
  };

  function buildExport(state) {
    return {
      kind: schema.EXPORT_KIND,
      appVersion: schema.APP_VERSION,
      schemaVersion: state.schemaVersion,
      exportedAt: util.nowISO(),
      counts: counts(state),
      data: util.clone(state)
    };
  }

  function suggestFilename(state) {
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var time = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    return 'boite-a-oublis_' + stamp + '_' + time + '.json';
  }

  function exportToFile(state) {
    var payload = buildExport(state);
    util.downloadText(suggestFilename(state), JSON.stringify(payload, null, 2), 'application/json');
    return payload;
  }

  /**
   * Liest und prüft eine Sicherungsdatei.
   * @returns {{ok:boolean, errors:string[], warnings:string[], incoming:object|null, meta:object}}
   */
  function analyse(text, currentState) {
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      return { ok: false, errors: ['Die Datei ist keine gültige JSON-Datei. (' + err.message + ')'], warnings: [], incoming: null, meta: {} };
    }

    var payload = parsed;
    var meta = {};

    if (parsed && parsed.kind === schema.EXPORT_KIND && parsed.data) {
      payload = parsed.data;
      meta = {
        exportedAt: parsed.exportedAt || '',
        appVersion: parsed.appVersion || '',
        schemaVersion: parsed.schemaVersion
      };
    } else if (parsed && parsed.schemaVersion !== undefined && parsed.lexemes !== undefined) {
      meta = { exportedAt: (parsed.meta && parsed.meta.updatedAt) || '', appVersion: (parsed.meta && parsed.meta.appVersion) || '' };
    } else {
      return {
        ok: false,
        errors: ['Die Datei stammt nicht aus Boîte à Oublis (Kennzeichen „' + schema.EXPORT_KIND + '“ fehlt).'],
        warnings: [], incoming: null, meta: {}
      };
    }

    var migrated;
    try {
      migrated = BAO.migrations.migrate(util.clone(payload));
    } catch (err) {
      return { ok: false, errors: [err.message], warnings: [], incoming: null, meta: meta };
    }
    if (migrated.error) {
      return { ok: false, errors: [migrated.error], warnings: [], incoming: null, meta: meta };
    }

    var checked = schema.validateState(migrated.state);
    if (!checked.ok) {
      return { ok: false, errors: checked.errors, warnings: checked.warnings, incoming: null, meta: meta };
    }

    meta.migrations = migrated.applied;
    meta.counts = counts(checked.state);
    meta.currentCounts = counts(currentState);
    return { ok: true, errors: [], warnings: checked.warnings, incoming: checked.state, meta: meta };
  }

  /* --- Zusammenführen ------------------------------------------------------ */

  var MERGE_COLLECTIONS = ['subjects', 'groups', 'units', 'lexemes', 'starters', 'banks', 'functions'];

  function newerThan(a, b) {
    var ta = (a && (a.updatedAt || a.createdAt)) || '';
    var tb = (b && (b.updatedAt || b.createdAt)) || '';
    return ta > tb;
  }

  /**
   * Fügt den eingelesenen Bestand in den vorhandenen ein.
   * Regeln:
   *  - unbekannte Kennung  -> wird hinzugefügt
   *  - bekannte Kennung    -> der jüngere Datensatz gewinnt
   *  - Einstellungen bleiben lokal erhalten
   */
  function merge(currentState, incoming) {
    var result = util.clone(currentState);
    var report = { added: {}, updated: {}, kept: {} };

    MERGE_COLLECTIONS.forEach(function (name) {
      var index = new Map();
      (result[name] || []).forEach(function (item, i) { index.set(item.id, i); });
      report.added[name] = 0;
      report.updated[name] = 0;
      report.kept[name] = 0;

      (incoming[name] || []).forEach(function (item) {
        if (!index.has(item.id)) {
          result[name].push(util.clone(item));
          index.set(item.id, result[name].length - 1);
          report.added[name] += 1;
          return;
        }
        var position = index.get(item.id);
        var existing = result[name][position];
        if (newerThan(item, existing)) {
          result[name][position] = util.clone(item);
          report.updated[name] += 1;
        } else {
          report.kept[name] += 1;
        }
      });
    });

    // Verwaiste Wortbank-Positionen nach dem Zusammenführen bereinigen.
    var checked = schema.validateState(result);
    report.warnings = checked.warnings;
    return { state: checked.state, report: report };
  }

  function summariseReport(report) {
    var lines = [];
    MERGE_COLLECTIONS.forEach(function (name) {
      if (name === 'functions') return;
      var added = report.added[name] || 0;
      var updated = report.updated[name] || 0;
      if (!added && !updated) return;
      lines.push((COUNT_LABELS[name] || name) + ': ' + added + ' neu, ' + updated + ' aktualisiert');
    });
    return lines;
  }

  BAO.backup = {
    buildExport: buildExport,
    exportToFile: exportToFile,
    suggestFilename: suggestFilename,
    analyse: analyse,
    merge: merge,
    counts: counts,
    COUNT_LABELS: COUNT_LABELS,
    summariseReport: summariseReport
  };
})(window.BAO = window.BAO || {});

  </script>

  <script>
/* js/ui/toast.js */
/* ==========================================================================
   Kurzmeldungen
   Rückmeldung nach jeder Aktion – bei verändernden Aktionen mit direkter
   Möglichkeit zum Rückgängigmachen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var h = BAO.util.h;
  var root = null;

  function ensureRoot() {
    if (!root) root = document.getElementById('toast-root');
    return root;
  }

  function show(message, options) {
    options = options || {};
    var host = ensureRoot();
    if (!host) return function () {};

    var node = h('div.toast' + (options.kind ? '.toast--' + options.kind : ''), {},
      h('span.toast__text', { text: message })
    );

    var timer = null;
    function close() {
      if (timer) clearTimeout(timer);
      if (node.parentNode) node.parentNode.removeChild(node);
    }

    if (options.actionLabel) {
      node.appendChild(h('button.btn.btn--sm', {
        type: 'button',
        text: options.actionLabel,
        onclick: function () {
          close();
          if (options.onAction) options.onAction();
        }
      }));
    }

    node.appendChild(h('button.btn.btn--sm.btn--icon', {
      type: 'button', 'aria-label': 'Meldung schließen', text: '×', onclick: close
    }));

    host.appendChild(node);
    var duration = options.timeout === 0 ? 0 : (options.timeout || (options.actionLabel ? 8000 : 4000));
    if (duration) timer = setTimeout(close, duration);
    return close;
  }

  /** Meldung mit „Rückgängig“, die direkt auf den Verlauf des Speichers wirkt. */
  function undoable(message, options) {
    options = options || {};
    return show(message, {
      kind: options.kind,
      actionLabel: 'Rückgängig',
      timeout: options.timeout || 8000,
      onAction: function () {
        var label = BAO.store.undo();
        if (label) show('Rückgängig gemacht: ' + label, { kind: 'ok', timeout: 2600 });
      }
    });
  }

  BAO.toast = {
    show: show,
    undoable: undoable,
    ok: function (message, options) { return show(message, Object.assign({ kind: 'ok' }, options || {})); },
    error: function (message, options) { return show(message, Object.assign({ kind: 'danger', timeout: 9000 }, options || {})); }
  };
})(window.BAO = window.BAO || {});

  <script>
/* js/ui/modal.js */
/* ==========================================================================
   Dialoge
   Ein einziger, schlichter Dialogtyp für Formulare, Rückfragen und
   Entscheidungen. Tastaturbedienung inklusive (Esc, Tabulatorfalle, Enter).
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var openStack = [];

  function focusables(node) {
    return util.$('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', node)
      .filter(function (el) { return el.offsetParent !== null || el === document.activeElement; });
  }

  /**
   * open({ title, subtitle, body, actions, width, initialFocus, dismissable })
   * actions: [{ label, value, kind: 'primary'|'danger'|'ghost', shortcut: 'enter' }]
   * Rückgabe: Promise mit dem Wert der gewählten Aktion (null bei Abbruch).
   * Ein Aktions-Handler kann false liefern, um den Dialog offen zu halten.
   */
  function open(config) {
    config = config || {};
    var previousFocus = document.activeElement;

    return new Promise(function (resolve) {
      var backdrop = h('div.modal-backdrop', { role: 'presentation' });
      var dialog = h('div.modal', {
        role: 'dialog', 'aria-modal': 'true', 'aria-label': config.title || 'Dialog',
        style: config.width ? { '--modal-w': config.width } : null
      });

      var head = h('div.modal__head', {}, h('h2', { text: config.title || '' }));
      if (config.subtitle) head.appendChild(h('p', { text: config.subtitle }));
      dialog.appendChild(head);

      var api = {
        dialog: dialog,
        body: null,
        close: function (value) { finish(value); },
        setBusy: function (busy) {
          util.$('button', dialog).forEach(function (b) { b.disabled = !!busy; });
        }
      };

      var body = h('div.modal__body');
      api.body = body;
      var content = typeof config.body === 'function' ? config.body(api) : config.body;
      util.append(body, content);
      dialog.appendChild(body);

      var actions = config.actions || [{ label: 'Schließen', value: null, kind: 'primary' }];
      var foot = h('div.modal__foot');
      actions.forEach(function (action) {
        var cls = 'button.btn';
        if (action.kind === 'primary') cls += '.btn--primary';
        if (action.kind === 'danger') cls += '.btn--danger';
        if (action.kind === 'ghost') cls += '.btn--ghost';
        foot.appendChild(h(cls, {
          type: 'button',
          text: action.label,
          dataset: { value: String(action.value) },
          onclick: function () { choose(action); }
        }));
      });

      backdrop.appendChild(dialog);

      var closed = false;
      function finish(value) {
        if (closed) return;
        closed = true;
        document.removeEventListener('keydown', onKey, true);
        if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        var i = openStack.indexOf(api);
        if (i >= 0) openStack.splice(i, 1);
        if (previousFocus && previousFocus.focus) {
          try { previousFocus.focus(); } catch (err) { /* Fokusziel verschwunden */ }
        }

      }

      function choose(action) {
        if (action.onSelect) {
          var outcome = action.onSelect(api);
          if (outcome === false) return;
          if (outcome && typeof outcome.then === 'function') {
            outcome.then(function (value) { if (value !== false) finish(value === undefined ? action.value : value); });
            return;
          }
          if (outcome !== undefined && outcome !== true) { finish(outcome); return; }
        }
        finish(action.value === undefined ? null : action.value);
      }

      function onKey(event) {
        if (openStack[openStack.length - 1] !== api) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          if (config.dismissable === false) return;
          finish(null);
          return;
        }
        if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
          var primary = actions.filter(function (a) { return a.kind === 'primary'; })[0];
          if (primary) { event.preventDefault(); choose(primary); }

        }
        if (event.key === 'Tab') {

   Gestaltungsgrundsätze
   - sehr große Grundschrift, die sich an Breite UND Höhe orientiert
   - hoher Kontrast, ruhige Flächen, wenig Dekoration
   - Farbe nur mit Bedeutung:
       Zielsprache = Tinte,  Wortverbindung = Akzent,

  --stage-ink: #10141a;
  --stage-ink-2: #39414e;
  --stage-muted: #6d7684;
  --stage-line: #ded8ce;
  --stage-accent: #a8502c;
  --stage-de: #2f5580;
  --stage-brand: #1f4f6b;

  inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;

  color: var(--stage-ink);

  <script>
/* js/projection/deck.js */
/* ==========================================================================
   Vorlage für die Projektion ("Deck")
   Übersetzt eine Wortbank zusammen mit der gewählten Unterstützungsstufe in
   Abschnitte und daraus in einzelne Bildschirmseiten. Die endgültige
   Aufteilung entsteht in render.js durch Messung – hier steht die inhaltliche
   Vorarbeit und eine belastbare Schätzung.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var schema = BAO.schema;
  var select = BAO.select;

  var LIVE_SECTION_ID = '__live';

  /** Feldsichtbarkeit für eine Unterstützungsstufe. */
  function fieldsForLevel(level, fieldLevels) {
    var levels = fieldLevels || schema.defaultSettings().fieldLevels;
    var out = {};
    schema.FIELDS.forEach(function (field) {
      var threshold = levels[field.key] === undefined ? field.level : levels[field.key];
      out[field.key] = level >= threshold;
    });
    return out;
  }

  function countSecondary(fields) {
    return ['collocation', 'chunk', 'explanation', 'translation', 'example', 'pronunciation']
      .filter(function (key) { return fields[key]; }).length;
  }

  /* --- Zeilen eines Eintrags ---------------------------------------------- */

  function lexemeLines(lex, fields, layout) {
    var lines = [];
    function push(cls, text) { if (text) lines.push({ cls: cls, text: text }); }

    if (layout === 'impulse') {
      // Impuls: bewusst nur eine einzige Stützzeile, damit die Fläche ruhig bleibt.
      if (fields.chunk && lex.chunk) push('pitem__chunk', lex.chunk);
      else if (fields.collocation && lex.collocation) push('pitem__chunk', lex.collocation);
      else if (fields.translation && lex.translation) push('pitem__de', lex.translation);
      return lines;
    }

    if (fields.collocation) push('pitem__chunk', lex.collocation);
    if (fields.chunk) push('pitem__chunk', lex.chunk);
    if (fields.explanation) push('pitem__expl', lex.explanation);
    if (fields.translation) push('pitem__de', lex.translation);
    if (fields.example) push('pitem__ex', lex.example);
    return lines;
  }

  function lexemeMeta(lex, fields) {
    var parts = [];
    if (fields.pronunciation && lex.pronunciation) parts.push(lex.pronunciation);
    return parts.join(' · ');
  }

  function starterLines(starter, fields) {
    var lines = [];
    if (fields.starterTranslation && starter.translation) {
      lines.push({ cls: 'pitem__de', text: starter.translation });
    }
    return lines;
  }

  /* --- Abschnittsaufbau ---------------------------------------------------- */

  function resolveLayout(section, items, fields) {
    if (section.layout && section.layout !== 'auto') return section.layout;
    var onlyStarters = items.length > 0 && items.every(function (i) { return i.kind === 'starter'; });
    if (onlyStarters) return 'starters';
    if (countSecondary(fields) === 0) return 'impulse';
    return 'cards';
  }

  /**
   * Schätzt, wie viele Einträge auf eine Seite passen. Die Messung in
   * render.js korrigiert das anschließend – diese Zahl ist die Obergrenze und
   * sorgt zugleich für die vom Konzept gewünschte Portionierung.
   */
  function estimateCapacity(layout, fields, maxItems) {
    var secondary = countSecondary(fields);
    if (layout === 'starters') {
      return util.clamp(fields.starterTranslation ? 6 : 8, 3, maxItems);
    }
    if (layout === 'impulse') {
      return util.clamp(9, 3, Math.max(6, maxItems));
    }
    var capacity = maxItems - secondary * 2;
    return util.clamp(capacity, 3, maxItems);
  }

  function buildItems(state, section) {
    var items = [];
    (section.items || []).forEach(function (item) {
      var resolved = select.resolveItem(state, item);
      if (!resolved) return;
      items.push({
        key: item.id,
        kind: resolved.kind,
        ref: resolved.ref,
        item: item
      });
    });
    return items;
  }

  /**
   * Satzanfänge werden nach kommunikativen Funktionen gegliedert, sobald ein
   * Abschnitt mehr als eine Funktion enthält. Die Zwischenüberschrift ist eine
   * eigene Position und wird beim Umbruch nie allein am Seitenende gelassen.
   */
  function withFunctionGroups(state, items, layout) {
    if (layout !== 'starters') return items;
    var functionIds = util.unique(items.map(function (item) {
      return item.kind === 'starter' ? (item.ref.functionId || '') : '';
    }));
    if (functionIds.length < 2) return items;

    var out = [];
    var lastFunction = null;
    items.forEach(function (item) {
      var functionId = item.kind === 'starter' ? (item.ref.functionId || '') : '';
      if (functionId !== lastFunction) {
        out.push({
          key: 'grp_' + functionId + '_' + out.length,
          kind: 'group',
          label: select.functionLabel(state, functionId)
        });
        lastFunction = functionId;
      }
      out.push(item);
    });
    return out;
  }

  function countEntries(items) {
    return items.filter(function (item) { return item.kind !== 'group'; }).length;
  }

  /**
   * build(state, bank, options)
   * options: { level, fields, focusSectionId, liveItems, maxItemsPerSlide }
   */
  function build(state, bank, options) {
    options = options || {};
    var level = options.level || (bank ? bank.defaultLevel : 2) || 2;
    var fields = options.fields || fieldsForLevel(level, state.settings.fieldLevels);
    var maxItems = options.maxItemsPerSlide || state.settings.maxItemsPerSlide || 12;

    var subject = bank ? select.subject(state, bank.subjectId) : null;
    var group = bank ? select.group(state, bank.groupId) : null;

    var deck = {
      bankId: bank ? bank.id : '',
      title: bank ? bank.title : 'Live-Hilfe',
      scene: bank ? bank.scene : '',
      subjectName: subject ? subject.name : '',
      subjectColor: subject ? subject.color : '',
      groupName: group ? group.name : '',
      level: level,
      fields: fields,
      maxItemsPerSlide: maxItems,
      sections: [],
      slides: []
    };

    (bank ? bank.sections || [] : []).forEach(function (section) {
      var items = buildItems(state, section);
      if (!items.length) return;
      if (options.focusSectionId && section.id !== options.focusSectionId) return;
      var layout = resolveLayout(section, items, fields);
      deck.sections.push({
        id: section.id,
        title: section.title,
        layout: layout,
        capacity: estimateCapacity(layout, fields, maxItems),
        items: withFunctionGroups(state, items, layout)
      });
    });

    var live = (options.liveItems || []).filter(Boolean);
    if (live.length && (!options.focusSectionId || options.focusSectionId === LIVE_SECTION_ID)) {
      var liveItems = live.map(function (entry) {
        return { key: entry.id, kind: 'live', ref: entry, item: null };
      });
      deck.sections.push({
        id: LIVE_SECTION_ID,
        title: 'Live-Hilfe',
        layout: liveItems.every(function (i) { return i.ref.type === 'starter'; }) ? 'starters' : 'cards',
        capacity: estimateCapacity('cards', fields, maxItems),
        items: liveItems,
        live: true
      });
    }

    paginate(deck);
    return deck;
  }

  /**
   * Verteilt die Einträge jedes Abschnitts auf Seiten.
   * capacities: optionale Zuordnung { sectionId: anzahl } aus der Messung.
   */
  function paginate(deck, capacities) {
    var slides = [];
    deck.sections.forEach(function (section, sectionIndex) {
      var capacity = Math.max(1, (capacities && capacities[section.id]) || section.capacity);
      var pages = Math.max(1, Math.ceil(section.items.length / capacity));
      // Gleichmäßig verteilen: lieber 2 x 5 als 8 + 2.
      var perPage = Math.ceil(section.items.length / pages);
      for (var page = 0; page < pages; page++) {
        var items = section.items.slice(page * perPage, (page + 1) * perPage);
        if (!items.length) continue;
        slides.push({
          sectionId: section.id,
          sectionTitle: section.title,
          sectionIndex: sectionIndex,
          layout: section.layout,
          live: !!section.live,
          pageInSection: page + 1,
          pagesInSection: pages,
          items: items
        });
      }
    });
    // Seitenzahlen nachtragen, wenn ein Abschnitt tatsächlich mehrfach umbrochen wurde.
    var perSection = {};
    slides.forEach(function (slide) { perSection[slide.sectionId] = (perSection[slide.sectionId] || 0) + 1; });
    slides.forEach(function (slide) { slide.pagesInSection = perSection[slide.sectionId]; });

    deck.slides = slides;
    return deck;
  }

  function isEmpty(deck) { return !deck || !deck.slides.length; }

  function sectionSummary(deck) {
    return deck.sections.map(function (section) {
      var slides = deck.slides.filter(function (s) { return s.sectionId === section.id; });
      return {
        id: section.id,
        title: section.title,
        items: countEntries(section.items),
        slides: slides.length,
        firstSlide: deck.slides.indexOf(slides[0]),
        live: !!section.live
      };
    });
  }

  BAO.deck = {
    LIVE_SECTION_ID: LIVE_SECTION_ID,
    fieldsForLevel: fieldsForLevel,
    countSecondary: countSecondary,
    lexemeLines: lexemeLines,
    lexemeMeta: lexemeMeta,
    starterLines: starterLines,
    estimateCapacity: estimateCapacity,
    build: build,
    paginate: paginate,
    countEntries: countEntries,
    isEmpty: isEmpty,
    sectionSummary: sectionSummary
  };
})(window.BAO = window.BAO || {});
