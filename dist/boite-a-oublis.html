  /* --- Live-Hilfe dauerhaft speichern ------------------------------------------ */

  function saveLiveEntry(item, ctx, bank) {
    var state = BAO.store.getState();
    var isStarter = item.type === 'starter';
    var fieldText = ui.textField({ label: isStarter ? 'Satzanfang' : 'Zielwort', value: item.text, full: true });
    var fieldTranslation = ui.textField({ label: 'Deutsch (optional)', value: item.translation, full: true });
    var fieldStatus = ui.selectField({ label: 'Status', value: 'new', options: ui.statusOptions() });
    var fieldFunction = ui.selectField({ label: 'Kommunikative Funktion', value: '', options: ui.functionOptions(state, true) });
    var addToBank = h('input', { type: 'checkbox', checked: bank ? true : null, disabled: bank ? null : true });

    return BAO.modal.open({
      title: 'Live-Hilfe dauerhaft speichern',
      subtitle: 'Der Eintrag wandert in den Bestand von ' + ctx.group.name + '.',
      width: '560px',
      body: h('div.stack', {},
        fieldText, fieldTranslation,
        h('div.grid2', {}, isStarter ? fieldFunction : fieldStatus),
        h('label.switch', {}, addToBank,
          h('span', { text: bank ? 'zusätzlich in die Wortbank „' + bank.title + '“ aufnehmen' : 'keine Wortbank geöffnet' }))
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Speichern', kind: 'primary',
          onSelect: function () {
            var text = fieldText.input.value.trim();
            if (!text) { fieldText.input.focus(); return false; }
            var newId = null;
            BAO.store.commit('Live-Hilfe gespeichert', function (draft) {
              if (isStarter) {
                var starter = schema.makeStarter({
                  subjectId: ctx.subject.id, groupId: ctx.group.id, text: text,
                  translation: fieldTranslation.input.value.trim(),
                  functionId: util.$('select', fieldFunction).value
                });
                draft.starters.push(starter);
                newId = starter.id;
              } else {
                var lex = schema.makeLexeme({
                  subjectId: ctx.subject.id, groupId: ctx.group.id, term: text,
                  translation: fieldTranslation.input.value.trim(),
                  status: util.$('select', fieldStatus).value,
                  introducedUnitId: ctx.unit ? ctx.unit.id : '',
                  introducedSchoolYear: ctx.group.schoolYear
                });
                draft.lexemes.push(lex);
                newId = lex.id;
              }
              if (bank && addToBank.checked) {
                var target = select.bank(draft, bank.id);
                if (target) {
                  var section = target.sections[target.sections.length - 1];
                  if (!section) {
                    section = schema.makeSection({ title: 'Live ergänzt' });
                    target.sections.push(section);
                  }
                  section.items.push(schema.makeBankItem({ kind: isStarter ? 'starter' : 'lex', refId: newId }));
                  target.updatedAt = util.nowISO();
                }
              }
            });
            BAO.session.removeLive(item.id);
            BAO.toast.undoable('Im Bestand gespeichert.');
            return true;
          }
        }
      ]
    });
  }

  /* --- Bausteine der Steuerung -------------------------------------------------- */

  function levelCard(session) {
    var card = h('div.ctrl-card', {},
      h('h3', {}, 'Unterstützungsstufe', h('span.spacer'),
        h('span.chip.chip--outline', { text: 'Tasten 1 – 3' }))
    );
    var levels = h('div.levels');
    schema.LEVELS.forEach(function (level) {
      levels.appendChild(h('button.level-btn', {
        type: 'button',
        'aria-pressed': session.level === level.id ? 'true' : 'false',
        onclick: function () { BAO.session.setLevel(level.id); }
      },
        h('strong', { text: level.id + ' · ' + level.name }),
        h('small', { text: level.hint })
      ));
    });
    card.appendChild(levels);

    var toggles = h('div.toggles', { style: { 'margin-top': 'var(--sp-3)' } });
    schema.FIELDS.forEach(function (field) {
      var id = 'fld_' + field.key;
      toggles.appendChild(h('div.toggle-row', {},
        h('input', {
          type: 'checkbox', id: id,
          checked: session.fields && session.fields[field.key] ? true : null,
          onchange: function () { BAO.session.toggleField(field.key); }
        }),
        h('label', { for: id, text: field.label })
      ));
    });
    card.appendChild(h('details.form-more', { open: true },
      h('summary', { text: 'Einzelne Hilfen ein- oder ausblenden' }),
      toggles,
      h('span.hint', { text: 'Ein Wechsel der Stufe setzt diese Schalter wieder auf die Voreinstellung.' })
    ));
    return card;
  }

  function sectionCard(session, app) {
    var deck = BAO.session.getDeck();
    var summary = BAO.session.summary();
    var slide = BAO.session.currentSlide();
    var map = h('div.section-map');
    refs.sectionMap = map;

    if (!summary.length) {
      map.appendChild(h('span.hint', { text: 'Diese Wortbank enthält noch keine Einträge.' }));
    }

    summary.forEach(function (section, index) {
      map.appendChild(h('button.section-map__item', {
        type: 'button',
        dataset: { sectionId: section.id },
        'aria-current': slide && slide.sectionId === section.id ? 'true' : 'false',
        onclick: function () { BAO.session.goToSection(section.id); }
      },
        h('span.section-map__idx', { text: (index + 1) + '.' }),
        h('span', { text: section.title }),
        h('span.section-map__count', {
          text: section.items + ' · ' + section.slides + ' ' + util.plural(section.slides, 'Seite', 'Seiten')
        })
      ));
    });

    return h('div.ctrl-card', {},
      h('h3', {}, 'Abschnitte', h('span.spacer'),
        h('button.btn.btn--sm', {
          type: 'button',
          'aria-pressed': session.focusSectionId ? 'true' : 'false',
          title: 'Fokusmodus: nur den aktuellen Abschnitt groß zeigen',
          onclick: function () {
            var current = BAO.session.currentSlide();
            if (session.focusSectionId) BAO.session.toggleFocus(session.focusSectionId);
            else if (current) BAO.session.toggleFocus(current.sectionId);
          }
        }, ui.icon('focus', 14), 'Fokus')
      ),
      map,
      session.focusSectionId
        ? h('div.note', { text: 'Fokusmodus aktiv: Es wird nur ein Abschnitt gezeigt – dafür deutlich größer.' })
        : null
    );
  }

  function autoCard(session) {
    var progress = h('div.progress-track', {}, h('div.progress-bar'));
    refs.progressBar = util.$('.progress-bar', progress);
    var countdown = h('span.hint');
    refs.countdown = countdown;

    var secondsInput = h('input', {
      type: 'number', min: '5', max: '600', step: '5', value: String(session.auto.seconds),
      'aria-label': 'Intervall in Sekunden',
      onchange: function (event) { BAO.session.setSeconds(parseInt(event.target.value, 10) || 45); }
    });

    var presets = h('div.filterbar');
    [20, 30, 45, 60, 90].forEach(function (value) {
      presets.appendChild(h('button.btn.btn--sm', {
        type: 'button',
        'aria-pressed': session.auto.seconds === value ? 'true' : 'false',
        text: value + ' s',
        onclick: function () { BAO.session.setSeconds(value); BAO.app.scheduleRender(); }
      }));
    });

    var loopId = 'auto_loop';
    return h('div.ctrl-card', {},
      h('h3', {}, 'Automatisches Weiterschalten'),
      h('div.stack.stack--tight', {},
        presets,
        h('div.row', {},
          h('span.label', { text: 'Intervall' }), secondsInput, h('span.hint', { text: 'Sekunden' })
        ),
        progress,
        countdown,
        h('div.toggle-row', {},
          h('input', {
            type: 'checkbox', id: loopId,
            checked: BAO.store.getState().settings.autoAdvanceLoop ? true : null,
            onchange: function (event) {
              var value = event.target.checked;
              BAO.store.commit('Automatik-Wiederholung', function (draft) {
                draft.settings.autoAdvanceLoop = value;
              }, { undoable: false });
            }
          }),
          h('label', { for: loopId, text: 'am Ende wieder von vorn beginnen' })
        ),
        h('span.hint', {
          text: 'Ohne Wiederholung bleibt die letzte Seite stehen – kein überraschender Neustart mitten im Abschreiben.'
        })
      )
    );
  }

  function liveCard(session, ctx, bank) {
    var input = h('input', { type: 'text', placeholder: 'Ausdruck oder Satzanfang …', 'aria-label': 'Live-Hilfe eingeben' });
    var typeSelect = ui.selectField({
      value: 'word', ariaLabel: 'Art der Live-Hilfe',
      options: [{ value: 'word', label: 'Ausdruck' }, { value: 'starter', label: 'Satzanfang' }]
    });

    function add() {
      var text = input.value.trim();
      if (!text) return;
      BAO.session.addLive({ type: typeSelect.value, text: text });
      input.value = '';
      input.focus();
    }
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); add(); }
      event.stopPropagation();
    });

    var list = h('div.live-list');
    session.live.forEach(function (item) {
      list.appendChild(h('div.live-item', {},
        h('span.live-item__text', { text: (item.type === 'starter' ? '❝ ' : '') + item.text }),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Speichern',
          title: 'Dauerhaft in den Bestand übernehmen',
          onclick: function () { saveLiveEntry(item, ctx, bank); }
        }),
        h('button.btn.btn--sm.btn--icon', {
          type: 'button', text: '×', title: 'Nur ausblenden',
          onclick: function () { BAO.session.removeLive(item.id); }
        })
      ));
    });

    return h('div.ctrl-card', {},
      h('h3', {}, 'Live-Hilfe', h('span.spacer'),
        session.live.length
          ? h('button.btn.btn--sm', {
            type: 'button', text: 'Alle entfernen', onclick: function () { BAO.session.clearLive(); }
          })
          : null
      ),
      h('div.live-form', {},
        h('div.row', {}, input),
        h('div.row', {}, typeSelect,
          h('button.btn.btn--primary.btn--sm', { type: 'button', text: 'Einblenden', onclick: add })
        )
      ),
      session.live.length ? list : h('span.hint', {
        text: 'Spontane Hilfen erscheinen sofort am Beamer und pausieren die Automatik. '
          + 'Sie verschwinden mit dem Ende der Stunde – außer du speicherst sie.'
      })
    );
  }

  function appearanceCard(session) {
    var scaleValue = h('span.chip', { text: Math.round(session.scale * 100) + ' %' });
    return h('div.ctrl-card', {},
      h('h3', {}, 'Darstellung am Beamer'),
      h('div.stack.stack--tight', {},
        h('div.row', {},
          h('span.label', { text: 'Schrift' }),
          h('button.btn.btn--sm.btn--icon', {
            type: 'button', text: '−', 'aria-label': 'Schrift kleiner',
            onclick: function () { BAO.session.setScale(session.scale - 0.1); BAO.app.scheduleRender(); }
          }),
          scaleValue,
          h('button.btn.btn--sm.btn--icon', {
            type: 'button', text: '+', 'aria-label': 'Schrift größer',
            onclick: function () { BAO.session.setScale(session.scale + 0.1); BAO.app.scheduleRender(); }
          }),
          h('span.hint', { text: 'Größere Schrift verteilt die Inhalte auf mehr Seiten.' })
        ),
        h('div.row', {},
          h('span.label', { text: 'Hintergrund' }),
          h('button.btn.btn--sm', {
            type: 'button', text: 'hell', 'aria-pressed': session.theme === 'light' ? 'true' : 'false',
            onclick: function () { BAO.session.setTheme('light'); BAO.app.scheduleRender(); }
          }),
          h('button.btn.btn--sm', {
            type: 'button', text: 'dunkel', 'aria-pressed': session.theme === 'dark' ? 'true' : 'false',
            onclick: function () { BAO.session.setTheme('dark'); BAO.app.scheduleRender(); }
          })
        ),
        h('div.toggle-row', {},
          h('input', {
            type: 'checkbox', id: 'stage_progress',
            checked: BAO.store.getState().settings.showProgressOnStage !== false ? true : null,
            onchange: function (event) {
              var value = event.target.checked;
              BAO.store.commit('Fortschritt am Beamer', function (draft) {
                draft.settings.showProgressOnStage = value;
              }, { undoable: false });
              BAO.session.renderAll({ reason: 'render', relayout: false });
            }
          }),
          h('label', { for: 'stage_progress', text: 'Fortschritt dezent am Beamer zeigen' })
        ),
        h('div.row', {},
          h('span.label', { text: 'Höchstens' }),
          h('input', {
            type: 'number', min: '3', max: '24', step: '1',
            value: String(BAO.store.getState().settings.maxItemsPerSlide),
            style: { width: '80px' }, 'aria-label': 'Einträge je Seite',
            onchange: function (event) {
              var value = util.clamp(parseInt(event.target.value, 10) || 12, 3, 24);
              BAO.store.commit('Einträge je Seite', function (draft) {
                draft.settings.maxItemsPerSlide = value;
              }, { undoable: false });
              BAO.session.rebuild({ reason: 'rebuild' });
            }
          }),
          h('span.hint', { text: 'Einträge je Seite' })
        )
      )
    );
  }

  /* --- Ansicht ------------------------------------------------------------------ */

  function render(host, context) {
    bindKeys();
    isRendering = true;
    refs = {};

    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var session = BAO.session.getState();
    var view = h('div.view');

    var banks = ctx.group ? select.banksOfGroup(state, ctx.group.id) : [];
    var bank = session.bankId ? select.bank(state, session.bankId) : null;

    if (!session.active) {
      view.appendChild(h('div.view__head', {},
        h('div.view__title', {}, h('h1', { text: 'Projektion' }),
          h('span.sub', { text: 'Wortbank auswählen und am Beamer einblenden' }))
      ));
      if (!banks.length) {
        view.appendChild(ui.emptyState({
          title: 'Noch keine Wortbank vorhanden',
          text: 'Stelle zuerst eine Wortbank zusammen – oder blende spontan eine Live-Hilfe ein.',
          actionLabel: 'Wortbank anlegen', onAction: function () { app.go('wortbanken'); },
          secondaryLabel: 'Live-Hilfe starten', onSecondary: function () { app.openLiveHelp(); }
        }));
      } else {
        var tiles = h('div.tiles');
        banks.forEach(function (item) {
          tiles.appendChild(h('button.tile', {
            type: 'button', onclick: function () { app.projectBank(item.id); }
          },
            h('div.tile__title', { text: item.title }),
            h('div.tile__meta', { text: item.scene + ' · ' + select.bankItemCount(item) + ' Einträge' }),
            h('div.tile__foot', {}, h('span.chip', { text: 'Stufe ' + item.defaultLevel }))
          ));
        });
        view.appendChild(tiles);
      }
      host.appendChild(view);
      isRendering = false;
      return;
    }

    /* --- Kopfzeile ---------------------------------------------------------- */
    var windowOpen = BAO.output.isWindowOpen();
    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: bank ? bank.title : 'Live-Hilfe' }),
        h('span.sub', {
          text: [ctx.subject && ctx.subject.name, ctx.group && ctx.group.name, bank && bank.scene]
            .filter(Boolean).join(' · ')
        })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        banks.length > 1 ? ui.selectField({
          value: session.bankId, ariaLabel: 'Wortbank wechseln',
          options: [{ value: '', label: 'nur Live-Hilfe' }].concat(banks.map(function (b) {
            return { value: b.id, label: b.title };
          })),
          onChange: function (value) { BAO.session.start(value, { keepLive: true }); }
        }) : null,
        h('button.btn', {
          type: 'button',
          'aria-pressed': windowOpen ? 'true' : 'false',
          title: 'Eigenes Beamerfenster öffnen oder schließen (Strg + B)',
          onclick: function () {
            if (BAO.output.isWindowOpen()) {
              BAO.output.closeWindow();
            } else {
              var result = BAO.output.openWindow();
              if (!result.ok) {
                BAO.toast.error('Das Beamerfenster wurde blockiert. Bitte Pop-ups erlauben – ersatzweise startet der Vollbildmodus.');
                BAO.output.openOverlay();
              } else {
                BAO.toast.ok('Beamerfenster geöffnet: auf den zweiten Bildschirm ziehen, dort F für Vollbild.');
              }
            }
            BAO.session.renderAll({ reason: 'window-opened' });
          }
        }, ui.icon('beamer', 16), windowOpen ? 'Beamerfenster schließen' : 'Beamerfenster'),
        h('button.btn', {
          type: 'button',
          title: 'Vollbild auf diesem Bildschirm (Rückfallebene ohne zweites Fenster)',
          onclick: function () {
            if (BAO.output.isOverlayOpen()) BAO.output.closeOverlay();
            else BAO.output.openOverlay();
            BAO.session.renderAll({ reason: 'overlay-opened' });
          }
        }, ui.icon('focus', 16), BAO.output.isOverlayOpen() ? 'Vollbild beenden' : 'Vollbild'),
        h('button.btn.btn--ghost', {
          type: 'button', text: 'Beenden',
          onclick: function () {
            BAO.session.stop();
            BAO.output.closeOverlay();
            app.scheduleRender();
          }
        })
      )
    ));

    if (!windowOpen && !BAO.output.isOverlayOpen()) {
      view.appendChild(h('div.note', {
        text: 'Noch keine Ausgabefläche geöffnet. „Beamerfenster“ öffnet ein eigenes Fenster für den zweiten '
          + 'Bildschirm; „Vollbild“ blendet die Projektion auf diesem Bildschirm ein.'
      }));
    }

    /* --- Vorschau und Steuerung ---------------------------------------------- */
    var frame = h('div.stage-frame', { dataset: { mirrored: windowOpen ? 'true' : 'false' } });

    var playButton = h('button.btn.btn--icon', {
      type: 'button', 'aria-pressed': session.auto.playing ? 'true' : 'false',
      onclick: function () {
        if (!BAO.session.toggleAuto() && !BAO.session.getState().auto.playing) {
          BAO.toast.show(session.copyMode
            ? 'Im Abschreibmodus bleibt die Seite bewusst stehen.'
            : 'Letzte Seite erreicht – zum Fortsetzen zurückblättern.', { timeout: 3200 });
        }
      }
    }, session.auto.playing ? '❚❚' : '▶');
    refs.playButton = playButton;

    var position = h('strong');
    refs.position = position;
    var sectionInfo = h('span.hint');
    refs.sectionInfo = sectionInfo;

    var preview = h('div.stage-preview', {},
      frame,
      h('div.stage-preview__bar', {},
        h('div.transport', {},
          h('button.btn.btn--icon', {
            type: 'button', title: 'Erste Seite', 'aria-label': 'Erste Seite',
            onclick: function () { BAO.session.goTo(0); }
          }, '⏮'),
          h('button.btn.btn--icon', {
            type: 'button', title: 'Zurück (Pfeil links)', 'aria-label': 'Vorherige Seite',
            onclick: function () { BAO.session.prev(); }
          }, '◀'),
          playButton,
          h('button.btn.btn--icon', {
            type: 'button', title: 'Weiter (Pfeil rechts)', 'aria-label': 'Nächste Seite',
            onclick: function () { BAO.session.next(false); }
          }, '▶'),
          h('button.btn.btn--icon', {
            type: 'button', title: 'Letzte Seite', 'aria-label': 'Letzte Seite',
            onclick: function () { BAO.session.goTo(BAO.session.totalSlides() - 1); }
          }, '⏭')
        ),
        h('div', { style: { display: 'flex', 'flex-direction': 'column' } }, position, sectionInfo),
        h('span.spacer'),
        h('button.btn.btn--sm', {
          type: 'button', 'aria-pressed': session.copyMode ? 'true' : 'false',
          title: 'Abschreibmodus: Seite bleibt stehen, Automatik bleibt aus (Taste C)',
          text: 'Abschreiben',
          onclick: function () { BAO.session.toggleCopyMode(); BAO.app.scheduleRender(); }
        }),
        h('button.btn.btn--sm', {
          type: 'button', 'aria-pressed': session.blank ? 'true' : 'false',
          title: 'Bildschirm leeren (Taste B)',
          text: session.blank ? 'Bildschirm zeigen' : 'Bildschirm leeren',
          onclick: function () { BAO.session.toggleBlank(); BAO.app.scheduleRender(); }
        })
      )
    );

    var panel = h('div.ctrl-panel', {},
      levelCard(session),
      sectionCard(session, app),
      autoCard(session),
      liveCard(session, ctx, bank),
      appearanceCard(session),
      h('div.ctrl-card', {},
        h('h3', {}, 'Tastenkürzel'),
        h('div.kv', {},
          h('dt', { text: '← →' }), h('dd', { text: 'blättern' }),
          h('dt', { text: 'Leertaste' }), h('dd', { text: 'Automatik an/aus' }),
          h('dt', { text: '1 2 3' }), h('dd', { text: 'Unterstützungsstufe' }),
          h('dt', { text: 'B' }), h('dd', { text: 'Bildschirm leeren' }),
          h('dt', { text: 'C' }), h('dd', { text: 'Abschreibmodus' }),
          h('dt', { text: 'F' }), h('dd', { text: 'Vollbild' }),
          h('dt', { text: '+ −' }), h('dd', { text: 'Schriftgröße' })
        )
      )
    );

    view.appendChild(h('div.present', {}, preview, panel));
    host.appendChild(view);

    // Vorschau anhängen und alle Flächen zeichnen, sobald das Layout steht.
    var slidesBefore = BAO.session.getDeck() ? BAO.session.getDeck().slides.length : 0;
    BAO.output.attachPreview(frame);
    window.requestAnimationFrame(function () {
      BAO.session.renderAll({ reason: 'render' });
      var deck = BAO.session.getDeck();
      if (deck && deck.slides.length !== slidesBefore) {
        // Die Messung auf der echten Fläche hat die Seitenzahl verändert –
        // die Abschnittsübersicht muss den gleichen Stand zeigen.
        app.scheduleRender();
        return;
      }
      syncControls();
    });

    isRendering = false;
  }

  BAO.views = BAO.views || {};
  BAO.views.present = { render: render };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/views/manage.js */
/* ==========================================================================
   Verwaltung: Fächer, Lerngruppen, Unterrichtsreihen
   Hier entsteht die Struktur, in der der Wortschatz über Jahre wächst –
   einschließlich der Übernahme einer Lerngruppe in das nächste Schuljahr.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  var PALETTE = [
    { color: '#2b5c8a', soft: '#e6eef7' },
    { color: '#a4552f', soft: '#f8e9e1' },
    { color: '#3d7a5c', soft: '#e5f1ec' },
    { color: '#6d4b96', soft: '#eee8f7' },
    { color: '#a3792a', soft: '#f8f0dd' },
    { color: '#8a3a52', soft: '#f8e6ea' }
  ];

  /* --- Fach -------------------------------------------------------------------- */

  function editSubject(subject) {
    var isNew = !subject;
    var data = subject ? util.clone(subject) : schema.makeSubject({ order: BAO.store.getState().subjects.length });
    var fieldName = ui.textField({ label: 'Fach oder Fremdsprache', value: data.name, placeholder: 'z. B. Spanisch' });
    var fieldShort = ui.textField({ label: 'Kürzel', value: data.short, placeholder: 'ES' });

    var chosen = { color: data.color, soft: data.colorSoft };
    var swatches = h('div.row');
    PALETTE.forEach(function (entry) {
      var button = h('button.btn.btn--icon', {
        type: 'button',
        title: 'Farbe wählen',
        'aria-label': 'Farbe wählen',
        style: { background: entry.color, 'border-color': entry.color, width: '34px', 'min-height': '30px' },
        onclick: function () {
          chosen = { color: entry.color, soft: entry.soft };
          util.$$('button', swatches).forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          button.setAttribute('aria-pressed', 'true');
        }
      });
      button.setAttribute('aria-pressed', entry.color === data.color ? 'true' : 'false');
      swatches.appendChild(button);
    });

    return BAO.modal.open({
      title: isNew ? 'Neues Fach' : 'Fach bearbeiten',
      subtitle: 'Jedes Fach hat eigene Lerngruppen, eigenen Wortschatz und eigene Satzanfänge.',
      width: '520px',
      initialFocus: 'input',
      body: h('div.stack', {}, h('div.grid2', {}, fieldName, fieldShort),
        h('div.field', {}, h('label', { text: 'Farbe' }), swatches)),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: isNew ? 'Anlegen' : 'Übernehmen', kind: 'primary',
          onSelect: function () {
            var name = fieldName.input.value.trim();
            if (!name) { fieldName.input.focus(); return false; }
            var values = {
              name: name,
              short: (fieldShort.input.value.trim() || name.slice(0, 2)).toUpperCase().slice(0, 3),
              color: chosen.color, colorSoft: chosen.soft
            };
            BAO.store.commit(isNew ? 'Fach angelegt' : 'Fach bearbeitet', function (draft) {
              if (isNew) draft.subjects.push(Object.assign(data, values));
              else {
                var target = select.subject(draft, data.id);
                if (target) Object.assign(target, values);
              }
            });
            BAO.toast.undoable(isNew ? 'Fach angelegt.' : 'Fach aktualisiert.');
            return true;
          }
        }
      ]
    });
  }

  function removeSubject(subject) {
    var state = BAO.store.getState();
    var content = BAO.stock.contentOfSubject(state, subject.id);
    var what = BAO.stock.describeContent(content);
    BAO.modal.confirm({
      title: 'Fach „' + subject.name + '“ löschen?',
      text: 'Damit verschwinden auch alle zugehörigen Inhalte.',
      detail: 'Betroffen: ' + content.groups + ' ' + util.plural(content.groups, 'Lerngruppe', 'Lerngruppen')
        + (what ? ' sowie ' + what : '') + '. '
        + 'Rückgängig machen ist möglich, ein Export vorher schadet trotzdem nicht.',
      confirmLabel: 'Fach löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      BAO.store.commit('Fach gelöscht', function (draft) { BAO.stock.removeSubject(draft, subject.id); });
      BAO.toast.undoable('Fach gelöscht.');
    });
  }

  /* --- Lerngruppe --------------------------------------------------------------- */

  function editGroup(group, subjectId) {
    var isNew = !group;
    var data = group ? util.clone(group) : schema.makeGroup({ subjectId: subjectId, schoolYear: util.currentSchoolYear() });
    var fieldName = ui.textField({ label: 'Bezeichnung', value: data.name, placeholder: 'z. B. 9b oder Q1 GK' });
    var fieldGrade = ui.textField({ label: 'Jahrgangsstufe', value: String(data.grade), type: 'number' });
    var fieldYear = ui.textField({ label: 'Schuljahr', value: data.schoolYear, placeholder: '2025/26' });
    var fieldNote = ui.textField({ label: 'Notiz', value: data.note, full: true, placeholder: 'z. B. zweite Fremdsprache, drei Wochenstunden' });

    return BAO.modal.open({
      title: isNew ? 'Neue Lerngruppe' : 'Lerngruppe bearbeiten',
      width: '560px',
      initialFocus: 'input',
      body: h('div.stack', {}, h('div.grid3', {}, fieldName, fieldGrade, fieldYear), fieldNote),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: isNew ? 'Anlegen' : 'Übernehmen', kind: 'primary',
          onSelect: function () {
            var name = fieldName.input.value.trim();
            if (!name) { fieldName.input.focus(); return false; }
            var values = {
              name: name,
              grade: util.clamp(parseInt(fieldGrade.input.value, 10) || 5, 1, 13),
              schoolYear: fieldYear.input.value.trim() || util.currentSchoolYear(),
              note: fieldNote.input.value.trim(),
              updatedAt: util.nowISO()
            };
            var newId = null;
            BAO.store.commit(isNew ? 'Lerngruppe angelegt' : 'Lerngruppe bearbeitet', function (draft) {
              if (isNew) {
                var created = Object.assign(data, values);
                draft.groups.push(created);
                newId = created.id;
              } else {
                var target = select.group(draft, data.id);
                if (target) Object.assign(target, values);
              }
            });
            BAO.toast.undoable(isNew ? 'Lerngruppe angelegt.' : 'Lerngruppe aktualisiert.');
            if (newId) BAO.app.setContext(data.subjectId, newId);
            return true;
          }
        }
      ]
    });
  }

  /** Übernahme in das nächste Schuljahr – der Bestand wächst weiter. */
  function promoteGroup(group) {
    var state = BAO.store.getState();
    var counts = select.statusCounts(state, group.id);
    var currentUnit = select.currentUnit(state, group.id);
    var nextYear = util.nextSchoolYear(group.schoolYear);
    var nextGrade = group.grade + 1;

    var optCore = h('input', { type: 'checkbox', id: 'promo_core', checked: true });
    var optRevisit = h('input', { type: 'checkbox', id: 'promo_revisit', checked: true });
    var optClose = h('input', { type: 'checkbox', id: 'promo_close', checked: true });
    var optUnit = h('input', { type: 'checkbox', id: 'promo_unit' });
    var unitTitle = ui.textField({ label: 'Titel der neuen Reihe', value: '', placeholder: 'z. B. Auftakt ' + nextYear });

    return BAO.modal.open({
      title: 'Lerngruppe ' + group.name + ' ins nächste Schuljahr übernehmen',
      subtitle: 'Jahrgang ' + group.grade + ' → ' + nextGrade + '  ·  Schuljahr ' + group.schoolYear + ' → ' + nextYear,
      width: '600px',
      body: h('div.stack', {},
        h('div.note', {
          text: 'Der gesamte Wortschatz bleibt erhalten und wird nicht dupliziert. '
            + 'Es ändern sich nur Jahrgang, Schuljahr und – wenn gewünscht – der Status der Einträge.'
        }),
        h('div.stack.stack--tight', {},
          h('div.toggle-row', {}, optCore,
            h('label', { for: 'promo_core', text: 'Aktuellen Wortschatz als Grundbestand sichern (' + (counts.new + counts.active) + ' Einträge: neu/aktiv → Grundbestand)' })),
          h('div.toggle-row', {}, optRevisit,
            h('label', {
              for: 'promo_revisit',
              text: currentUnit
                ? 'Wortschatz der Reihe „' + currentUnit.title + '“ zum Wiederaufgreifen markieren'
                : 'Wortschatz der letzten Reihe zum Wiederaufgreifen markieren (keine laufende Reihe gefunden)'
            })),
          h('div.toggle-row', {}, optClose,
            h('label', { for: 'promo_close', text: 'Laufende Unterrichtsreihen als abgeschlossen markieren' })),
          h('div.toggle-row', {}, optUnit,
            h('label', { for: 'promo_unit', text: 'Neue Unterrichtsreihe für ' + nextYear + ' anlegen' }))
        ),
        unitTitle
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Übernehmen', kind: 'primary',
          onSelect: function () {
            var markCore = optCore.checked;
            var markRevisit = optRevisit.checked;
            var closeUnits = optClose.checked;
            var createUnit = optUnit.checked;
            var title = unitTitle.input.value.trim() || ('Auftakt ' + nextYear);

            BAO.store.commit('Lerngruppe ins nächste Schuljahr übernommen', function (draft) {
              var target = select.group(draft, group.id);
              if (!target) return false;

              if (markCore) {
                draft.lexemes.forEach(function (lex) {
                  if (lex.groupId !== group.id) return;
                  if (lex.status === 'new' || lex.status === 'active') {
                    lex.status = 'core';
                    lex.updatedAt = util.nowISO();
                  }
                });
              }
              if (markRevisit && currentUnit) {
                draft.lexemes.forEach(function (lex) {
                  if (lex.groupId !== group.id) return;
                  if (lex.introducedUnitId === currentUnit.id && lex.status !== 'archived') {
                    lex.status = 'revisit';
                    lex.updatedAt = util.nowISO();
                  }
                });
              }
              if (closeUnits) {
                draft.units.forEach(function (unit) {
                  if (unit.groupId === group.id && unit.status === 'current') unit.status = 'done';
                });
              }

              target.history = (target.history || []).concat([{
                schoolYear: target.schoolYear, grade: target.grade,
                at: util.nowISO(), note: 'Übernahme in Jahrgang ' + nextGrade
              }]);
              target.grade = nextGrade;
              target.schoolYear = nextYear;
              target.updatedAt = util.nowISO();

              if (createUnit) {
                draft.units.push(schema.makeUnit({
                  groupId: group.id, title: title, schoolYear: nextYear,
                  status: 'current', order: draft.units.filter(function (u) { return u.groupId === group.id; }).length
                }));
              }
            });
            BAO.toast.undoable(group.name + ' ist jetzt in Jahrgang ' + nextGrade + ' (' + nextYear + ').');
            return true;
          }
        }
      ]
    });
  }

  function removeGroup(group) {
    var state = BAO.store.getState();
    var what = BAO.stock.describeContent(BAO.stock.contentOfGroups(state, [group.id]));
    BAO.modal.confirm({
      title: 'Lerngruppe „' + group.name + '“ löschen?',
      text: 'Alles, was dieser Lerngruppe gehört, wird entfernt.',
      detail: (what ? 'Betroffen: ' + what + '. ' : 'Die Lerngruppe ist noch leer. ')
        + 'Alternative: die Lerngruppe archivieren – dann bleibt alles erhalten.',
      confirmLabel: 'Endgültig löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      BAO.store.commit('Lerngruppe gelöscht', function (draft) { BAO.stock.removeGroups(draft, [group.id]); });
      BAO.toast.undoable('Lerngruppe gelöscht.');
    });
  }

  /* --- Unterrichtsreihe --------------------------------------------------------- */

  function editUnit(unit, group) {
    var isNew = !unit;
    var data = unit ? util.clone(unit) : schema.makeUnit({
      groupId: group.id, schoolYear: group.schoolYear,
      order: select.unitsOfGroup(BAO.store.getState(), group.id).length
    });
    var fieldTitle = ui.textField({ label: 'Titel der Reihe', value: data.title, placeholder: 'z. B. Le stage en entreprise' });
    var fieldYear = ui.textField({ label: 'Schuljahr', value: data.schoolYear });
    var fieldStatus = ui.selectField({
      label: 'Stand', value: data.status,
      options: [
        { value: 'planned', label: 'geplant' },
        { value: 'current', label: 'läuft gerade' },
        { value: 'done', label: 'abgeschlossen' }
      ]
    });
    var fieldDescription = ui.textField({ label: 'Kurzbeschreibung', value: data.description, full: true, multiline: true, rows: 3 });

    return BAO.modal.open({
      title: isNew ? 'Neue Unterrichtsreihe' : 'Unterrichtsreihe bearbeiten',
      width: '560px',
      initialFocus: 'input',
      body: h('div.stack', {}, fieldTitle, h('div.grid2', {}, fieldYear, fieldStatus), fieldDescription),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: isNew ? 'Anlegen' : 'Übernehmen', kind: 'primary',
          onSelect: function () {
            var title = fieldTitle.input.value.trim();
            if (!title) { fieldTitle.input.focus(); return false; }
            var values = {
              title: title,
              schoolYear: fieldYear.input.value.trim() || group.schoolYear,
              status: util.$('select', fieldStatus).value,
              description: fieldDescription.input.value.trim()
            };
            BAO.store.commit(isNew ? 'Unterrichtsreihe angelegt' : 'Unterrichtsreihe bearbeitet', function (draft) {
              if (isNew) draft.units.push(Object.assign(data, values));
              else {
                var target = select.unit(draft, data.id);
                if (target) Object.assign(target, values);
              }
              if (values.status === 'current') {
                draft.units.forEach(function (u) {
                  if (u.groupId === group.id && u.id !== data.id && u.status === 'current') u.status = 'done';
                });
              }
            });
            BAO.toast.undoable(isNew ? 'Unterrichtsreihe angelegt.' : 'Unterrichtsreihe aktualisiert.');
            return true;
          }
        }
      ]
    });
  }

  function removeUnit(unit) {
    var state = BAO.store.getState();
    var affected = state.lexemes.filter(function (l) { return l.introducedUnitId === unit.id; }).length;
    BAO.modal.confirm({
      title: 'Unterrichtsreihe löschen?',
      text: '„' + unit.title + '“ wird entfernt.',
      detail: affected
        ? affected + ' Wortschatzeinträge verlieren ihre Reihenzuordnung, bleiben aber im Bestand.'
        : 'Es sind keine Einträge zugeordnet.',
      confirmLabel: 'Löschen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return;
      BAO.store.commit('Unterrichtsreihe gelöscht', function (draft) {
        draft.units = draft.units.filter(function (u) { return u.id !== unit.id; });
        // Wortschatz, Wortbanken, Tafeln und Whiteboards bleiben – nur ohne Reihe.
        BAO.stock.detachUnit(draft, unit.id);
      });
      BAO.toast.undoable('Unterrichtsreihe gelöscht.');
    });
  }

  /* --- Ansicht ------------------------------------------------------------------- */

  var UNIT_STATUS = { planned: 'geplant', current: 'läuft', done: 'abgeschlossen' };

  function groupCard(state, subject, group, app) {
    var units = select.unitsOfGroup(state, group.id);
    var counts = select.statusCounts(state, group.id);
    var banks = select.banksOfGroup(state, group.id).length;
    var boards = select.boardsOfGroup(state, group.id).length;
    var whiteboards = select.whiteboardsOfGroup(state, group.id).length;
    // Was die Lerngruppe besitzt – in der Reihenfolge der Navigationsleiste.
    var summary = [
      boards + ' ' + util.plural(boards, 'Tafel', 'Tafeln'),
      whiteboards + ' ' + util.plural(whiteboards, 'Whiteboard', 'Whiteboards'),
      counts.total + ' ' + util.plural(counts.total, 'Wort', 'Wörter'),
      banks + ' ' + util.plural(banks, 'Wortbank', 'Wortbanken')
    ].join(' · ');

    var unitList = h('div.grp__units');
    if (!units.length) {
      unitList.appendChild(h('span.hint', { text: 'Noch keine Unterrichtsreihe angelegt.' }));
    }
    units.forEach(function (unit) {
      var entries = state.lexemes.filter(function (l) { return l.introducedUnitId === unit.id; }).length;
      unitList.appendChild(h('div.unit-row', {},
        h('span.chip.chip--outline', { text: unit.schoolYear }),
        h('span.unit-row__title', { text: unit.title }),
        h('span.chip', { text: UNIT_STATUS[unit.status] || unit.status }),
        h('span.hint', { text: entries + ' ' + util.plural(entries, 'Eintrag', 'Einträge') }),
        h('span.spacer'),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Reihe bearbeiten', onclick: function () { editUnit(unit, group); }
        }, ui.icon('edit', 14)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Reihe löschen', onclick: function () { removeUnit(unit); }
        }, ui.icon('trash', 14))
      ));
    });

    var history = h('div.timeline');
    (group.history || []).forEach(function (entry) {
      history.appendChild(h('div.timeline__row', {},
        h('span.timeline__year', { text: entry.schoolYear }),
        h('span', { text: 'Jahrgang ' + entry.grade + (entry.note ? ' · ' + entry.note : '') })
      ));
    });
    history.appendChild(h('div.timeline__row', {},
      h('span.timeline__year', { text: group.schoolYear }),
      h('span', { text: 'Jahrgang ' + group.grade + ' · aktuell' })
    ));

    return h('div.grp', {},
      h('div.grp__head', {},
        ui.favButton(group.favorite, function () {
          BAO.store.commit('Favorit geändert', function (draft) {
            var target = select.group(draft, group.id);
            if (target) target.favorite = !target.favorite;
          });
        }),
        h('span.grp__name', { text: group.name }),
        h('span.chip', { text: 'Jahrgang ' + group.grade }),
        h('span.chip.chip--outline', { text: group.schoolYear }),
        group.archived ? h('span.chip.chip--st-archived', {}, h('i.dot'), 'archiviert') : null,
        h('span.hint', { text: summary }),
        h('span.spacer'),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Öffnen',
          onclick: function () { app.setContext(subject.id, group.id); app.go('wortschatz'); }
        }),
        h('button.btn.btn--sm', {
          type: 'button', text: 'Ins nächste Schuljahr',
          title: 'Jahrgangsstufe erhöhen und den Bestand mitnehmen',
          onclick: function () { promoteGroup(group); }
        }),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Lerngruppe bearbeiten', onclick: function () { editGroup(group, subject.id); }
        }, ui.icon('edit', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: group.archived ? 'Aus dem Archiv holen' : 'Archivieren',
          onclick: function () {
            BAO.store.commit(group.archived ? 'Lerngruppe reaktiviert' : 'Lerngruppe archiviert', function (draft) {
              var target = select.group(draft, group.id);
              if (target) target.archived = !target.archived;
            });
            BAO.toast.undoable(group.archived ? 'Lerngruppe ist wieder aktiv.' : 'Lerngruppe archiviert.');
          }
        }, group.archived ? '↺' : ui.icon('archive', 15)),
        h('button.btn.btn--ghost.btn--sm.btn--icon', {
          type: 'button', title: 'Lerngruppe löschen', onclick: function () { removeGroup(group); }
        }, ui.icon('trash', 15))
      ),
      group.note ? h('div.hint', { text: group.note }) : null,
      h('details.form-more', {},
        h('summary', { text: 'Unterrichtsreihen und Verlauf' }),
        unitList,
        h('button.btn.btn--sm', {
          type: 'button', text: '+ Unterrichtsreihe', style: { 'margin-top': 'var(--sp-2)' },
          onclick: function () { editUnit(null, group); }
        }),
        h('div.section__head', { style: { 'margin-top': 'var(--sp-3)' } }, h('span.label', { text: 'Verlauf' })),
        history
      )
    );
  }

  function render(host, context) {
    var state = context.state;
    var app = context.app;
    var view = h('div.view');

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: 'Fächer und Lerngruppen' }),
        h('span.sub', { text: 'Fach → Lerngruppe → Unterrichtsreihe. Der Wortschatz gehört zur Lerngruppe und wächst mit ihr.' })
      ),
      h('div.spacer'),
      h('div.view__actions', {},
        h('button.btn', { type: 'button', onclick: function () { editSubject(null); } },
          ui.icon('plus', 16), 'Neues Fach')
      )
    ));

    if (!state.subjects.length) {
      view.appendChild(ui.emptyState({
        title: 'Noch kein Fach angelegt',
        text: 'Lege zuerst ein Fach an – zum Beispiel Französisch oder Englisch.',
        actionLabel: 'Fach anlegen', onAction: function () { editSubject(null); }
      }));
      host.appendChild(view);
      return;
    }

    var tree = h('div.tree');
    select.subjects(state).forEach(function (subject) {
      var groups = select.groupsOfSubject(state, subject.id, true);
      var node = h('div.tree__subject', { style: ui.subjectVars(subject) },
        h('div.tree__subjectHead', {},
          h('span.ctx-flag', { text: subject.short }),
          h('h2', { text: subject.name }),
          h('span.hint', { text: groups.length + ' ' + util.plural(groups.length, 'Lerngruppe', 'Lerngruppen') }),
          h('span.spacer'),
          h('button.btn.btn--sm', {
            type: 'button', text: '+ Lerngruppe', onclick: function () { editGroup(null, subject.id); }
          }),
          h('button.btn.btn--ghost.btn--sm.btn--icon', {
            type: 'button', title: 'Fach bearbeiten', onclick: function () { editSubject(subject); }
          }, ui.icon('edit', 15)),
          h('button.btn.btn--ghost.btn--sm.btn--icon', {
            type: 'button', title: 'Fach löschen', onclick: function () { removeSubject(subject); }
          }, ui.icon('trash', 15))
        )
      );
      var list = h('div.tree__groups');
      if (!groups.length) {
        list.appendChild(h('span.hint', { text: 'Noch keine Lerngruppe in diesem Fach.' }));
      }
      groups.forEach(function (group) { list.appendChild(groupCard(state, subject, group, app)); });
      node.appendChild(list);
      tree.appendChild(node);
    });

    view.appendChild(tree);
    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.manage = {
    render: render,
    editSubject: editSubject,
    editGroup: editGroup,
    editUnit: editUnit,
    promoteGroup: promoteGroup
  };
})(window.BAO = window.BAO || {});

  </script>
  <script>
/* js/views/data.js */
/* ==========================================================================
   Daten: Sicherung, Import, CSV, Einstellungen, Programminformationen
   Grundsatz: Nichts geht unbemerkt verloren. Vor jedem Import wird der
   bisherige Bestand gesichert und der Vorgang lässt sich rückgängig machen.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var schema = BAO.schema;
  var select = BAO.select;

  /* --- Export ------------------------------------------------------------------ */

  function exportAll() {
    var payload = BAO.backup.exportToFile(BAO.store.getState());
    var summary = BAO.stock.describeContent(Object.assign({}, payload.counts, { units: 0 }));
    var advice = '. Sie liegt im Download-Ordner – am besten zusätzlich auf einem Stick oder in der Schul-Cloud ablegen.';
    // Ohne Dateien des Soundboards ist die Sicherung sofort fertig.
    if (!BAO.media.planExport(BAO.classroomModel.mediaIds(BAO.store.getState())).included.length) {
      BAO.toast.ok('Sicherungsdatei erstellt' + (summary ? ': ' + summary : '') + advice, { timeout: 7000 });
      return payload;
    }
    payload.done.then(function (media) {
      BAO.toast.ok('Sicherungsdatei erstellt' + (summary ? ': ' + summary : '') + ', dazu '
        + media.files + ' ' + util.plural(media.files, 'Datei', 'Dateien') + ' des Soundboards ('
        + BAO.media.formatBytes(media.bytes) + ')' + advice, { timeout: 7000 });
      if (media.skipped.length) {
        BAO.toast.error('Nicht in der Sicherungsdatei, weil zusammen zu groß: ' + media.skipped.join(', ')
          + '. Diese Dateien bitte gesondert aufbewahren.', { timeout: 14000 });
      }
    }, function (err) {
      BAO.toast.error('Die Sicherungsdatei konnte nicht erstellt werden: ' + (err && err.message ? err.message : err));
    });
    return payload;
  }

  /* --- Stand der Sicherung -------------------------------------------------------- */

  /** Der Hinweis über der Exportschaltfläche: Wie steht es um die Sicherung? */
  function backupNote(state) {
    var info = BAO.backup.status(state);
    if (info.never && !info.dirty) {
      return h('div.note', { dataset: { backup: 'none' }, text: 'Noch nichts Eigenes zu sichern. Sobald du etwas änderst, lohnt sich eine Sicherungsdatei.' });
    }
    if (info.never) {
      return h('div.note.note--warn', { dataset: { backup: 'never' } },
        h('strong', { text: 'Es gibt noch keine Sicherungsdatei. ' }),
        'Alle Daten liegen nur im Speicher dieses Browsers – wird er geleert, sind sie verloren.');
    }
    var when = util.formatDateTime(info.last);
    if (info.due) {
      return h('div.note.note--warn', { dataset: { backup: 'due' } },
        h('strong', { text: 'Seit ' + info.unsavedDays + ' Tagen gibt es Änderungen ohne Sicherungsdatei. ' }),
        'Letzte Sicherungsdatei: ' + when + '.');
    }
    if (info.dirty) {
      return h('div.note', { dataset: { backup: 'open' }, text: 'Letzte Sicherungsdatei: ' + when + '. Seitdem gibt es Änderungen.' });
    }
    return h('div.note.note--ok', { dataset: { backup: 'ok' }, text: 'Alles gesichert – Sicherungsdatei vom ' + when + '.' });
  }

  /** Wie voll ist der Speicher des Browsers? Handschrift braucht am meisten Platz. */
  function usageNote(storage) {
    var usage = storage.usage;
    if (!usage || !storage.available) return null;
    var percent = Math.round(usage.share * 100);
    if (usage.share < 0.6) return null;
    return h('div.note' + (usage.share >= 0.8 ? '.note--warn' : ''), { dataset: { usage: String(percent) } },
      h('strong', { text: 'Der Speicher des Browsers ist zu etwa ' + percent + ' % gefüllt. ' }),
      'Am meisten Platz brauchen Whiteboards mit viel Handschrift. Eine Sicherungsdatei erstellen und danach '
        + 'nicht mehr benötigte Whiteboards löschen schafft Luft.');
  }

  /* --- Beispieldaten ---------------------------------------------------------------- */

  function removeSamples() {
    var state = BAO.store.getState();
    var groups = BAO.stock.sampleGroups(state);
    if (!groups.length) return Promise.resolve(false);
    var content = BAO.stock.describeContent(BAO.stock.contentOfGroups(state, groups.map(function (g) { return g.id; })));
    return BAO.modal.confirm({
      title: 'Beispieldaten entfernen?',
      text: 'Entfernt ' + util.plural(groups.length, 'wird die Beispiel-Lerngruppe ', 'werden die Beispiel-Lerngruppen ')
        + groups.map(function (g) {
          var subject = select.subject(state, g.subjectId);
          return g.name + (subject ? ' (' + subject.name + ')' : '');
        }).join(' und ') + ' mit allem, was dazugehört.',
      detail: (content ? 'Betroffen: ' + content + '. ' : '')
        + 'Fächer und eigene Lerngruppen bleiben erhalten. Der Schritt lässt sich mit Strg + Z rückgängig machen.',
      confirmLabel: 'Beispiele entfernen', danger: true
    }).then(function (confirmed) {
      if (!confirmed) return false;
      BAO.store.commit('Beispieldaten entfernt', function (draft) { BAO.stock.removeSampleData(draft); });
      BAO.toast.undoable('Die Beispieldaten sind entfernt.');
      return true;
    });
  }

  function exportCsv(ctx) {
    if (!ctx.group) return;
    var lexemes = select.lexemesOfGroup(BAO.store.getState(), ctx.group.id);
    if (!lexemes.length) { BAO.toast.error('Diese Lerngruppe hat noch keinen Wortschatz.'); return; }
    var csv = BAO.csv.lexemesToCsv(lexemes);
    var name = 'wortschatz_' + util.fold(ctx.subject.name).slice(0, 3) + '_' + util.fold(ctx.group.name) + '.csv';
    // Byte Order Mark, damit Excel die Umlaute richtig erkennt.
    util.downloadText(name, '\uFEFF' + csv, 'text/csv');
    BAO.toast.ok(lexemes.length + ' Einträge als CSV gespeichert.');
  }

  /* --- Import einer Sicherung --------------------------------------------------- */

  function countRow(label, before, after) {
    return h('tr', {},
      h('td', { text: label }),
      h('td', { text: String(before) }),
      h('td', { text: String(after) }),
      h('td', { text: (after - before >= 0 ? '+' : '') + (after - before) })
    );
  }

  function showImportDialog(result) {
    var state = BAO.store.getState();
    var incoming = result.incoming;
    var before = BAO.backup.counts(state);
    var after = BAO.backup.counts(incoming);
    var mediaCount = (result.media || []).length;

    /** Holt die Klänge und Bilder des Soundboards nach, die der neue Bestand braucht. */
    function restoreMedia(nextState) {
      BAO.backup.restoreMedia(result.media, nextState).then(function (report) {
        if (report.failed) {
          BAO.toast.error(report.failed + ' ' + util.plural(report.failed, 'Datei', 'Dateien')
            + ' des Soundboards ließen sich nicht aus der Sicherung lesen.');
        }
      });
    }

    var table = h('table.mini', {},
      h('thead', {}, h('tr', {},
        h('th', { text: 'Inhalt' }), h('th', { text: 'jetzt' }),
        h('th', { text: 'in der Datei' }), h('th', { text: 'Differenz' })
      )),
      h('tbody', {},
        Object.keys(BAO.backup.COUNT_LABELS).map(function (key) {
          return countRow(BAO.backup.COUNT_LABELS[key], before[key], after[key]);
        })
      )
    );

    return BAO.modal.open({
      title: 'Sicherung einlesen',
      subtitle: result.meta.exportedAt
        ? 'Erstellt am ' + util.formatDateTime(result.meta.exportedAt)
          + (result.meta.appVersion ? ' mit Version ' + result.meta.appVersion : '')
        : 'Herkunft der Datei unbekannt.',
      width: '640px',
      dismissable: true,
      body: h('div.stack', {},
        h('div.table-wrap', {}, table),
        result.meta.migrations && result.meta.migrations.length
          ? h('div.note', { text: 'Die Datei wurde auf die aktuelle Datenversion angehoben: ' + result.meta.migrations.join('; ') })
          : null,
        result.warnings.length
          ? h('div.note.note--warn', {}, h('strong', { text: 'Hinweise beim Prüfen:' }),
            h('ul', {}, result.warnings.slice(0, 6).map(function (w) { return h('li', { text: w }); })))
          : null,
        mediaCount
          ? h('div.note', {
            dataset: { media: String(mediaCount) },
            text: 'Die Datei enthält außerdem ' + mediaCount + ' ' + util.plural(mediaCount, 'Klang- oder Bilddatei', 'Klang- und Bilddateien')
              + ' des Soundboards. Sie kommen beim Wiederherstellen mit; beim Zusammenführen bleiben '
              + 'Klangtasten und Symbole dieses Rechners, wie sie sind.'
          })
          : null,
        h('div.stack.stack--tight', {},
          h('strong', { text: 'Wie sollen die Daten übernommen werden?' }),
          h('div.note', {
            text: 'Zusammenführen: Vorhandenes bleibt erhalten, Neues kommt hinzu, bei gleicher Kennung gewinnt '
              + 'der jüngere Stand. Wiederherstellen: Der jetzige Bestand wird vollständig ersetzt.'
          }),
          h('span.hint', { text: 'Beides lässt sich mit Strg + Z rückgängig machen; zusätzlich wird eine Sicherheitskopie abgelegt.' })
        )
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Zusammenführen', kind: 'primary',
          onSelect: function () {
            var merged = BAO.backup.merge(BAO.store.getState(), incoming);
            var lines = BAO.backup.summariseReport(merged.report);
            // Der zusammengeführte Bestand steht so in keiner Sicherungsdatei.
            if (lines.length && !merged.state.meta.unsavedSince) merged.state.meta.unsavedSince = util.nowISO();
            BAO.store.replaceState(merged.state, 'Sicherung zusammengeführt');
            restoreMedia(merged.state);
            BAO.toast.undoable(lines.length ? 'Zusammengeführt – ' + lines.join(', ') : 'Nichts Neues gefunden.', { timeout: 12000 });
            return true;
          }
        },
        {
          label: 'Wiederherstellen (ersetzen)', kind: 'danger',
          onSelect: function () {
            return BAO.modal.confirm({
              title: 'Bestand wirklich ersetzen?',
              text: 'Der jetzige Bestand wird durch den Inhalt der Datei ersetzt.',
              detail: 'Eine Sicherheitskopie des jetzigen Standes wird angelegt, und der Schritt lässt sich rückgängig machen.',
              confirmLabel: 'Ersetzen', danger: true
            }).then(function (confirmed) {
              if (!confirmed) return false;
              // Der Bestand entspricht danach genau dieser Datei.
              if (!incoming.meta.lastBackupAt && result.meta.exportedAt) incoming.meta.lastBackupAt = result.meta.exportedAt;
              incoming.meta.unsavedSince = '';
              incoming.meta.changedAt = incoming.meta.changedAt || '';
              BAO.store.replaceState(incoming, 'Sicherung wiederhergestellt');
              restoreMedia(incoming);
              BAO.toast.undoable('Bestand aus der Sicherung wiederhergestellt.', { timeout: 12000 });
              return true;
            });
          }
        }
      ]
    });
  }

  function handleBackupFile(file) {
    if (!file) return;
    util.readFileAsText(file).then(function (text) {
      var result = BAO.backup.analyse(text, BAO.store.getState());
      if (!result.ok) {
        BAO.modal.open({
          title: 'Diese Datei kann nicht eingelesen werden',
          width: '520px',
          body: h('div.stack', {},
            h('div.note.note--danger', {}, h('ul', {}, result.errors.map(function (e) { return h('li', { text: e }); }))),
            h('p', { text: 'Der vorhandene Bestand wurde nicht verändert.' })
          ),
          actions: [{ label: 'Verstanden', value: null, kind: 'primary' }]
        });
        return;
      }
      showImportDialog(result);
    }).catch(function (err) {
      BAO.toast.error('Die Datei konnte nicht gelesen werden: ' + err.message);
    });
  }

  /* --- CSV-Import ---------------------------------------------------------------- */

  function showCsvDialog(text, ctx) {
    var parsed = BAO.csv.parse(text);
    if (!parsed.rows.length) { BAO.toast.error('Die CSV-Datei enthält keine Daten.'); return; }

    var hasHeader = BAO.csv.looksLikeHeader(parsed.rows[0]);
    var header = hasHeader ? parsed.rows[0] : parsed.rows[0].map(function (_, i) { return 'Spalte ' + (i + 1); });
    var dataRows = hasHeader ? parsed.rows.slice(1) : parsed.rows;
    var mapping = hasHeader ? BAO.csv.guessMapping(parsed.rows[0]) : { term: 0, translation: 1 };

    var fieldStatus = ui.selectField({ label: 'Status für alle neuen Einträge', value: 'new', options: ui.statusOptions() });
    var fieldUnit = ui.selectField({
      label: 'Unterrichtsreihe', value: ctx.unit ? ctx.unit.id : '',
      options: ui.unitOptions(BAO.store.getState(), ctx.group.id)
    });

    var mappingGrid = h('div.grid3');
    var previewWrap = h('div.table-wrap');

    function refreshPreview() {
      util.clear(previewWrap);
      var fields = Object.keys(mapping).filter(function (key) { return mapping[key] !== null && mapping[key] !== undefined; });
      var table = h('table.mini', {},
        h('thead', {}, h('tr', {}, fields.map(function (f) { return h('th', { text: BAO.csv.FIELD_LABELS[f] }); }))),
        h('tbody', {}, dataRows.slice(0, 5).map(function (row) {
          return h('tr', {}, fields.map(function (f) { return h('td', { text: row[mapping[f]] || '' }); }));
        }))
      );
      previewWrap.appendChild(table);
    }

    Object.keys(BAO.csv.FIELD_LABELS).forEach(function (field) {
      var options = [{ value: '', label: '– nicht übernehmen –' }].concat(header.map(function (name, index) {
        return { value: String(index), label: name };
      }));
      mappingGrid.appendChild(ui.selectField({
        label: BAO.csv.FIELD_LABELS[field] + (field === 'term' ? ' *' : ''),
        value: mapping[field] === undefined ? '' : String(mapping[field]),
        options: options,
        onChange: function (value) {
          if (value === '') delete mapping[field];
          else mapping[field] = parseInt(value, 10);
          refreshPreview();
        }
      }));
    });
    refreshPreview();

    return BAO.modal.open({
      title: 'CSV-Datei einlesen',
      subtitle: dataRows.length + ' Datenzeilen erkannt · Trennzeichen „'
        + (parsed.delimiter === '\t' ? 'Tabulator' : parsed.delimiter) + '“'
        + (hasHeader ? ' · mit Kopfzeile' : ' · ohne Kopfzeile'),
      width: '760px',
      body: h('div.stack', {},
        h('div.note', {
          text: 'Die Einträge werden der Lerngruppe ' + ctx.group.name + ' (' + ctx.subject.name + ') hinzugefügt.'
        }),
        h('div.grid2', {}, fieldStatus, fieldUnit),
        h('details.form-more', { open: true },
          h('summary', { text: 'Spaltenzuordnung prüfen' }),
          mappingGrid
        ),
        h('div.field', {}, h('label', { text: 'Vorschau' }), previewWrap)
      ),
      actions: [
        { label: 'Abbrechen', value: null, kind: 'ghost' },
        {
          label: 'Einträge importieren', kind: 'primary',
          onSelect: function () {
            if (mapping.term === undefined) {
              BAO.toast.error('Bitte eine Spalte für das Zielwort zuordnen.');
              return false;
            }
            var state = BAO.store.getState();
            var unitId = util.$('select', fieldUnit).value;
            var unit = unitId ? select.unit(state, unitId) : null;
            var outcome = BAO.csv.toLexemes(dataRows, mapping, {
              subjectId: ctx.subject.id, groupId: ctx.group.id,
              status: util.$('select', fieldStatus).value,
              unitId: unitId, schoolYear: unit ? unit.schoolYear : ctx.group.schoolYear
            }, select.lexemesOfGroup(state, ctx.group.id));

            if (!outcome.entries.length) { BAO.toast.error('Keine Zeile enthielt ein Zielwort.'); return false; }

            BAO.store.commit(outcome.entries.length + ' Einträge importiert', function (draft) {
              outcome.entries.forEach(function (entry) { draft.lexemes.push(entry); });
            });
            var message = outcome.entries.length + ' Einträge importiert.';
            if (outcome.duplicates.length) message += ' ' + outcome.duplicates.length + ' davon gibt es bereits ähnlich.';
            if (outcome.skipped) message += ' ' + outcome.skipped + ' Zeilen ohne Zielwort übersprungen.';
            BAO.toast.undoable(message, { timeout: 12000 });
            return true;
          }
        }
      ]
    });
  }

  function handleCsvFile(file, ctx) {
    if (!file) return;
    if (!ctx.group) { BAO.toast.error('Bitte zuerst eine Lerngruppe wählen.'); return; }
    util.readFileAsText(file).then(function (text) { showCsvDialog(text, ctx); })
      .catch(function (err) { BAO.toast.error('Die Datei konnte nicht gelesen werden: ' + err.message); });
  }

  /* --- Einstellungen -------------------------------------------------------------- */

  function settingsCard(state) {
    var levelGrid = h('div.grid2');
    schema.FIELDS.forEach(function (field) {
      var levelSelect = ui.selectField({
        value: String(state.settings.fieldLevels[field.key] === undefined ? field.level : state.settings.fieldLevels[field.key]),
        ariaLabel: 'Ab Stufe: ' + field.label,
        options: schema.LEVELS.map(function (l) { return { value: String(l.id), label: 'ab Stufe ' + l.id + ' (' + l.name + ')' }; }),
        onChange: function (value) {
          BAO.store.commit('Zuordnung der Unterstützungsstufen', function (draft) {
            draft.settings.fieldLevels[field.key] = parseInt(value, 10);
          });
          if (BAO.session.getState().active) BAO.session.setLevel(BAO.session.getState().level);
        }
      });
      levelSelect.style.width = 'auto';
      levelSelect.style.minWidth = '13rem';
      levelGrid.appendChild(h('div.row', {},
        h('span', { style: { flex: '1 1 auto', 'min-width': '8ch' }, text: field.label }),
        levelSelect
      ));
    });

    var scenes = h('div.row');
    (state.settings.scenes || []).forEach(function (scene) {
      scenes.appendChild(h('span.chip.chip--tag', {}, scene,
        h('button', {
          type: 'button', text: '×', 'aria-label': 'Szene entfernen: ' + scene,
          onclick: function () {
            BAO.store.commit('Szene entfernt', function (draft) {
              draft.settings.scenes = draft.settings.scenes.filter(function (s) { return s !== scene; });
            });
          }
        })
      ));
    });
    scenes.appendChild(h('button.btn.btn--sm', {
      type: 'button', text: '+ Szene',
      onclick: function () {
        BAO.modal.prompt({ title: 'Neue Unterrichtsszene', label: 'Bezeichnung', placeholder: 'z. B. Debatte' })
          .then(function (value) {
            if (!value) return;
            BAO.store.commit('Szene ergänzt', function (draft) {
              if (draft.settings.scenes.indexOf(value) < 0) draft.settings.scenes.push(value);
            });
          });
      }
    }));

    var functions = h('div.row');
    select.functions(state).forEach(function (fn) {
      functions.appendChild(h('span.chip.chip--tag', {}, fn.label,
        h('button', {
          type: 'button', text: '×', 'aria-label': 'Verwendung entfernen: ' + fn.label,
          onclick: function () {
            var used = state.starters.filter(function (s) { return s.functionId === fn.id; }).length;
            BAO.modal.confirm({
              title: 'Verwendung entfernen?',
              text: '„' + fn.label + '“ wird aus der Liste entfernt.',
              detail: used ? used + ' Satzanfänge verlieren ihre Zuordnung, bleiben aber erhalten.' : '',
              confirmLabel: 'Entfernen', danger: true
            }).then(function (confirmed) {
              if (!confirmed) return;
              BAO.store.commit('Funktion entfernt', function (draft) {
                draft.functions = draft.functions.filter(function (f) { return f.id !== fn.id; });
                draft.starters.forEach(function (s) { if (s.functionId === fn.id) s.functionId = ''; });
              });
            });
          }
        })
      ));
    });
    functions.appendChild(h('button.btn.btn--sm', {
      type: 'button', text: '+ Verwendung',
      onclick: function () {
        BAO.modal.prompt({ title: 'Neue Verwendung', label: 'Bezeichnung', placeholder: 'z. B. eine Vermutung äußern' })
          .then(function (value) {
            if (!value) return;
            BAO.store.commit('Funktion ergänzt', function (draft) {
              draft.functions.push({ id: util.uid('fn'), label: value, order: draft.functions.length });
            });
          });
      }
    }));

    return h('div.card', {},
      h('div.card__head', {}, h('h2', { text: 'Einstellungen' })),
      h('div.card__body.stack', {},
        h('div.field', {},
          h('label', { text: 'Welche Angaben ab welcher Unterstützungsstufe erscheinen' }),
          h('span.hint', { text: 'Gilt für alle Wortbanken. Im Unterricht lässt sich jede Angabe zusätzlich einzeln ein- und ausblenden.' }),
          levelGrid
        ),
        h('div.field', {}, h('label', { text: 'Unterrichtsszenen' }), scenes),
        h('div.field', {},
          h('label', { text: 'Verwendungen der Satzanfänge' }),
          h('span.hint', { text: 'Neue Bezeichnungen entstehen auch direkt beim Anlegen eines Satzanfangs.' }),
          functions)
      )
    );
  }

  /* --- Ansicht -------------------------------------------------------------------- */

  function render(host, context) {
    var state = context.state;
    var ctx = context.ctx;
    var app = context.app;
    var view = h('div.view');
    var storage = BAO.store.storageInfo();
    var totals = select.totals(state);
    var safety = BAO.storage.loadSafetyCopy();
    var media = BAO.media.planExport(BAO.classroomModel.mediaIds(state));

    view.appendChild(h('div.view__head', {},
      h('div.view__title', {},
        h('h1', { text: 'Daten und Sicherung' }),
        h('span.sub', { text: 'Alles bleibt auf diesem Rechner. Exportieren, einlesen, einstellen.' })
      )
    ));

    var dropzone = h('div.dropzone', {},
      h('strong', { text: 'Sicherungsdatei hierher ziehen' }),
      h('p', { text: 'oder Datei auswählen (.json) – das Ablegen klappt überall im Fenster' }),
      h('button.btn', {
        type: 'button', text: 'Datei auswählen',
        onclick: function () { util.pickFile('application/json,.json').then(handleBackupFile); }
      })
    );
    ['dragenter', 'dragover'].forEach(function (type) {
      dropzone.addEventListener(type, function (event) {
        event.preventDefault();
        dropzone.classList.add('is-over');
      });
    });
    ['dragleave', 'drop'].forEach(function (type) {
      dropzone.addEventListener(type, function (event) {
        event.preventDefault();
        dropzone.classList.remove('is-over');
        if (type === 'drop' && event.dataTransfer.files && event.dataTransfer.files[0]) {
          handleBackupFile(event.dataTransfer.files[0]);
        }
      });
    });

    var grid = h('div.data-grid', {},
      h('div.card', {},
        h('div.card__head', {}, h('h2', { text: 'Sicherung erstellen' })),
        h('div.card__body.stack', {},
          backupNote(state),
          usageNote(storage),
          h('p', {
            text: 'Die Sicherungsdatei enthält alles in einer einzigen Datei: Fächer, Lerngruppen, Reihen, '
              + 'Wortschatz, Satzanfänge, Wortbanken, Tafeln, Whiteboards, das Soundboard mit seinen Klängen '
              + 'und Bildern sowie die Einstellungen. Mit ihr zieht der Bestand auch auf einen anderen Rechner um.'
          }),
          h('dl.kv', {},
            h('dt', { text: 'Fächer' }), h('dd', { text: String(totals.subjects) }),
            h('dt', { text: 'Lerngruppen' }), h('dd', { text: String(totals.groups) }),
            h('dt', { text: 'Wortschatz' }), h('dd', { text: String(totals.lexemes) }),
            h('dt', { text: 'Satzanfänge' }), h('dd', { text: String(totals.starters) }),
            h('dt', { text: 'Wortbanken' }), h('dd', { text: String(totals.banks) }),
            h('dt', { text: 'Tafeln' }), h('dd', { text: String(totals.boards) }),
            h('dt', { text: 'Whiteboards' }), h('dd', { text: String(totals.whiteboards) }),
            h('dt', { text: 'Phasen-Presets' }), h('dd', { text: String(totals.presets) }),
            h('dt', { text: 'Klänge und Bilder' }), h('dd', {
              dataset: { bind: 'media-total' },
              text: media.included.length + media.skipped.length
                ? (media.included.length + media.skipped.length) + ' ('
                  + BAO.media.formatBytes(media.bytes + media.skipped.reduce(function (sum, entry) { return sum + entry.size; }, 0)) + ')'
                : '0'
            })
          ),
          media.skipped.length
            ? h('div.note.note--warn', {
              text: 'Zusammen sind die Dateien des Soundboards zu groß für die Sicherungsdatei. Nicht enthalten: '
                + media.skipped.map(function (entry) { return entry.name; }).join(', ') + '.'
            })
            : null,
          h('button.btn.btn--primary.btn--wide', {
            type: 'button', title: 'Sicherungsdatei erstellen (Strg + S)', onclick: exportAll
          }, ui.icon('download', 16), 'Alle Daten exportieren'),
          h('span.hint', { text: 'Geht von überall mit Strg + S oder einem Klick auf den Sicherungsstand unten in der Fußzeile.' }),
          h('button.btn.btn--wide', {
            type: 'button',
            text: ctx.group ? 'Wortschatz von ' + ctx.group.name + ' als CSV' : 'CSV-Export (Lerngruppe wählen)',
            disabled: ctx.group ? null : true,
            onclick: function () { exportCsv(ctx); }
          })
        )
      ),

      h('div.card', {},
        h('div.card__head', {}, h('h2', { text: 'Sicherung einlesen' })),
        h('div.card__body.stack', {},
          dropzone,
          h('p.hint', {
            text: 'Nach dem Prüfen entscheidest du: zusammenführen, vollständig wiederherstellen oder abbrechen.'
          }),
          safety
            ? h('div.note.note--warn', {},
              h('div', { text: 'Sicherheitskopie vorhanden vom ' + util.formatDateTime(safety.savedAt) + '.' }),
              h('button.btn.btn--sm', {
                type: 'button', text: 'Sicherheitskopie wiederherstellen',
                style: { 'margin-top': 'var(--sp-2)' },
                onclick: function () {
                  BAO.modal.confirm({
                    title: 'Sicherheitskopie wiederherstellen?',
                    text: 'Der jetzige Bestand wird durch den Stand vom ' + util.formatDateTime(safety.savedAt) + ' ersetzt.',
                    confirmLabel: 'Wiederherstellen', danger: true
                  }).then(function (confirmed) {
                    if (!confirmed) return;
                    var checked = schema.validateState(safety.state);
                    BAO.store.replaceState(checked.state, 'Sicherheitskopie wiederhergestellt');
                    BAO.toast.undoable('Sicherheitskopie wiederhergestellt.');
                  });
                }
              }))
            : null
        )
      ),

      h('div.card', {},
        h('div.card__head', {}, h('h2', { text: 'Wortschatzliste als CSV einlesen' })),
        h('div.card__body.stack', {},
          h('p', {
            text: 'Für vorhandene Listen aus Tabellenprogrammen. Trennzeichen und Spalten werden erkannt '
              + 'und lassen sich vor dem Import prüfen.'
          }),
          h('button.btn.btn--wide', {
            type: 'button',
            text: ctx.group ? 'CSV-Datei auswählen' : 'Erst eine Lerngruppe wählen',
            disabled: ctx.group ? null : true,
            onclick: function () {
              util.pickFile('.csv,text/csv,text/plain').then(function (file) { handleCsvFile(file, ctx); });
            }
          }),
          h('span.hint', {
            text: 'Erkannte Spaltennamen: Zielwort, Artikel, Deutsch, Wortverbindung, Chunk, Erklärung, '
              + 'Beispiel, Aussprache, Thema, Tags, Niveau, Status.'
          })
        )
      )
    );
    view.appendChild(grid);

    view.appendChild(h('div', { style: { 'margin-top': 'var(--sp-5)' } }, settingsCard(state)));

    /* --- Programminformationen ---------------------------------------------- */
    view.appendChild(h('div.card', { style: { 'margin-top': 'var(--sp-5)' } },
      h('div.card__head', {}, h('h2', { text: 'Über Boîte à Oublis' })),
      h('div.card__body', {},
        h('dl.kv', {},
          h('dt', { text: 'Version' }), h('dd', { text: schema.APP_VERSION }),
          h('dt', { text: 'Datenversion' }), h('dd', { text: String(state.schemaVersion) }),
          h('dt', { text: 'Speicherung' }), h('dd', {
            text: storage.available
              ? 'lokal im Browser (localStorage), etwa ' + Math.round(storage.bytes / 1024) + ' kB'
                + (storage.usage ? ' – rund ' + Math.max(1, Math.round(storage.usage.share * 100)) + ' % des üblichen Platzes' : '')
              : 'nicht verfügbar – bitte regelmäßig exportieren'
          }),
          h('dt', { text: 'Klänge und Bilder' }), h('dd', {
            text: !BAO.media.isReady() ? 'Ablage wird geöffnet …'
              : BAO.media.isPersistent()
                ? 'lokal im Browser (IndexedDB), ' + BAO.media.formatBytes(BAO.media.usage().bytes)
                : 'nur für diese Sitzung – der Browser erlaubt hier keine IndexedDB'
          }),
          h('dt', { text: 'Zuletzt gespeichert' }), h('dd', { text: util.formatDateTime(storage.savedAt) || '–' }),
          h('dt', { text: 'Datenschutz' }), h('dd', {
            text: 'Keine Konten, keine Server, keine Übertragung. Alles bleibt auf diesem Rechner.'
          }),
          h('dt', { text: 'Urheber' }), h('dd', { text: '© Florian Nowak' })
        ),
        h('div.row', { style: { 'margin-top': 'var(--sp-4)', 'flex-wrap': 'wrap' } },
          BAO.stock.hasSampleData(state) ? h('button.btn.btn--sm', {
            type: 'button', text: 'Beispieldaten entfernen',
            title: 'Entfernt die mitgelieferten Beispiel-Lerngruppen – Eigenes bleibt erhalten',
            onclick: removeSamples
          }) : null,
          h('button.btn.btn--danger.btn--sm', {
            type: 'button', text: 'Alle lokalen Daten zurücksetzen',
            onclick: function () {
              BAO.modal.confirm({
                title: 'Wirklich alles zurücksetzen?',
                text: 'Der gesamte lokale Bestand wird gelöscht und die Beispieldaten werden neu angelegt.',
                detail: 'Bitte vorher exportieren. Der Schritt lässt sich mit Strg + Z rückgängig machen.',
                confirmLabel: 'Zurücksetzen', danger: true
              }).then(function (confirmed) {
                if (!confirmed) return;
                var fresh = schema.emptyState();
                BAO.seed.fill(fresh);
                BAO.store.replaceState(fresh, 'Alles zurückgesetzt');
                BAO.toast.undoable('Zurückgesetzt – die Beispieldaten sind wieder da.');
                app.go('start');
              });
            }
          })
        )
      )
    ));

    host.appendChild(view);
  }

  BAO.views = BAO.views || {};
  BAO.views.data = {
    render: render, exportAll: exportAll, removeSamples: removeSamples,
    handleBackupFile: handleBackupFile, handleCsvFile: handleCsvFile
  };
})(window.BAO = window.BAO || {});

  </script>
<!-- Anwendung -->
  <script>
/* js/app.js */
/* ==========================================================================
   Anwendungsrahmen
   Navigation, Arbeitskontext (Fach + Lerngruppe), Schnellsuche, Live-Hilfe,
   Tastenkürzel und das Zeichnen der jeweils aktiven Ansicht.
   ========================================================================== */
(function (BAO) {
  'use strict';

  var util = BAO.util;
  var h = util.h;
  var ui = BAO.ui;
  var select = BAO.select;

  /* Der einfache Modus zeigt nur, was für die Grundform gebraucht wird:
     Tafeln, Whiteboards, Soundboard, Elemente, Lerngruppen, Daten. Erreichbar
     bleibt alles – die Adressen ändern sich nicht, nur die Navigationsleiste
     wird kürzer. */
  var ROUTES = [
    { path: 'start',        view: 'dashboard',   label: 'Start',        icon: 'home',       key: '1' },
    { path: 'tafeln',       view: 'boards',      label: 'Tafeln',       icon: 'beamer',     key: '2', simple: true },
    { path: 'whiteboards',  view: 'whiteboards', label: 'Whiteboards',  icon: 'whiteboard', key: '3', simple: true },
    { path: 'soundboard',   view: 'soundboard',  label: 'Soundboard',   icon: 'sound',      key: '0', simple: true },
    { path: 'wortschatz',   view: 'vocab',       label: 'Wortschatz',   icon: 'list',       key: '4',
      simple: true, simpleLabel: 'Elemente' },
    { path: 'satzanfaenge', view: 'starters',    label: 'Satzanfänge',  icon: 'quote',      key: '5' },
    { path: 'wortbanken',   view: 'banks',       label: 'Wortbanken',   icon: 'grid',       key: '6' },
    { path: 'projektion',   view: 'present',     label: 'Projektion',   icon: 'play',       key: '7' },
    { path: 'tafel',        view: 'board',       label: 'Tafel',        icon: 'beamer',     hidden: true },
    { path: 'whiteboard',   view: 'whiteboard',  label: 'Whiteboard',   icon: 'whiteboard', hidden: true },
    { path: 'wortbank',     view: 'bankEditor',  label: 'Wortbank',     icon: 'grid',       hidden: true },
    { path: 'verwaltung',   view: 'manage',      label: 'Lerngruppen',  icon: 'school',     key: '8', simple: true },
    { path: 'daten',        view: 'data',        label: 'Daten',        icon: 'data',       key: '9', simple: true }
  ];
